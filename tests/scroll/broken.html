<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>broken scroll fixture</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  section { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  h1, h2 { font-size: 3rem; text-align: center; }
</style>
</head>
<body>

<section style="background:#eee;">
  <h1>1. Normal hero — this section is fine</h1>
</section>

<!-- Bug A: DEAD SCROLL. A sticky-pinned box 2.5 viewports tall with static
     content that never advances. Several consecutive scroll samples land
     inside the pin range and see the identical frame. -->
<section style="height:250vh; position:relative; padding:0;">
  <div style="position:sticky; top:0; height:100vh; width:100%; background:#222;
              display:flex; align-items:center; justify-content:center;">
    <h2 style="color:#fff;">2. This never changes while you scroll</h2>
  </div>
</section>

<!-- Bug B: UNREVEALED. Starts at opacity 0 and nothing ever reveals it. -->
<section style="background:#eee;">
  <h2 style="opacity:0;" id="ghost">3. You should never see this heading appear</h2>
</section>

<!-- Bug C: CONTRAST UNDER MEDIA. A white headline over a white image. -->
<section style="position:relative; background:#fff; overflow:hidden;">
  <img alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAE0lEQVR4nGP8//8/AwwwwVl4OQCWbgMF7ZjH1AAAAABJRU5ErkJggg=="
       style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;">
  <h2 style="position:relative; z-index:1; color:#fff;">4. White headline, white ground</h2>
</section>

<section style="background:#ddd;">
  <h2>5. Ordinary closing section</h2>
</section>

<footer style="min-height:60vh; display:flex; align-items:center; justify-content:center; background:#111; color:#fff;">
  <p>6. Footer</p>
</footer>

</body>
</html>
