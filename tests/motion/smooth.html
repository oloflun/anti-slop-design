<!doctype html>
<meta charset="utf-8"><title>smooth fixture</title>
<style>
  body { margin:0; background:#0b0c0e; color:#f4f2ee; font:16px/1.5 system-ui; }
  .spacer { height: 300vh; }
  .stage { position: sticky; top: 0; height: 100vh; display:grid; place-items:center; }
  /* The card is a DESCENDANT of the act and reads the smoothed value through
     inheritance. That is the real contract, and it is why the shim registers
     --sc-ps with inherits:true. A fixture that set the value on the same
     element would pass while the real thing was broken. */
  .card { width: 40vw; height: 22vw; background:#1e5e9c;
          transform: rotateY(calc(var(--sc-ps, 0) * -180deg)); }
</style>
<div class="spacer" id="act" data-sc-act="pin">
  <div class="stage"><div class="wrap"><div class="card" id="card"></div></div></div>
</div>

<script>
  // Stand-in for scrollcraft's read(): publishes --sc-p 1:1 from the scroll
  // event, exactly as the engine does at scrollcraft.js:857. No lerp here.
  var act = document.getElementById('act');
  function raw() {
    var r = act.getBoundingClientRect();
    var span = r.height - innerHeight;
    var p = Math.min(1, Math.max(0, -r.top / (span || 1)));
    act.style.setProperty('--sc-p', p.toFixed(4));
  }
  addEventListener('scroll', raw, { passive: true });
  raw();
</script>

<!-- The real shim, loaded the way a build loads it: copied in beside the
     engine and run after it. Not a miniature. -->
<script src="sc-smooth.js"></script>
