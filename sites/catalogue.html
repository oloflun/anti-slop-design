/time readout", "small show-reel video thumbnail in place of a full hero photo", "star-rating trust line", "right-aligned vertical service list", "giant black headline crossing cream ground", "dense nine-photo bento grid on black", "dark closing services panel"], "palette": ["#E4DCCB", "#171410", "#B4784A", "#FFFFFF", "#8C7A62"], "type": ["Geist", "Inter Display"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://aveon.framer.website/", "has_image": true, "img": "../design-catalogue/entries/aveon/fold.webp", "full": "../design-catalogue/entries/aveon/shot.webp", "sections": {"Why it works": "The header withholds the expected full-bleed hero photo, replacing it with a\nsmall \"SHOW REEL\" video thumbnail, a live location/date/time readout\n(`BROOKLYN - NEW YORK`, a real clock ticking), and a star-rating trust line —\nmore console than hero. It's an unusual restraint for an interior-design\nstudio, where a big atmospheric room photo is the category default; here the\nmetadata itself (place, time, rating) is doing the opening work instead.\n\nA giant black headline (\"SPACES THAT TELL A STORY\") then takes the full width\non cream, functioning as the page's actual visual anchor in place of a hero\nimage — type as the hero, not photography.\n\nThe real photographic payload arrives afterward as a dense, nine-image bento\ngrid on black ground: kitchens, bathrooms, hallways and courtyards shown at\nonce, uneven tile sizes, all outlined in thin borders. Rather than a slow\nphotographic narrative (one room, then the next), the studio shows its whole\nrange in a single glance — a catalogue view rather than a story, despite the\nheadline's claim.", "What to borrow (principle)": "- **Replace a full hero photograph with a metadata console** — a small video\n  thumbnail, a live clock, a location tag — when you want restraint over\n  spectacle in the first screen.\n- **Let a giant headline serve as the actual visual anchor** of a section, in\n  place of an image, when the copy itself is strong enough to hold the space.\n- **Show your full photographic range as one dense bento grid** rather than a\n  slow one-image-at-a-time scroll, when breadth is the more persuasive claim\n  than any single room.\n- **Pair a star-rating with a specific client-count** (\"trusted by 200+\n  homeowners\") rather than either alone, for a fast, legible trust signal.", "What to leave": "- A live, ticking clock in the header is a small technical flourish that adds\n  engineering overhead for very little persuasive return — it's a template\n  signature more than a brand asset.\n- A nine-image bento grid this dense, with no captions or project names, asks\n  a lot of the reader to infer context; at minimum a hover state naming each\n  space would help.\n- The headline's claim (\"spaces that tell a story\") sits oddly against a grid\n  structure built for breadth-at-a-glance rather than narrative sequence — the\n  copy and the layout are making different arguments.", "Signature move": "The metadata console in place of a hero photo: a small show-reel thumbnail, a\nlive location/date/time readout, and a star-rating line stand in for the\nexpected full-bleed atmospheric interior shot, deferring the big photography\nuntil after the headline.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed,\nthough the captured CSS only carries a single `250ms` opacity transition and\na generic `background, box-shadow` hover rule, plus a loading-spinner\nkeyframe. No staggered bento-tile reveal was captured in the static CSS — the\ngrid's fade/scale-in, if present, is most likely driven by Framer's inline\nwhileInView animation rather than a CSS keyframe, so that read stays inferred\nfrom the image.\n\n| token | value | role |\n|---|---|---|\n| `sm` | 250ms | opacity transitions |", "Brief": "Build a restrained interior-design studio page that defers its hero\nphotography. Open on a cream header with a small show-reel video thumbnail, a\nlive location/date/time readout, a star-rating trust line, and a right-aligned\nvertical service list — no full hero image yet. Let a giant black headline\nserve as the visual anchor of the next section. Follow with a dense bento grid\nof 8-10 real project photographs on black ground, uneven tile sizes, thin\nborders, shown all at once rather than one room at a time. Close on a dark\npanel restating the studio's full-spectrum service offering.", "Image recipe": "A set of real interior spaces — kitchens, bathrooms, living areas, courtyards —\nshot with natural warm light, considered material detail (marble, wood,\nbrass), varied angles and crops so a dense grid of them reads as textured\nrather than repetitive, no visible people.", "Photo search": "Unsplash first, Pexels second.\n- \"warm interior kitchen natural light detail\"\n- \"marble bathroom interior design detail\"\n- \"courtyard interior warm light architectural\"", "Reference lock": "Primary reference/direction: Avéon — a metadata console replacing the hero photo, a giant black headline as visual anchor, a dense nine-image bento grid on black.\nPreserve (3-5 traits): a metadata console (show-reel thumbnail, live clock, location tag, star rating) in place of a full hero photograph; a giant headline serving as the section's visual anchor rather than an image; a dense bento grid showing the full photographic range at once rather than a sequential narrative; a right-aligned vertical service list as understated navigation.\nBorrow only (1-2): the star-rating-plus-client-count trust line; the dark closing services panel.\nRole rules: bento grid tiles never carry more than a thin border, no heavy captions; headline copy must match the layout's actual argument (breadth vs. narrative) rather than contradict it.\nMedia strategy: photo:unsplash — warm, real interior photography with varied crops and angles for grid texture; no CGI renders.\nReject: a full-bleed hero photograph replacing the metadata console (defeats the device); a bento grid with uniform tile sizes; headline claims that contradict the layout's actual structure.\nToken commitments: cream `#E4DCCB`, black `#171410`, terracotta `#B4784A`, white `#FFFFFF`, warm-stone `#8C7A62`; bold sans for all type, headline set at giant scale as the visual anchor."}, "has_extract": true}, {"slug": "beautiful", "title": "Beautiful™", "url": "", "captured": "2026-09-04", "family": "sunday-kitchen-cream", "dna": "Domestic Sunday-morning lifestyle photography x rationed coral punctuation", "register": "warm photographic", "grammar": "chaptered editorial", "lane": "A cream-canvas kitchen-goods page where black-outlined pill nav and circular category icons float over warm product photography, one coral pill button per screen, and a single full-bleed coral banner interrupts the page once as its only loud moment", "mode": "persuade", "traits": ["\"cream canvas", "never white\"", "\"one coral accent", "one use per viewport\"", "999px pill buttons only", "1px black hairline as sole border language", "centred serif logo lockup", "tracked-out mono eyebrow labels"], "palette": ["#fff5e6", "#fa7864", "#dc8264", "#000000", "#e8e8e1", "#ffffff"], "type": ["GascogneTS", "Basis Grotesque Pro"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "consumer-brand", "category2": "editorial", "origin": "refero", "extract": "none", "source_url": "", "has_image": true, "img": "../design-catalogue/entries/beautiful/fold.webp", "full": "../design-catalogue/entries/beautiful/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens. Cream linen `#fff5e6`\nreplaces white as the canvas everywhere — hero, about section, category row,\nfooter — which is what makes this read as a kitchen rather than a storefront\nbefore a single product loads. Coral `#fa7864` is rationed to a strict \"one moment\nper viewport\" rule: the filled hero button, the single full-bleed banner strip, and\nnothing else. Every other surface stays black-on-cream, so the coral reads as\npunctuation rather than branding-by-repetition.\n\nType performs the familiar editorial-vs-workhorse split, but with an inverted\ntracking rule that is the real signature: Basis Grotesque Pro opens its\nletter-spacing as size increases (0.019em at small sizes up to 0.031em at 21px),\nwhich is the opposite of how most grotesques tighten at body size — the effect is\na calm, unhurried reading rhythm that matches the \"warm kitchen\" brief. GascogneTS\ncarries the editorial voice at weight 500 only, never bold, so emphasis always\ncomes from the serif switch or a size jump, never from weight.\n\nGeometry enforces the same discipline as colour: buttons are always a full 999px\npill, cards are always 0px (square, borderless, defined only by the photography\ninside them), and every interactive container gets a 1px black hairline instead of\nelevation. That two-value radius system — pill or square, nothing between — keeps\n\"clickable\" and \"content\" visually distinct without needing shadow to do the job.", "What to borrow (principle)": "- **Cap a rationed accent to a literal one-per-screen rule.** \"One coral moment per\n  viewport maximum\" is concrete enough to audit and keeps an accent from creeping\n  into decoration.\n- **Invert the tracking convention on purpose.** Opening letter-spacing as size\n  grows (instead of the usual tightening) is a small, checkable choice that reads\n  as calm rather than default.\n- **Split radius into exactly two values tied to function.** Pill = clickable,\n  square = content. No third radius value muddies the signal.\n- **Let the black hairline replace both border and shadow.** One line weight\n  (1px, pure black) doing all of nav, cards, and icon-circle duty keeps the system\n  legible at a glance.\n- **Centre the logo, flank it with function.** A dead-centre wordmark with nav\n  pills on one side and utility icons on the other reads as considered rather than\n  a default flex-row header.", "What to leave": "- A 0px card radius paired with no border and no shadow means the product\n  photography itself has to carry all the visual weight of \"this is a card\" —\n  weak or inconsistent photography would collapse the grid instantly.\n- The single coral banner strip depends on being genuinely singular; a second\n  large coral surface anywhere else on the page would break the \"exclamation\n  point\" reading described in the source.\n- Positive letter-spacing at every body size is a deliberate anti-convention that\n  will read as merely \"loose\" rather than \"calm\" without the warm cream canvas and\n  serif pairing supporting it.", "Signature move": "The coral banner strip: one full-bleed `#fa7864` band, roughly 120px tall, carrying\nonly centred white serif text with no padding container — the single large coral\nsurface on the entire page, positioned as a hard divider between the category grid\nand the footer.", "Motion": "No motion or interaction tokens are captured in the Refero export — the system is\ndescribed entirely in static component and layout terms. Inferred from the image\nand the \"flat, borderless-from-shadow\" elevation philosophy: hover states most\nlikely swap the 1px black border to a filled black background (matching the\nexisting \"quietest interactive elements\" language for nav pills), and the hero\ncarousel arrows suggest a simple slide transition between hero images rather than\na scroll-driven or parallax effect. (inferred)", "Brief": "Build a warm domestic kitchen-goods landing page. Canvas is cream linen `#fff5e6`\neverywhere — never pure white; borders are 1px solid black on every interactive\nelement (nav pills, category circles, carousel arrows); cards have 0px radius and\nno border, letting the product photography define the edge. Reserve coral `#fa7864`\nfor exactly one filled pill button per screen and the single full-bleed banner\nstrip; use terracotta `#dc8264` for outlined secondary CTAs. Centre a GascogneTS\nserif logo in the header, flanked by black-bordered nav pills on the left and a\nplain search icon on the right. Open with an asymmetric hero: 60% product\nphotography, 40% copy stack — tracked-out coral mono eyebrow label, GascogneTS\nweight-500 headline at up to 52px, body copy in Basis Grotesque Pro with positive\nletter-spacing, then one coral pill button. Add a horizontal row of circular\ncategory icons (999px radius, black hairline) below. Keep 64px section gaps and no\nshadows anywhere.", "Image recipe": "Warm still-life or lifestyle photograph of [SUBJECT] — staged on a wooden\ncountertop or against a soft neutral wall, natural directional window light (not\nstudio-flat), styled with linen textiles and fresh botanicals or scattered\ningredients, high-key and slightly desaturated toward warm cream tones, no sterile\nwhite-cyc background, no harsh flash.", "Photo search": "Unsplash first, Pexels second.\n- \"kitchen countertop natural light warm styling\"\n- \"ceramic kitchenware wooden counter lifestyle\"\n- \"breakfast table linen natural light\"\n- \"woman kitchen morning candid warm light\"", "Reference lock": "Primary reference/direction: Beautiful™ — warm cream kitchen-goods page, rationed\ncoral accent, editorial serif over a calm-tracked grotesque.\nPreserve (3-5 traits): cream linen `#fff5e6` canvas everywhere, no pure white\nbackground; coral `#fa7864` limited to one filled button and the single banner\nstrip per page; 1px solid black hairline as the only border/structure device, no\nshadows; 999px pill radius on every button and icon circle, 0px on every card;\npositive, size-scaling letter-spacing on all Basis Grotesque Pro text.\nBorrow only (1-2): the tracked-out coral uppercase mono eyebrow label; the\nhandwritten signature sign-off as a humanizing one-off.\nRole rules: coral never becomes a background surface outside the single banner;\nGascogneTS never sets body copy or UI labels; Basis Grotesque Pro never goes bold;\nlogo stays centred, never flush-left.\nMedia strategy: photo:unsplash — warm, natural-light domestic still life and\nlifestyle photography only; no studio white-cyc product shots, no 3D renders.\nReject: a second saturated accent colour; sharp corners on any clickable element;\ndrop shadows or elevation; bold body text; a left-aligned or asymmetric logo\nlockup.\nToken commitments: bg `#fff5e6`, divider `#e8e8e1`, card `#ffffff`, ink `#000000`,\nink-soft `#282828`, accent `#fa7864`, accent-outline `#dc8264`; display GascogneTS\nweight 500 at 25-52px/leading 1.0-1.2; body Basis Grotesque Pro 400 at 10-21px with\n0.019-0.031em tracking; radius 999px buttons/circles, 0px cards; page max-width\n1200px, section gap 64px."}, "has_extract": false}, {"slug": "before-ai-slop", "title": "Flowstack (before / AI slop control)", "url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/before-ai-slop.html", "captured": "2026-09-03", "family": "saas-default", "dna": "Tailwind defaults x pitch deck", "register": "modern clean", "grammar": "none", "lane": "Floating pill nav, split hero with a fake dashboard card, three icon cards, a four-number stat band, a centred CTA and a one-line footer — the default vertical stack, nothing else", "mode": "persuade", "traits": ["floating pill nav", "indigo-to-violet gradient", "Inter everything", "split hero with dashboard mock", "three icon feature cards", "unsourced stat band", "greyed fake logo row", "centred closing CTA", "made with love footer"], "palette": ["#FBFAF7", "#FFFFFF", "#6366F1", "#8B5CF6", "#EC4899", "#F59E0B", "#1E40AF", "#1F2937"], "type": ["Inter"], "kind": "antipattern", "source": "claude", "status": "ready", "category": "product-focused", "category2": "", "origin": "example-site", "extract": "none", "source_url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/before-ai-slop.html", "has_image": true, "img": "../design-catalogue/entries/before-ai-slop/fold.webp", "full": "../design-catalogue/entries/before-ai-slop/shot.webp", "sections": {"Why it works": "It is included as the control, not as a target — but it is worth being honest about\nwhat it gets right, because that is what makes it the default.\n\nThe information order is correct: what it is, who trusts it, what it does, what it\nproduced, what to do next. Every element is legible, the hierarchy is\nunambiguous, contrast passes, the tap targets are large, and it will render\nidentically in every browser on every device. A team with no designer ships this in\nan afternoon and it will not embarrass them.\n\nThat is the whole of the case. Everything competent here is competence available\nfrom a template; nothing on the page could only have come from this company.", "What to borrow (principle)": "- **The section order.** Promise → proof → capability → result → ask. The sequence\n  is right; it is the content poured into it that is empty.\n- **One typeface, sized properly.** Inter at 16/1.6 for body and a heavy weight for\n  display is a legitimate, boring, working system.\n- **A visible primary action in the nav and again at the close.** Two asks, same\n  words, no third.", "What to leave": "Nearly all of it. Catalogued here so the specific tells are nameable:\n\n- **Claims with no referent.** \"10x faster shipping\", \"50% cost reduction\", \"10,000+\n  teams\", \"99.99% uptime SLA\" — four numbers, no source, no customer, no method. A\n  reader who believes them learns nothing; a reader who doesn't discounts the whole\n  page. Compare with the entries in this catalogue that print real prices and real\n  inventory numbers.\n- **The greyed logo row of invented companies.** ACME, NEXUS, QUANTUM, HORIZON.\n  Social proof that proves nothing, in the exact grey-at-40 % treatment every SaaS\n  page uses.\n- **The indigo-to-violet gradient** on the logo mark, the icon tiles and the chart\n  fill. It is the single most over-used colour move of the period and it carries no\n  meaning here — nothing is indigo about this product.\n- **Three icon cards in a row.** Lightning bolt, link, rocket; \"Lightning fast\",\n  \"Seamless integrations\", \"Next-gen automation\". The icons illustrate the adjective,\n  not the product, and the adjectives are interchangeable with any competitor's.\n- **The fake dashboard card.** A screenshot-shaped rectangle with plausible metrics\n  and a smooth two-line area chart. It shows the product's chrome and none of its\n  work.\n- **Language that could describe anything.** \"All-in-one platform for modern teams\",\n  \"elevate\", \"unleash\", \"transform your workflow\", \"ship faster\". Delete the logo and\n  no reader could name the category.\n- **Everything centred.** Section heading centred, subhead centred, stat band\n  centred, CTA centred, footer centred. Centring is the layout you get when no\n  decision has been made about where the reader's eye should start.\n- **`Made with ❤️ in San Francisco`.** The last line of the page is a stock\n  sentiment.", "Signature move": "There isn't one, and that is the finding. Every element on the page is the highest-\nprobability element for its slot: the pill nav, the badge above the headline, the\ngradient word inside the headline, the two-button hero, the avatar cluster, the\nlogo row, the icon triptych, the stat band, the centred CTA. Nothing was chosen\nagainst the average. Keep this entry as the measuring stick: if a new page can be\ndescribed entirely by naming its slots, it has landed here.", "Motion": "", "Brief": "Reproduce only as a control. Build a single-column SaaS landing page on near-white\n`#FBFAF7`, everything in Inter. Floating white pill nav with six links, a text\n\"Sign in\" and a dark \"Start free\" pill. Split hero: small pill badge, a three-line\nheadline at ~4rem/1.05 with one phrase in indigo `#6366F1`, a two-line grey\nsubhead, a dark primary button and a ghost \"Watch demo\", an avatar cluster with\n\"Trusted by 10,000+ teams\"; on the right a white rounded card with four metric\nlabels and a soft indigo area chart. Then a greyed row of six invented company\nnames, three white icon cards with gradient tiles, a four-figure stat band in\nindigo, a centred CTA section, and a one-line footer. Centre every section\nheading. Do not name a real customer, cite a source or show the product working.", "Image recipe": "None — the page contains no photography, and that is part of the diagnosis. Its\nonly \"image\" is a rounded rectangle mocking a dashboard, drawn in CSS with a\ngradient area chart. If you must reproduce it: flat white card, 16px radius, soft\nshadow, four label/number pairs in a row, one smooth two-series area chart in\nindigo and amber, no axis labels, no gridlines, no real data.", "Photo search": "Not applicable — the control page uses no photography. Any entry in this catalogue\nthat does is a better source of direction.", "Reference lock": "Primary reference/direction: NEGATIVE reference. Flowstack — the default AI-generated SaaS landing page. Never use as direction; use to detect drift toward it.\nPreserve (3-5 traits): nothing.\nBorrow only (1-2): the section order (promise → proof → capability → result → ask); one typeface used consistently.\nRole rules: if a page under construction acquires a pill nav, a gradient word in the headline, an icon triptych, an unsourced stat band or a greyed row of invented logos, it has drifted here and the direction must be re-derived from the brand's own evidence.\nMedia strategy: placeholder — the control has no real imagery, which is the point.\nReject: indigo-to-violet gradients; unsourced metrics; invented customer logos; icon cards illustrating adjectives; fake dashboard mocks; centred everything; \"all-in-one\", \"seamless\", \"next-gen\", \"elevate\", \"unleash\", \"transform\"; \"Made with ❤️ in <city>\".\nToken commitments: none — this entry commits no tokens. Recorded palette (`#FBFAF7`, `#6366F1`, `#8B5CF6`, `#EC4899`, `#F59E0B`, `#1F2937`) exists so the combination can be recognised and avoided."}, "has_extract": false}, {"slug": "bobbin", "title": "Bobbin (by TutorCruncher)", "url": "https://withbobbin.com/", "captured": "2026-09-04", "family": "yellow-glass-tutor-console", "dna": "EdTech desk photography x glass status card", "register": "modern clean", "grammar": "live surface", "lane": "A warm desk photograph carries a floating glass status card mid-hero, then a cream accordion of features sits beside a live analytics-dashboard screenshot", "mode": "persuade", "traits": ["yellow-black brand accent", "floating glass status card on photo", "roman headline with one highlighted phrase", "cream accordion feature panel", "dashboard analytics screenshot as proof", "logo trust row", "dual typeface (sans UI + serif accent)", "parent brand credited in the subtitle"], "palette": ["#F5C518", "#151515", "#F2EDE1", "#FFFFFF", "#8A6A3B"], "type": ["GT Standard", "GT Alpina"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://withbobbin.com/", "has_image": true, "img": "../design-catalogue/entries/bobbin/fold.webp", "full": "../design-catalogue/entries/bobbin/shot.webp", "sections": {"Why it works": "The hero photograph — a tutor at a desk, mid-lesson — is doing ordinary work\nuntil a glass status card (\"Transcribing in progress,\" with duration and word\ncount) floats over it. That single card converts a generic \"person working\"\nstock photo into a specific claim: the product is listening to this exact\nmoment. The headline pairs a plain roman line with one phrase set in the brand\nyellow (\"Built with **Bobbin**\"), so the accent colour marks the product name\nand nothing else.\n\nTrust and proof are kept close together rather than in separate sections: a\n\"trusted by 1,800+ tutoring companies\" logo row sits directly under the hero,\nand just below full dashboard preview.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed.\nMost UI transitions ride a fast, near-uniform `300ms` on Tailwind's default\nease-out (`cubic-bezier(0.4,0,0.2,1)`/`cubic-bezier(0,0,0.2,1)`, 152 uses\ncombined) — this is a Tailwind/shadcn-driven page, not a bespoke motion\nsystem. Confirming the \"status card\" read: `cta-unlock-in` and `cta-fade-up`\nslide/fade a card up into place, `cursor-blink` ticks a text cursor on/off\n(the \"live\" typing feel), and `border-rotate` spins a conic gradient around a\ncard edge as a glow. The one outlier token is `xxl` at a full `8s` — almost\ncertainly the cursor-blink or a slow ambient loop, not a content reveal.\n\n| token | value | role |\n|---|---|---|\n| `xs`–`md` | 150–300ms | default UI/card transitions |\n| `lg` | 450ms | larger surface transitions |\n| `xxl` | 8s | ambient loop (cursor/glow) |\n| custom (Tailwind) | `cubic-bezier(0.4,0,0.2,1)` | dominant (112 uses) |\n| ease-out | `cubic-bezier(0,0,0.2,1)` | secondary (40 uses) |", "Brief": "Build a yellow-and-black EdTech product page. Open on a warm, documentary photo\nof the user mid-task, with one small glass-morphic status card floating over it\nnaming a specific live action and its metrics. Set the headline in a plain\ngrotesk sans with exactly one phrase — the product name — highlighted in the\nbrand yellow. Directly under the hero, run a trust logo row, then a cream\nsection pairing a four-item accordion (one open by default) against a real\nanalytics screenshot showing the same feature the open item describes. Use a\nserif for occasional display warmth against an otherwise all-sans UI.", "Image recipe": "Documentary photo of a person mid-task at [SUBJECT] — a desk, natural window\nlight, warm tones, genuine focus/absorption in their expression, workspace\ndetails (notebook, plant, laptop) visible but not staged, shot at a slight\nangle rather than head-on.", "Photo search": "Unsplash first, mode": "persuade", "traits": ["full-bleed folded-ribbon gradient hero", "plain white headline over saturated gradient", "small arrow-mark logo", "three-panel alternating-tone service triad", "bulleted capability lists per panel", "orange circular arrow buttons", "plain sans throughout"], "palette": ["#7A1B12", "#E8571E", "#083A74", "#0E1B33", "#EDEDEA", "#FFFFFF"], "type": ["Manrope"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "institutional", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://www.brandfederation.com/", "has_image": true, "img": "../design-catalogue/entries/brand-federation/fold.webp", "full": "../design-catalogue/entries/brand-federation/shot.webp", "sections": {"Why it works": "The hero is a single abstract graphic — a folded, ribbon-like gradient shape in\ndeep red fading to bright orange — filling the entire viewport behind a plain,\nconversational headline (\"Turn your brand into a force for growth\"). No\nphotography, no icon set, just one continuous abstract form doing all the\nvisual work, which suits a brand-strategy consultancy: the graphic reads as\n\"transformation\" or \"momentum\" without depicting anything literal that could\ndate or narrow the pitch.\n\nThe service structure below is a clean triad — Research, Strategy,\nImplementation — given three panels in three different tones (light grey, dark\nnavy, warm peach), each with its own bulleted capability list and a small\ncircular orange arrow button. Alternating panel tone rather than panel content\ngives a plain three-column list visual rhythm without needing three different\nillustrations.\n\nThe page's confidence comes from restraint in a specific place: everything\nbelow the gradient hero is plain, functional, almost administrative — bulleted\nlists in a single sans, no further photography or illustration — which lets\nthe one abstract gradient hero stand as the entire \"creative capability\" proof,\nwith the rest of the page reading as organised, credible delivery.", "What to borrow (principle)": "- **Fill the entire hero with one abstract gradient graphic** rather than\n  photography or icons, when the service (strategy, transformation) resists\n  literal depiction.\n- **Alternate panel background tone, not panel content structure**, to give a\n  plain three-column service list visual rhythm.\n- **Reserve your one accent colour for small circular action buttons** across an\n  otherwise neutral service section, so it stays a clear \"click here\" signal.\n- **Let one bold visual statement (the hero) carry all the creative weight**,\n  and let everything after it be plain and organised — the contrast itself\n  reads as competence.", "What to leave": "- A saturated red-to-orange gradient this large risks reading as generic\n  \"AI startup\" visual shorthand if it isn't paired with a genuinely distinct\n  headline — the words need to be doing real work since the graphic alone\n  won't differentiate the brand.\n- Three alternating panel tones (light, dark, peach) in one row can create\n  uneven perceived hierarchy — the dark-navy centre panel visually dominates\n  even if \"Strategy\" isn't meant to outweigh \"Research\" or \"Implementation.\"", "Signature move": "The full-bleed folded-ribbon gradient: one continuous abstract shape, warm red\nfading to orange, filling the entire hero viewport with no other imagery,\ncarrying the brand's entire visual identity in a single non-literal graphic.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed.\nTransitions sit on a `200–350ms` range with no eased curve captured (colour,\nborder-colour, background-colour and transform all transition on the\nbrowser's implicit default), plus a generic loading-spinner keyframe. No\nshifting-gradient or panel-reveal keyframe was captured, so the \"animated\nribbon\" and \"panels fade in\" reads stay inferred from the image, not\nconfirmed — the ribbon graphic is most likely a static SVG/image asset rather\nthan an animated one.\n\n| token | value | role |\n|---|---|---|\n| `sm` | 200ms | colour/transform state changes |\n| `md` | 325ms | border-colour transitions |", "Brief": "Build a plain, credibility-first consultancy page anchored by one abstract\ngradient hero. Fill the entire hero viewport with a single continuous abstract\nshape (a folded ribbon, a fluid gradient) in two related warm hues, with a\nplain conversational headline in white set over it and one CTA. Drop to white\nfor the service structure: three panels in alternating tones (light, dark,\nwarm) each naming one service phase with a short bulleted capability list and\na small circular accent-coloured arrow button. Keep all type in a single plain\nsans throughout, no further illustration after the hero.", "Image recipe": "Not applicable — this reference is carried by an abstract gradient/ribbon\ngraphic rather than photography. If photography is substituted, use a single\nabstract, non-literal texture (fabric, liquid, light trails) in the brand's two\nhero colours, filling the full viewport with no recognisable subject.", "Photo search": "Unsplash first, Pexels second (for a photographic substitute only).\n- \"abstract red orange gradient fabric flow\"\n- \"fluid liquid gradient warm tones\"\n- \"abstract ribbon light trail warm\"", "Reference lock": "Primary reference/direction: Brand Federation — one full-bleed abstract gradient-ribbon hero, dropping to a plain three-panel alternating-tone service triad.\nPreserve (3-5 traits): a single continuous abstract gradient/ribbon graphic filling the entire hero, carrying the whole visual identity; plain conversational headline in white set directly over the gradient; three service panels in alternating background tones (light, dark, warm), each with a short bulleted list; small circular accent-coloured arrow buttons as the only recurring accent element.\nBorrow only (1-2): the small arrow-mark logo; the \"backed by growth\" framing of the headline.\nRole rules: only one abstract graphic per page, confined to the hero; accent colour (orange) reserved for circular action buttons only, never body text; service panels always alternate tone in sequence, never repeat consecutively.\nMedia strategy: abstract gradient/ribbon graphic only for the hero; no photography anywhere on the page — if substituted, keep it equally abstract and non-literal.\nReject: photography or icon illustration in the hero in place of the abstract graphic; a uniform single-tone service section with no alternation; more than one accent colour.\nToken commitments: deep-red `#7A1B12`, orange `#E8571E`, peach-panel `#F5C9A0`, navy-panel `#0E1B33`, light-panel `#EDEDEA`, white `#FFFFFF`; `Manrope` for all type."}, "has_extract": true}, {"slug": "bumble", "title": "Bumble", "url": "https://bumble.com", "captured": "2026-09-04", "family": "honey-wordmark-collage", "dna": "Monochrome-plus-one-honey UI x tilted lifestyle-photo collage", "register": "modern clean", "grammar": "typographic poster", "lane": "A full-bleed honey-yellow hero where an oversized wordmark sits behind a fan of tilted, overlapping member photos, then the page settles onto white feature cards with a barely-there shadow and alternating yellow bands as section punctuation", "mode": "persuade", "traits": ["monochrome + exactly two yellows", "oversized wordmark as hero device", "5-8° tilted overlapping photo collage", "\"16-24px soft radii", "1000px badges\"", "one whisper shadow (12% opacity)", "positive letter-spacing across all sizes"], "palette": ["#ffdb5b", "#fff386", "#202020", "#ffffff", "#f3f3f3", "#3b3b3b"], "type": ["BumbleSans"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "playful", "category2": "product-focused", "origin": "refero", "extract": "ok", "source_url": "https://bumble.com", "has_image": true, "img": "../design-catalogue/entries/bumble/fold.webp", "full": "../design-catalogue/entries/bumble/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. The system is explicit about its own constraint: exactly two yellows\n(`#ffdb5b`, `#fff386`) against an otherwise achromatic near-black-and-white UI —\nno semantic red, green or blue anywhere. Because honey yellow only ever appears as\na full-bleed section canvas or a card frame, never as a button fill, it reads as\nmood rather than as a state colour; the single filled action button stays ink\n`#202020` throughout, so \"brand colour\" and \"clickable\" are never the same signal.\n\nThe one typeface, BumbleSans, carries every role from nav to display, differentiated\nby weight (400-700) and a consistently positive letter-spacing that widens with\nsize — an unusual choice for a geometric sans, which normally tightens at large\nsizes. That opened tracking is what keeps a single-typeface system from feeling\nmonotonous across nine size steps.\n\nThe hero's signature device — the brand wordmark rendered at 200px+, with tilted\n(5-8°) member photos overlapping the letterforms — inverts the usual figure/ground\nrelationship: the type is the background texture and the photography is the\nforeground event. Combined with the one approved shadow (a 12%-opacity whisper used\nonly to lift white cards a few pixels off the page), the whole system stays soft\nand low-contrast so the tilted photography reads as the highest-energy element on\nany given screen.", "What to borrow (principle)": "- **Declare a literal colour budget and hold it.** \"Exactly two yellows, otherwise\n  monochrome\" is auditable in a way \"use the brand colour sparingly\" is not.\n- **Never let the brand colour double as the action colour.** Keeping the primary\n  button in ink black means colour communicates warmth, not clickability — the two\n  jobs stay separable.\n- **Invert type-vs-photo hierarchy once, deliberately.** Using the wordmark as\n  background texture behind photography (rather than photography behind text) is a\n  legible, one-time reversal of a very common hero pattern.\n- **Allow exactly one shadow value.** A single whisper-soft shadow used everywhere\n  a card needs to lift avoids the drift into stacked, inconsistent elevation.\n- **Widen tracking as size grows.** Positive, size-scaling letter-spacing is a\n  small lever that shifts a geometric sans from \"clinical\" to \"warm.\"", "What to leave": "- A single custom typeface for every role (nav through 68px display) is a high bar\n  — it requires a genuinely complete family across weights 400-700, or the system\n  falls back to a generic substitute at extreme sizes.\n- The tilted-photo hero collage depends on a steady supply of diverse, well-lit\n  lifestyle photography; a thin or repetitive photo library will make the \"dynamic\n  collage\" read as awkwardly sparse instead.\n- The explicit \"don't add semantic colours\" rule is easy to break under product\n  pressure (error states, success states) and needs a documented alternative\n  (icon, copy, weight) before it can hold in a real product team.", "Signature move": "The oversized wordmark-as-background hero: the brand name set at 200px+ directly\non the honey canvas, with three or four tilted (5-8°) member-profile photo cards\noverlapping the letterforms — the type recedes into texture, the photography\nbecomes the foreground subject.", "Motion": "(from designlang extract) Feel reads as smooth, and the page is scroll-linked.\nDurations are short — 200ms and 300ms — on a plain `ease` curve, used sparingly\n(the extract logs only a single explicit easing use outside the keyframes). The\nconfirmed keyframes are four named `swap-card` animations (each a slide combining\nopacity and transform), which directly explains the hero device: the tilted,\noverlapping member-photo cards animate in as a staggered stack-and-swap reveal\nrather than a static collage or slow parallax. (observed in capture) the\n\"no hover-state lift\" note on the filled action button suggests state changes\notherwise rely on colour inversion rather than movement, consistent with a soft,\nlow-drama system that lets photography carry the energy.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 200ms | `ease` |\n| md | 300ms | `ease` |\n| swap-card-1..4 | slide (opacity + transform) | 1-3 uses each |", "Brief": "Build a consumer social-app marketing page. UI stays monochrome — ink `#202020` on\nwhite `#ffffff`, stepping to mist `#f3f3f3` for quiet elevation — with exactly two\nyellows, honey `#ffdb5b` and pollen `#fff386`, used only as full-bleed section\ncanvases or card frames, never as button fills. Open full-bleed on a honey hero:\nan oversized (200px+) wordmark in ink, with 3-4 member-photo cards tilted 5-8° and\noverlapping the letterforms. Float a borderless nav with a white pill marking the\nactive link and a filled ink \"Sign in\" button. Below, alternate white feature\ncards (16-24px radius, one whisper shadow, 24-40px padding, photo + copy in a\n2-column layout) with full-bleed honey or pollen product-variant sections showing\ntilted phone screenshots. Use 1000px pill radius for every badge and tag. Keep\nletter-spacing positive and widening with size throughout, 64px section gaps, and\nnever introduce a second chromatic hue.", "Image recipe": "Candid lifestyle portrait of [SUBJECT] — a diverse young adult in a real-world\nsetting (café, park, social gathering), natural daylight with warm colour grading\nthat leans toward honey/amber tones, genuine unposed expression, shot close and\npersonal as if for a profile card rather than a wide environmental establishing\nshot.", "Photo search": "Unsplash first, Pexels second.\n- \"young adult portrait candid natural light warm\"\n- \"friends outdoor social gathering daylight\"\n- \"phone screenshot mockup dating app UI\"\n- \"diverse group portrait warm tone\"", "Reference lock": "Primary reference/direction: Bumble — monochrome-plus-two-yellows UI, oversized\nwordmark hero with tilted overlapping member-photo collage.\nPreserve (3-5 traits): strict two-yellow chromatic budget (`#ffdb5b`, `#fff386`)\nagainst an otherwise achromatic `#202020`-on-white UI; honey/pollen used only as\nfull-bleed canvas or card frame, never as a button fill; single filled action\nbutton always ink `#202020`; one approved shadow value only, no stacking; positive,\nsize-scaling letter-spacing across every BumbleSans size.\nBorrow only (1-2): the oversized wordmark-as-background hero device; the 5-8°\ntilted overlapping photo-card collage.\nRole rules: yellow never fills a button or badge foreground; body text never drops\nbelow 15px or below weight 400; body paragraphs stay left-aligned, centring is\nreserved for hero display type only.\nMedia strategy: photo:unsplash — diverse, candid, warm-graded lifestyle portraits\nand social-setting photography; no illustration, no stock corporate imagery.\nReject: a second chromatic hue for any state or category; heavy or multi-layer\nshadows; sharp corners (0-4px) on cards or buttons; centred body prose; full-\nopacity pure black anywhere.\nToken commitments: bg `#ffffff`, soft `#f3f3f3`, honey `#ffdb5b`, pollen `#fff386`,\nink `#202020`, ink-soft `#3b3b3b`; type weights 400/500/600/700 at 15-68px, tracking\n0.007em at 15px scaling to 0.02em at 32px+; radius 16px nav/buttons, 24px cards,\n1000px badges; shadow `rgba(32,32,32,0.12) 0 1px 8px`; page max-width 1200px,\nsection gap 64px, card padding 32px."}, "has_extract": true}, {"slug": "busy-bee-honey", "title": "Busy Bee Honey", "url": "https://www.busybeehoney.com/", "captured": "2026-09-04", "family": "barnside-billboard-label", "dna": "Painted roadside billboard x vintage honey-label Americana", "register": "illustrated dark", "grammar": "chaptered editorial", "lane": "Full-bleed solid-colour bands of cocoa, gold and marquee-blue butt directly against each other with no gap, each stamped by a mega-scale condensed serif headline and an unframed bear-bottle sitting straight on the canvas", "mode": "persuade", "traits": ["\"238px condensed display serif", "0.8 line-height\"", "\"full-bleed colour blocks", "zero gap between sections\"", "\"unframed centred product", "no card\"", "\"1000px pill CTAs", "colour-inverted per section\"", "scrolling marquee band as sole divider", "\"flat", "no shadow", "colour-is-elevation\""], "palette": ["#3b2722", "#f2ebd0", "#ffca50", "#a0342a", "#6aacc2", "#6fa162"], "type": ["TayMakawao", "Barkman Honey", "TayBirdie"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "consumer-brand", "category2": "playful", "origin": "refero", "extract": "ok", "source_url": "https://www.busybeehoney.com/", "has_image": true, "img": "../design-catalogue/entries/busy-bee-honey/fold.webp", "full": "../design-catalogue/entries/busy-bee-honey/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. There is no card, no shadow, and no max-width container anywhere in the\nsystem — hierarchy is built entirely from two mechanisms: the jump from body text\nto a display headline that can reach 238px, and the abutment of solid full-bleed\ncolour bands (dark cocoa, honeycomb gold, cornflower-blue marquee) with zero gap\nbetween them. Where a typical product page would lift a card with a shadow, this\none simply changes the background colour of the whole section — colour step\nreplaces elevation entirely.\n\nType reinforces the \"painted sign\" premise: TayMakawao is set at an aggressive 0.80\nline-height with tight tracking so letters lock together like wooden cutout\nlettering, and it is explicitly never used above 1.0 leading — the tightness is the\nbrand's whole voice, not an accident. A second serif, Barkman Honey, is reserved\nfor one level below the mega display, so the page never has two competing giant\nstatements on the same screen.\n\nThe product itself gets no visual apparatus at all — no frame, no drop shadow, no\ncard — it simply sits centred on whatever colour the section is running. Because\nthe CTA pill always inverts against its section (dark pill on gold, gold pill on\ndark, never dark-on-dark), the one interactive element on each screen is legible\nwithout needing extra weight or a border to announce itself.", "What to borrow (principle)": "- **Replace elevation with colour-block abutment.** Sections that touch with zero\n  gap, each a different flat colour, can do the \"this is a new area\" job a shadow\n  usually does — with none of the cost.\n- **Give the display headline a strict maximum leading.** Locking line-height at or\n  below 1.0 (here, 0.80) is what makes oversized type read as engraved lettering\n  rather than merely \"big text.\"\n- **Never wrap the hero product in a container.** An unframed product sitting\n  directly on a solid colour reads as the literal subject of the page, not a\n  photographed asset inside a UI.\n- **Always invert the CTA against its section.** A hard rule — light pill on dark,\n  dark pill on light, never same-on-same — keeps the one clickable element visible\n  without extra styling.\n- **Use a thin marquee band as the only divider device.** A scrolling strip of\n  repeated phrase + glyph, in a colour reserved just for that purpose, replaces a\n  hairline rule with a moment of motion and specificity.", "What to leave": "- 238px display type constrains the entire content strategy to headline-length\n  copy; anything resembling a paragraph would either break the grid or force the\n  type down to a size where the \"billboard\" effect disappears.\n- Zero gap between full-bleed colour sections leaves no breathing room for a\n  brand voice that isn't confident about hard colour contrast — softer or pastel\n  palettes would read as jarring rather than bold under this rule.\n- The explicit six-typeface stack (mega serif, secondary serif, UI sans, system\n  serif fallback, mono, system sans) is a lot of type surface area to keep\n  disciplined; a smaller team will likely need to consolidate two or three roles.", "Signature move": "The unframed, uncarded hero product: the bear-shaped bottle rendered at full\nphotographic scale, centred, with no card, no shadow, no background treatment\nbeyond the section's flat colour — it is presented as the literal subject of the\npage rather than a photographed object floating on a surface.", "Motion": "(from designlang extract) Feel reads as responsive, and the page is scroll-linked.\nThe extract corrects the marquee-band reading: the keyframes actually confirmed\nfiring are a pair of bee-wing-flap rotations (`Bee_leftWingFlap`/\n`Bee_rightWingFlap`, rotate 10deg to -15deg with a skew, 11 uses each) driving an\nanimated bee mascot/icon, not a scrolling text band. A third keyframe,\n`Emblem_rotate` (a full 360deg turn), matches the circular \"trace seal\" badge\ncalled out separately as a borrow-only device — it likely spins slowly as a\nauthenticity mark. A `LoaderLogo_rotateBee` keyframe plus a sliding-gradient\nshimmer drive the page loader. Interactive transitions run mostly on an ease-out\nfamily (91 uses, `cubic-bezier(0.215, 0.61, 0.355, 1)` and `cubic-bezier(0.25,\n0.46, 0.45, 0.94)`) at durations from 200ms up to 1s, with a smaller ease-in-out\n(`ease`) set for simpler colour/background changes. Cookie-banner and modal\nslide/fade keyframes are also present but are UI chrome, not brand choreography.\n(observed in capture) the rest of the scroll resolves as static, hard-edged colour\nbands with no crossfade or parallax, consistent with the source's \"deliberately\nflat\" elevation philosophy.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 200ms | `ease` |\n| md | 300ms | ease-out family |\n| lg | 500ms | ease-out family |\n| xl | 1s | ease-out family |\n| bee wing flap | rotate 10°→-15° | 11 uses each side |\n| emblem/seal | 360° turn | — |", "Brief": "Build a bold, Americana food-brand landing page. Run full-bleed solid colour\nsections — dark cocoa `#3b2722`, honeycomb gold `#ffca50`, cornflower-blue marquee\n`#6aacc2` — that abut directly with no gap and no max-width container. Set the hero\nheadline in a condensed display serif at 90-238px, line-height 0.80, slight\nnegative tracking, bleeding past the container edge. Place the product photograph\ncentred and unframed on the section's flat colour, at roughly half viewport\nheight, no card, no shadow. Use a secondary serif at 65px for the next-level\nsubhead, and a plain workhorse sans for nav, footer and micro-labels. Every CTA is\na 1000px pill that inverts against its section (dark pill on gold, gold pill on\ndark). Insert a 40-64px scrolling marquee band in cornflower blue between colour\nsections, repeating a short phrase with a small line-art glyph. Never use white for\ncanvas — cream parchment `#f2ebd0` only — and never add a shadow anywhere.", "Image recipe": "Studio product photograph of [SUBJECT] — a single object shot dead-centre against\na flat saturated colour backdrop matching the section it sits in, sharp focus, high\ncontrast between the object and the flat field, no props, no surface or shadow\nbeneath it, no gradient — the object reads as if cut out and placed directly on a\npainted colour panel.", "Photo search": "Unsplash first, Pexels second.\n- \"product bottle flat colour background studio\"\n- \"honey jar amber liquid product shot\"\n- \"vintage americana packaging label\"\n- \"roadside sign painted lettering\"", "Reference lock": "Primary reference/direction: Busy Bee Honey — billboard-Americana product page,\nfull-bleed abutting colour bands, mega condensed-serif display type.\nPreserve (3-5 traits): full-bleed solid colour sections with zero gap and no\nmax-width container; display type at 90-238px, line-height capped at 0.80-1.0,\nnever looser; product photography always unframed, centred, no card or shadow;\nCTA pill always inverts against its section colour; scrolling marquee band as the\nonly divider device.\nBorrow only (1-2): the circular \"trace seal\" badge as a heritage/authenticity mark;\nthe line-art bee glyph as an inline period between short phrases.\nRole rules: cornflower blue is a divider/strip colour only, never a large surface;\nsage green never appears in text or buttons; display type never bolds or loosens\npast 1.0 leading; canvas is always cream parchment, never pure white.\nMedia strategy: photo:unsplash — single-object studio product shots on flat\nsaturated colour, no lifestyle staging, no hands, no kitchen context.\nReject: drop shadows or glow of any kind; a card or border around the hero\nproduct; a sans-serif display face; a centered/contained layout with side\ngutters; more than one mega-display headline per screen.\nToken commitments: dark `#3b2722`, cream `#f2ebd0`, gold `#ffca50`, red-accent\n`#a0342a`, blue-strip `#6aacc2`, green-strip `#6fa162`; display 90-238px/leading\n0.80-1.0/-0.01em tracking; secondary serif 65px/leading 1.0; radius 0px sections,\n1000px pills/tags; base spacing unit 8px, card padding 24px."}, "has_extract": true}, {"slug": "calyx", "title": "Calyx", "url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/calyx.html", "captured": "2026-09-03", "family": "paper-atelier", "dna": "Print catalogue x mono ledger", "register": "editorial print", "grammar": "gallery/catalog", "lane": "Full-bleed photographic overture, then a quiet paper column that scrolls as a numbered, priced catalogue and closes on one dark panel", "mode": "persuade", "traits": ["cream paper ground", "Cardo display italic", "PT Mono kickers", "12-col editorial grid", "numbered priced index rows", "rust drop caps", "full-bleed photo plates", "dark closing panel", "fixed multiply grain"], "palette": ["#F7F3EB", "#ECE7DE", "#12120B", "#24251D", "#585951", "#893F28", "#5D7A66", "#1A4129"], "type": ["Cardo", "PT Mono"], "kind": "example", "source": "claude", "status": "ready", "category": "editorial", "category2": "luxury-craft", "origin": "example-site", "extract": "none", "source_url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/calyx.html", "has_image": true, "img": "../design-catalogue/entries/calyx/fold.webp", "full": "../design-catalogue/entries/calyx/shot.webp", "sections": {"Why it works": "The page behaves like a printed commission catalogue, not a website. One typeface\npair does all the work: Cardo carries every voice — roman for the hero, italic for\nheadlines, pull quotes and product names — and PT Mono, tracked out at 0.22em and\nnever larger than 11px, carries every label, caption, counter and address. Because\nthe mono is reserved strictly for metadata, the reader learns the code in one\nscreen: serif is the studio talking, mono is the ledger.\n\nThe photography is never decorative filler. The hero is a single full-bleed\nbouquet with the headline set straight onto it; every subsequent image is a plate\nwith a commission number, a location and a `02 / 14` counter beneath it. Images\nare made to look like documentation, which is exactly what a florist selling\nsite-specific work needs to prove.\n\nThe economic centre of the page is the boldest move: an index of eleven cuttings\nwith real names, real ingredient lists and real prices in SEK, ruled like a\ncatalogue. Nothing on the page persuades harder than showing the price.\n\nThe 12-column grid is used asymmetrically and honestly — labels sit in columns 1-3,\ncontent in 4-12, with a hairline rule under each kicker. The empty left column is\nthe luxury signal; nothing is centred to fill it.", "What to borrow (principle)": "- **One serif, one mono, a hard rule between them.** Serif = voice, mono = record.\n  Never let the mono grow past caption size, never let the serif carry a label.\n- **Price the work in public.** A ruled index of named items with numbers, spec\n  line and price does more selling than any hero claim.\n- **Caption every image like an archive.** `CMSN. 0211 — HOTEL PIGALLE,\n  DROTTNINGGATAN` plus a `02 / 14` counter converts a stock photo into evidence.\n- **Reserve exactly one accent.** Rust `#893F28` appears only on drop caps and one\n  product title; everything else is ink on paper.\n- **End on inversion, once.** A single dark panel at the close makes the\n  commission CTA feel like a different room, not a louder button.", "What to leave": "- The fixed `mix-blend-mode: multiply` grain overlay at 0.5 opacity — it costs a\n  full-screen composited layer for a texture most viewers never consciously see,\n  and it dulls photography that was already muted.\n- The blanket reveal: `document.querySelectorAll('section, h1, h2, h3, blockquote,\n  figure, li')` all get a 1.2s transition. Everything animating means nothing is\n  emphasised, and long index lists stagger awkwardly.\n- Copy that overwrites its own restraint (\"The eleventh is a wedding.\", \"smells\n  like a memory\"). One or two of these read as craft; four in a row read as\n  costume.\n- Text set directly on a busy bouquet, held up only by a drop shadow. It survives\n  here because the crop happens to be dark on the left — it would fail on a lighter\n  photo. Use a scrim or a dedicated plate.", "Signature move": "The commission counter. Every image plate carries a mono caption on the left and a\n`NN / 14` counter on the right, so the page reads as a numbered run of real jobs\nwith a finite capacity — reinforced by the copy (\"We accept eleven commissions a\nweek\"). Scarcity stated as bookkeeping, not as a badge.", "Motion": "", "Brief": "Build a cream-paper editorial catalogue for a small studio that sells finite,\nnamed, site-specific work. Set everything in one old-style serif (Cardo) — roman\nfor display, italic for headlines and product names — with a single tracked-out\nmonospace at caption size for all labels, numbers and addresses. Ground is warm\noff-white `#F7F3EB`; ink is a near-black olive `#12120B`; exactly one accent, a\nrust `#893F28`, used only for drop caps and one title. Open on a full-bleed\nphotograph with the headline in cream serif set into it, mixing roman and italic\nlines. Below the fold, drop to a 12-column grid where mono kickers sit in columns\n1-3 under a hairline rule and content runs 4-12; keep the left column empty. Show\nwork as captioned plates with commission numbers and an `NN / total` counter.\nCentre the page on a ruled index of named items with ingredient lines, spec and\nprice. Close on one full-width dark panel with the contact address and nothing\nelse.", "Image recipe": "Documentary still life of [SUBJECT], shot on medium format film, natural north\nwindow light, shallow depth of field with one plane crisp and the rest falling\nsoft, muted desaturated colour with warm cream highlights and cool green shadows,\nno styling props, no studio strobe, no gradient background — the object as\ndelivered, photographed where it will live. Slight overexposure in the highlights,\ngrain retained.", "Photo search": "Unsplash first, Pexels second.\n- \"florist bouquet natural light film\"\n- \"flowers in vase window light muted\"\n- \"wildflowers close up shallow depth of field\"\n- \"wedding table arrangement documentary\"", "Reference lock": "Primary reference/direction: Calyx — cream paper atelier catalogue, Cardo + PT Mono, priced index as centrepiece.\nPreserve (3-5 traits): warm cream ground `#F7F3EB` with near-black olive ink `#12120B`; Cardo for all voice, PT Mono at caption size for all metadata; 12-col grid with empty left column and hairline rules under kickers; numbered/priced index rows as the page's centre; captioned image plates with `NN / total` counters.\nBorrow only (1-2): rust `#893F28` drop caps; the single dark closing panel.\nRole rules: serif never labels, mono never speaks; mono capped at 11px and 0.22em tracking; accent rust on at most two elements per page; headline mixes roman and italic lines only in the hero.\nMedia strategy: photo:unsplash — documentary stills of real work, always captioned with a reference number and counter; never a generic hero stock frame.\nReject: fixed grain overlays; blanket scroll reveals on every element; centred layouts; a second accent colour; sans-serif of any kind; drop-shadowed text over busy photography without a scrim.\nToken commitments: bg `#F7F3EB`, bg-tint `#ECE7DE`, ink `#12120B`, ink-soft `#24251D`, stone `#585951`, rust `#893F28`, green-mid `#5D7A66`, green-deep `#1A4129`; display `Cardo`, mono `PT Mono`; display leading 0.92-1.04, display tracking -0.02em, kicker tracking 0.22em; grid 12-col, max-width 1480px, gutter 32px."}, "has_extract": false}, {"slug": "caractere-bois", "title": "Caractère Bois", "url": "https://www.caractere-bois.fr", "captured": "2026-09-04", "family": "oxblood-atelier-blueprint", "dna": "Documentary workshop video x oxblood serif wordmark with blueprint line overlays", "register": "editorial print", "grammar": "gallery/catalog", "lane": "A sky-blue band carries a huge oxblood serif wordmark over a workshop video, drops into a full-bleed oxblood pull-quote panel, then scatters joinery detail photography annotated with hairline architectural line drawings", "mode": "persuade", "traits": ["oxblood display serif wordmark", "sky-blue header band", "documentary workshop video hero", "full-bleed oxblood pull-quote panel", "mixed roman/italic serif headlines", "hairline architectural line overlays on photos", "scattered mosaic detail photography", "rounded humanist sans labels"], "palette": ["#EAEAEA", "#9CC4FF", "#540A04", "#F4300F", "#333333", "#C2AF94", "#B28959", "#897A65"], "type": ["PP Migra", "studiofeixensans"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "luxury-craft", "category2": "portfolio", "origin": "raw-url", "extract": "ok", "source_url": "https://www.caractere-bois.fr", "has_image": true, "img": "../design-catalogue/entries/caractere-bois/fold.webp", "full": "../design-catalogue/entries/caractere-bois/shot.webp", "sections": {"Why it works": "The identity opens on a strong colour clash used deliberately: a sky-blue band\ncarries the wordmark \"CARACTÈRE BOIS\" set in an oxblood display serif (PP\nMigra) large enough to nearly fill the header, with the brand's leaf-shaped\nmark sitting between the two words as a hard-edged full stop. Immediately\nbelow, a documentary video of a craftsman at a workshop table plays without\nany text over it — the wordmark has already said the brand's name, so the\nfootage is left to just show real work happening. The next section commits\nharder to the oxblood: a full-bleed dark-red panel with a French pull-quote\nset in the same serif, roman and italic mixed within the sentence (much like\nCalyx's own display convention) to give emphasis without changing size or\nweight. The extract shows a brighter red-orange (`#f4300f`) as the single\nmost-used colour on the page, ahead of the oxblood itself — the identity\nleans on this hotter accent for smaller, higher-frequency marks (links,\nhairlines, small UI) while oxblood carries the large panels and the wordmark.\n\nFurther down, the page's most specific device appears: photographs of joinery\ndetails — a door handle, a cabinet corner, a window frame — have thin oxblood\narchitectural line drawings sketched directly onto them, as if a blueprint had\nbeen laid over the finished photograph. It reads as \"this is designed before\nit's built,\" turning product photography into evidence of process. The\ndetail photos themselves are scattered at irregular sizes rather than gridded,\nechoing a workshop pin-board rather than a catalogue spread.\n\nLabels and captions drop to a rounded, humanist sans (studiofeixensans),\ntracked and small, giving the page the same voice/record split Calyx uses\nbetween serif and mono — serif speaks, sans records.", "What to borrow (principle)": "- **Let a bold wordmark on a contrasting flat-colour band stand alone above\n  documentary footage** — the footage doesn't need to repeat what the wordmark\n  already established.\n- **Mix roman and italic within one headline sentence** for emphasis instead of\n  changing size, weight or colour — it reads as considered typesetting rather\n  than a shouted headline.\n- **Overlay thin hand-drawn-style line work directly on product photography**\n  to signal \"this was designed,\" not just \"this was photographed\" — a cheap\n  device relative to a full blueprint render, with outsized effect.\n- **Scatter detail photography at irregular sizes** rather than a uniform grid\n  when the goal is to feel like a workshop or atelier, not a catalogue.", "What to leave": "- The sky-blue vs. oxblood header contrast is high-saturation and won't suit\n  every craft brand — it works here because the rest of the page is quiet\n  enough to absorb one loud opening beat.\n- The hairline line-overlay device needs restraint; used on every photo it\n  would stop reading as \"blueprint annotation\" and start reading as clutter.\n- The pull-quote panel's italic-mixed-with-roman treatment depends on the\n  copy itself being short — it would lose clarity in a longer paragraph.", "Signature move": "Thin oxblood architectural line drawings sketched directly onto joinery detail\nphotographs — an arc, a door-frame outline — turning finished product shots\ninto something closer to an annotated technical drawing.", "Motion": "(from designlang extract) The extract rates overall feel \"smooth\" with\nconfirmed scroll-linked behaviour. Three duration steps span 200ms to a full\n1000ms, mostly on a plain `ease-in-out` (`ease`) rather than a custom bezier —\nrestrained, matching the page's quiet, gallery-like pacing. Five named\nkeyframes are defined, all dialog-pattern: `dialog-fade-in` (opacity 0→1)\nplus four directional slide-ins (`dialog-slide-in-right/top/bottom/left`,\neach a 100%→0 translate) — almost certainly the mechanism behind a cart/menu\noverlay (the \"PANIER/MENU\" nav buttons noted in Reference lock) rather than\nthe joinery-detail or pull-quote sections, which appear to rely on plain\nopacity/transform transitions instead. (observed in capture) The hero's\nlooping documentary video is independently confirmed — raw and fresh\ncaptures show two different frames of the same workshop scene — autoplay/loop\nvideo, not inferred.\n\n| kind | tokens |\n|---|---|\n| durations | sm 200ms · md 400ms · xl 1000ms |\n| easing | ease-in-out (`ease`, 1 use) |\n| keyframes | `dialog-fade-in` · `dialog-slide-in-{right,top,bottom,left}` |", "Brief": "Build a French craft/atelier brand on a high-contrast opening: a bold\noxblood-on-sky-blue (or equivalent complementary pair) wordmark band, followed\nimmediately by autoplaying documentary video of real workshop work with no\ntext overlay. Use one serif for all display copy, mixing roman and italic\nwithin a single headline sentence for emphasis rather than varying size or\ncolour. Commit to one full-bleed dark accent panel for a short pull-quote.\nFurther down, scatter product/detail photography at irregular sizes rather\nthan a grid, and overlay a small number of them with thin hand-drawn-style\narchitectural line work to signal designed intention behind the craft. Keep\nlabels and captions in a plain rounded sans, small and tracked, separate from\nthe serif's voice.", "Image recipe": "Documentary photograph of [SUBJECT] — a joinery/cabinetry detail (handle,\ncorner, frame) or interior fit-out — natural or warm interior light, real\nmaterial texture (wood grain, brass hardware) in sharp focus, candid framing\nas installed rather than staged for catalogue, optionally with a thin\nhand-drawn architectural line (arc, outline) overlaid in a single accent\ncolour to suggest a design sketch beneath the finished piece.", "Photo search": "Unsplash first, Pexels second.\n- \"wood cabinetry detail brass handle\"\n- \"joinery workshop craftsman documentary\"\n- \"interior wood furniture detail natural light\"\n- \"carpentry workshop tools warm light\"", "Reference lock": "Primary reference/direction: Caractère Bois — oxblood serif wordmark on\nsky-blue, documentary workshop video, blueprint-line-overlaid joinery detail\nphotography.\nPreserve (3-5 traits): high-contrast wordmark band (one bold accent colour on\none contrasting flat ground) opening the page; autoplaying documentary\nworkshop video with no text overlay; one serif carrying all display copy,\nmixed roman/italic within a sentence for emphasis; thin hand-drawn-style line\noverlays on a minority of detail photographs; scattered irregular-size photo\nplacement rather than a uniform grid.\nBorrow only (1-2): the leaf-shaped logomark as a divider between wordmark\nhalves; the pill-shaped \"PANIER/MENU\" nav buttons.\nRole rules: line overlays applied to at most a third of any photo set, never\nall of them; serif never used for captions/labels, sans never used for\nheadlines.\nMedia strategy: photo/video:documentary — real workshop and installed-project\nfootage/photography only, no staged catalogue product shots.\nReject: a uniform photo grid in place of the scattered mosaic; line overlays\non every image; a second display typeface competing with the serif.\nToken commitments: sky `#9CC4FF`, oxblood `#540A03`, oxblood-accent `#AB3E21`,\npaper `#EAEAEA`, wood-light `#C2AF94`, wood-mid `#B28959`, wood-deep `#897A65`;\ndisplay serif \"PP Migra\" (roman + italic mixed), labels \"studiofeixensans\"."}, "has_extract": true}, {"slug": "comet-perplexity", "title": "Comet (by Perplexity)", "url": "", "captured": "2026-09-04", "family": "orbit-sphere-browser", "dna": "Planetary sphere illustration x AI-browser feature grid", "register": "modern clean", "grammar": "live surface", "lane": "Two abstract planetary spheres flank a serif headline on cream, framing a stacked browser-window product mockup, then a 2x2 pastel feature grid each showing a different AI capability", "mode": "persuade", "traits": ["cream ground", "dual abstract planetary sphere illustrations flanking hero", "serif headline", "small orbit-dot logomark", "stacked browser-window product mockup", "black pill download CTA with platform list", "2x2 pastel feature-card grid", "soft rounded card corners throughout"], "palette": ["#F4F0E6", "#12232A", "#B4432A", "#171414", "#DCE8D8", "#D8E4EA"], "type": ["\"serif display (visual match", "unverified)\"", "\"sans UI (visual match", "unverified)\""], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "", "origin": "raw-image", "extract": "none", "source_url": "https://comet.perplexity.ai/", "has_image": true, "img": "../design-catalogue/entries/comet-perplexity/fold.webp", "full": "../design-catalogue/entries/comet-perplexity/shot.webp", "sections": {"Why it works": "The hero is framed by two large abstract planetary spheres — one dark\nteal-black, one warm red-orange — sitting at opposite corners, mostly cropped\noff-screen. They're pure illustration, no literal astronomy, but the product is\nnamed \"Comet,\" so the spheres function as a visual pun that also happens to\nframe the central content in negative space without needing a bounding box.\n\nA serif headline (\"The browser that works for you\") on plain cream ground\nkeeps the tone calm and editorial rather than technical, which matters for a\nbrowser product: the pitch is meant to feel like a considered upgrade to\nsomething familiar, not a new category to learn. The parent brand is credited\nin a small line above the headline (\"A new browser from Perplexity\"),\nborrowing existing trust rather than asking the product to build its own from\nzero.\n\nBelow the fold, four capabilities (\"AI that understands,\" \"AI that builds,\"\n\"AI that emails,\" \"AI that creates\") are shown as a 2x2 grid of soft pastel\ncards, each with a distinct, real UI moment inside — a summarize/ask/translate\npanel, a chat building a website, a draft-email composer. Repeating the\nsentence structure across four card titles turns a feature list into a\nreadable refrain, while each card's actual screenshot content stays specific.", "What to borrow (principle)": "- **Use two abstract shapes to frame the hero in negative space**, cropped at\n  opposite corners, rather than a bounding box or background fill — especially\n  when the shapes can pun on the product name.\n- **Credit a trusted parent brand in a small line above the headline** for a\n  new spin-out product, to borrow credibility before the product has its own.\n- **Repeat a sentence structure across feature-card titles** (\"AI that\n  understands / builds / emails / creates\") so a feature grid reads as a\n  refrain rather than a disconnected list.\n- **Keep the download CTA plain and platform-explicit** (a pill listing Mac,\n  Windows, iOS, Android) rather than a vague \"get started.\"", "What to leave": "- Two large illustrated spheres this abstract risk reading as decorative rather\n  than meaningful if the \"Comet\" name/pun isn't reinforced anywhere else on the\n  page.\n- A 2x2 feature grid with four near-identical pastel card treatments can\n  under-differentiate genuinely different capabilities (summarizing vs.\n  building vs. emailing) if the only variation is the screenshot inside.", "Signature move": "The corner-cropped planetary spheres: two large abstract illustrated orbs, one\ncool and dark, one warm and bright, positioned at opposite corners of the hero\nand cropped by the viewport edge, framing the central content in negative\nspace rather than a container.", "Motion": "(inferred from image) The stacked browser-window mockup and its assistant\npanel suggest the product screenshot may animate between states (a document\nview, then an assistant reply); the planetary spheres, given their scale and\nplacement, could plausibly have a slow parallax drift. Not confirmed without a\ncaptured extract.", "Brief": "Build a calm, editorial AI-product page anchored by an abstract illustrated\nmotif tied to the product name. Frame the hero in cream with two large\nabstract shapes at opposite corners, cropped by the viewport, and a serif\nheadline with a small parent-brand credit line above it. Show one real,\nlayered product screenshot (a primary view plus a secondary assistant panel)\ncentred in the hero. Use a plain black pill CTA naming supported platforms\nexplicitly. Below, lay out capabilities as a repeated-sentence-structure card\ngrid, each card in its own soft pastel tone with a distinct real UI screenshot\ninside.", "Image recipe": "Not applicable — this reference is carried by abstract illustrated spheres\nrather than photography. If photography is substituted, use two abstract,\nsoftly lit spherical or planetary forms in contrasting warm/cool tones,\ncropped at opposite corners of the frame, with no literal astronomical\ncontext.", "Photo search": "Unsplash first, Pexels second (for a photographic substitute only).\n- \"abstract sphere warm cool contrast studio\"\n- \"planetary orb illustration abstract\"\n- \"sphere gradient dark teal warm orange\"", "Reference lock": "Primary reference/direction: Comet — two corner-cropped abstract planetary spheres framing a serif hero, repeated-sentence-structure feature grid.\nPreserve (3-5 traits): two large abstract illustrated spheres, contrasting warm/cool tones, cropped at opposite corners of the hero; serif headline on plain cream ground with a small parent-brand credit line above it; one layered product screenshot (primary view + secondary panel) centred in the hero; feature-card titles repeating one sentence structure across all four cards.\nBorrow only (1-2): the platform-explicit black pill download CTA; the soft pastel per-card background tones.\nRole rules: illustrated spheres never fully enclose the hero content, always cropped/off-frame; feature-card sentence structure must stay identical across all cards, only the final word/screenshot changes.\nMedia strategy: abstract illustration only for the hero motif; product screenshots are real UI, not illustrated mockups.\nReject: a literal photographic space/astronomy theme in place of abstract illustration; feature cards with inconsistent title structure; a generic \"get started\" CTA in place of a platform-explicit one.\nToken commitments: cream `#F4F0E6`, dark-sphere `#12232A`, warm-sphere `#B4432A`, ink `#171414`, pastel-green `#DCE8D8`, pastel-blue `#D8E4EA`; serif display for the headline, sans for UI and card copy."}, "has_extract": false}, {"slug": "contralabs", "title": "Contra Labs", "url": "https://contralabs.com", "captured": "2026-09-04", "family": "old-master-halftone-collage", "dna": "Renaissance oil portraiture x halftone-dithered tech device", "register": "illustrated dark", "grammar": "gallery/catalog", "lane": "A classical oil-painting figure works a halftone-dithered laptop in the hero, then the page scatters more of the same device — dot-matrix phones and laptops collaged into old-master portraits — around short serif claims", "mode": "persuade", "traits": ["renaissance oil painting portraiture", "halftone/dither-textured device overlays", "serif display headlines", "scattered mosaic image layout", "pill-shaped nav CTAs", "cream paper ground", "sage green logo mark"], "palette": ["#FBFAF6", "#A5BEBA", "#2B2B29", "#918F66", "#C8BCAE", "#494444"], "type": ["Source Serif 4 Variable", "GT Standard L Regular"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "product-focused", "category2": "editorial", "origin": "raw-url", "extract": "ok", "source_url": "https://contralabs.com", "has_image": true, "img": "../design-catalogue/entries/contralabs/fold.webp", "full": "../design-catalogue/entries/contralabs/shot.webp", "sections": {"Why it works": "The whole identity rests on one collage device: a classical oil-painting\nfigure — the kind you'd find captioned in a museum — is shown using a modern\ndevice that's been rendered as a coarse halftone dot-matrix, as if it were\nprinted on newsprint rather than painted. The contrast is the argument made\nvisual without saying it: old human expertise (the painting) meeting new\nmachine texture (the dithered object), which is exactly what an \"AI eval lab\nfor human creativity\" is selling. Because the device is reused — laptop in the\nhero, phones and tablets in the portraits further down — it reads as a system,\nnot a one-off hero trick.\n\nType stays out of the way of that device. A warm serif (Source Serif 4)\ncarries every headline and claim in plain sentence case, sized generously but\nnever competing visually with the collage; a plain grotesque (GT Standard L)\nhandles body copy and UI labels. Below the fold, the page changes composition\nstrategy entirely — instead of one large hero image, it scatters a dozen small\nportrait cards at irregular sizes and positions around a centred serif\nheadline, like pinned photographs on a wall, which keeps the \"gallery of\nevidence\" feeling going without repeating the hero's exact framing.\n\nThe palette is almost silent — cream paper, near-black ink, one sage-green\naccent on the logo mark and page furniture — so every bit of colour interest in\nthe page comes from the paintings themselves, not from applied brand colour.", "What to borrow (principle)": "- **Invent one visual collage device that literalises the pitch**, and reuse it\n  across the page rather than confining it to the hero — a single trick used\n  once reads as decoration; used five times it reads as a visual language.\n- **Keep type completely neutral (one serif, one grotesque, sentence case)**\n  when the imagery itself is doing all the conceptual work — competing display\n  type would fight the collage for attention.\n- **Scatter proof images at irregular sizes instead of a grid** to keep a\n  photo-heavy section from reading as a stock gallery.\n- **Reserve brand colour for the smallest elements** (logo mark, hairlines)\n  and let sourced/generated imagery carry all the visual richness.", "What to leave": "- Nav copy and CTA labels changed between two captures of the same page\n  (\"Request partnership\" / \"Research\" vs. \"Join network\" / \"Get in touch\"),\n  suggesting active A/B testing or fast iteration — fine for a young company,\n  worth knowing before treating any single state as final.\n- The scattered mosaic layout risks feeling cluttered at narrower viewports;\n  it depends on generous whitespace that a smaller screen won't have.\n- The halftone/dither texture on devices is a specific, hard-to-reproduce\n  effect — it needs either a real filter pipeline or bespoke asset prep, not a\n  quick CSS trick.", "Signature move": "Classical oil-painting portraits photoshopped to hold a modern device rendered\nin a coarse black-and-white halftone dot pattern — human craft and machine\ntexture occupying the same frame, reused across the hero and every proof\nsection as the page's one recurring idea.", "Motion": "(from designlang extract) The extract rates overall feel \"responsive\" with\nconfirmed scroll-linked behaviour, though the token set itself is unusually\nminimal: just two duration steps (an effectively-instant 1ms and a single\n320ms `md`) and one ease-out curve (`cubic-bezier(0.22, 1, 0.36, 1)`, 6 uses)\ndriving width and transform changes. This scarcity matches the page's overall\nrestraint — colour and type stay quiet so the collage imagery carries\nattention, and motion follows the same discipline rather than adding its own\nflourish. The only keyframe defined is Framer's built-in loading spinner, not\na bespoke animation; there's no evidence of a custom stagger or reveal\nchoreography for the scattered mosaic section beyond what a generic\nscroll-reveal utility would add.\n\n| kind | tokens |\n|---|---|\n| durations | instant 1ms · md 320ms |\n| easing | ease-out `cubic-bezier(0.22, 1, 0.36, 1)` (6×) |", "Brief": "Build a product/lab landing page around one bespoke visual collage device that\nmakes the pitch literal without copy — here, classical oil portraiture paired\nwith a modern object rendered in coarse halftone dither, standing in
