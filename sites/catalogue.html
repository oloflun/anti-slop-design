for \"human\nexpertise meets machine.\" Reuse the device across the hero and every proof\nsection rather than once. Keep typography completely quiet: one warm serif for\nheadlines in plain sentence case, one grotesque for body and UI, both\ngenerously sized but never competing with the imagery. Ground the page in cream\npaper with near-black ink and exactly one small accent colour reserved for the\nlogo mark and hairlines. Below the fold, break from the hero's single-image\ncomposition into a scattered mosaic of small proof images at irregular sizes\naround a centred serif claim.", "Image recipe": "Classical oil-painting portrait of [SUBJECT] in Renaissance or Baroque style,\nwarm varnished tones, holding or interacting with a modern device (laptop,\nphone, tablet) that has been re-rendered in a coarse black-and-white halftone\ndot pattern as if printed separately and composited in, sharp tonal contrast\nbetween the painted figure and the dithered object, museum-plate lighting and\ncolour grading on the portrait itself.", "Photo search": "Unsplash first, Pexels second (for supporting texture only — the signature\ncollage imagery is bespoke composite work, not sourced stock).\n- \"renaissance oil painting portrait classical\"\n- \"museum painting detail hands\"\n- \"old master portrait warm tone\"", "Reference lock": "Primary reference/direction: Contra Labs — old-master portraiture collaged\nwith halftone-dithered devices, scattered mosaic proof layout.\nPreserve (3-5 traits): the halftone-dithered device held by a classical\noil-painting figure, reused across hero and every proof section; one warm\nserif for headlines in plain sentence case, one grotesque for body/UI, neither\ncompeting with the imagery; cream paper ground with near-black ink and a single\nsmall accent colour; scattered mosaic of irregularly-sized proof images below\nthe fold instead of a uniform grid.\nBorrow only (1-2): the pill-shaped nav CTA pair (outline + filled); the small\nribbon/diamond logo mark.\nRole rules: the halftone-dither treatment applies only to modern devices\ninserted into classical paintings, never to full images or to UI chrome;\naccent colour never used for large fills, only marks and hairlines.\nMedia strategy: bespoke composite (painting + halftone device) as the sole\nhero-scale device across the page; no separate stock photography competing\nfor hero attention.\nReject: a second display typeface; full-colour brand fills competing with the\npaintings; a uniform image grid in place of the scattered mosaic.\nToken commitments: paper `#F1F0EC`, ink `#41352B`, sage `#C3DAD7`, stone\n`#B7BBAD`, olive `#6C6B55`; headline serif \"Source Serif 4 Variable\", body/UI\n\"GT Standard L Regular\"."}, "has_extract": true}, {"slug": "creative-giants", "title": "Creative Giants", "url": "https://creativegiants.art", "captured": "2026-09-04", "family": "weight-300-poster-studio", "dna": "Art-book poster typography x rationed saturated accent cards", "register": "editorial print", "grammar": "typographic poster", "lane": "A warm off-white canvas opens on a single weight-300 headline set at poster scale, drops straight into a full-bleed documentary photograph, then runs a sequence of whitespace-led editorial sections where colour appears only as single accent cards, never as background", "mode": "portfolio", "traits": ["\"84px weight-300 display", "-0.04em tracking\"", "\"1440px pill on interactive only", "0px on editorial\"", "\"bone-white canvas", "never pure white\"", "chromatic accents rationed to single-card hits", "full-bleed sharp-cornered photography", "near-invisible chrome — logo + one Menu pill"], "palette": ["#fffef7", "#000000", "#666666", "#8a0467", "#03624c", "#ffd001"], "type": ["Switzer"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://creativegiants.art", "has_image": true, "img": "../design-catalogue/entries/creative-giants/fold.webp", "full": "../design-catalogue/entries/creative-giants/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. A single family, Switzer, carries the entire system on exactly two\nweights: 300 for every display and headline size from 12px to 84px, 400 for body\nand UI. Using weight 300 at poster scale is the anti-convention choice the source\ncalls out explicitly — most systems would bold up at 64-84px, but the light weight\nkeeps the hairline strokes intact, so the type reads as airbrushed onto the cream\ncanvas rather than shouted. Letter-spacing tightens as size grows (-0.04em at 84px\ndown to -0.018em at 14px), which is what keeps those large light strokes from\nreading as merely thin — they lock together instead of drifting apart.\n\nColour is treated as a rationed resource in an unusually literal way: eleven named\nhues exist in the token set, but the rule governing them is \"never flood a\nsection\" — chromatic colour appears only as a single accent card in a grid, a\nborder on an image edge, or a rare inverted dark field, and \"never more than one\n[accent card] in a row.\" That discipline is what keeps eleven possible hues from\nreading as a messy palette; at any given moment the page is showing at most one of\nthem.\n\nInteractive and editorial geometry are kept strictly separate: 1440px pill radius\nbelongs only to buttons, tags and the Menu control; cards and images stay\nperfectly square at 0px. Combined with a shadow system that amounts to a single\n1px inner ring (not a drop shadow), the page has no elevation at all — separation\ncomes purely from whitespace, the rare inverted field, and full-bleed photography\nthat is always allowed to be the loudest thing on screen.", "What to borrow (principle)": "- **Use a light weight at poster scale on purpose.** Weight 300 at 64-84px reads\n  as considered restraint precisely because most systems reach for 700+ at that\n  size — the whisper is the signal.\n- **Tighten tracking as size grows, don't just enlarge.** Progressive negative\n  letter-spacing keeps oversized light type from looking merely stretched.\n- **Ration a large colour set to one hit at a time.** \"Never more than one accent\n  card in a row\" turns a big palette into a controllable, auditable rule instead\n  of a free-for-all.\n- **Split radius by function, not by whim.** One radius value for every\n  interactive control, zero for every editorial surface (cards, images) — no\n  values in between.\n- **Let a single 1px ring stand in for all elevation.** A near-invisible highlight\n  ring, used once, communicates \"this is different\" without the weight of a\n  drop shadow.", "What to leave": "- Weight-300 display type at 84px is a high-fidelity requirement: it needs a\n  genuine light cut of the chosen face, rendered crisply, or it will look broken\n  rather than airbrushed on lower-quality screens or fallback fonts.\n- Reserving eleven distinct accent colours for single-card use only demands real\n  editorial discipline in a CMS-driven site; without an enforced limit, \"one at a\n  time\" tends to erode under content-team pressure.\n- Zero elevation and near-invisible chrome (one logo mark, one Menu pill) puts\n  the entire wayfinding burden on photography and whitespace — this will not\n  translate to a content-dense product or dashboard context.", "Signature move": "The oversized poster headline sitting directly on the cream canvas with a subtle\nvertical charcoal-to-black gradient inside the cream-coloured letterforms — a\nsculptural, chiseled treatment rather than flat-printed type, occupying roughly\n40% of the viewport before any photograph appears.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked.\nThree easing families are in play at three short durations (200/300/550ms): a\nplain `ease` for simple state changes, a sharp custom accelerate-decelerate family\n(`cubic-bezier(0.65, 0.05, 0, 1)`, `cubic-bezier(0.625, 0.05, 0, 1)`) for snappier\npanel/background transitions, and plain `linear` for continuous motion. The one\nkeyframe confirmed firing is `marquee_timeline`, a slide-x transform driving a\nhorizontal ticker — likely the \"latest news\"/timeline strip rather than a\ndecorative band. A `spin` keyframe exists in the stylesheet but isn't confirmed\nin use. (observed in capture) the gradient-lettered headline resolves as a static\ngraphic on load with no animated reveal, and scroll transitions between the\nimage-led sections read as simple cuts rather than parallax or scroll-scrub\neffects — consistent with the source's insistence that \"the system has no\nmeaningful elevation\" and that whitespace, not motion, is the primary structural\ntool.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 200ms | `ease` |\n| md | 300ms | `ease` |\n| lg | 550ms | `cubic-bezier(0.65, 0.05, 0, 1)` |\n| marquee_timeline | — | slide-x transform, 1 use |", "Brief": "Build a design-studio portfolio homepage. Canvas is bone white `#fffef7`\neverywhere — never pure white. Open on a single Switzer weight-300 headline at\n64-84px, letter-spacing tightening to -0.04em, occupying about 40% of the\nviewport, optionally with a vertical charcoal-to-black gradient inside the\nlettering. Drop immediately into a full-bleed, sharp-cornered documentary\nphotograph with bottom-left meta text and a 34px weight-300 statement headline\noverlaid. Below, run monolithic sections — a small all-caps eyebrow, a 34-54px\nweight-300 statement, 48-64px of whitespace before and after, no rules or\ndividers. Use a 3-column card grid for project/news items: square sharp-cornered\nimages, 18-20px weight-300 titles, 14px graphite body copy, no card border, no\nshadow. Let exactly one card per row swap to a saturated or pastel accent surface\n(never more than one at a time). Every button, tag and the single Menu control\ngets a 1440px pill radius; every card and image stays at 0px. No drop shadows\nanywhere — the one permitted shadow is a 1px white inner ring on dark elements.", "Image recipe": "Documentary editorial photograph of [SUBJECT] — full-bleed, sharp-cornered, no\noverlay or rounded mask, atmospheric and candid rather than staged, natural\navailable light, human subjects or public installations in real environments,\nno product mockups, no illustration, no studio backdrop.", "Photo search": "Unsplash first, Pexels second.\n- \"public art installation outdoor documentary\"\n- \"creative studio team candid documentary\"\n- \"event production behind the scenes photography\"\n- \"urban architecture wide shot natural light\"", "Reference lock": "Primary reference/direction: Creative Giants — weight-300 poster-scale editorial\nstudio site, colour rationed to single accent cards, near-invisible chrome.\nPreserve (3-5 traits): bone-white `#fffef7` canvas, never pure white; Switzer\nweight 300 for every display/headline size, weight 400 only for body and UI, never\nbolder; progressive negative tracking as size grows (-0.04em at 84px); 1440px\npill radius on interactive elements only, 0px on every card and image; chromatic\naccents limited to a single card or border hit at a time, never a flooded section.\nBorrow only (1-2): the charcoal-to-black gradient treatment inside display\nlettering; the single 1px white inner-ring \"shadow\" on dark elements.\nRole rules: headlines never exceed two lines or bold past 300; no chromatic CTA\nfill — all interactive surfaces stay black or transparent; body text always\nleft-aligned except the centred hero headline.\nMedia strategy: photo:unsplash — full-bleed, sharp-cornered documentary and\natmospheric photography only; no illustration, no 3D, no product mockups.\nReject: bold headlines; pure white canvas; rounded corners on cards or images;\nany drop shadow; a chromatic CTA background; two accent-coloured cards in the\nsame row; browser-default link blue.\nToken commitments: bg `#fffef7`, ink `#000000`, graphite `#666666`, ash `#aaaaaa`,\naccents `#8a0467`/`#03624c`/`#a5c8eb`/`#ffacea`/`#a5ebd6`/`#101731`/`#ffd001`;\ndisplay weight 300 at 64-84px/leading 1.0/-0.04em to -0.027em tracking; radius\n1440px interactive, 0px editorial; base spacing unit 8px, section gap 64px."}, "has_extract": true}, {"slug": "customer-io", "title": "Customer.io", "url": "https://customer.io", "captured": "2026-09-04", "family": "cream-console", "dna": "Marketing-ops dashboard x rainbow-word headline", "register": "modern clean", "grammar": "live surface", "lane": "White ground, a plain-spoken headline that turns single words into brand colours, a real product screenshot staged in a lived-in room, then a logo wall and a feature grid", "mode": "persuade", "traits": ["warm white ground", "deep teal wordmark/CTA", "rainbow-keyword headline", "product screenshot staged in a real room photo", "rounded pill buttons", "trust-line checklist under CTA", "dense logo wall", "AI-agent chat panel shown inline"], "palette": ["#FFFFFF", "#0B2B24", "#1F8A5B", "#E8632B", "#7A3FE0", "#D91E7A", "#E0A400"], "type": ["Saans"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://customer.io", "has_image": true, "img": "../design-catalogue/entries/customer-io/fold.webp", "full": "../design-catalogue/entries/customer-io/shot.webp", "sections": {"Why it works": "The headline does the branding: a plain sentence (\"More impact from every\nin-app...\") with single words — data, messaging, AI, customers, stronger,\nrelevant — recoloured in the product's accent palette. It's a cheaper trick than\na custom illustration system and it repeats later in the page, so the reader\nlearns the code (colour = concept) once and reads it fluently for the rest of the\nscroll.\n\nThe product screenshot is staged, not floated: it sits inside a soft-focus photo\nof a real desk/room, at a slight scale, so the dashboard reads as \"someone's\nactual screen\" rather than a marketing render. Two panels are visible at once —\nthe main goals dashboard and an AI assistant chat sidebar — which lets the page\nclaim \"AI\" without a separate AI section.\n\nTrust is layered in small print rather than a big claim: three checkmarked lines\nunder the CTA (`14-day free trial`, `no credit card`, `cancel anytime`) remove\nfriction objections before the reader has to ask, and a dense two-row logo wall\nimmediately below does the social-proof work without slowing the page down with\ncase-study copy.", "What to borrow (principle)": "- **Recolour single words in the headline to teach a palette.** It's a lightweight\n  way to introduce a multi-colour brand system without illustration.\n- **Stage product screenshots inside a photographed environment.** A dashboard\n  sitting in a soft-focus desk photo reads as real use, not a render.\n- **Answer objections in three small checkmarks under the CTA**, not in a\n  separate FAQ section.\n- **Show two product surfaces in one screenshot** (main view + assistant panel) to\n  claim a second capability without a second hero.", "What to leave": "- The recoloured-word technique loses legibility fast if pushed past 4-5 words per\n  headline — it starts to look like a ransom note rather than a palette lesson.\n- A dense two-row logo wall this early risks reading as filler if the brands\n  aren't instantly recognisable at a glance.", "Signature move": "The staged screenshot-in-a-room: the actual product UI, photographed as if\nsitting open on a real desk with plants and daylight around it, rather than\nfloated on a flat colour or device frame. It borrows the credibility of a\nlifestyle photo for a screenshot.", "Motion": "(from designlang extract) The feel reads as \"responsive\" with scroll-linked\nmotion confirmed. Nearly every transition sits on a fast `200ms`/`400ms`\nduration pair, almost all riding a single decelerating ease-out family\n(`cubic-bezier(0.19,1,0.22,1)` and its close cousins) — the page favours\nsnappy settle-ins over anything springy or bouncy. Keyframes lean toward\nambient/decorative motion rather than content reveals: `marquee` drives the\nlogo-wall scroll, `text-gradient` and `shine` sweep a moving highlight through\ngradient text, `meteor` and `border-beam` animate glowing accents around\ncards, and Radix `accordion-down`/`accordion-up` handle expandable FAQ-style\npanels. No bespoke reveal choreography for the headline words was captured;\nthat read stays inferred.\n\n| token | value | role |\n|---|---|---|\n| `sm` | 200ms | hover/UI state changes |\n| `md` | 400ms | larger surface transitions |\n| ease-out | `cubic-bezier(0.19,1,0.22,1)` etc. | dominant family, 184 uses |", "Brief": "Build a white-ground SaaS marketing page for a data/messaging platform. Open on a\nplain-English headline where 4-6 single words are recoloured in the product's\nbrand palette (teal, orange, purple, pink, gold) against a dark ink colour for the\nrest of the sentence. Below, stage the real product dashboard inside a\nsoft-focus photograph of a physical room, showing two panels at once (primary\nview + an AI assistant sidebar). Follow with a two-row wall of recognisable\nclient logos, then a rounded-pill CTA row with three small checkmarked\ntrust lines underneath. Keep buttons fully rounded, ink-teal on white.", "Image recipe": "A soft-focus interior [SUBJECT] — a desk, a plant, natural daylight — shot so the\ncentre third stays in enough focus to host a product screenshot overlay, warm\nneutral tones, no visible people, shallow depth of field falling off toward the\nedges.", "Photo search": "Unsplash first, Pexels second.\n- \"desk plant natural light soft focus interior\"\n- \"home office daylight blurred background\"\n- \"minimal workspace window light\"", "Reference lock": "Primary reference/direction: Customer.io — rainbow-keyword headline over a staged product-in-a-room screenshot, checklist trust line, dense logo wall.\nPreserve (3-5 traits): plain-English headline with 4-6 single words recoloured in brand accents against dark ink; product screenshot staged inside a soft-focus real-room photo, never floated on flat colour; three small checkmarked trust lines directly under the primary CTA; fully rounded pill buttons throughout.\nBorrow only (1-2): the two-panel screenshot (main view + AI sidebar) as a way to show a second feature without a second hero; the dense two-row logo wall directly below the fold.\nRole rules: recoloured headline words capped at 6 per headline; only one screenshot-in-a-room per page; accent colours never used for body copy, only for headline emphasis and small UI chrome.\nMedia strategy: photo:unsplash — real, warm, softly-lit interior only; never a flat-colour or gradient background behind the product shot.\nReject: floating the screenshot on a flat brand-colour panel; more than one dense logo wall per page; recolouring entire phrases instead of single words.\nToken commitments: bg `#FFFFFF`, ink `#0B2B24`, teal `#1F8A5B`, orange `#E8632B`, purple `#7A3FE0`, pink `#D91E7A`, gold `#E0A400`; a single rounded grotesk sans for all type; buttons fully rounded (pill), ink-filled primary / outlined secondary."}, "has_extract": true}, {"slug": "david-protein", "title": "David (protein)", "url": "", "captured": "2026-09-04", "family": "packshot-tier-system", "dna": "Protein-bar packshot grid x tiered product ladder", "register": "modern clean", "grammar": "gallery/catalog", "lane": "Black-ground studio packshots of bitten protein bars open the page as a tiered value pitch, then a dense shop-all photo grid and a bundle-building close", "mode": "persuade", "traits": ["black studio ground", "bitten-bar hero packshots", "gold foil-look wrapper design", "scrolling proof ticker", "dense shop-all photo grid", "tiered product naming (Gold/Bronze)", "bundle-builder CTA", "close-up lifestyle bite shot"], "palette": ["#0A0A0A", "#C68A3D", "#FFFFFF", "#2E5C8A", "#A6272C"], "type": ["\"condensed bold sans (visual match", "unverified)\""], "kind": "reference-style", "source": "anton", "status": "ready", "category": "consumer-brand", "category2": "", "origin": "raw-image", "extract": "none", "source_url": "https://davidprotein.com", "has_image": true, "img": "../design-catalogue/entries/david-protein/fold.webp", "full": "../design-catalogue/entries/david-protein/shot.webp", "sections": {"Why it works": "The hero is four bitten-open protein bars, shot on black, cropped so the torn\nwrapper and the chocolate coating fill the frame — hunger photography, not\nnutrition-label photography. Each wrapper carries its own flavour-coded colour\nband (blue, plum, red, cream) against a shared gold-foil base, so the product\nrange reads as a set without needing a separate \"flavours\" grid.\n\nThe commercial structure is stated as a tier system — \"David Gold is\ndisciplined. David Bronze is desired. Have it all.\" — which turns a bulk-\ndiscount offer (\"buy 4 cartons, get 1 free\") into a small piece of brand\nmythology instead of a plain coupon. Tiering the product line by metaphor\n(gold/bronze) rather than by size or flavour gives the brand something to say\nbeyond price.\n\nA scrolling ticker of proof points (`19,000+ positive reviews`, `free shipping\nover $50`, `satisfaction guarantee`) runs continuously beneath the hero, doing\nthe reassurance work in peripheral vision rather than in a dedicated trust\nsection. The shop-all grid that follows keeps every tile on the same black\nstudio ground as the hero, so the page never breaks its own photographic\nregister moving from hero to catalogue.", "What to borrow (principle)": "- **Shoot the product bitten or torn open**, not sealed — showing the eating\n  moment sells appetite, not packaging.\n- **Give a value-tier system a brand name** (Gold/Bronze) instead of presenting a\n  bulk discount as a plain percentage-off offer.\n- **Run trust proof as a continuous ticker**, not a static badge row, so it reads\n  as ambient credibility rather than a claim to verify.\n- **Keep hero and catalogue photography on the same ground colour** so the page\n  doesn't visually reset moving from pitch to shop.", "What to leave": "- A ticker this dense, repeating four or five claims on loop, risks becoming\n  visual noise if it runs faster than a comfortable reading pace.\n- Naming products after precious-metal tiers (Gold/Bronze) only works if the\n  actual product difference (formulation, price) is legible nearby — otherwise\n  it reads as branding without substance.", "Signature move": "The tier line as closing copy: \"David Gold is disciplined. David Bronze is\ndesired. Have it all.\" Three short sentences that turn a subscribe-and-save\nupsell into a piece of brand voice, placed right next to the bundle-builder CTA\nrather than in a hero.", "Motion": "(inferred from image) The hero packshot row and the proof ticker both read as\nbuilt for horizontal scroll/marquee motion (the ticker text repeats mid-line,\na tell of a looping strip); no other motion is visible in the capture.", "Brief": "Build a black-ground, studio-lit consumer packshot page for a tiered snack\nproduct line. Open on 3-4 bitten or torn product shots on black, each wrapper\ncarrying its own accent colour against a shared metallic base colour, with a\nsingle \"most value\" claim and a primary CTA. Run a continuous proof ticker\n(review count, shipping threshold, guarantee) directly beneath the hero. Follow\nwith a dense shop-all grid of studio product photography on the same black\nground. Close on a bundle-builder module paired with one lifestyle bite-shot\nphoto and a short, tiered brand-voice line.", "Image recipe": "Studio product shot of [SUBJECT] — torn or bitten open to reveal texture, shot on\npure black, single hard key light with a visible rim highlight, shallow depth of\nfield on the torn edge, no props, no surface — the product suspended or\npropped invisibly against black.", "Photo search": "Unsplash first, Pexels second.\n- \"chocolate bar torn open studio black background\"\n- \"protein bar macro texture dark\"\n- \"snack bar bite shot close up\"", "Reference lock": "Primary reference/direction: David — black-ground tiered protein-bar packshot page with a continuous proof ticker.\nPreserve (3-5 traits): bitten/torn product photography on pure black studio ground; each SKU carrying its own accent colour against a shared metallic base; continuous scrolling proof ticker directly under the hero; tiered brand naming (e.g. Gold/Bronze) for the value ladder.\nBorrow only (1-2): the bundle-builder module paired with a lifestyle bite-shot; the short tiered brand-voice closing line.\nRole rules: black ground never broken by a white section within the shop grid; ticker claims capped at 4-5 rotating items; tier names always paired with a visible price/value difference nearby.\nMedia strategy: photo:unsplash — studio product photography on black only; one lifestyle/human bite-shot permitted near the close, nowhere else.\nReject: sealed-package-only photography; a static trust badge row in place of the ticker; more than one typeface family across packshot and UI type.\nToken commitments: black `#0A0A0A`, gold `#C68A3D`, white `#FFFFFF`, blue-wrapper `#2E5C8A`, red-wrapper `#A6272C`; bold condensed sans for the wordmark and UI type."}, "has_extract": false}, {"slug": "deonlibra", "title": "Deon Libra", "url": "https://deonlibra.com", "captured": "2026-09-04", "family": "marquee-condensed-attitude", "dna": "Drop-culture DTC wellness x scrolling marquee protest copy", "register": "cinematic dark", "grammar": "rhythmic cutlist", "lane": "A cinematic hero photo sits between two scrolling marquee tickers, then black product-grid panels alternate with cream press/awards bands and a dark-red archival-photo statement section", "mode": "persuade", "traits": ["scrolling marquee ticker text (top and bottom)", "condensed bold display sans (Anton)", "black ground with red accent", "cream product-card panels", "press-logo wall", "archival family photography", "email signup modal", "accessibility widget button"], "palette": ["#000000", "#FFF8E7", "#C00121", "#887871", "#212018", "#E2DACC", "#703D2E", "#A99E93"], "type": ["Anton", "Inter"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "consumer-brand", "category2": "playful", "origin": "raw-url", "extract": "ok", "source_url": "https://deonlibra.com", "has_image": true, "img": "../design-catalogue/entries/deonlibra/fold.webp", "full": "../design-catalogue/entries/deonlibra/shot.webp", "sections": {"Why it works": "The page opens between two moving marquee tickers — a thin cream strip above\nthe nav (\"THE SCENT OF EXPENSIVE HOBBIES IS HERE\") and a bold red strip below\nthe hero (\"THIS IS NOT A BEAUTY BRAND\") — so the brand's attitude is stated in\nmotion before any product is shown. The hero photograph itself (a clay tennis\ncourt, balls mid-bounce) has nothing to do with the product literally; it's\nestablishing a lifestyle register — leisure, expense, ritual — that the\ncondensed all-caps headline (\"WELLNESS ROOTED IN RITUAL, ART, AND DROP\nCULTURE\") then names directly.\n\nOne display face, Anton — extremely condensed, extremely bold — carries every\nheadline, ticker and section statement at consistent weight, so scale is the\nonly variable used for emphasis; nothing shifts in style, only in size. Body\ncopy and product data drop to a plain Inter, keeping the loud parts loud and\nthe informational parts quiet. Product cards run on a black ground with cream\nframes, a red \"on sale\" flag, and product photography with visible packaging\ncopy (the products themselves are typeset like the site, condensed bold\nlabels) — so the packaging and the page share one visual system rather than\nphotography being the only brand touchpoint.\n\nThe \"Our Why\" section breaks from product entirely into a dark maroon panel\nwith archival-style photography and a direct, culturally specific statement\n(\"EVEN WHILE SLEEPING, BLACK PEOPLE CANNOT REST\") — copy doing real narrative\nwork rather than generic brand-voice copy, which is unusual enough in this\ngenre to be the site's strongest asset.", "What to borrow (principle)": "- **Use scrolling marquee tickers as attitude statements**, not just\n  promotional banners — putting the brand's point of view in constant motion\n  makes it unmissable without a large static block.\n- **Choose hero photography for register, not for product literalism** — a\n  tennis court says \"expensive leisure\" faster than a product shot would.\n- **Run one extremely condensed, extremely bold display face at every scale**\n  so hierarchy comes entirely from size, keeping the whole page visually\n  coherent even across very different section types.\n- **Let real, specific, culturally-grounded copy carry a \"why\" section** —\n  it reads as conviction, not as brand-voice filler.\n- **Match product packaging typography to the site's own type system** so\n  photography and page feel like one continuous brand object.", "What to leave": "- The email-signup modal fires early and covers most of the hero on load —\n  worth testing timing/frequency against how much of the marquee/hero attitude\n  gets seen before it's obscured.\n- Two marquee tickers running simultaneously (top and bottom of hero) plus a\n  third mid-page risks becoming visual noise rather than emphasis if overused\n  further down the page.\n- Extremely condensed display type at small sizes (as seen in some award/press\n  captions) pushes legibility — fine at headline scale, marginal at caption\n  scale.", "Signature move": "Twin scrolling marquee tickers bracketing the hero — one understated\n(top nav strip), one loud and red (\"THIS IS NOT A BEAUTY BRAND\") — stating the\nbrand's point of view in constant motion before any product appears.", "Motion": "(from designlang extract) The extract rates overall feel \"responsive\" with\nconfirmed scroll-linked behaviour. Five duration steps span 100ms to 800ms,\nmostly on a snappy custom ease-out (`cubic-bezier(0.3, 1, 0.3, 1)`, 107\nuses — the dominant curve on the page) with three more measured custom curves\n(30 uses combined) for slower transitions. Four keyframes are confirmed\nin use: `scrolling-left` (transform + visibility, 22 uses) is the mechanism\nbehind the marquee tickers; `rotator` and `dash` (7 uses each) drive a\nrotating/SVG-progress element; `junipNodeInserted` (1 use) is a third-party\nreview-widget (Junip) insertion animation, not brand motion. Additional\nkeyframes — `text-underlined` (a link-hover underline wipe), `zoom-fade` /\n`zoom-fade-short` (scale 1.1-1.2→1 with fade), and `spin` — are defined in the\nstylesheet but not registered as in-use at scan time. (observed in capture)\nThe marquee ticker text is a continuous horizontal scroll/loop, confirmed by\nthe raw and fresh captures showing different text scroll positions on the\nsame strip. An email-signup modal appears over the hero within the first few\nseconds of load (observed — present in the fresh capture, absent in the raw\none), suggesting a timed rather than scroll-triggered trigger.\n\n| kind | tokens |\n|---|---|\n| durations | xs 100ms · sm 200ms · md 300ms · lg 500ms · xl 800ms |\n| easings | ease-out `cubic-bezier(0.3, 1, 0.3, 1)` (107×, dominant) · custom (30×) |\n| keyframes in use | `scrolling-left` (marquee) · `rotator` · `dash` · `junipNodeInserted` (3rd-party) |", "Brief": "Build a DTC lifestyle/wellness brand around one moving marquee ticker stating\nthe brand's attitude in a short, quotable line, bracketing a hero photograph\nchosen for lifestyle register rather than literal product content. Run one\nextremely condensed, extremely bold display face at every heading scale, with\na plain grotesque for body and product data. Alternate black product-grid\npanels (cream card frames, one red accent for sale flags/CTAs) with cream\npress-logo and awards bands. Include one section that breaks from product\nentirely — a dark accent panel with archival-style photography and specific,\nfirst-person copy stating why the brand exists, not generic mission language.\nMatch product packaging typography to the site's own display face so\nphotography reads as part of the same system.", "Image recipe": "Documentary or archival-style photograph of [SUBJECT], warm desaturated\ncolour grading evoking film stock, candid or environmental framing rather than\nstudio product staging, chosen to establish a lifestyle or cultural register\nconnected to the brand rather than to depict the product literally.", "Photo search": "Unsplash first, Pexels second.\n- \"clay tennis court balls documentary\"\n- \"archival family photograph film grain\"\n- \"vintage sports photography 90s\"\n- \"product still life red black minimal\"", "Reference lock": "Primary reference/direction: Deon Libra — marquee-ticker attitude statements,\ncondensed bold display type at every scale, black/cream/red DTC system.\nPreserve (3-5 traits): a scrolling marquee ticker stating brand attitude in a\nshort line, bracketing the hero; one extremely condensed bold display face\ncarrying every headline and ticker at consistent weight; black ground with\ncream card frames and one red accent for CTAs/sale flags; hero photography\nchosen for lifestyle register rather than literal product depiction; at least\none section with specific, first-person \"why\" copy over archival-style\nphotography.\nBorrow only (1-2): the accessibility-widget floating button; the \"-14%\" red\nsale flag on product cards.\nRole rules: display face never drops below a legible caption size; red accent\nreserved for CTAs, sale flags and the loudest ticker only, never a large\nbackground fill.\nMedia strategy: photo:unsplash — documentary/archival-toned photography for\nlifestyle and \"why\" sections; clean studio product photography only for\nproduct-grid cards.\nReject: a second display typeface; generic mission-statement copy in place of\nspecific narrative; a static banner in place of the moving marquee.\nToken commitments: ink `#000000`, cream `#FEF8E6`, red `#C10221`, maroon\n`#703D2E`, stone `#887871`, stone-light `#A99E93`; display \"Anton\" (condensed\nbold caps), body \"Inter\"."}, "has_extract": true}, {"slug": "diabla", "title": "Diabla", "url": "https://www.diablaoutdoor.com/en/", "captured": "2026-09-04", "family": "blush-courtyard-editorial", "dna": "Fashion-magazine cropped headlines x Mediterranean poolside photography", "register": "editorial print", "grammar": "gallery/catalog", "lane": "A full-bleed sunlit courtyard photograph carries a centre-distributed red nav and a cropped 110px headline, then the page settles onto a blush-pink canvas of three-up editorial columns where red exists only as outline and ink, never as fill", "mode": "persuade", "traits": ["80-110px display at 0.88 line-height", "\"red as outline/ink only", "never a fill\"", "\"blush canvas", "never pure white\"", "\"monoweight Helvetica", "no bold anywhere\"", "\"centre-distributed nav", "wordmark at centre\"", "\"zero shadow", "whitespace as separator\""], "palette": ["#ed2e38", "#fcf0f3", "#333333", "#000000"], "type": ["Helvetica Neue Light", "Helvetica Neue Roman"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "luxury-craft", "category2": "consumer-brand", "origin": "refero", "extract": "ok", "source_url": "https://www.diablaoutdoor.com/en/", "has_image": true, "img": "../design-catalogue/entries/diabla/fold.webp", "full": "../design-catalogue/entries/diabla/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens. The system's whole\nidentity rides on a single rule: vermillion `#ed2e38` is never a flood fill — it\nappears only as the wordmark, link text, heading colour, and 1px button outlines.\nBecause the brand's one chromatic note is always ink or stroke, never a coloured\nsurface, the page keeps the restraint of a magazine layout even where a typical\ne-commerce site would reach for a filled \"Shop now\" button.\n\nType is deliberately monoweight: a single Helvetica Neue family runs Light for\ndisplay and Roman for everything else, with no bold or semibold anywhere.\nHierarchy comes entirely from a brutal size jump (14px body to 110px display) and\nfrom colour (vermillion vs. charcoal), plus line-height compressed to 0.88-0.91 at\ndisplay sizes — tight enough that ascenders and descenders crop, turning product\nnames into cropped fashion headlines rather than comfortable web type.\n\nLayout reinforces the editorial register: navigation is distributed\nleft-centre-right with the wordmark dead centre rather than flush left, three-up\ngrid columns are separated by whitespace alone with no card chrome, and the entire\nsystem avoids shadows — components read as printed on paper. Full-bleed\nphotography (sun-bleached courtyards, poolscapes) is never inset or rounded,\nletting the Mediterranean setting carry the mood the UI deliberately withholds.", "What to borrow (principle)": "- **Restrict a chromatic accent to outline and ink, never fill.** A single colour\n  used only as stroke and text keeps a bold hue from reading as loud or\n  commercial.\n- **Run a single typeface at exactly two weights, no bold.** Forcing hierarchy\n  onto size and colour alone, with weight locked, keeps the system honest and\n  impossible to over-emphasize.\n- **Compress display leading below 1.0 deliberately.** Cropping ascenders and\n  descenders at 0.88-0.91 line-height is what turns oversized type into a\n  poster statement instead of merely \"large text.\"\n- **Centre the wordmark in a distributed nav.** Placing the brand mark at the\n  optical centre, flanked symmetrically by nav groups, reads as a magazine\n  masthead rather than a standard left-logo header.\n- **Separate grid columns with whitespace, not chrome.** No card border, no\n  background — three equal columns held apart purely by generous gutters.", "What to leave": "- Monoweight type with no bold option removes a common emphasis lever; any content\n  team used to bolding key phrases will need a different technique (colour, size,\n  case) instead.\n- A single, never-filled accent colour depends on the rest of the page staying\n  genuinely neutral — introducing a second saturated hue anywhere would break the\n  \"one sharp edge\" reading entirely.\n- Extremely compressed display leading (0.88) is unforgiving of long headlines;\n  it only works with short, poster-length copy.", "Signature move": "The outlined vermillion button: a 1px `#ed2e38` border with transparent or\nblush-tinted fill and uppercase vermillion text — the brand's only interactive\ncontrol, communicating action entirely through a stroke rather than a filled\nsurface.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked.\nProperty transitions (filter, opacity, width/height/background) run at 300-800ms\non a single custom ease-in-out-cubic curve, `cubic-bezier(0.645, 0.045, 0.355,\n1)` — the 800ms step on `filter` most likely drives an image hover/focus\ntreatment. The keyframes the extract confirms firing (`bounce`, `mc_slideOut`,\n`slideIn`) are a Mailchimp signup-popup's own animations, not bespoke page\nchoreography — third-party widget chrome, same as the swiper-carousel spinner and\ncookie-banner fade also present in the stylesheet. Note: the live site currently\nshows a \"Coming Soon\" placeholder mid-relaunch, so this entry's images are drawn\nfrom the Refero export rather than a fresh capture; the designlang extraction\nitself ran against real page markup and is not affected. (observed in capture)\nthe small red downward arrow beneath the hero headline suggests a simple\nscroll-cue nudge rather than an animated affordance, and the full-bleed\nphotography with no card framing implies plain crossfades between sections\nrather than parallax.\n\n| Token | Value | Easing |\n|---|---|---|\n| md | 300ms | `cubic-bezier(0.645, 0.045, 0.355, 1)` |\n| lg | 500ms | `cubic-bezier(0.645, 0.045, 0.355, 1)` |\n| xl (filter/hover) | 800ms | `cubic-bezier(0.645, 0.045, 0.355, 1)` |", "Brief": "Build an editorial outdoor-furniture landing page. Canvas is blush pink `#fcf0f3`\neverywhere — never pure white; body copy is charcoal `#333333`, not black.\nVermillion `#ed2e38` is the single chromatic note, used only for the wordmark,\nnav links, heading text, and 1px outlined-button borders — never as a fill. Open\nfull-bleed on a sun-drenched courtyard or poolscape photograph with a\ndistributed, transparent nav (nav groups left and right, wordmark centred) and a\ncentred display headline at 80-110px, Helvetica Neue Light, line-height 0.88-0.91,\nwhite on the photo. Below the hero, settle to a max-width ~1200px three-up\neditorial grid: full-bleed image, uppercase vermillion eyebrow, uppercase\nheadline, charcoal body copy, one outlined vermillion button — columns separated\nby whitespace only, no card chrome. Keep 80px section gaps, zero shadows, and\nnever round or frame photography.", "Image recipe": "Sun-drenched Mediterranean lifestyle photograph of [SUBJECT] — a poolside or\ncourtyard setting in bleached pastel colour, strong midday sun with hard shadows,\noutdoor furniture styled in situ (not isolated), palm foliage or stone\narchitecture in frame, high-key and slightly desaturated except for one or two\nsaturated accent objects, full-bleed with no vignette or border.", "Photo search": "Unsplash first, Pexels second.\n- \"Mediterranean courtyard pool midday sun\"\n- \"outdoor furniture poolside pastel pink\"\n- \"striped awning courtyard architecture\"\n- \"palm trees rocky coastline bright light\"", "Reference lock": "Primary reference/direction: Diabla — Mediterranean editorial furniture page,\nred as outline/ink only, cropped 80-110px display type.\nPreserve (3-5 traits): blush pink `#fcf0f3` canvas, never pure white; vermillion\n`#ed2e38` restricted to wordmark, links, headings and outlined-button borders,\nnever a fill; monoweight Helvetica (Light for display, Roman for everything else),\nno bold anywhere; display line-height capped at 0.88-0.91; distributed nav with\nthe wordmark at dead centre.\nBorrow only (1-2): the three-up editorial grid pattern (product / catalogue /\ndesigner profile); the black-and-white monochrome designer-portrait treatment.\nRole rules: vermillion never becomes a filled surface; body text never bolds;\nphotography is always full-bleed, never rounded or framed; nav stays distributed,\nnever flush-left.\nMedia strategy: photo:unsplash — full-bleed, sun-drenched Mediterranean lifestyle\nphotography and monochrome portraiture only; no product-only white-cyc shots.\nReject: filled red CTAs; bold or semibold Helvetica; drop shadows; rounded-corner\nphotography; a left-aligned logo; a second saturated accent colour.\nToken commitments: bg `#fcf0f3`, ink `#333333`, ink-hard `#000000`, accent\n`#ed2e38`; display 80-110px/leading 0.88-0.91; body 14-16px/leading 1.5; radius\n0px cards/images, 14px buttons/links; page max-width 1200px, section gap 80px."}, "has_extract": true}, {"slug": "diamondrose", "title": "Diamond Rose Sanctuary", "url": "https://diamondrosesanctuary.com", "captured": "2026-09-04", "family": "vertical-sanctuary-wordmark", "dna": "Aerial coastal nature-preserve photography x split horizontal/vertical wordmark", "register": "warm photographic", "grammar": "filmic one-shot", "lane": "One full-bleed aerial photograph of a preserved coastline carries a two-part wordmark — horizontal on the left, vertical along the right edge — with a quiet cream section of centred serif copy following beneath", "mode": "experience", "traits": ["full-bleed aerial coastal photograph", "wordmark split horizontal and vertical", "serif display over photo", "cream ground below fold", "deep green ink CTA", "outline secondary button", "small dotted-rule section kickers", "centred serif bo tional framing rather than a conventional centred logo lockup.\n- **Keep the hero's informational load (nav, dates, statement, CTAs) distributed to the\n  frame's quiet corners**, leaving the centre of the photograph fully uninterrupted.\n- **Pair a solid and an outlined CTA of the same colour family**, rather than two\n  differently coloured buttons, so hierarchy reads through fill alone.\n- **Mark new topics below the fold with a tiny dotted-rule kicker** instead of a heavier\n  section rule — keeps a text-only register feeling as quiet as its content.", "What to leave": "- This entry's images are derived from the archived raw capture, not a fresh render — the\n  live site returned HTTP 200 but did not reach network-idle within the capture budget\n  (likely a background video or map component), so treat exact copy and any since-changed\n  details as approximate.\n- The vertical \"SANCTUARY\" wordmark, while a strong compositional device, depends on\n  enough uninterrupted photograph on the right edge to breathe — a busier or more\n  cluttered hero photo would make it compete with subject matter.\n- A persistent \"Upcoming Retreat\" date module sits directly in the primary nav row,\n  competing for attention with wayfinding items (Retreats, Rentals, Lotus Temple, About)\n  at the same visual weight — worth a clearer secondary treatment.", "Signature move": "The split wordmark: the brand name is broken across two perpendicular reading directions\non the same screen, so it functions as a frame around the photograph rather than a mark\nplaced on it — a rare, specific device none of this set's other hospitality/luxury\nentries use.", "Motion": "Motion feel is mixed and the extract marks the page as scroll-linked. The transition\nvocabulary is thin: only two durations show up in the live CSS, and no named easing tokens\nwere captured — the transitions fall back to the browser's default `ease` rather than an\nauthored curve. Keyframe use is equally narrow: `arrows-bounce`, a small vertical bounce\n(0 → 10px → 0), is the only keyframe actually applied on the page, and it almost certainly\ndrives the hero's small downward \"scroll to explore\" arrow rather than any content reveal;\na generic `spin` (a full 360° rotation, likely a loading indicator) exists in the\nstylesheet but isn't logged as in-use. No stagger or scroll-scrubbed choreography is\nrecorded — this reads as a near-static page carrying one small looping cue rather than a\nreveal system (from designlang extract).\n\n| kind | name | value |\n|---|---|---|\n| duration | `md` | 400ms |\n| duration | `lg` | 450ms |\n| easing | — | not captured; falls back to default `ease` |\n| keyframe | `arrows-bounce` | slide-y bounce, drives the scroll-cue arrow |", "Brief": "Build a nature-retreat/wellness-sanctuary landing page opening on one full-bleed aerial\nphotograph of a preserved natural landscape. Split the property's wordmark across two\naxes: the primary name set horizontally in serif capitals in one corner, a secondary word\n(e.g. \"Sanctuary\") running vertically along an outer edge, both framing rather than\ncovering the photograph. Keep all other hero information — nav, a small upcoming-date\nmodule, a two-line statement, a solid-plus-outline CTA pair, and a scroll cue — distributed\nto the frame's quiet corners, leaving the photograph's centre uninterrupted. Below the\nfold, drop entirely to a plain warm cream ground with centred serif statements and tiny\ndotted-rule kickers marking each new topic, no further photography until a dedicated\ngallery section.", "Image recipe": "Aerial documentary photograph of [SUBJECT] — a preserved coastline, a wooded peninsula, an\nopen bay — shot from a drone or small aircraft, natural overcast or soft daylight, true-\nto-life muted greens and blues, minimal human development visible, composed with open sky\nor water along at least one full edge so a vertical wordmark can run there without\ncrossing busy detail.", "Photo search": "Unsp n", "captured": "2026-09-04", "family": "terroir-calendar-atelier", "dna": "Wine-terroir provenance x seasonal skincare calendar", "register": "editorial print", "grammar": "gallery/catalog", "lane": "A sky-and-grasses photograph carries a giant serif wordmark over a literal month-by-month calendar strip, then cream product plates ruled and priced in euros by season", "mode": "persuade", "traits": ["giant serif wordmark set on photo", "tracked micro-caps provenance copy", "literal J-D month calendar strip as design device", "cream product-plate grid", "colour-coded seasonal product photography", "euro pricing under each tile", "terracotta accent banner", "wine-estate origin story"], "palette": ["#6E93B5", "#F0EAD9", "#C1552B", "#7C8A3E", "#5A6E3A", "#3A2E1F"], "type": ["Francesco", "Sackers Gothic"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "luxury-craft", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://dixhectares.com/en", "has_image": true, "img": "../design-catalogue/entries/dix-hectares/fold.webp", "full": "../design-catalogue/entries/dix-hectares/shot.webp", "sections": {"Why it works": "The provenance claim is stated three times in three registers before the reader\nsees a single product: a tracked micro-caps line (\"French skincare, cultivated\non a Grand Cru terroir...\"), a giant serif wordmark, and — most distinctively —\na literal month-by-month calendar strip (`J F M A M J J A S O N D`) running the\nfull width beneath the hero. The calendar is the unusual move: it makes\n\"seasonal skincare\" a structural, almost architectural feature of the page\nlayout, not just a line of copy.\n\nThe brand borrows its authority from wine, not cosmetics — \"Grand Cru terroir\"\nis a wine-classification term, and the estate origin (a Bordeaux wine château\ndiversifying into skincare) gives the calendar device real logic: the product\nliterally changes with the growing season, so a calendar isn't decoration, it's\nthe product's actual organizing principle.\n\nProduct photography is colour-coded by season rather than shot on a single\nneutral background: a jar on terracotta orange, a tube on olive green, a bottle\nin a glass vase on sage — each SKU gets its own seasonal ground colour, so the\nshop grid reads as a colour-mapped calendar in miniature, echoing the strip\nabove it.", "What to borrow (principle)": "- **Turn a seasonal or cyclical product logic into a literal calendar-strip\n  layout device**, not just copy — make the structure of the page argue the\n  claim.\n- **Borrow authority language from an adjacent, higher-status category** (wine\n  terroir vocabulary for skincare) when the provenance is genuinely shared.\n- **Colour-code product photography by category or season** so the shop grid\n  itself communicates organization, not just individual product beauty.\n- **State the same core claim in three type registers** (tracked micro-caps,\n  giant display, structural layout) so it lands whether the reader skims or\n  reads closely.", "What to leave": "- A full J-through-D calendar strip is a striking one-time device; repeating it\n  as a navigational element throughout the site would wear out its novelty fast.\n- Colour-coding every product to its season risks a cluttered shop grid once the\n  catalogue grows past a handful of SKUs per season — it needs a neutral-ground\n  fallback for larger ranges.", "Signature move": "The month-by-month calendar strip: twelve ruled cells, one per month letter,\nrun full-width directly beneath the hero wordmark — turning \"seasonal skincare\"\nfrom a tagline into an actual piece of interface.", "Motion": "(from designlang extract) Feel is \"responsive\" with scroll-linked motion\nconfirmed. The dominant easing is a decelerating ease-out family\n(`cubic-bezier(0.33,1,0.68,1)`, `cubic-bezier(0.25,1,0.5,1)`,\n`cubic-bezier(0.215,0.61,0.355,1)` — 81 uses combined) on a `300–800ms`\nduration ladder, giving hover states and section transitions a smooth,\nsettled arrival rather than anything springy. Most of the actual keyframes\ncaptured, though, are commerce plumbing rather than page choreography:\nShopify's accelerated-checkout skeleton and rotator/dash spinners, plus a\nSwiper carousel preloader — none of it is the calendar-strip or product-tile\nreveal the layout implies, which the static extract doesn't confirm either\nway.\n\n| token | value | role |\n|---|---|---|\n| `xs`/`md` | 100/300ms | UI state changes |\n| `lg`/`xl` | 500/800ms | larger section transitions |\n| ease-out | `cubic-bezier(0.33,1,0.68,1)` etc. | dominant (81 uses) |\n| custom | `cubic-bezier(0.65,0,0.35,1)` etc. | secondary (43 uses) |", "Brief": "Build an editorial-print skincare page rooted in a genuine seasonal or\nprovenance story. Open on a photograph of the raw material (a plant, a\nlandscape, a harvest) with tracked micro-caps provenance copy and a giant serif\nwordmark overlaid. Directly beneath, run a literal calendar-strip device (twelve\ncells, one per month) as a structural page element, not decoration. Below, on\ncream, lay out product tiles as a ruled grid, each shot on its own\nseason-appropriate colour ground with the price set in the local currency\nbeneath. Keep an orange or terracotta accent for banners and small UI only.", "Image recipe": "A hand or figure holding [SUBJECT] — wild grasses, herbs, or harvest material —\nagainst open sky, natural outdoor light, shallow depth of field with the sky\nslightly overexposed, muted natural colour, no visible product or packaging in\nthe hero shot.", "Photo search": "Unsplash first, Pexels second.\n- \"wild grasses harvest hand against sky\"\n- \"herb bundle natural light outdoor\"\n- \"botanical harvest field golden light\"", "Reference lock": "Primary reference/direction: Dix Hectares — literal month-calendar strip as a structural device under a terroir-provenance hero.\nPreserve (3-5 traits): tracked micro-caps provenance copy stated above a giant serif wordmark; a literal twelve-month calendar strip run full-width as a structural (not decorative) layout device; product photography colour-coded by season on distinct grounds; euro/local-currency pricing set directly beneath each product tile.\nBorrow only (1-2): the orange \"free delivery\" announcement banner; the vase-styled product photography for liquid formats.\nRole rules: the calendar-strip device appears once per page, directly under the hero, never repeated as navigation; each product's ground colour must correspond to its season, not be arbitrary; provenance copy stays in tracked micro-caps, never full-size body text.\nMedia strategy: photo:unsplash — natural outdoor light, raw/harvest material only for hero imagery; product photography is studio-lit on seasonal colour grounds.\nReject: a neutral white-background product grid that discards the seasonal colour-coding; decorative (non-functional) calendar graphics; provenance claims without a genuine sourcing story behind them.\nToken commitments: sky `#6E93B5`, cream `#F0EAD9`, terracotta `#C1552B`, olive `#7C8A3E`, sage-product-bg `#5A6E3A`, ink-brown `#3A2E1F`; serif display for the wordmark, tracked small-caps for all provenance/label copy."}, "has_extract": true}, {"slug": "dope-security", "title": "dope.security", "url": "https://dope.security", "captured": "2026-09-04", "family": "midnight-boarding-pass", "dna": "Twilight sky photography x a translucent boarding-pass card, violet rationed like runway lighting", "register": "cinematic dark", "grammar": "split stage", "lane": "A near-black canvas carries a single dramatic dusk-sky photograph as the hero, with a frosted glass boarding-pass card floating on the right and 74px letterspaced mono stamps signposting every section below — the one violet accent appearing only once or twice per page", "mode": "persuade", "traits": ["\"signal violet rationed to 1-2 uses per page", "never a border\"", "GrandSlang italic reserved for 2-3 largest moments only", " han 15% of the page\" after the hero)\n  depends on that one image being genuinely striking — a weaker photograph\n  would leave the rest of the page visually thin.", "Signature move": "The coordinate-stamp footer: a live-updating GPS coordinate paired with a\nsmall heart icon and \"Fly Direct\" labeling, written as if the brand is\nsigning a postcard from a physical location — the closing gesture that\ncompletes the travel/boarding-pass conceit running through the whole page.", "Motion": "(from designlang extract) Feel reads as responsive, and the page is\nscroll-linked — correcting the earlier \"no durations captured\" read. A\nfast-settling ease-out family (`cubic-bezier(0.23, 1, 0.32, 1)` and\n`cubic-bezier(0.165, 0.84, 0.44, 1)`, 9 uses) carries transitions across four\ndurations from 100ms to 600ms. One keyframe is confirmed firing: `sparkle`, a\nreveal combining opacity and transform (1 use) — almost certainly the \"one\nfeature card glow\" the violet accent is rationed to, giving that single\nsignal-violet moment a small animated flourish rather than a static highlight.\n(observed in capture) the live capture confirms the hero's atmospheric sky\nphotograph, translucent boarding-pass card, and streaking airplane-light\nmotif are present and match the described composition; given the frosted nav\npattern, hover and scroll states beyond the sparkle most plausibly still rely\non opacity or blur intensity shifts on that same ease-out family rather than\ntranslation, consistent with the shadowless, line-weight-driven elevation\nphilosophy documented throughout.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 100ms | ease-out family |\n| sm | 200ms | ease-out family |\n| md | 300ms | ease-out family |\n| lg | 600ms | ease-out family |\n| sparkle (violet glow) | reveal (opacity + transform) | 1 use |", "Brief": "Build a premium, midnight-terminal security-product landing page. Canvas is\nnear-black `#090909`; almost-white `#f7f9fa` carries primary text and 1px\nborders. Signal violet `#af50ff` is the only chromatic voice, appearing at\nmost once or twice per page as a feature-card glow, a single filled CTA, or\nan accent stroke — never a border, never body text. Open full-bleed on a\nsingle dramatic twilight-sky photograph with a left-column hero mixing\nGrandSlang italic (146px, \"Your new\" / \"with AI DLP\") and Whyte Inktrap\n(64px, the product name), plus a translucent 19.2px-radius \"boarding pass\"\ncard floating on the right with two pill CTAs. Signpost every section below\nwith a 74px Whyte Inktrap Mono uppercase heading at constant 0.2em tracking\n— never mixed on the same line as GrandSlang. Use only two button radii: 8px\nfor compact bordered controls, 1584px for pill CTAs. Replace shadows with\n0.5-1px low-opacity hairlines everywhere except a single 1px nav shadow.\nClose on a coordinate-stamp footer with a live GPS location and a heart\nicon. Keep 120px section gaps and a 1200px content max-width.", "Image recipe": "Atmospheric wide-format sky photograph of [SUBJECT] — a dramatic twilight or\ndusk scene with saturated purple-to-amber gradient clouds over a glowing\nhorizon, shot uncropped and unmasked to fill the full viewport, with a\nsingle small streak of light (aircraft trail) crossing the frame as the\nonly literal subject beyond the sky itself.", "Photo search": "Unsplash first, Pexels second.\n- \"dramatic twilight sky purple clouds horizon\"\n- \"dusk sky gradient clouds wide format\"\n- \"airplane light trail night sky\"\n- \"atmospheric sunset clouds moody\"", "Reference lock": "Primary reference/direction: dope.security — midnight boarding-pass product\npage, violet rationed as a stated 1-2-uses-per-page signal.\nPreserve (3-5 traits): near-black `#090909` canvas with almost-white\n`#f7f9fa` text, nine-step achromatic scale; signal violet `#af50ff` capped at\n1-2 uses per page, never a border or body-text colour; three typefaces in\nstrictly separate roles (Whyte Inktrap workhorse, mono for 74px 0.2em-\ntracked section stamps, GrandSlang italic for 2-3 largest moments only,\nnever below 32px); zero box-shadow beyond one 1px nav hairline; exactly two\nbutton radii (8px controls, 1584px pills).\nBorrow only (1-2): the translucent \"boarding pass\" hero card device; the\nlive-coordinate postcard-signature footer.\nRole rules: GrandSlang and the mono stamp voice never share a line; violet\nnever becomes a border or large text colour; card padding stays at 0 —\nlayout, not fill, creates the boundary.\nMedia strategy: photo:unsplash for a single dramatic atmospheric sky hero;\neverything after the hero stays iconographic/typographic — no further\nphotography.\nReject: a second accent colour; GrandSlang below 32px; box-shadow beyond the\none documented hairline; a button radius outside {8px, 1584px}; centred\nbody copy or multi-column text.\nToken commitments: bg `#090909`, nav-panel `#333248b3`, wash `#423738`,\naccent `#af50ff`, accent-tint `#e1bdff`, ink `#f7f9fa`, muted `#828384`;\ndisplay Whyte Inktrap 300-400 at 48-88px, GrandSlang 300-400 at 32-146px;\nmono stamp 74px/0.2em tracking; radius 19.2px cards, 8px controls, 1584px\npills; page max-width 1200px, section gap 120px."}, "has_extract": true}, {"slug": "dovetail", "title": "Dovetail", "url": "https://dovetail.no/", "captured": "2026-09-04", "family": "butter-cream-pill-stack", "dna": "Printed-magazine investment memo x stacked pill capability tags", "register": "editorial print", "grammar": "split stage", "lane": "A butter-cream canvas holds an oversized left-aligned headline against a monochrome editorial illustration, then the page alternates two-column splits and centred statements, each closed off by a hairline rule instead of a shadow", "mode": "persuade", "traits": ["\"72px display", "single typeface at three weights\"", "91px pill radius reserved for capability tags only", "\"9999px pill for buttons/nav", "16px for cards\"", "\"flat", "hairline dividers", "zero shadow\"", "\"monochrome illustration vs colour photography", "never mixed\"", "\"butter cream + ink black + two neutrals", "no accent colour\""], "palette": ["#f9e5b1", "#1d1e21", "#fef9f3", "#e5e7eb", "#000000"], "type": ["Lausanne"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "institutional", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://dovetail.no/", "has_image": true, "img": "../design-catalogue/entries/dovetail/fold.webp", "full": "../design-catalogue/entries/dovetail/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. The system has no accent colour at all — butter cream `#f9e5b1`, ink\nblack `#1d1e21`, warm bone and ash gray carry the entire page. That absence is\nitself the brand signal: a venture firm's site with no \"brand blue\" reads as more\nconsidered, not less finished, because every visual decision is forced onto type,\nscale and whitespace instead of a swatch.\n\nA single typeface, Lausanne, runs the whole system at exactly three weights —\n400 for body and nav, 600 for subheadings and button labels, 700 reserved\nstrictly for headlines 28px and above, capped at a 72px ceiling. Letter-spacing\nfollows classical convention rather than a flat value: it tightens at display\nsize and opens slightly at small body sizes, which is what keeps a single-family\nsystem from feeling monotonous across six size steps.\n\nRadius is split with unusual discipline into three distinct, non-overlapping\nuses: 9999px for buttons and nav items, 16px for photo cards, and a striking 91px\nreserved exclusively for the capability pill tags stacked in the right rail —\nnever applied to a button or a card. Combined with a strict two-mode imagery rule\n(monochrome editorial illustration in the hero, full-colour photography in\nportfolio/about sections, never overlapping), the page reads as a printed\neditorial spread rather than a fundraising deck.", "What to borrow (principle)": "- **Ship a system with zero accent colour on purpose.** Two neutrals plus one\n  warm canvas and one ink can carry an entire institutional brand without ever\n  reaching for a \"brand colour.\"\n- **Give one radius value a single, exclusive job.** Reserving the largest pill\n  radius (91px) for exactly one component type (capability tags) makes that\n  device recognisable on sight, everywhere it appears.\n- **Alternate two imagery modes, never mix them in one view.** Monochrome\n  illustration for mood, full-colour photography for proof — kept strictly\n  separate so each mode stays legible as intentional.\n- **Cap display type at a stated maximum.** Declaring \"72px is the ceiling —\n  nothing goes larger\" prevents the usual creep toward ever-bigger hero text.\n- **Use letter-spacing that opens at small sizes, tightens at large.** Classical\n  tracking (not a flat value) is what keeps both extremes of the type scale\n  comfortable to read.", "What to leave": "- Zero accent colour is a genuinely hard constraint for a product or marketing\n  team that later needs a state colour (success, warning, notification) — the\n  system offers no built-in answer for that.\n- The 91px-radius pill tags depend on short, punchy labels (\"+ Design\", \"+ Tech\");\n  longer category names would break the lozenge reading the source describes.\n- A single typeface at three weights only works if that face has a genuinely\n  distinctive 700 cut — a generic substitute risks the display headlines losing\n  the \"literary weight\" the source attributes to Lausanne specifically.", "Signature move": "The stacked capability pill cluster: four or five 91px-radius pill tags\n(\"Capital\", \"+ Design\", \"+ Tech\", \"+ Strategy\", \"+ Finance\") right-aligned in a\ntight vertical column with 8-12px gaps, reading as a word-cloud list of\ndisciplines rather than a conventional tag row.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked —\ncorrecting the earlier \"no motion tokens\" read. Transitions run fast and quiet:\n150ms and 200ms, mostly on a standard `cubic-bezier(0.4, 0, 0.2, 1)` curve (10\nuses) with a single plain `ease` use elsewhere. No keyframe animations are\nconfirmed firing, which fits the source's explicit \"no z-axis layering\" rule —\nmotion here lives entirely in short property transitions (colour, border,\nopacity on hover/focus), not choreographed reveals. (observed in capture) the\nlive capture confirms a static hero on load with no animated reveal; any\nscroll-triggered motion is most plausibly a simple opacity fade given the\n\"strictly horizontal and two-dimensional\" constraint.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 150ms | `cubic-bezier(0.4, 0, 0.2, 1)` |\n| sm | 200ms | `cubic-bezier(0.4, 0, 0.2, 1)` / `ease` |", "Brief": "Build an institutional investment-firm homepage. Canvas is butter cream `#f9e5b1`\nfor hero and feature sections; ink black `#1d1e21` carries all text and filled\nbuttons; warm bone `#fef9f3` lifts card surfaces; ash gray `#e5e7eb` is the only\nborder colour — no accent hue anywhere. Set the wordmark in Lausanne 700 at\n32-48px top-left, nav links at 16px weight 400 top-right, a small geometric brand\nglyph far right. Open with a two-column hero: an oversized 72px weight-700\nheadline with negative tracking on the left, a monochrome line-and-fill editorial\nillustration on the right, one dark filled pill button (\"Get in touch\") below the\nheadline. Alternate subsequent sections between two-column splits (text-left,\nphoto-right in a 16px-radius hairline-bordered card) and centred statement\nheadlines, separated only by 1px ash-gray hairlines — never a shadow, never a\nbackground change. Stack capability tags (91px radius, warm-bone fill, ash-gray\nborder) in a tight right-aligned column wherever disciplines need listing. Keep\n64-96px section gaps.", "Image recipe": "Two distinct treatments, never combined in one section: (1) a detailed monochrome\nline-and-fill illustration of [SUBJECT] — fine linework, organic shapes, solid\nblack fills, no colour, no gradient, functioning as a literary counterweight to\ntype; (2) full-colour documentary photography of [SUBJECT] — natural light team\nor workspace shots, unstaged, presented in a 16px-radius card with a 1px hairline\nborder, no filter or duotone treatment.", "Photo search": "Unsplash first, Pexels second.\n- \"team workspace overhead natural light documentary\"\n- \"office collaboration candid photography\"\n- \"hand-drawn line illustration people editorial\"\n- \"startup team portrait natural light\"", "Reference lock": "Primary reference/direction: Dovetail — butter-cream editorial investment-firm\npage, zero accent colour, stacked 91px pill capability tags.\nPreserve (3-5 traits): butter cream `#f9e5b1` canvas with ink black `#1d1e21`\ntext, no accent colour anywhere; single typeface (Lausanne) at exactly three\nweights, 700 capped to headlines 28px and above with a 72px ceiling; three\ndistinct radius values each reserved for one component (9999px buttons/nav, 16px\ncards, 91px capability tags only); 1px ash-gray hairlines as the only section\ndivider, zero shadows; monochrome illustration and colour photography kept in\nstrictly separate sections.\nBorrow only (1-2): the stacked, right-aligned capability pill cluster; the\ncustom geometric brand-glyph logomark.\nRole rules: 91px radius never applies outside capability tags; illustration and\nphotography never share a section; body text stays left-aligned below 32px;\nweight 700 never sets body copy.\nMedia strategy: photo:unsplash for documentary team/workspace photography;\nsupplement with commissioned monochrome line illustration for hero moments — no\nstock illustration, no 3D, no icon badges or avatars.\nReject: a second accent colour; a shadow or gradient anywhere; pill radius on\ncards or images; center-aligned long-form body text; overlapping/z-axis layered\ndecoration.\nToken commitments: bg `#f9e5b1`, card `#fef9f3`, border `#e5e7eb`, ink `#1d1e21`,\nink-hard `#000000`; display Lausanne 700 at 48-72px/leading 1.0/-0.005 to -0.01em\ntracking; body 400 at 20-22px/leading 1.36-1.4; radius 16px cards, 9999px\nbuttons/nav, 91px capability tags; page max-width 1200px, section gap 64-96px."}, "has_extract": true}, {"slug": "equityfund", "title": "The Climate and Clean Energy Equity Fund", "url": "https://theequityfund.org", "captured": "2026-09-04", "family": "lavender-advocacy-poster", "dna": "Protest photography x civic condensed poster type", "register": "editorial print", "grammar": "typographic poster", "lane": "A giant condensed slogan straddles a documentary protest photo in a lavender field, then drops to a cream state-by-state ledger of where the fund operates", "mode": "persuade", "traits": ["lavender field ground", "oversized condensed display sans", "serif body copy", "photo bleeding through cut-out headline", "maroon ink", "state-map grid", "cream ledger section", "documentary protest photography"], "palette": ["#C4B4E0", "#FCF6ED", "#521224", "#77686A", "#743B43", "#B99498", "#D5C1B4"], "type": ["Judge", "Feature Text", "Metrify Narrow"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "institutional", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://theequityfund.org", "has_image": true, "img": "../design-catalogue/entries/equityfund/fold.webp", "full": "../design-catalogue/entries/equityfund/shot.webp", "sections": {"Why it works": "The page pairs one very loud device with one very quiet one and gives each exactly one\njob. \"HOW WE WIN\" is set in an ultra-condensed display sans (Judge) at a size that breaks\nout of any normal headline scale, and a single documentary photograph is windowed through\nthe middle of it so the type reads as a frame around real people rather than a slogan\nfloating in space. Everything else on the page — the mission paragraph, the state\ndescriptions — drops into a serif (Feature Text) at conservative body size, so the poster\ngesture never repeats and stays singular.\n\nColour does the organisational work that hierarchy usually does: a warm lavender field\nmarks the mission/identity zone at the top, and a cream ledger zone below marks the\noperating-record zone (states, partners, resources), with deep maroon ink used\nconsistently across both as the only accent. Because the palette shift is the section\nboundary, the page doesn't need rules or cards to tell the reader they've moved from \"who\nwe are\" to \"where we work.\"\n\nThe state grid is the credibility payload: a small-caps condensed label, a state name in\nserif, and a tinted silhouette map, repeated as a plain ruled list rather than a\nmap visualisation. Like Calyx's priced index, it turns a claim (\"we work in 13 states\")\ninto a scannable, literal inventory — the restraint of the list is what makes it read as\nfact rather than marketing copy.\n\nThe copy voice reinforces the same institutional stance as the layout: friendly in tone but\nwe-only in pronoun throughout (\"HOW WE WIN,\" \"WHAT WE DO\"), so the fund narrates its own\naction rather than issuing instructions to the reader (from designlang extract).", "What to borrow (principle)": "- **Let one photograph interrupt the headline instead of sitting beside it.** Windowing an\n  image through oversized type creates a single unmissable focal point without adding a\n  second hero element.\n- **Use a hard colour-field change as the only section break you need.** A palette shift\n  from mission-lavender to record-cream does the job rules and dividers usually do.\n- **Turn a claim into a list.** \"13 states\" becomes 13 named, mapped rows — the inventory\n  is more convincing than the number alone.\n- **Reserve the display face for exactly one line per page.** Everything else, however\n  important, goes into a body serif — the poster line stays singular because nothing\n  competes with it.", "What to leave": "- The oversized headline's baseline sits close enough to the photo that at narrower\n  viewports the crop and the \"WIN\" descender risk collision — worth a wider photo mask or\n  a fixed minimum gap.\n- Deep maroon-on-lavender body text (mission paragraph) sits close to the contrast floor\n  for extended reading; fine for two short paragraphs, risky if copy grows.\n- The state-grid silhouette maps are decorative rather than informational at this size —\n  they read as a texture, not a real map; a plain state list would carry the same\n  credibility with less production weight.", "Signature move": "The photograph windowed through the cut of the giant headline — \"HOW WE\" above the image,\n\"WIN\" below it, so the type and the photo occupy the same vertical column and the reader's\neye reads slogan-photo-slogan as one continuous unit instead of stacked elements.", "Motion": "Feel reads as mixed and the page is technically scroll-linked, but the extract's motion\nlayer is thin: no keyframe animations were recorded at all, only instant-feeling property\ntransitions on hover/focus states (colour, background-colour, border-colour, fill, stroke,\ntransform, grid-template-rows). Every recorded transition rides the same single easing\ncurve, a standard decelerate `cubic-bezier(0.4,0,0.2,1)`, with no spring or overshoot\nvariant anywhere. Durations sit short, 100-150ms, consistent with link and button\nmicro-states rather than section entrances — nothing in the extract animates the hard\nlavender-to-cream colour-field break or the windowed photo-through-headline composition, so\nthat pairing reads as a single static reveal rather than a scroll-triggered sequence. No\nstagger or choreography pattern is present in the data. (from designlang extract)\n\n| token | value | used for |\n|---|---|---|\n| xs | 100ms | fastest hover/focus states |\n| (unnamed) | 150ms | colour/background/border/fill/stroke/transform hovers |\n| ease (custom) | `cubic-bezier(0.4,0,0.2,1)` | every recorded transition |", "Brief": "Build an advocacy-fund landing page anchored on one oversized condensed display slogan\nwith a documentary photograph windowed through its middle. Ground the hero/mission zone in\na warm lavender field with deep maroon ink; drop to a cream ledger zone below for the\noperating record. Set the slogan in an ultra-condensed display sans at a size that exceeds\nnormal headline scale — one line only, never repeated elsewhere on the page. Set all body\ncopy, mission statements and descriptions in a body serif at conservative size. Use the\ncolour-field change alone as the section break between \"who we are\" and \"where we work.\"\nBelow the fold, list the operating footprint as a plain ruled grid: label, name, and a\nsmall tinted marker per row, not a live map. Close with resources/news in the same\ncream/maroon system.", "Image recipe": "Documentary photograph of [SUBJECT] — a civic rally, a statehouse rotunda, a community\norganising moment — shot handheld, available light, warm and slightly warm-toned, real\nsignage and real crowds in frame, no staged studio lighting, cropped to read cleanly when\nwindowed through large type (a clear horizontal band of legible subject matter through the\nmiddle third of the frame).", "Photo search": "Unsplash first, Pexels second.\n- \"statehouse rotunda rally crowd\"\n- \"community organizing protest signs documentary\"\n- \"civic rally megaphone daylight\"\n- \"state capitol building exterior\"", "Reference lock": "Primary reference/direction: The Climate and Clean Energy Equity Fund — lavender advocacy\nposter, oversized condensed headline windowing a documentary photo, cream state ledger.\nPreserve (3-5 traits): lavender mission field paired with cream record field, maroon ink\nconsistent across both; one oversized ultra-condensed display line per page, never\nrepeated; body copy always in a conservative serif, never the display face; a photograph\nwindowed through the headline rather than placed beside it; operating footprint shown as a\nruled list of named, mapped rows.\nBorrow only (1-2): the small tinted state-silhouette markers; the small-caps condensed\nsection labels (\"STATES WHERE WE ARE ADVANCING CLIMATE EQUITY\").\nRole rules: display face appears once per page at poster scale, never at body or button\nsize; body serif never exceeds two short paragraphs per screen; maroon is the only accent\nacross both colour fields; section breaks are colour-field changes, not rules or cards.\nMedia strategy: photo:unsplash — handheld documentary crowd/rally photography, warm\navailable light, no staged studio shots.\nReject: multiple accent colours; the display face used for body copy or buttons; a live\ninteractive map in place of the ruled list; centred hero copy; gradient or drop-shadow\ntreatments on the headline.\nToken commitments: bg-mission `#C4B4E0`, bg-record `#FCF6ED`, ink `#521224`, ink-soft\n`#743B43`, stone `#77686A`, tint-1 `#B99498`, tint-2 `#D5C1B4`; display `Judge` (or nearest\nultra-condensed grotesque), body `Feature Text` (or nearest text serif), label `Metrify\nNarrow`; display set at poster scale only, body conservative, labels small-caps tracked."}, "has_extract": true}, {"slug": "example", "title": "EXAMPLE", "url": "https://www.weareexample.com", "captured": "2026-09-04", "family": "condensed-marquee-agency", "dna": "Culture-agency manifesto poster x hotel-lounge marquee reel", "register": "modern clean", "grammar": "typographic poster", "lane": "A giant condensed black headline wedges small client photos into its own letterforms, then a full-bleed hotel-lounge photo carries a horizontal scrolling marquee of the same copy", "mode": "persuade", "traits": ["off-white ground", "ultra-bold condensed display sans", "photos wedged into headline letterforms", "italic script sub-tagline", "horizontal marquee text over photo", "warm red-lit interior photography", "numbered slide counter", "minimal single-line nav"], "palette": ["#F3
