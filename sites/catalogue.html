 case and a neutral, third-person voice,\nso the wordmark and colour system carry the studio's personality rather than the language\n(from designlang extract).", "What to borrow (principle)": "- **Build a wordmark from the same colour pair used everywhere else**, so the logo reads\n  as generated by the system rather than pasted on top of it.\n- **Turn service icons into both logo ornaments and navigation bullets.** Reusing the same\n  three marks in two contexts teaches the vocabulary once.\n- **Mark the brand with corner tags on full-bleed photography instead of a persistent\n  header/footer chrome.** The photo keeps the whole frame; the brand still reads on every\n  screen.\n- **Hold every label to one tracked small-caps sans.** A single display exception (the\n  wordmark) stays legible as an exception only if nothing else competes with it.", "What to leave": "- Splitting the wordmark across four screen corners (P / A / Y / A) depends on the viewer\n  reading top-to-bottom, left-to-right in the right order — it works as a subtle signature\n  but wouldn't survive as a primary way to communicate the brand name to a first-time\n  visitor.\n- The homepage's icon-labelled service row sits in a large field of otherwise empty\n  olive ground; on a wider viewport this risks reading as unfinished rather than\n  intentionally spacious.", "Signature move": "The four-corner letter tag: instead of a persistent logo lockup, a single character of the\nstudio's name sits in each corner of a full-bleed project photograph, turning every\nimage plate into a piece of branded stationery without ever adding a bar, rule or watermark\nacross the photo itself.", "Motion": "Overall feel reads as springy on a scroll-linked page — the one named easing family the\nextract found is a genuine spring/overshoot curve, `cubic-bezier(0.56, 0.56, 0.4, 1.13)`,\nwhose >1 control point gives it a slight bounce past its resting value. Duration steps run\n`md` 300ms and `lg` 500ms, and the spring curve is paired with a 0.5s transition (the\ngeneric `transform 0.4s` and unitless `0.3s` transitions elsewhere stay on the browser's\ndefault ease). The keyframes are a coordinated loading-screen family rather than\ncontent-reveal animation: a plain `spin`, a centred `loading-default` rotation, a\nbox-shadow-driven `loading-bars` bounce (bars grow at the 40% mark), and two orbiting\ndot-trail loaders (`loading-trail-1`, `loading-trail-2`) that sweep a ring of dots around a\ncentre point. Together they read as a branded pre-loader shown before the page settles,\nnot as scroll-triggered choreography on the icons or wordmark — no stagger pattern for the\npage content itself is documented. (from designlang extract)\n\n| Token | Value | Curve |\n|---|---|---|\n| `md` | 300ms | default ease |\n| `lg` | 500ms | spring `cubic-bezier(0.56, 0.56, 0.4, 1.13)` |\n| `spin` / `loading-default` | rotate 0deg → 360deg | default ease (loader) |\n| `loading-bars` | height 3.2em → 4em (40% peak) | default ease (loader) |\n| `loading-trail-1/2` | box-shadow / rotate orbit | default ease (loader) |", "Brief": "Build a production-studio identity on a flat two-colour field (deep olive ground, single\nchartreuse-yellow ink, no white or black in the core palette). Open the homepage on a\ncentred custom rounded wordmark accompanied by two or three small hand-drawn icons, and\nrepeat those same icons as bullets in a service-label row beneath. Hold every label, nav\nitem and caption to one tracked small-caps sans; reserve display scale for the wordmark\nalone. For project/case-study pages, run full-bleed documentary photography with minimal\nUI chrome — replace a persistent header/footer with a single letter of the studio name\nplaced in each corner of the frame, spelling the name out as the visitor scrolls through\nthe piece.", "Image recipe": "Documentary sports/production photograph of [SUBJECT] — an athlete mid-action, a location\nshoot, a crew at work — shot on location in natural daylight, true-to-life saturated\ncolour (not desaturated or heavily graded), candid framing rather than posed, composed\nfull-bleed with clear open corners so a single letter mark can sit legibly over the image.", "Photo search": "Unsplash first, Pexels second.\n- \"golf course documentary natural light\"\n- \"sports action candid on location\"\n- \"film crew on set outdoor shoot\"\n- \"athlete mid action daylight documentary\"", "Reference lock": "Primary reference/direction: PAYÁ Film Haus — flat olive/chartreuse studio identity with\nfour-corner letter tags on full-bleed documentary photo plates.\nPreserve (3-5 traits): flat olive-green ground with a single chartreuse ink, no other\ncolours in the core identity; a custom rounded wordmark paired with hand-drawn icons that\ndouble as navigation bullets; one tracked small-caps sans for every label and caption;\nfull-bleed documentary photography on project pages with minimal persistent UI chrome;\nbrand presence carried by corner letter tags rather than a fixed header/footer lockup.\nBorrow only (1-2): the circular seal-style icon variant next to the studio initials; the\ntiny centred dot-separated date/season label (\"• 2024/2025 •\").\nRole rules: display scale is reserved for the wordmark only, project titles stay at body-\nadjacent size; the two-colour identity palette never gains a third hue outside\nphotography; corner tags never grow into a full header bar.\nMedia strategy: photo:unsplash — true-colour, on-location documentary sports/production\nphotography, never desaturated or studio-lit.\nReject: adding white or black as a core identity colour; a persistent logo header on\nproject pages; a second display typeface; centred photo captions breaking the full-bleed\nframe; drop shadows or card borders around photography.\nToken commitments: bg `#387648`, bg-deep `#223830`, ink `#ECFD64`, ink-soft `#98BF64`,\nink-mid `#74A653`; label/body `Annuario` (tracked small-caps for all UI text); wordmark\ncustom rounded display, used once per page at large scale only."}, "has_extract": true}, {"slug": "perplexity-ai", "title": "Perplexity AI", "url": "https://www.perplexity.ai", "captured": "2026-09-04", "family": "botanical-parchment-camouflage", "dna": "Blurred garden photography as UI camouflage x whisper-weight serif declarations", "register": "warm photographic", "grammar": "continuous world", "lane": "White flower-like cards float over 20px-blurred botanical photography as if composited onto living nature footage, with a whisper-weight serif headline reading like a caption etched onto the glass between UI and garden", "mode": "experience", "traits": ["40px pill nav/CTA vs 4-12px everywhere else", "\"warm sepia ink", "never true black\"", "20px blur on all hero/feature photography", "\"weight-300 serif and sans display", "tight leading\"", "\"zero drop shadow", "luminance-step depth only\"", "\"serif for declarations", "sans for interface", "never mixed\""], "palette": ["#faf8f5", "#271a00", "#d1cfc7", "#ffffff", "#0f3639", "#23291b"], "type": ["pplxSerif", "pplxSans", "pplxSansMono"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "editorial", "origin": "refero", "extract": "failed: designlang extract is a generic block/error page (Arial-only, 5-colour palette incl. default link blue, near-empty Section Roles/Page Intent), not real Perplexity content", "source_url": "https://www.perplexity.ai", "has_image": true, "img": "../design-catalogue/entries/perplexity-ai/fold.webp", "full": "../design-catalogue/entries/perplexity-ai/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. Aged sepia `#271a00` replaces true black everywhere as primary text and\nborder colour — the source is explicit that this near-brown warmth is \"the\nbrand's chromatic signature, not interchangeable with true black,\" reserved\nabsolute black strictly for the footer. That single substitution is what lets\ncool digital UI sit convincingly on top of warm botanical photography without\nvisual conflict.\n\nDepth is built entirely from luminance step and blur, never shadow: white cards\nfloat on parchment canvas at a stated \"2-3% luminance difference,\" while hero\nand feature photography receives a uniform 20px blur so sharp UI elements read\nas composited glass panels over out-of-focus nature footage. Radius reinforces\nthe same hierarchy signal used elsewhere in this catalogue — 40px pill reserved\nexclusively for nav and primary CTAs, 4-12px for every other surface — so the\none loud geometric gesture always marks \"you can click this.\"\n\nTypography keeps two display voices in strict separation: pplxSerif for\n\"declaration moments\" (section headlines at 48-96px) and pplxSans for interface\nand hero title alike, both locked to weight 300 at display scale — \"authority\nthrough restraint, not volume,\" per the source. The rule against ever mixing\nserif and sans within one text block is what keeps the whisper-weight\nconsistently readable as intentional rather than merely thin.", "What to borrow (principle)": "- **Substitute a warm near-black for true black system-wide.** A single sepia\n  ink used for every text and border role gives an otherwise cool digital UI a\n  consistent warm register.\n- **Blur photography uniformly to let sharp UI float above it.** A stated 20px\n  blur (not a gradient of blur values) creates a legible \"glass over nature\"\n  compositing effect rather than a muddled background.\n- **Reserve one extreme radius for exactly two component types.** 40px only on\n  nav pills and CTAs, 4-12px everywhere else, keeps the interactive signal\n  unambiguous.\n- **Lock both display faces to the same light weight.** Running both the serif\n  and the sans at weight 300 for display sizes means switching typefaces\n  changes register (editorial vs. interface) without changing volume.\n- **Vignette photography into the canvas colour, not into black.** Fading image\n  edges toward parchment/white rather than a dark vignette keeps a photo-heavy\n  hero from ever reading as moody or dark-mode.", "What to leave": "- Applying a uniform 20px blur across all hero and feature imagery is a\n  significant production cost and a strong constraint — it only works if every\n  photograph is genuinely usable \"soft,\" and it forecloses ever showing crisp\n  photography as a feature.\n- The single teal accent, confined to \"nav active states, subtle highlights,\"\n  is easy to lose track of in a near-monochrome sepia system; a design team\n  would need to actively audit for accidental teal creep or accidental omission.\n- Weight-300 display type at both serif and sans sizes depends on both\n  typefaces having genuinely well-drawn light cuts; a heavier substitute for\n  either face would collapse the \"whisper-weight authority\" effect the system\n  is built around.", "Signature move": "The frosted-glass floating card: a translucent white surface at 60% opacity,\n1px hairline border, sitting directly on blurred botanical photography — UI\nrendered as a physical pane of glass laid over a garden rather than a flat\nrectangle on a background image.", "Motion": "No motion or interaction tokens are captured in the Refero export beyond the\nstatic `backdrop-filter: blur(20px)` treatment on photography and the nav pill's\nmorph \"into pill shape on hover/active.\" The live capture shows an active\nbuilding/query demo animating a monospace progress line (\"BUILDING...\") beneath\nthe hero — indicating the homepage runs a live, animated product demonstration\nrather than a static hero, though no specific easing or duration is documented\nbeyond that observed behavior.", "Brief": "Build an AI-product marketing page with a botanical-camouflage aesthetic.\nCanvas is parchment `#faf8f5`; primary text, borders and icons use aged sepia\n`#271a00` — never true black, which is reserved for the footer only. Apply a\nuniform 20px blur to all hero and feature photography (close-up wildflower and\ngarden scenes), vignetting edges into white/parchment via a gradient. Float\nwhite `#ffffff` cards and frosted-glass buttons (60% opacity white, 1px sepia-\ntint border) directly over the blurred imagery. Use 40px pill radius\nexclusively for the navigation bar and primary CTA; keep every other card,\nbadge and input at 4-12px. Set the hero title and section declarations at\nweight 300, 72-96px, alternating between pplxSerif (editorial declarations) and\npplxSans (interface/hero title) — never mixed within one text block, and\npplxSans always carrying -0.028em tracking. Reserve teal `#0f3639` for nav\nactive states only. No drop shadows anywhere — depth comes from a 2-3%\nluminance step between white cards and parchment canvas.", "Image recipe": "Close-up botanical photograph of [SUBJECT] — wildflowers, ornamental grasses or\ngarden foliage in soft natural daylight, photorealistic (never illustrated or\nabstracted), shot with genuine shallow depth of field, then processed with a\nuniform 20px gaussian blur so the entire frame reads as consistently\nout-of-focus, edges fading to white via a 200px linear gradient.", "Photo search": "Unsplash first, Pexels second.\n- \"wildflower garden close up soft focus\"\n- \"ornamental grass natural light bokeh\"\n- \"botanical foliage blurred background\"\n- \"forget-me-not flowers close up\"", "Reference lock": "Primary reference/direction: Perplexity AI (Computer) — botanical-camouflage\nAI product page, blurred garden photography beneath frosted UI cards.\nPreserve (3-5 traits): parchment `#faf8f5` canvas with aged sepia `#271a00`\nink, never true black outside the footer; uniform 20px blur on all hero/feature\nphotography with edges vignetting to white; 40px pill radius reserved for nav\nand CTAs only, 4-12px elsewhere; weight-300 display type on both serif and sans\nfaces, never mixed in one block; zero drop shadow, depth from luminance step\nonly.\nBorrow only (1-2): the frosted-glass 60%-opacity button over blurred imagery;\nthe monospace live-build progress indicator.\nRole rules: serif never sets UI/interface text; teal accent confined to nav\nactive states, never a large fill; pplxSansMono reserved for code-adjacent\nbadges only.\nMedia strategy: photo:unsplash — close-up, photorealistic botanical photography\nprocessed with a uniform blur filter; never illustrated or abstract, never\nsharp in a UI-adjacent context.\nReject: drop shadows on any card; sharp (non-blurred) hero photography; a\nsecond saturated accent beyond teal; 40px radius on cards or content\ncontainers; body text below 15px.\nToken commitments: bg `#faf8f5`, card `#ffffff`, border `#d1cfc7`, ink\n`#271a00`, muted `#7c7464`, accent `#0f3639`, dark-overlay `#23291b`; display\nweight 300 at 48-96px/leading 1.0-1.12/-0.028em (sans only); body pplxSans 400\nat 15-16px/leading 1.5; radius 4px inputs/badges, 12px cards, 40px nav/CTA;\nsection gap 28-40px, card padding 40px."}, "has_extract": true}, {"slug": "picnic", "title": "Picnic", "url": "https://trypicnic.com", "captured": "2026-09-04", "family": "checkered-lunch-hero", "dna": "Office-delivery SaaS x checkered picnic-blanket food photography", "register": "warm photographic", "grammar": "split stage", "lane": "One full-bleed overhead picnic-spread photo carries the whole hero with a serif claim and orange italic accent word, then the page drops to a plain cream ledger of logos and numbered solutions", "mode": "persuade", "traits": ["full-bleed overhead food photo hero", "serif display with italic accent word", "single orange accent", "logo wall of restaurant brands", "numbered solution list with hairline rules", "circular video-still callout", "cream ledger below fold", "sticky orange sign-up card"], "palette": ["#F7F6F2", "#F74C24", "#6D3E25", "#E5D3CA", "#52170D", "#EA8D71"], "type": ["P22 Mackinac Pro", "Inter", "Inter Display"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "product-focused", "category2": "consumer-brand", "origin": "raw-url", "extract": "ok", "source_url": "https://trypicnic.com", "has_image": true, "img": "../design-catalogue/entries/picnic/fold.webp", "full": "../design-catalogue/entries/picnic/shot.webp", "sections": {"Why it works": "The hero is carried entirely by one photograph — an overhead, warm-lit picnic-blanket\nspread of pizza, strawberries and drinks — with white and orange serif type set directly\nonto it. The headline mixes roman and italic within one sentence (\"50+ restaurants\ndelivered to your **office**\"), and the italic word is the only one carrying the brand's\norange, so the accent colour and the emphasis device are the same move: colour marks the\none word the sentence turns on.\n\nBelow the fold the page changes register completely, from photographic warmth to a plain\ncream ledger: a restaurant logo wall in mixed display faces (each brand keeps its own\nidentity), then a numbered list of business solutions separated by hairline rules, each\nwith an orange kicker and a \"Learn more\" link. The restraint here is what makes the hero\nphoto feel earned rather than decorative — the page proves the claim (50+ real restaurant\nbrands) immediately after making it, in the same orange the hero used for emphasis.\n\nA circular, cropped video-still sits beside the solutions list rather than another\nrectangular card, breaking the grid just enough to read as a genuine interruption (a\n\"how it works\" moment) without introducing a new colour or typeface. The whole page runs\non exactly two registers — photographic hero, ruled ledger — and one accent colour moves\nbetween both.\n\nThe copy voice makes the same move from broad to specific as the layout: it opens in \"we\"\nframing for the company's claims, then shifts to direct \"you\" address at the point of\nconversion, mirroring how the page moves from a shared hero photo to a personal CTA (from\ndesignlang extract).", "What to borrow (principle)": "- **Mix roman and italic within one headline sentence and let the italic carry the\n  accent colour.** Emphasis and colour become the same signal instead of two competing\n  ones.\n- **Follow a photographic hero immediately with proof in the same accent colour.** A logo\n  wall or number, coloured to match the hero's one accent, reads as continuation, not a\n  new section.\n- **Use a circular crop to break a rectangular grid once.** One non-rectangular element\n  (a video still, a photo) reads as an intentional pause, not inconsistency, if it's the\n  only one.\n- **Let each partner logo keep its own type and colour in a wall.** It signals real\n  variety of real brands rather than a homogenised \"as seen in\" strip.", "What to leave": "- The sticky orange sign-up card overlapping the hero's bottom-right corner (both\n  captures) crops into the photograph and competes with the primary CTA in the centre —\n  worth demoting to a scroll-triggered or footer placement.\n- Hairline rules under each numbered solution are the same weight as the section's other\n  rules, so the numbered list doesn't visually separate from surrounding content at a\n  glance; a slightly heavier rule or indent would help.\n- The \"Order\" vs \"Request Picnic\" button pair uses the same orange for one filled and one\n  outlined button — close enough in weight that the primary action isn't obviously\n  primary.", "Signature move": "The italic accent word inside a mixed-case serif headline, set in the brand's one orange\ndirectly over the hero photograph — emphasis, colour and voice collapse into a single\ntypographic gesture instead of three separate decisions.", "Motion": "Feel reads as smooth rather than mixed — the most cohesive rhythm of this batch — and the\npage is scroll-linked. Durations run a clean short-to-long ladder, 140/180/300/500ms,\nmostly riding a standard `ease-out` deceleration with a `linear` curve reserved for a\nhandful of transitions; no spring or overshoot curves appear anywhere. The curated keyframe\nlist shows two structural moves repeated across the page: an `enter` opacity fade (a\nper-section reveal on scroll) and an eight-times-repeated `scroll` slide-x transform, almost\ncertainly the auto-scrolling restaurant logo wall described in Why it works. The fuller\nkeyframe set adds bespoke touches beyond that summary: a `pd-font-pulse` scale-up-and-back\non a small chip or badge (desktop and mobile variants), a generic opacity `pulse`, a\n`splat-fade-out` for a decorative graphic, and a `nav-modal-enter`/`nav-modal-exit` pair\nthat wipes the mobile nav in and out via `clip-path` inset from the right edge rather than a\nsimple fade or slide — the circular video-still's play affordance itself carries no\nrecorded keyframe, so its click behaviour stays unconfirmed. (from designlang extract)\n\n| token | value | used for |\n|---|---|---|\n| xs | 140ms | fastest hover/colour transitions |\n| sm | 180ms | transform hovers |\n| md | 300ms | mid-length transitions |\n| lg | 500ms | slower transform moves |\n| ease-out | `ease-out` | most transitions (91 uses) |\n| linear | `linear` | a subset of transitions (27 uses) |", "Brief": "Build an office-food-delivery landing page anchored on one full-bleed, warm overhead\nphotograph of a real food spread. Set the headline in a serif that mixes roman and italic\nwithin one sentence, with the italic word carrying the single brand accent colour (a warm\norange-red) directly over the photo in white/orange type. Below the fold, drop to a plain\ncream ledger: a restaurant-logo wall (each logo keeps its own typeface), then a numbered,\nhairline-ruled list of business solutions with orange kickers and \"Learn more\" links.\nBreak the rectangular grid once with a circular photo or video-still element beside the\nlist. Keep the accent orange consistent between hero italic, kickers and primary buttons;\nintroduce no second accent colour anywhere on the page.", "Image recipe": "Overhead documentary photograph of [SUBJECT] — a shared meal, a checkered picnic spread,\noffice lunch containers — shot from directly above, warm natural or warm artificial light,\nsaturated true-to-life food colour, some motion (hands reaching, chopsticks mid-bite),\ncheckered or textured linen visible at the edges, no studio product-shot lighting.", "Photo search": "Unsplash first, Pexels second.\n- \"overhead picnic spread checkered blanket\"\n- \"office lunch shared meal overhead\"\n- \"pizza box strawberries flatlay warm light\"\n- \"coworkers eating lunch together overhead\"", "Reference lock": "Primary reference/direction: Picnic — full-bleed overhead food-photo hero with a mixed\nroman/italic serif headline, cream ledger of proof below.\nPreserve (3-5 traits): one full-bleed warm overhead food photograph carrying the entire\nhero; headline mixing roman and italic in one sentence, italic word carrying the sole\naccent colour; a real-brand logo wall immediately below the hero as proof; numbered,\nhairline-ruled solution list with orange kickers; exactly one accent colour used\neverywhere (hero italic, kickers, buttons).\nBorrow only (1-2): the circular crop for the video-still/how-it-works element; the pill-\nshaped location/order search bar over the hero photo.\nRole rules: italic serif is reserved for the one emphasis word per headline, never used\nfor body copy; orange never appears twice as both a filled and outlined button without\nclear weight difference; logo wall entries keep native brand typography, never\nnormalised to one face.\nMedia strategy: photo:unsplash — warm, saturated, overhead real-food photography with\nvisible human presence (hands, motion); never a sterile product-only flatlay.\nReject: a second accent colour; centred, static (non-mixed-style) headlines; card\nshadows or rounded rectangles in the ledger section; a logo wall normalised to one\ntypeface.\nToken commitments: bg `#F7F6F2`, accent `#F74C24`, accent-soft `#EA8D71`, ink-warm\n`#6D3E25`, ink-deep `#52170D`, tint `#E5D3CA`; display `P22 Mackinac Pro` (hero serif),\nbody/UI `Inter` / `Inter Display`; headline mixes roman and italic in one line, body and\nlabels stay upright; hairline rules at consistent weight throughout the ledger."}, "has_extract": true}, {"slug": "planhat", "title": "Planhat", "url": "https://www.planhat.com", "captured": "2026-09-04", "family": "darkroom-annual-report", "dna": "Cinematic forest-hero photography x architectural monochrome editorial grid", "register": "cinematic dark", "grammar": "split stage", "lane": "A single dark, golden-lit forest photograph carries the entire hero, then the page snaps to pure white for a compact, architecturally precise editorial grid where hairline borders and negative space do all the separating a shadow would otherwise do", "mode": "persuade", "traits": ["\"one photograph total", "everywhere else flat white\"", "-0.06em tracking at 113px display", "\"strictly monochrome + one taupe", "no marketing chroma\"", "\"4px radius interactive", "8px cards", "hard rule\"", "hairline 1px borders replace all shadow", "10px uppercase eyebrow above every section"], "palette": ["#000000", "#ffffff", "#121211", "#575551", "#958d7e", "#e8552b"], "type": ["Geigy LL Duplex Var", "Inter"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "institutional", "origin": "refero", "extract": "ok", "source_url": "https://www.planhat.com", "has_image": true, "img": "../design-catalogue/entries/planhat/fold.webp", "full": "../design-catalogue/entries/planhat/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. Photography is rationed to exactly one instance: a single full-bleed\ndark forest hero with warm golden light, under a 60%+ black gradient wash for\nlegibility. The source states this explicitly — \"below the fold, there is no\nphotography at all.\" That scarcity is what makes the hero feel cinematic rather\nthan decorative; everything after it is pure white space, hairline borders, and\ntype, so the one photograph a reader sees carries maximum weight.\n\nA custom neo-grotesque variable face with five active stylistic alternates\ncarries every headline at increasingly aggressive negative tracking as size\ngrows — from -0.02em at 24px to -0.06em at 113px — producing a compressed,\narchitectural quality the source calls the brand's defining trait. Inter\nhandles every functional role beneath it, itself lightly negative-tracked\n(-0.01em to -0.02em) to keep density tight without crowding — never looser than\nthat, and the source explicitly forbids anything looser than -0.01em on body\ntext.\n\nThe marketing surface stays strictly monochrome plus one warm taupe accent; a\nsecond colour (Ember Tag orange) exists only inside embedded product-UI\nmockups, never on the marketing chrome itself — a boundary the source enforces\nby name (\"never on CTAs, headings, or background fills\"). Combined with 1px\nhairline borders replacing shadow for every card, table, and logo grid, the\npage reads as a precise, architectural annual report rather than a typical\nSaaS marketing site.", "What to borrow (principle)": "- **Ration photography to a single, deliberate instance.** One cinematic hero\n  photograph, with nothing else photographic below the fold, gives that image\n  outsized emotional weight.\n- **Escalate negative tracking with size, not just leading.** A precise\n  tracking curve (-0.02em to -0.06em) across the type scale is what makes an\n  87px+ headline read as compressed and architectural rather than merely big.\n- **Fence a functional accent colour to the product, never the marketing\n  chrome.** Keeping Ember Tag inside product-UI mockups only means the\n  marketing surface can stay genuinely monochrome without losing a working\n  accent for the product itself.\n- **Use hairline borders as a complete substitute for shadow.** A 1px black\n  rule doing every job a shadow normally does — card edges, table dividers,\n  logo-grid separation — reads as more precise, less \"app-like.\"\n- **Anchor every section with an identical eyebrow pattern.** A 10px uppercase\n  label at fixed tracking, positioned a fixed distance above every heading,\n  turns section openers into a predictable rhythm a reader can scan.", "What to leave": "- A single hero photograph and nothing else photographic is a strict\n  discipline; a content or growth team will be tempted to add photography\n  elsewhere (testimonials, team pages) and needs a firm no to preserve the\n  rarity.\n- The custom variable typeface's five stylistic alternates (cv03, cv04, cv09,\n  cv11, blwf) are explicitly non-negotiable per the source — a generic\n  substitute grotesque will visibly lose the letterform distinction that\n  defines the brand.\n- Confining a functional accent colour strictly to product mockups is a subtle\n  rule that erodes easily; a \"new feature\" badge on the marketing site would be\n  a natural but rule-breaking place to reach for Ember Tag.", "Signature move": "The single-photograph hero-to-white cut: one full-bleed cinematic forest\nphotograph under a black wash carries the entire above-the-fold statement, then\nthe page cuts hard to pure white with zero photography for the remainder of the\nscroll — a stark tonal and material shift used exactly once.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked.\nTransitions run at 300ms and 500ms on a plain `ease` or a custom\n`cubic-bezier(0.44, 0, 0.56, 1)` curve. One keyframe is confirmed firing —\n`ch2-bar-bottom-in-2`, a slide-y combining opacity and transform — its name\n(\"ch2-bar,\" i.e. chart 2, bar) points to an animated bar-chart element rising\ninto place, most likely inside one of the numbered editorial sections rather\nthan the hero itself. (observed in capture) given the \"no drop shadows...\nseparation is achieved through hairline borders and surface color shifts only\"\nelevation philosophy, a button hover most plausibly still shifts between filled\nand outlined treatments (as documented for LOG IN / REQUEST A DEMO) alongside\nthat one confirmed chart animation.\n\n| Token | Value | Easing |\n|---|---|---|\n| md | 300ms | `ease` |\n| lg | 500ms | `cubic-bezier(0.44, 0, 0.56, 1)` |\n| ch2-bar-bottom-in-2 | slide-y (opacity + transform) | chart bar reveal |", "Brief": "Build a B2B SaaS marketing page with an editorial, architectural register. Use\nexactly one photograph: a full-bleed dark forest/nature hero with warm golden\nlight, under a 60%+ black gradient wash, left-aligned white text at roughly 45%\nviewport width. Below the fold, the canvas is pure white `#ffffff` with no\nfurther photography — only hairline 1px black borders, generous negative\nspace, and type. Set every heading 32px and above in a custom neo-grotesque\nvariable face at weight 400, negative tracking escalating from -0.02em at 24px\nto -0.06em at 113px; use Inter for all UI, body and button text at 14-16px with\nlight negative tracking (-0.01em to -0.02em), and 10px uppercase eyebrow labels\nat +0.1em tracking above every section heading. Cap radius at 4px for buttons/\ninputs/images, 8px for cards — never softer. Build the customer-logo section as\na strict hairline-bordered grid table, not cards. Confine the one functional\naccent colour (a warm ember orange) to illustrations of the product UI itself,\nnever to marketing CTAs, headings or fills. Keep sections to 64-80px vertical\ngaps on a 1280px max-width grid.", "Image recipe": "Cinematic environmental photograph of [SUBJECT] — a misty forest or natural\nlandscape with warm golden-hour light filtering through, atmospheric and\nmoody, shot wide with genuine depth, intended to sit beneath a 60%+ black\ngradient wash for text legibility — used once, as the singular photographic\nmoment on the entire page.", "Photo search": "Unsplash first, Pexels second.\n- \"misty forest golden hour light\"\n- \"sunlight through trees atmospheric\"\n- \"moody forest landscape warm tone\"\n- \"golden light woodland cinematic\"", "Reference lock": "Primary reference/direction: Planhat — cinematic single-photograph hero\ncutting to a monochrome architectural editorial grid.\nPreserve (3-5 traits): exactly one photograph on the entire page, a dark\ngolden-lit forest hero under a 60%+ black wash, nothing photographic below the\nfold; custom variable display face with negative tracking escalating from\n-0.02em to -0.06em across the type scale; strictly monochrome-plus-one-taupe\nmarketing surface, with the one functional accent (Ember Tag) confined to\nproduct-UI mockups only; 1px hairline borders as the complete substitute for\nshadow; radius capped at 4px interactive, 8px cards.\nBorrow only (1-2): the 6×2 hairline-bordered logo-grid table pattern; the\n10px uppercase eyebrow label fixed above every section heading.\nRole rules: Ember Tag never appears on marketing CTAs, headings or fills; the\ndisplay face never substitutes for a system grotesque; body text never loosens\npast -0.01em tracking.\nMedia strategy: photo:unsplash for the single cinematic hero photograph only;\neverything else is flat illustration/mockup or pure typography — no further\nphotography anywhere on the page.\nReject: a second photograph anywhere below the fold; drop shadows on any card\nor panel; radius above 8px on content containers; centred body paragraphs;\nEmber Tag on marketing chrome.\nToken commitments: bg `#ffffff`, card `#f5f5f3`, mockup-surface `#f0eeea`,\nink `#000000`, ink-soft `#121211`, muted `#575551`, warm `#958d7e`, product-\naccent `#e8552b`; display -0.02em to -0.06em tracking at 24-113px/leading\n1.0-1.4; body Inter 400-500 at 10-16px; radius 4px buttons/inputs/images, 8px\ncards; page max-width 1280px, section gap 64-80px."}, "has_extract": true}, {"slug": "raus", "title": "Raus", "url": "https://www.raus.life/", "captured": "2026-09-04", "family": "whispered-cabin-journal", "dna": "Weight-300 whisper-tight sans headlines x a single marigold booking bar", "register": "warm photographic", "grammar": "chaptered editorial", "lane": "A cream-paper canvas holds asymmetric photo pairs and weight-300 headlines with almost no visible chrome, punctuated once by a marigold search bar floating across the hero's bottom edge as the page's only loud gesture", "mode": "persuade", "traits": ["\"weight 300 everywhere", "negative tracking at scale\"", "\"cream canvas", "zero shadow\"", "\"one marigold accent", "one use per screen\"", "\"20-40px radius", "no sharp corners\"", "asymmetric 2-column photo pairs", "pine green reserved for wordmark and links only"], "palette": ["#f7f0e1", "#23212c", "#006434", "#fcbd1c", "#a6dfff", "#dd5000"], "type": ["neue-haas-unica"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "hospitality", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://www.raus.life/", "has_image": true, "img": "../design-catalogue/entries/raus/fold.webp", "full": "../design-catalogue/entries/raus/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. A single typeface carries the entire page at weight 300 for nearly\neverything, with weight 400 reserved only for meta labels and body copy where\n300 \"would feel too fragile\" — the source's own language for why the whisper\nweight needs an escape hatch at small, information-dense sizes. Negative\ntracking tightens consistently from -0.02em at display down to -0.005em at\ncaption, which is what keeps the airy weight from reading as merely thin.\n\nColour discipline is exact: Pine green `#006434` is confined to the wordmark,\nhero headings and inline links — never a button fill, badge or decorative\nshape — while marigold `#fcbd1c` is confined to the search bar, accent blocks\nand tag fills, never text. Those two rules, stated as absolutes in the source,\nare what let a single bright marigold search bar function as the entire page's\nloud moment: everything else, including the CTA button, stays charcoal-on-\ncream.\n\nGeometry reinforces the same restraint through generosity rather than\nsharpness: every radius is generous (20px default, 40px for hero cards, 99px\nfor pills) and shadows are banned outright — depth comes only from layering\ncream tones and radius, never elevation. Combined with an asymmetric,\nnever-centred hero image pair (one image roughly 60% width, one 40%), the page\nreads as a hand-printed travel journal that happens to have a booking widget\nrather than a travel-tech product.", "What to borrow (principle)": "- **Give a whisper-weight system an escape hatch at small sizes.** Reserving a\n  slightly heavier weight for meta labels and dense body text keeps 300-weight\n  from becoming illegible where it matters most.\n- **Split brand colour into \"identity\" and \"action\" roles that never overlap.**\n  One colour for wordmark/links, a completely different one for the single\n  interactive surface — never mixed — makes each colour instantly legible for\n  its job.\n- **Ban sharp corners entirely, not just on buttons.** A minimum-20px radius\n  policy across cards, buttons and pills creates a uniform softness that a\n  mixed radius scale can't achieve.\n- **Let one saturated surface carry the entire page's energy.** A single\n  marigold search bar against an otherwise charcoal-on-cream page does more\n  visual work than a full accent palette would.\n- **Compose the hero as an uneven photo pair, never a symmetric split.** A\n  60/40 image ratio reads as considered editorial composition rather than a\n  generic two-up template.", "What to leave": "- Zero shadow anywhere means every card boundary depends entirely on subtle\n  cream-tone layering; on a low-contrast display this system risks reading as\n  flat and undifferentiated.\n- Weight 300 as the default text weight across headlines through captions is a\n  narrow font requirement — a substitute typeface without a genuine light cut\n  will make the whole system feel broken rather than airy.\n- The hard \"green never fills, marigold never speaks\" rule is easy to violate\n  under marketing pressure (a green promotional badge, a marigold headline) and\n  needs active enforcement to hold.", "Signature move": "The marigold search bar: a 40px-radius pill spanning nearly the full hero\nwidth, floating across the bottom edge of the asymmetric photo pair — the\nbooking widget doubles as the hero's single chromatic event rather than being\na separate utility bolted beneath it.", "Motion": "(from designlang extract) Feel reads as springy, and the page is scroll-linked —\na real surprise against the \"restraint as a design value\" reading: alongside a\nplain `ease` and a standard `cubic-bezier(0.4, 0, 0.2, 1)`, the extract confirms\na genuine spring/overshoot curve, `cubic-bezier(0.665, 0.425, 0.44, 1.105)`, in\nuse across five duration steps from 100ms to 1s. So the restraint is visual,\nnot kinetic — interactive elements likely settle with a small bounce rather\nthan a flat linear stop. Worth noting: the extract's own #fcbd1c usage count is\nexactly 1 across the whole page, a literal confirmation of the \"marigold, one\nuse per screen\" rule stated in the frontmatter traits. (observed in capture)\nthe live capture confirms a static composition matching the layout closely (same\nmarigold search bar, same asymmetric photo pair, same announcement bar); given\nthe zero-shadow register, hover states most plausibly still shift the pill link\nbutton's fill from transparent to charcoal, now most likely with that spring\nsettle rather than a flat cut.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 100ms | `ease` |\n| sm | 200ms | `ease` |\n| md | 300ms | `cubic-bezier(0.4, 0, 0.2, 1)` |\n| lg | 500ms | spring |\n| xl | 1s | spring |\n| spring/overshoot | — | `cubic-bezier(0.665, 0.425, 0.44, 1.105)` |", "Brief": "Build a warm, editorial cabin-booking landing page. Canvas is cream paper\n`#f7f0e1`; charcoal `#23212c` carries all body text and hairline borders —\nnever pure black. Pine green `#006434` is reserved strictly for the wordmark,\nhero headings and inline links; marigold `#fcbd1c` is reserved strictly for the\nsearch bar and accent-block surfaces — neither colour crosses into the other's\nrole. Set every heading and most body copy in one typeface at weight 300, with\nweight 400 only for meta labels and captions; tighten tracking from -0.02em at\n40px display down to -0.005em at 12px caption. Round every interactive element\ngenerously: 20px for cards/buttons, 40px for hero cards, 99px for pills — never\nbelow 12px anywhere. Compose the hero as an asymmetric 2-column image pair\n(roughly 60/40 width split) with a marigold 40px-radius search pill floating\nacross the bottom. Ban shadows entirely; depth comes only from cream-on-cream\nlayering and radius. Caption every photo section with a small uppercase meta\ntag before any descriptive copy, and keep the footer on the same cream canvas\nwith no dark inversion.", "Image recipe": "Editorial lifestyle photograph of [SUBJECT] — a cabin or nature retreat in soft\nnatural daylight, warm greens and muted earth tones, generously sized and\nun-cropped within its rounded frame, shot as a documentary travel-journal\nimage rather than a styled real-estate listing, no heavy retouching or\nsaturation boost.", "Photo search": "Unsplash first, Pexels second.\n- \"cabin in forest natural light exterior\"\n- \"cozy cabin interior warm light\"\n- \"nature retreat meadow morning light\"\n- \"person reading terrace outdoor cabin\"", "Reference lock": "Primary reference/direction: Raus — whisper-weight editorial cabin-booking\njournal, one marigold booking bar as the page's sole loud gesture.\nPreserve (3-5 traits): cream paper `#f7f0e1` canvas with charcoal `#23212c`\nink, never pure black or white; weight 300 default across nearly every text\nrole, weight 400 reserved for meta/caption only; Pine green confined to\nwordmark/headings/links, marigold confined to the search bar and accent\nsurfaces, never crossing roles; minimum 20px radius on every element, zero\nshadow anywhere; asymmetric (never symmetric) hero photo composition.\nBorrow only (1-2): the marigold search-bar-as-hero-CTA device; the small\nuppercase \"IDEA ##\" category label preceding editorial captions.\nRole rules: marigold never sets text; pine green never fills a button or\nbadge; body copy never centres; no radius below 12px on any clickable element.\nMedia strategy: photo:unsplash — warm, documentary nature/cabin lifestyle\nphotography only; no staged real-estate photography, no 3D renders.\nReject: drop shadows or elevation; sharp corners (0-8px); a second bright\naccent colour; a centred hero stack; Pine green as a CTA fill.\nToken commitments: bg `#f7f0e1`, ink `#23212c`, ink-white `#ffffff`, brand-green\n`#006434`, accent `#fcbd1c`, sky `#a6dfff`, ember `#dd5000`; type weight 300\ndefault/400 at meta sizes; display 40px/leading 0.95/-0.02em tracking down to\ncaption 12px/leading 1.18/-0.005em; radius 20px default, 40px hero cards, 99px\npills; page max-width 1280px, section gap 80-120px."}, "has_extract": true}, {"slug": "redbrick-coffee", "title": "Redbrick Coffee", "url": "https://redbrick.coffee/", "captured": "2026-09-04", "family": "scarlet-broadsheet-storefront", "dna": "Weight-300 didone display serif x a single scarlet ink thread running through every UI element", "register": "editorial print", "grammar": "chaptered editorial", "lane": "A cream broadsheet page runs scarlet ink through every interactive surface — logo, nav, labels, borders, arrows — while a weight-300 serif at up to 150px commands alternating 50/50 image-and-text splits like a print magazine, never a filled button in sight", "mode": "persuade", "traits": ["\"one red for every interactive element", "no second accent\"", "\"100-150px weight-300 serif", "~1.0 leading\"", "\"outlined links only", "zero filled buttons\"", "\"25px card/image radius", "50px pills", "3.75px links\"", "alternating 50/50 image-text splits", "10px tracked-out running-head labels"], "palette": ["#e82c2a", "#212529", "#ffffff", "#f2f2f2", "#121212"], "type": ["Editorial Old", "Surt", "GTStandard-M"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "consumer-brand", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://redbrick.coffee/", "has_image": true, "img": "../design-catalogue/entries/redbrick-coffee/fold.webp", "full": "../design-catalogue/entries/redbrick-coffee/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. Brick red `#e82c2a` is treated as a single chromatic thread running\nthrough every interactive and label element on the page — logo, nav links,\nsection labels, hairline rules, arrow links, the announcement bar — while body\nparagraphs stay in press black and the canvas stays cream white. Because red\nnever appears as a filled surface (there is explicitly no filled-button style\nin this system), the colour reads as ink rather than UI chrome, reinforcing the\n\"printed broadsheet\" register the source names directly.\n\nType performs a two-voice split calibrated for extremes: Editorial Old at\nweight 300 only, 100-150px, near-1.0 leading, is reserved exclusively for\ndisplay headlines — \"never bold, never weight 400+\" per the source — while\nSurt carries every functional role at consistently positive, size-scaling\ntracking (0.013em at 15px up to 0.06em at 10px labels), giving even the\nsmallest running-head text a typeset, slightly old-style character that\nmatches the serif's editorial mood instead of reading as generic UI.\n\nThe layout commits fully to a magazine rhythm: alternating 50/50 image-and-\ntext splits, each section opened by a tiny tracked-out red running head and\nclosed by a right-aligned arrow link, exactly mimicking a print magazine's\nsection markers. Elevation is banned outright — the 25px card radius and one\ntonal step (white canvas to `#f2f2f2` card) do all the separation work a\nshadow normally would, keeping the page reading as flat printed pages rather\nthan a stack of floating panels.", "What to borrow (principle)": "- **Run one accent colour through every UI role simultaneously.** Using the\n  same red for logo, nav, labels, borders and links — never diluted, never\n  supplemented — makes a single hue carry an entire brand's interactivity.\n- **Ban filled buttons entirely in favour of outlined ink.** A system with no\n  filled-button style at all reads as editorial (ink on paper) rather than\n  app-like (surfaces and elevation).\n- **Reserve the display serif for one weight and one job only.** Locking\n  Editorial Old to weight 300, display-only, prevents the \"anti-convention\"\n  thin-weight statement from ever being diluted by a bolder variant.\n- **Give tracking a consistent scaling formula, not a flat value.** Surt's\n  0.013em-to-0.06em curve across sizes gives every text role its own tuned\n  legibility rather than one generic letter-spacing value.\n- **Structure every section with a running-head-plus-arrow-link pair.** A tiny\n  tracked label at the top and a right-aligned arrow link at the same visual\n  weight bookend each section like a magazine spread, giving scannable\n  wayfinding without any nav chrome.", "What to leave": "- Zero filled buttons anywhere is a strict commercial constraint — a checkout\n  or high-urgency conversion flow may need at least one filled, unmissable\n  action that this system doesn't provide a pattern for.\n- Weight 300 at up to 150px depends on a genuinely well-drawn light cut of the\n  display serif; a lower-quality substitute will read as broken rather than\n  intentionally thin at that scale.\n- A single-colour-only rule (no second accent permitted) is fragile once a\n  product line grows — seasonal or limited-edition products will have no\n  built-in way to differentiate without either breaking the rule or relying\n  entirely on packaging photography to carry that signal.", "Signature move": "The magazine running head: a tiny 10px uppercase red label with 0.06em\ntracking sitting above a 1px red hairline rule, paired with a right-aligned\narrow link (\"Shop blends →\") at the same visual weight — a section-opener\ndevice borrowed directly from print magazine page furniture.", "Motion": "(from designlang extract) Feel reads as smooth, and the page is scroll-linked.\nThe system is genuinely minimal in practice, not just by omission: only two\ndurations are confirmed (100ms and 500ms), both riding a plain `ease` curve (8\nuses), and no keyframe animations are confirmed firing anywhere. That matches\nthe component notes precisely — primary nav links have \"no color shift\" on\nhover, \"the only state change is opacity.\" (observed in capture) the live\ncapture confirms a static composition matching the layout and colour system\nclosely; given the flat, shadow-free elevation philosophy and the extract's own\nminimal timing set, any further interaction state most plausibly relies on\nopacity or border-weight shifts on that same 100-500ms range rather than colour\nchange or a keyframed reveal.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 100ms | `ease` |\n| lg | 500ms | `ease` |", "Brief": "Build an editorial coffee-storefront landing page. Canvas is cream white\n`#ffffff`; press black `#212529` carries body paragraphs; brick red `#e82c2a`\nis the single accent, running through the logo, every nav link, section\nlabels, hairline rules and arrow links — never as a filled button background,\nnever diluted with a second hue. Open with a full-bleed red announcement bar\nabove a white nav strip, then a 50/50 hero split: a weight-300 Editorial Old\nheadline at 100-150px, ~1.0 leading, in red on the text side, paired with a\n25px-radius lifestyle photograph on the other. Alternate 50/50 image-and-text\nsplits down the page, each opened by a 10px uppercase red running-head label\nabove a hairline rule and closed by a right-aligned arrow link at the same\nsize. Product cards sit on `#f2f2f2` surfaces at 25px radius with no shadow;\nevery interactive element is either a 1px outlined red pill (50px radius for\nbuttons/inputs, 3.75px for inline links) or plain red text — never a solid\nfill. Keep Surt's positive tracking scaling with size throughout, and close on\na dark `#121212` footer panel.", "Image recipe": "Warm overhead or waist-level lifestyle photograph of [SUBJECT] — coffee,\npastries or brewing equipment styled on a wooden table with books or magazines\nin frame, natural warm light, tightly cropped to feel like a magazine spread\nrather than a product catalog shot, no white-cyc studio background, no posed\nmodel shots.", "Photo search": "Unsplash first, Pexels second.\n- \"coffee wooden table overhead warm light\"\n- \"espresso cup croissant cafe table\"\n- \"coffee brewing equipment lifestyle\"\n- \"open book coffee cup warm tone\"", "Reference lock": "Primary reference/direction: Redbrick Coffee — scarlet-ink editorial coffee\nstorefront, weight-300 display serif, zero filled buttons.\nPreserve (3-5 traits): cream white canvas with press black body text; brick\nred `#e82c2a` as the sole accent across logo, nav, labels, borders and links,\nnever a second hue; Editorial Old locked to weight 300, display-only, never\nbolder; zero filled buttons anywhere — every action is outlined red or plain\nred text; alternating 50/50 image-and-text section splits, each with a\nrunning-head label and arrow-link pair.\nBorrow only (1-2): the magazine running-head-plus-arrow-link section-opener\npattern; the 10px GTStandard-M micro-label treatment for the announcement bar.\nRole rules: red never fills a large surface or a button background outside\nthe announcement bar; the display serif never sets body copy or drops below\n100px; body text is never centred in a narrow column.\nMedia strategy: photo:unsplash — warm overhead lifestyle photography with\nwooden surfaces, books and hands; no studio white-cyc product shots.\nReject: any filled (solid-background) button; bold or heavier weight on\nEditorial Old; a second accent colour; drop shadows on cards or images;\ncentred display headlines in narrow columns.\nToken commitments: bg `#ffffff`, card `#f2f2f2`, dark `#121212`, ink `#212529`,\naccent `#e82c2a`; display Editorial Old 300 at 100-150px/leading 0.99-1.2;\nbody Surt 400 at 15-35px with 0.013-0.04em tracking; label 10px/0.06em\ntracking; radius 25px cards/images, 50px pills, 3.75px inline links; section\ngap 50px, card padding 30px."}, "has_extract": true}, {"slug": "ripe", "title": "RIPE", "url": "https://www.get-ripe.com/", "captured": "2026-09-04", "family": "sky-leadership-poster", "dna": "Sky/bird photography x bold poster typography leadership brand", "register": "modern clean", "grammar": "none", "lane": "A pale blue sky photograph carries a huge condensed poster headline behind two pill CTAs, then a cream section pairs bold statement copy with prose, closing on a horizontal row of product thumbnail cards", "mode": "persuade", "traits": ["sky/bird photograph hero", "huge condensed bold poster headline", "dual pill CTA (individuals/companies)", "announcement banner above nav", "cream secondary ground", "bold statement + prose pairing", "horizontal thumbnail card row", "playful merch-style product photography"], "palette": ["#7FADD6", "#EDE6C9", "#14140F", "#D9C7EC", "#B7CBAE", "#F5F0B8"], "type": ["SeriouslyNostalgic Condensed", "Inter"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "playful", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://www.get-ripe.com/", "has_image": true, "img": "../design-catalogue/entries/ripe/fold.webp", "full": "../design-catalogue/entries/ripe/shot.webp", "sections": {"Why it works": "The headline claim — \"LEADERSHIP IS A LIFESTYLE.\" — is set in a huge, heavy\ncondensed sans directly over a pale blue sky photograph dotted with small\nbirds. It's an unusual pairing for a leadership/coaching brand: most competitors\nin this space reach for boardrooms or handshakes, while this page reaches for\nopen sky, which reframes \"leadership\" as expansive and personal rather than\ncorporate.\n\nTwo pill CTAs sit side by side under the headline — \"For Individuals\" in cream,\n\"For Companies\" in sage — splitting the audience at the very first decision\npoint rather than making the visitor guess which path applies to them. An\nannouncement banner above the nav (\"GYMR is here...\") adds urgency for existing\nfollowers without competing with the primary headline.\n\nBelow the fold, the brand's actual product range — merch, memberships, a\nphysical calendar/journal — is shown as a horizontal row of styled photography\n(a man holding a \"GET YOUR MIND RIPE\" poster, a spiral-bound calendar, workshop\nphotography), which grounds the aspirational sky-and-birds opening in tangible,\npurchasable things by the second screen.", "What to borrow (principle)": "- **Split the audience into two named CTAs at the first decision point**\n  (\"For Individuals\" / \"For Companies\") rather than a single generic button.\n- **Use an unexpected photographic register for the category** (sky and birds\n  for a leadership brand, not a boardroom) to stand out from category default\n  imagery.\n- **Run an announcement banner above the main nav** for time-sensitive news\n  without disturbing the hero's own message.\n- **Ground an aspirational hero in tangible product photography** within the\n  first scroll or two, so the brand isn't all mood and no substance.", "What to leave": "- A condensed poster headline this heavy, set directly on a busy sky photograph,\n  risks legibility issues at smaller sizes or on lower-contrast crops of the\n  same photo.\n- Mixing merch photography, testimonial-style portraits and product shots in one\n  horizontal row (as the page does below the fold) can read as cluttered without\n  a consistent photographic treatment across the row.", "Signature move": "The sky-and-birds hero: a plain, almost abstract photograph of clouds and small\ndistant birds, carrying nothing but a huge poster headline and two pill CTAs —\nno product, no portrait, no dashboard. For a personal-development brand, empty\nsky reads as aspiration rather than emptiness.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed,\nthough the captured CSS is thin: a single `400ms` duration token drives\nopacity and transform transitions, plus a generic `background, box-shadow`\nhover rule and a loading-spinner keyframe. No parallax or marquee keyframe was\ncaptured for the sky/bird hero or the announcement banner, so that read stays\ninferred from the image rather than confirmed — consistent with a page whose\nricher motion, if any, is likely handled outside the static stylesheet.\n\n| token | value | role |\n|---|---|---|\n| `md` | 400ms | opacity/transform transitions |", "Brief": "Build a playful, aspirational leadership-brand page. Open on a plain sky or\nopen-air photograph — no people, no product — with a huge condensed bold\nheadline set directly over it and two pill CTAs splitting the audience\n(individual / organization) side by side. Run a slim announcement banner above\nthe nav for current news. Below the fold, shift to a cream ground pairing a\nbold short statement against a longer prose paragraph, then show the actual\nproduct range (merch, physical goods, workshop photography) as a horizontal\nrow of styled photography to ground the opening mood in real substance.", "Image recipe": "An open sky of [SUBJECT] — pale blue, soft clouds, a few small birds in flight,\nshot wide with no horizon or landmark visible, bright and slightly\noverexposed, no colour grading beyond natural daylight.", "Photo search": "Unsplash first, Pexels second.\n- \"open sky clouds birds flying minimal\"\n- \"pale blue sky birds distant\"\n- \"clear sky daylight negative space\"", "Reference lock": "Primary reference/direction: RIPE — sky-and-birds hero with a huge poster headline, dual audience-split CTAs, product photography grounding the aspiration below the fold.\nPreserve (3-5 traits): plain open-sky photography (no people, no product) as the sole hero image; huge condensed bold headline set directly over the photo; two pill CTAs splitting the audience at the first decision point; an announcement banner above the main nav for time-sensitive news.\nBorrow only (1-2): the horizontal row of styled product/merch photography below the fold; the bold-statement-plus-prose pairing on cream.\nRole rules: hero photography stays empty of people/product — that's reserved for the product row below the fold; only two CTA pills per hero, each naming its audience explicitly; announcement banner never duplicates the hero's own headline claim.\nMedia strategy: photo:unsplash — plain, minimal sky/nature photography for the hero; styled, warm product/lifestyle photography for the proof row beneath.\nReject: a boardroom or handshake photograph in place of the sky hero; a single generic CTA with no audience split; overcrowding the product row with more than 4-5 mixed-treatment images.\nToken commitments: sky `#7FADD6`, cream `#EDE6C9`, ink `#14140F`, lilac-pill `#D9C7EC`, sage-pill `#B7CBAE`, banner-yellow `#F5F0B8`; condensed bold display sans for headlines, plain sans for body and UI."}, "has_extract": true}, {"slug": "rogo", "title": "Rogo", "url": "https://rogo.com", "captured": "2026-09-04", "family": "dusk-skyline-fintech", "dna": "Wall Street dusk cinematography x white-paper product proof", "register": "cinematic dark", "grammar": "filmic one-shot", "lane": "A single cinematic dusk photograph of the Manhattan skyline carries a serif claim and a bank-logo wall of trust, then the page drops to a plain white section of paired screenshot tiles and short serif/sans claims", "mode": "persuade", "traits": ["full-bleed dusk skyline photograph", "serif headline over photo", "white pill CTA", "financial-institution logo wall", "top announcement bar with case-study link", "plain white product section", "paired screenshot-and-claim rows", "conservative serif for stat sentences"], "palette": ["#F7F7F7", "#151515", "#000000", "#737373", "#EEEDEC"], "type": ["ABC Arizona Mix Regular", "Inter"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "product-focused", "category2": "institutional", "origin": "raw-url", "extract": "ok", "source_url": "https://rogo.ai", "has_image": true, "img": "../design-catalogue/entries/rogo/fold.webp", "full": "../design-catalogue/entries/rogo/shot.webp", "sections": {"Why it works": "The hero borrows the authority register of finance itself rather than SaaS convention: a\nsingle cinematic photograph of Manhattan at dusk (Empire State Building lit, a flag in the\nforeground, water in the frame) carries a serif headline (\"The AI Platform for Finance\")\nin white, with no gradient beyond what's needed for legibility. Directly under it, a\nrow of real, recognisable investment-bank and advisory logos in their native typography\nsits on the same dark photograph rather than a separate white strip — proof and pitch\nshare one frame, the same device the equity-fund and picnic entries in this set use with\nphotographs and logo walls.\n\nThe moment the page leaves the hero, it changes almost every register at once: dark to\nwhite, cinematic to plain, wide serif claim to a two-column layout pairing a short serif\nsentence with an actual product screenshot (deal tables, data-room integrations). Nothing\nis illustrated or abstracted — every claim is followed immediately by a real interface\ntile showing the claim in action, which is a more literal, harder-to-fake form of proof\nthan an icon or an illustration would be.\n\nA single bold clause inside an otherwise grey sentence (\"Rogo changes that.\") functions\nas this page's version of the italic-accent-word device seen elsewhere in this set —\nexcept here the emphasis tool is weight, not style, keeping the serif consistent while\nstill marking exactly which words the sentence turns on.", "What to borrow (principle)": "- **Put a client-logo wall on the same photographic frame as the hero claim**, not in a\n  separate strip — proof arrives in the same breath as the pitch.\n- **Follow every marketing claim immediately with an unedited product screenshot**, not an\n  illustration or icon — for a credibility-sensitive audience, the real interface is the\n  more convincing artifact.\n- **Mark emphasis with weight inside one consistent typeface**, rather than switching\n  fonts or styles, when the surrounding register (finance, serif, restraint) doesn't\n  suit a decorative italic.\n- **Change every register at once at the hero boundary** — colour, photography, and\n  layout together — so the transition itself signals \"now the proof begins.\"", "What to leave": "- The top announcement bar (case-study link) and the cookie-settings panel both compete\n  for attention with the primary CTA on first paint in this capture — worth sequencing so\n  only one persistent overlay is visible at once.\n- Font measurement could not complete live for this entry (the page never reached network\n  idle within budget, twice); typeface identification here is read off the image only.\n- The screenshot tiles are cropped tightly enough that supporting UI chrome (window\n  frames, full context) is lost — convincing as texture, but a viewer can't actually parse\n  the interface from the tile alone.", "Signature move": "The logo wall on the photograph: trust marks (bank and advisory-firm names) sit directly\non the dusk skyline image rather than in a separate white proof strip, so the claim\n(\"trusted by leading financial institutions\") and its evidence occupy the same frame\ninstead of a claim-then-scroll-for-proof sequence.", "Motion": "Motion reads as mixed and notably restrained: the extract confirms only one named\nduration and one custom easing curve, both applied narrowly to colour transitions —\nthere is no fade, slide or scale keyframe in use anywhere. Scroll-linked: yes, though the\nmechanism behind that (likely inline/JS-driven reveal rather than CSS `@keyframes`) isn't\ndirectly visible in the extract, so the still-frame reading of a per-section fade-in\nremains unconfirmed rather than disproven. The one easing curve in use,\n`cubic-bezier(0.44, 0, 0.56, 1)`, is a steep, symmetric ease — slow at both ends, fast\nthrough the middle — with no spring or overshoot. Two keyframes exist in the CSS bundle\n(`react-loading-skeleton`, a shimmer sweep; `__framer-loading-spin`, a 360deg rotation)\nbut neither appears in the \"in use\" set — both read as loading-state UI, not page motion\n(from designlang extract).\n\n| Duration | Easing | Applies to |\n|---|---|---|\n| 300ms (`md`) | `cubic-bezier(0.44, 0, 0.56, 1)` (13 uses) | colour |", "Brief": "Build a finance-sector AI product page opening on one full-bleed cinematic dusk cityscape\nphotograph, with a serif headline in white and a single white pill CTA. Place a row of\nreal client/partner logos directly on the same photograph, beneath the headline, rather\nthan in a separate proof section. Immediately below the fold, switch completely to a\nplain white ground: pair every short serif claim sentence with an unedited, real product\nscreenshot beside it, alternating the image side left-right down the page. Use bold\nweight, not italics or a second typeface, to mark the one clause per sentence that\nmatters most. Keep a persistent top announcement bar for one timely case-study link, but\navoid stacking it with other overlays (cookie banners, chat widgets) on first paint.", "Image recipe": "Cinematic dusk or blue-hour cityscape photograph of [SUBJECT] — a financial-district\nskyline, a harbour with an iconic building lit against the sky — shot with warm sky tones\nfading to a cool dark foreground, a recognisable landmark silhouette, some foreground\ntexture (water, a flag, a railing) for depth, composed with a clear open band across the\nmiddle third for headline type and a logo row beneath it.", "Photo search": "Unsplash first, Pexels second.\n- \"Manhattan skyline dusk skyline blue hour\"\n- \"financial district cityscape evening\"\n- \"New York harbor dusk skyline\"\n- \"city skyline golden hour water reflection\"", "Reference lock": "Primary reference/direction: Rogo — cinematic dusk-skyline fintech hero with an on-photo\nlogo wall, plain white claim-plus-screenshot proof section.\nPreserve (3-5 traits): one full-bleed cinematic dusk cityscape photograph carrying the\nhero claim in white serif type; a real client/partner logo wall placed on the same\nphotograph, not a separate strip; a hard register change (dark/photographic to\nwhite/plain) at the fold; every marketing claim paired immediately with an unedited\nproduct screenshot, alternating sides down the page; emphasis marked by bold weight\nwithin one consistent serif, never a second typeface or italic.\nBorrow only (1-2): the persistent top announcement bar for a single timely link; the\nwhite pill CTA style against the dark hero.\nRole rules: the hero photograph never carries more than headline, CTA and logo row —\nno additional copy blocks; every claim below the fold requires a real screenshot beside\nit, not an illustration; only one attention-competing overlay (announcement bar, cookie\npanel, chat) is visible on first paint at a time.\nMedia strategy: photo:unsplash — cinematic dusk/blue-hour cityscape photography, warm\nsky against cool dark foreground; never a daytime or flatly lit skyline.\nReject: illustrations or icons standing in for real product screenshots; a separate\n\"trusted by\" strip disconnected from the hero photograph; italics or a second display\nface for emphasis; multiple simultaneous overlay panels on load.\nToken commitments: bg `#F7F7F7`, ink `#151515`, ink-soft `#302F2F`, warm-grey `#776D69`,\nstone `#BBB8B6`; serif for headlines and stat sentences, sans for UI labels and body;\nemphasis via bold weight only within the serif, never italic or a second face."}, "has_extract": true}, {"slug": "rre-ventures", "title": "RRE Ventures", "url": "https://rre.com/", "captured": "2026-09-04", "family": "satellite-abstraction-fund", "dna": "Satellite ocean photography x boutique-fund credibility panel", "register": "cinematic dark", "grammar": "split stage", "lane": "Abstract satellite ocean photography runs continuously behind the page, interrupted by alternating pale-blue credibility panels carrying stats, thesis and testimonials", "mode": "persuade", "traits": ["full-bleed abstract satellite/ocean photography as continuous ground", "alternating dark-photo/light-panel bands", "small geometric logomark", "plain stat trio", "sector tag grid", "quoted testimonial close", "minimal caps labels"], "palette": ["#0B2540", "#1C5F6B", "#C9A15C", "#D7E6EF", "#FFFFFF"], "type": ["RRE Monument Grotesk"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "institutional", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://rre.com/", "has_image": true, "img": "../design-catalogue/entries/rre-ventures/fold.webp", "full": "../design-catalogue/entries/rre-ventures/shot.webp", "sections": {"Why it works": "A single abstract satellite photograph — swirling ocean currents in navy, teal\nand sand — runs continuously as the page's visual ground, with content panels\nlaid on top of it rather than replacing it. Because the image is abstract\n(no recognisable landmark, no people, no product), it can carry a VC firm's\nentire visual identity without ever competing for meaning against the text on\ntop of it — it's mood without message, which is exactly what a fund's\nbackground needs to be.\n\nThe page alternates between full-photo bands and pale-blue opaque panels: hero\nclaim on photo, then a stats panel on solid pale blue, then investment-area tags\nback on photo, then a \"our difference\" panel on pale blue again, closing with a\ntestimonial quote back on the photograph. The rhythm of exposure-then-cover,\nexposure-then-cover, keeps the page visually alive without needing any\nadditional imagery — one photograph, reused as a through-line, does the work of\nseveral.\n\nContent itself stays plain and confident: three round numbers (`$2.5B+ AUM`,\n`125+ Exits`, `400+ Companies`), a sector tag grid (AI, Crypto, Fintech,\nConsumer...) and one closing founder quote. Nothing is illustrated or iconified —\nthe restraint is the credibility signal for a firm this established.", "What to borrow (principle)": "- **Use one abstract, non-literal photograph as a continuous through-line**,\n  alternating between full exposure and being covered by opaque content panels,\n  rather than sourcing a new image per section.\n- **Alternate photo bands and solid-colour panels rhythmically** to keep a long\n  page visually alive with a single image asset.\n- **State fund/firm metrics as three bare round numbers**, no icons, no charts —\n  for an established institutional audience, plainness reads as confidence.\n- **Close on one real, attributed testimonial quote** rather than a logo wall,\n  when relationship depth (not volume) is the actual sales pitch.", "What to leave": "- Relying on a single background photograph for the entire page means any\n  section that needs to add new visual information (a portfolio grid, a team\n  photo) will need to break the pattern eventually — the system needs a defined\n  exit point.\n- Pale-blue opaque panels directly against a dark, saturated photograph can\n  create a harsh edge at the panel boundary if not softened with a gradient or\n  consistent margin.", "Signature move": "The single continuous background: one abstract satellite/ocean photograph runs\nthe full length of the page, alternately exposed behind photo-band content and\ncovered by opaque pale-blue panels — one image asset doing the visual work of\nan entire long-scroll page.", "Motion": "(from designlang extract) Feel is \"responsive\" with scroll-linked motion\nconfirmed. Transitions sit on a quick `200–300ms` pair, riding a single\nease-out curve (`cubic-bezier(0.25,1,0.5,1)`, 12 uses) for hover/colour state\nchanges — filter, height, background and opacity moves on links and panel\nedges. No parallax or fixed-background keyframe was captured for the\nsatellite photograph itself, so the \"photo drifts behind the panels\" read\nstays inferred from the image, not confirmed by the extract.\n\n| token | value | role |\n|---|---|---|\n| `sm` | 200ms | link/filter/height transitions |\n| `md` | 300ms | panel/background transitions |\n| ease-out | `cubic-bezier(0.25,1,0.5,1)` | only family found (12 uses) |", "Brief": "Build an institutional, credibility-first fund or firm page. Choose one\nabstract, non-literal photograph (satellite imagery, aerial water, geological\ntexture) in a limited navy/teal/sand palette, and run it continuously behind\nthe entire page. Alternate full-photo content bands (hero claim, sector tags,\nclosing quote) with opaque pale-blue panels (stats, thesis, differentiators) so\nthe single image is rhythmically exposed and covered rather than replaced.\nState metrics as bare round numbers with no icons or charts. Close on one\nattributed testimonial quote rather than a logo wall. Keep type to a single\nplain grotesk sans throughout, small tracked caps for section labels.", "Image recipe": "Abstract satellite or aerial photography of [SUBJECT] — ocean currents,\ncoastline, or geological terrain — shot from directly above, saturated navy,\nteal and warm sand tones, no recognisable landmark or scale reference, texture\nand colour carrying the entire image.", "Photo search": "Unsplash first, Pexels second.\n- \"satellite ocean current abstract aerial\"\n- \"aerial coastline texture navy teal\"\n- \"earth from above abstract water\"", "Reference lock": "Primary reference/direction: RRE Ventures — one continuous abstract satellite photograph alternately exposed and covered by pale-blue credibility panels.\nPreserve (3-5 traits): a single abstract, non-literal photograph used continuously as the page's visual ground; alternating rhythm of full-photo bands and opaque pale-blue content panels; metrics stated as bare round numbers with no icons or charts; one attributed testimonial quote as the closing device, not a logo wall.\nBorrow only (1-2): the sector/investment-area tag grid; the small geometric logomark.\nRole rules: only one background photograph per page, no substitutions mid-scroll; opaque panels always pale blue, never a second photo or gradient; stat trio capped at three numbers, never more.\nMedia strategy: photo:unsplash — abstract aerial/satellite imagery only, no people, no literal office or handshake photography anywhere on the page.\nReject: swapping in a second background image; icon-illustrated stat tiles; a logo wall in place of the attributed quote.\nToken commitments: navy `#0B2540`, teal `#1C5F6B`, sand `#C9A15C`, panel-blue `#D7E6EF`, white `#FFFFFF`; single grotesk sans for all type, small tracked caps for section labels."}, "has_extract": true}, {"slug": "sanity", "title": "Sanity.io", "url": "https://www.sanity.io", "captured": "2026-09-04", "family": "geological-onyx-editorial", "dna": "Geological dark-hero photography x numbered Swiss-editorial section rhythm", "register": "cinematic dark", "grammar": "chaptered editorial", "lane": "A full-bleed dark hero of geological texture carries a compressed, tightly-tracked headline and one orange pill CTA, then the page drops to white numbered sections (01-05) where real product screenshots stand in for marketing illustration", "mode": "persuade", "traits": ["\"one orange CTA", "never decorative\"", "\" ed rather than systemic if a reader doesn't immediately parse the\n  glyph-as-concept logic — it needs to work even skimmed.\n- A fully saturated yellow ground this large, sustained through the entire\n  first fold, can fatigue on longer scroll sessions without a lighter section\n  to rest the eye soon after.", "Signature move": "The glyph-interrupted headline: a single plain sentence with inline icons and a\ntiny inset photo standing in for select words, so the headline reads as both\na sentence and a small system of marks — a device that rewards a second,\ncloser read.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed.\nDurations run a plain `100–600ms` ladder with no eased curve captured for the\ncommon transitions (opacity, transform, grid-template-rows all use the\nbrowser default). The real motion system lives in the Mantine-framework\nkeyframes: a `menuClose` clip-path wipe for the mobile nav, a `scroll`\nslide-x for a marquee/logo strip, plus stock scale/opacity pulse and rotate\nutilities (spinner, badge-ping style pulse) that read as UI chrome rather\nthan bespoke choreography — consistent with the entry's \"no motion visible\"\nread for the hero glyphs and photography themselves.\n\n| token | value | role |\n|---|---|---|\n| `xs`–`sm` | 100–200ms | UI state changes |\n| `md` | 300ms | default transitions |\n| `lg` | 600ms | larger transform/grid transitions |\n| `scroll` (keyframe) | slide-x | marquee/logo-row scroll |", "Brief": "Build a category-honest insurtech page for a physical-risk industry. Cover the\nhero in your industry's own signage colour (not a generic finance palette),\nand set a serif headline where 3-4 words are replaced or accompanied by small\ninline glyphs at cap-height, each marking one underlying concept. Run a\nbrokerage/partner trust-logo row directly beneath. Pair documentary photography\nof the real insured activity (a worker, a site, the actual risk) with a\ntan or neutral info panel making one specific, numbers-adjacent claim. Close\nwith an icon-illustrated grid of product modules, black pill CTAs throughout.", "Image recipe": "Documentary photograph of a worker in [SUBJECT] — construction, industrial, or\nfield-safety gear, genuine job-site setting, natural or work-light lighting,\nmid-task rather than posed, colour grading left mostly natural with the\nindustry's signage colour as an accent nearby.", "Photo search": "Unsplash first, Pexels second.\n- \"construction worker safety gear job site documentary\"\n- \"scaffolding worker steel beam candid\"\n- \"industrial site safety equipment natural light\"", "Reference lock": "Primary reference/direction: Shepherd — construction-signage yellow hero with a glyph-interrupted serif headline, documentary job-site photography paired with a claims panel.\nPreserve (3-5 traits): the industry's own signage colour (not finance-default navy) as the dominant hero ground; a serif headline broken by small inline glyphs at cap-height, each marking one concept; documentary photography of the actual insured activity paired directly with the value-proposition panel; a brokerage/partner trust-logo row placed immediately under the hero.\nBorrow only (1-2): the icon-illustrated product-module grid; the small folded-paper brand mark.\nRole rules: inline glyphs capped at 4 per headline, each must map to a real concept, never pure decoration; hero photography always documents the real insured activity, never generic office stock.\nMedia strategy: photo:unsplash — documentary, real-industry photography only; no boardroom or handshake stock imagery.\nReject: a generic navy-and-white finance palette; more than one full-bleed saturated-colour section in a row with no visual rest between them; decorative glyphs with no conceptual mapping.\nToken commitments: signage-yellow `#F0BE2C`, ink `#111111`, tan `#D8C9A8`, white `#FFFFFF`, icon-orange `#E8752B`; serif display for the headline, sans for UI and body."}, "has_extract": t
