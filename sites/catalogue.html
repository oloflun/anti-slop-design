 it, natural directional light with rich saturation, no props beyond the\nfood itself, no people, no styled table setting — the dish fills the frame\nedge-to-edge.", "Photo search": "Unsplash first, Pexels second.\n- \"poke bowl overhead food photography colourful\"\n- \"ceviche plated dish overhead warm tone\"\n- \"burrito wrap food photography close up\"\n- \"tortilla chips guacamole overhead bright\"", "Reference lock": "Primary reference/direction: Limón — olive-black signage hero alternating with\ncream editorial food sections, one lemon accent reserved for dark surfaces.\nPreserve (3-5 traits): Black Olive `#1d0b0d` dark sections and Warm Cream\n`#fcf9f0` light sections with no intermediate tone; Lemon Zest `#f7ea48` used only\nas a filled CTA or display text on dark, never on cream; positive letter-spacing\nthat opens with size (0.02em body to 0.06em display); near-zero 1px radius\neverywhere except a single 40px circular back-to-top control; food photography\nalways edge-to-edge, zero frame or shadow.\nBorrow only (1-2): the display wordmark overlaid directly onto food photography;\nthe ghost \"ORDER NOW →\" inline link pattern beneath each dish caption.\nRole rules: Lemon Zest never appears on the cream canvas; Forest Ink never\nbecomes a button background; display headlines never drop below 46px or use\nnegative tracking.\nMedia strategy: photo:unsplash — tightly cropped, edge-to-edge editorial food\nphotography, warm-toned surfaces, no people, no lifestyle staging.\nReject: rounding cards or buttons above 1px (outside the one FAB exception);\nlemon accent on a light background; drop shadows or gradients; framed/bordered\nfood photography; a second chromatic accent beyond lemon and forest green.\nToken commitments: dark `#1d0b0d`, green `#103b15`, accent `#f7ea48`, cream\n`#fcf9f0`, hairline `#dbe2dc`; display up to 75px/leading 1.0/0.06em tracking;\nbody 19-20px/leading 1.25-1.3/0.4-0.57px tracking; radius 1px default, 40px\ncircular FAB only; page max-width 1200px, section gap 60px."}, "has_extract": true}, {"slug": "lovera", "title": "Lovera", "url": "https://td-lovera.framer.website", "captured": "2026-09-04", "family": "ghost-wordmark-bento-studio", "dna": "Irreverent statue-hero agency branding x SaaS-dashboard bento proof", "register": "modern clean", "grammar": "split stage", "lane": "A near-black hero pairs a giant ghosted wordmark watermark with a classical statue wearing sunglasses and a chain, then the page drops to a white bento grid of client logos, stat cards and a mini process timeline", "mode": "persuade", "traits": ["near-black hero ground", "oversized ghosted wordmark watermark", "irreverent statue photography", "single orange pill CTA", "white bento-card proof grid", "large numeral stat cards", "mini process timeline chart", "circular avatar stack"], "palette": ["#FFFFFF", "#171717", "#434645", "#FF531F", "#FF825C", "#DDDFDE"], "type": ["Apfel Grotezk", "Oswald", "Antonio"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "portfolio", "category2": "product-focused", "origin": "raw-url", "extract": "ok", "source_url": "https://td-lovera.framer.website", "has_image": true, "img": "../design-catalogue/entries/lovera/fold.webp", "full": "../design-catalogue/entries/lovera/shot.webp", "sections": {"Why it works": "The hero earns attention through incongruity rather than polish: a classical marble bust\nwearing mirrored sunglasses and a chunky chain sits against a near-black ground, with the\nstudio's own wordmark ghosted at giant scale directly behind it as a watermark. The joke\n(old-world statuary styled as a modern founder) does the branding work a tagline usually\nhas to do — \"creative studio for founders\" reads as confirmed by the image before the\nheadline is even parsed.\n\nType carries three distinct jobs on one screen: a bold grotesque for the headline, a\nsmaller sans for the service list and supporting paragraph, and an orange pill CTA that is\nthe only saturated colour in the entire hero. Because everything else is black, white or\ngrey, the orange button and the statue photograph are the only two places the eye can\nland, which keeps the \"See pricing\" CTA from getting lost against the busy background\ntexture.\n\nThe copy voice makes the same founder-to-founder move the imagery does: the extract\nclassifies it as friendly and moving we→you — the studio introduces itself in the\ncollective \"we help brands grow,\" then addresses the visitor directly in service and CTA\ncopy, mirroring the hero's shift from brand statement to direct pitch.\n\nBelow the fold, the page changes vocabulary entirely, into a white bento grid that\nborrows directly from SaaS product-dashboard convention: large numeral stat cards (\"40%\",\n\"$12M\"), a client-logo strip, an avatar stack, and a small process timeline rendered as a\nliteral mini Gantt chart. For a design studio, presenting its own case-study proof in the\nsame visual language as a software dashboard is a considered choice — it signals \"we can\nbuild you this exact kind of interface,\" making the proof section itself a portfolio\npiece.", "What to borrow (principle)": "- **Use an oversized ghosted wordmark as hero texture**, not a literal logo lockup — it\n  reinforces brand presence without competing with the photograph in front of it.\n- **Let incongruous photography state your position before your headline does.** One\n  striking, unexpected image can carry positioning that would otherwise need a paragraph.\n- **Reserve your one accent colour for exactly the CTA**, when the surrounding hero is\n  otherwise pure black/white/grey — the eye has nowhere else to land.\n- **Present your own proof in the visual language of what you sell.** A studio that builds\n  dashboards should show its own results as a dashboard, not a testimonial slider.", "What to leave": "- The \"Made in Framer\" and \"Get the template\" badges are marketplace/tool artifacts, not\n  part of the studio's own design system — exclude from any derived build.\n- The ghosted wordmark watermark sits close enough in value to the dark background that\n  it's barely legible in this capture — effective as texture, but if it's meant to be read\n  at all it needs more contrast.\n- Three different type families in one hero screen (Apfel Grotezk, Oswald, Antonio, per\n  computed styles) is more type-system complexity than the visual result telegraphs;\n  consolidating to two would likely be indistinguishable to a viewer while easier to\n  maintain.", "Signature move": "The photographic non-sequitur: a classical marble statue styled with sunglasses and a\nchain as the entire hero image, doing the positioning work of \"irreverent, confident,\nculturally fluent\" that this kind of agency site usually spends a full paragraph trying to\nestablish.", "Motion": "The designlang extract (separate from the static `capture.py` scroll-through) reads the\noverall feel as mixed and confirms scroll-linked behaviour, but the motion it can actually\nverify is limited to quick hover/state transitions, not the bento grid's chart or counter\nanimations. Two durations are in use, 200ms and 300ms, carried by two distinct custom\neasing curves: `cubic-bezier(0.81, 0.12, 0.25, 0.87)` on 200ms colour transitions, and the\nsame steep, symmetric `cubic-bezier(0.44, 0, 0.56, 1)` seen on Rogo, here driving 300ms\nbackground-plus-box-shadow pairs (card/button hover). The first curve's control points\nare unusually ordered (its x-values run high-to-low rather than low-to-high), which\ntypically reads as a slight anticipation or bounce on the way in rather than a plain\nease — the only near-spring quality found in this set of four. Only one keyframe is\ndefined in the CSS (`__framer-loading-spin`, a 360deg rotation) and it isn't in the \"in\nuse\" set, so the bento-card counter-up/chart-draw animation implied by the still frames\nremains unconfirmed rather than disproven (from designlang extract).\n\n| Duration | Easing | Applies to |\n|---|---|---|\n| 200ms (`sm`) | `cubic-bezier(0.81, 0.12, 0.25, 0.87)` | colour (slight bounce/anticipation quality) |\n| 300ms (`md`) | `cubic-bezier(0.44, 0, 0.56, 1)` | background, box-shadow |", "Brief": "Build a creative-studio landing page opening on a near-black hero with an oversized\nghosted wordmark watermark behind one striking, unexpected photograph that states the\nstudio's position without need for a long headline. Set the headline in a bold grotesque,\nservice list and supporting copy in a plain sans, and use exactly one saturated accent\ncolour for the primary CTA — nothing else in the hero should carry colour. Below the\nfold, present client proof and results in a white bento grid styled like a product\ndashboard: large numeral stat cards, a client-logo strip, a small avatar stack, and a\nliteral mini process-timeline chart. Let the proof section itself demonstrate the kind of\ninterface work the studio sells.", "Image recipe": "High-contrast black-and-white photograph of [SUBJECT] — a classical statue or bust styled\nwith an incongruous modern accessory (sunglasses, jewellery, streetwear) — shot with\ndramatic, slightly cool studio lighting, sharp detail on stone texture, composed with a\nplain dark background so a ghosted wordmark watermark can sit behind it without\ndistraction.", "Photo search": "Unsplash first, Pexels second.\n- \"classical marble statue sunglasses\"\n- \"greek bust modern styling black white\"\n- \"statue portrait dramatic lighting\"\n- \"marble sculpture close up studio\"", "Reference lock": "Primary reference/direction: Lovera — ghosted-wordmark statue hero, white bento-dashboard\nproof section for a creative studio.\nPreserve (3-5 traits): a near-black hero with an oversized ghosted wordmark watermark\nbehind one striking, non-literal photograph; exactly one saturated accent colour reserved\nfor the primary CTA in an otherwise black/white/grey hero; a white bento-grid proof\nsection styled as a product dashboard (numeral stat cards, logo strip, avatar stack, mini\ntimeline chart); client and results proof presented as dashboard UI rather than\ntestimonial text.\nBorrow only (1-2): the small circular avatar stack as a trust signal; the mini Gantt-style\nprocess timeline card.\nRole rules: hero accent colour appears only on the primary CTA, never a second element;\nthe ghosted watermark stays behind photography, never overlapping legible copy; bento\ncards below the fold stay ungapped-white with consistent corner radius, no card exceeds\ntwo content types (a stat, a chart, a quote — never combined).\nMedia strategy: photo:unsplash — high-contrast black-and-white statue/sculpture\nphotography styled with an incongruous modern element; never a straight, unstyled classical\nphotograph.\nReject: multiple accent colours in the hero; a literal (non-ghosted) giant wordmark\ncompeting with the hero photo; testimonial sliders or quote carousels in place of the\ndashboard-style proof grid; template-marketplace UI chrome left in the design.\nToken commitments: hero-bg `#121212`, hero-ink-soft `#302F2E`, warm-tint `#816960`,\nwarm-pale `#C6B0AB`, paper `#DDDAD9`, proof-bg `#FFFFFF`; display `Apfel Grotezk` /\n`Oswald` for headlines, `Antonio` for supporting copy; single accent colour reserved for\nCTA only."}, "has_extract": true}, {"slug": "luccilambrusco", "title": "Lucci Lambrusco", "url": "https://www.luccilambrusco.com", "captured": "2026-09-04", "family": "vineyard-pop-condensed", "dna": "Tuscan lifestyle photography x condensed pop sans", "register": "warm photographic", "grammar": "rhythmic cutlist", "lane": "A full-bleed vineyard photo op opens the page, then it settles into a beat of cream and brick-red panels that alternate product shot, pull quote and Instagram grid", "mode": "persuade", "traits": ["age-gated entry", "full-bleed lifestyle hero", "condensed pop-sans headlines", "brick red panel fills", "cream ground", "circular pill CTAs", "script co-founder byline", "instagram social-proof strip"], "palette": ["#B83529", "#211612", "#5A462B", "#EFECCE", "#7E633E", "#898566", "#BCC4BF", "#DCD69D"], "type": ["ABC Ginto Nord Condensed", "ABC Solar"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "consumer-brand", "category2": "playful", "origin": "raw-url", "extract": "ok", "source_url": "https://www.luccilambrusco.com", "has_image": true, "img": "../design-catalogue/entries/luccilambrusco/fold.webp", "full": "../design-catalogue/entries/luccilambrusco/shot.webp", "sections": {"Why it works": "The page is built on one contrast: a soft, sun-warmed vineyard photograph carrying\nthe hero, and a hard-edged, all-caps condensed sans (ABC Ginto Nord Condensed)\ncarrying every headline over it. The condensed weight is heavy enough to sit on\ntop of a busy landscape photo without a scrim — it reads at a glance from the\nletterforms' own density, not from added shadow. Body copy and labels drop to\nABC Solar, an unrelated grotesque, so voice and record are cleanly split the way\nCalyx splits serif and mono, just with two sans families instead of serif/mono.\n\nColour carries the section rhythm rather than the grid. After the photographic\nhero, the page alternates full-bleed brick-red panels (headline + pull statement)\nwith cream panels (product photography + copy), so scrolling reads as a beat —\nred, cream, red, cream — before landing on an Instagram strip that borrows the\nsame red ground. Nothing here is subtle: type is huge, colour blocks are flat and\nsaturated, and the effect is closer to a poster campaign pinned to a wall than a\nconsidered editorial grid.\n\nThe founder photography (a recognisable co-founder, mid-pour glass shots, a\npolka-dot-dress candid) does the trust work that copy would otherwise have to\ndo — the page is short on argument and long on \"look who's already drinking\nthis.\"", "What to borrow (principle)": "- **Let one heavy display face carry text over photography with no scrim.**\n  Condensed, all-caps and dense enough to stay legible on a busy background.\n- **Alternate two flat colour panels to give scroll rhythm** instead of varying\n  layout — brick red and cream, repeated, reads as a designed beat rather than a\n  stack of sections.\n- **Put a real, recognisable person in the hero** if the brand has one — it\n  replaces several paragraphs of trust copy.\n- **Age-gate before brand**, but keep the gate typeface and colour identical to\n  the site so the wall itself starts building the palette.", "What to leave": "- The interstitial age-gate screen breaks first-viewport capture and adds a\n  click before any brand content — necessary for a wine brand, but worth noting\n  it cost the fold.\n- The Instagram carousel repeats photography already shown higher up the page\n  without adding new information.\n- Body copy is thin — several panels are a headline and a single CTA pill with\n  little supporting text, which works here because the celebrity photography is\n  doing the persuasion, but it would read as empty on a brand without that asset.", "Signature move": "Full-bleed hero photography with the headline set directly onto the image in a\ndense condensed caps face — no gradient, no scrim, no dark overlay. The type\nsurvives purely because the letterforms are heavy and tightly set.", "Motion": "(from designlang extract) The extract rates overall feel \"mixed\" rather than\none consistent character, but confirms scroll-linked behaviour throughout.\nFour duration steps run from a snappy 100ms up to 500ms, split between a\nstandard material ease (23 uses) for most state changes and a hard `linear`\ncurve (13 uses) — no spring or overshoot easing anywhere on the page. The only\nkeyframe actually driving content is `marqyL`, a horizontal\n`translateX(-100%)` slide that runs the Instagram/social-proof strip as a\ncontinuous marquee; a mirrored `marqyR` (`translateX(100%)`) is defined in the\nstylesheet but not registered as in-use, so the marquee reads as\none-directional in practice, not a two-lane crawl.\n\n| kind | tokens |\n|---|---|\n| durations | xs 100ms · sm 200ms · md 300ms · lg 500ms |\n| easings | custom `cubic-bezier(0.4, 0, 0.2, 1)` (23×) · linear (13×) |", "Brief": "Build a D2C drink landing page anchored on one full-bleed lifestyle photograph\nwith a heavy condensed all-caps sans set directly onto it — no scrim needed if\nthe face is dense enough. Split voice from record: condensed caps for every\nheadline, a plain grotesque for body and labels. Ground in warm cream\n`#EFEED0`; use one saturated accent, a brick red `#B73528`, as full-panel fills\nthat alternate with cream panels going down the page — headline panel, product\npanel, headline panel — so scrolling has a colour beat. Close on a social-proof\nstrip in the same red. Keep CTAs as thin-bordered pill buttons, never filled.", "Image recipe": "Documentary lifestyle photograph of [SUBJECT] in a sun-warmed outdoor setting,\ngolden-hour side light, a real person mid-gesture rather than posed, shallow\ndepth of field with a soft rural or vineyard background, warm desaturated colour\ngrading with lifted shadows, no studio lighting, no gradient overlay — shot as a\ncandid moment, not a product still.", "Photo search": "Unsplash first, Pexels second.\n- \"vineyard golden hour woman wine glass\"\n- \"italian countryside lifestyle candid\"\n- \"wine pour glass close up warm light\"\n- \"friends celebrating wine outdoor candid\"", "Reference lock": "Primary reference/direction: Lucci Lambrusco — condensed pop-sans over\nfull-bleed vineyard photography, alternating brick-red/cream panel rhythm.\nPreserve (3-5 traits): dense condensed all-caps display face set directly onto\nphotography with no scrim; brick red `#B73528` and cream `#EFEED0` as the only\ntwo panel grounds, alternating down the page; thin-bordered pill CTAs, never\nfilled; a real recognisable person carrying the hero and social-proof sections;\nshort, headline-led copy blocks rather than long paragraphs.\nBorrow only (1-2): the age-gate screen (only relevant for alcohol/age-restricted\ngoods); the Instagram carousel at the close.\nRole rules: condensed caps face never used below headline size; body grotesque\nnever used for a headline; red panels always full-bleed, never boxed or\ninset.\nMedia strategy: photo:unsplash — candid, golden-hour lifestyle photography with\na real subject in motion, never a static product-only shot for the hero.\nReject: gradient or dark scrims behind hero text; more than two panel ground\ncolours; filled CTA buttons; centred symmetrical layouts.\nToken commitments: bg `#EFEED0`, accent `#B73528`, ink `#211612`; display \"ABC\nGinto Nord Condensed\" all-caps, body \"ABC Solar\"; panels full-bleed edge to\nedge with no max-width container on the colour fill itself."}, "has_extract": true}, {"slug": "magnetism", "title": "Magnetism", "url": "https://magnetism.fr", "captured": "2026-09-04", "family": "linen-gallery-wordmark", "dna": "Wordmark-as-architecture x full-bleed luxury campaign photography", "register": "editorial print", "grammar": "gallery/catalog", "lane": "A 140px whisper-weight wordmark stretches edge-to-edge over a bone-white canvas threaded with faint field-line graphics, then the page drops into a strict 2-column grid of full-bleed, unframed campaign photographs labelled only by a hairline and a tracked-out caption row", "mode": "portfolio", "traits": ["140px weight-300 edge-to-edge wordmark", "\"99% achromatic", "colour only in photography\"", "0px radius on every surface", "\"bullet-separated nav", "no dividers\"", "0.10-0.22em tracking on all labels", "repeating M watermark on left margin"], "palette": ["#e5e7eb", "#222222", "#343434", "#aaaaaa", "#cccccc", "#dbdbdb"], "type": ["TT Hoves Pro Trial", "NeueMontreal"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://magnetism.fr", "has_image": true, "img": "../design-catalogue/entries/magnetism/fold.webp", "full": "../design-catalogue/entries/magnetism/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. The system is 99% achromatic by explicit design contract: bone white\ncanvas, graphite ink, three grays for hairlines and de-emphasis — nothing else.\nBecause the UI itself carries zero colour, the full-bleed campaign photography\n(vivid ocean blue, pastel skincare, amber spirits, high-contrast black-and-white)\nreads as the only chromatic event on the page, which is exactly the \"page is a\nwall, photograph is the art\" relationship the source states outright.\n\nType does something unusual: a single typeface runs both extremes of the scale at\nonce, with no intermediate steps — a 140px weight-300 wordmark stretched edge to\nedge as the page's entire header, and 8-10px micro-labels at up to 0.22em\ntracking as the entire functional vocabulary. Wide, positive letter-spacing is\ntreated as \"a structural material, not a finishing touch\" — it is precisely what\nkeeps 8px text legible and intentional rather than merely tiny.\n\nGeometry stays at 0px radius everywhere and elevation is banned outright; the only\ndepth cues are whitespace and 1px hairlines in two closely related grays. That\nflatness is what allows the repeating \"M\" watermark and the faint concentric\nfield-line graphics to read as ambient texture rather than clutter — they sit at\nthe same visual weight as the rest of the chrome, never competing with the\nphotography above them.", "What to borrow (principle)": "- **Run one typeface at two extreme, non-adjacent sizes.** A whisper-weight\n  140px wordmark and 8-10px tracked-out labels, with nothing between, makes the\n  single typeface do the entire identity job.\n- **Let tracking carry legibility at small sizes.** Wide positive letter-spacing\n  (0.22em) on micro-labels is what makes 8-10px text read as deliberate rather\n  than cramped.\n- **Separate nav items with a typographic character, not a UI element.** Middle-\n  dot bullets instead of borders or backgrounds keep the whole nav pure\n  typography.\n- **Never overlay text on photography.** Keeping captions in a dedicated row\n  below each image, never on top of it, preserves the \"photograph as\n  untouched art object\" contract.\n- **Give the brand mark a quiet, repeating presence instead of a fixed logo\n  placement.** A faint watermark character on the margin can carry identity\n  continuously without ever demanding attention.", "What to leave": "- Zero-radius, zero-shadow, zero-accent-colour is an extremely narrow palette to\n  extend into functional UI (forms, states, errors) — the system explicitly has\n  no answer for anything beyond editorial display.\n- A 140px wordmark stretched edge-to-edge assumes a short brand name; a longer\n  name would either break the \"stretch to full width\" effect or force a much\n  smaller size that undercuts the device entirely.\n- The captioned-photography-only imagery mode depends on a genuinely large,\n  high-quality campaign photo library; a thinner asset base would make the\n  2-column grid feel sparse rather than curated.", "Signature move": "The 140px edge-to-edge wordmark as the entire page header: no logo mark, no\ntagline, no lockup — the brand name itself, set at whisper weight and stretched\nto the full viewport width, functions as both identity and architecture.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked.\nFive easing families are in play across four durations (200/300/500/800ms):\nplain `ease` and `linear` for simple state changes, a slow-starting ease-in\n(`cubic-bezier(0.55, 0.055, 0.675, 0.19)`) and a fast-settling ease-out\n(`cubic-bezier(0.19, 1, 0.22, 1)`, 17 uses — the most-used curve) for entrances,\nplus a standard `cubic-bezier(0.4, 0, 0.2, 1)`. Notably, `clip-path` itself is\nanimated at 0.8s (ease-in-out) and 0.4s (the slow-start ease-in curve) — a\nwipe/reveal effect rather than a simple fade, most plausibly how each full-bleed\ncampaign image or video enters the grid as it scrolls into view. (observed in\ncapture) the live capture (a project page, not the homepage) shows full-bleed\nvideo/motion content used as campaign imagery itself — sailing footage in\nmotion — confirming that \"photography\" in this system extends to autoplaying\nvideo within the same unframed, full-bleed treatment as still images.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 200ms | `ease` / `linear` |\n| md | 300ms | `linear` |\n| lg | 500ms | `cubic-bezier(0.19, 1, 0.22, 1)` |\n| xl (clip-path wipe) | 800ms | `ease-in-out` |", "Brief": "Build a luxury creative-agency portfolio homepage. Canvas is bone white `#e5e7eb`\nthroughout, ink is graphite `#222222` — no chromatic UI colour anywhere, ever.\nOpen with the agency wordmark set edge-to-edge at ~140px, TT Hoves Pro Trial\nweight 300, no tracking, with a small \"TM\" superscript. Beneath it, a narrow\ndescription column at 10-11px with 0.10-0.22em tracking. A bullet-separated nav\n(• WORKS • ABOUT • BOUTIQUE •) floats below at 12-14px weight 400. Render a large\nfaint \"M\" watermark vertically centred on the left margin, and thin concentric\nfield-line graphics as ambient texture behind the header. Below the fold, lay out\nfull-bleed campaign photography edge-to-edge with 0px radius and 0px padding — a\nsingle hero banner followed by a strict 2-column grid, each image followed by a\nlabel row (client name right-aligned, \"CAMPAIGN\" left-aligned) at 8-10px with\n0.22em tracking, separated from the image by a 1px hairline. No shadows, no\noverlay text on photography, no border-radius anywhere. Section gaps run\n64-80px.", "Image recipe": "Full-bleed luxury campaign photograph of [SUBJECT] — high-production editorial or\nproduct photography (watches, spirits, fashion, lifestyle), vivid and fully\nsaturated regardless of subject (ocean blue, pastel skincare tone, warm amber, or\nhigh-contrast black-and-white), shot at magazine-cover quality, no crop\nconstraint or aspect-ratio limit, no vignette, no colour grading applied on top —\nthe photography's native palette is the only colour on the page.", "Photo search": "Unsplash first, Pexels second.\n- \"luxury product editorial photography vivid colour\"\n- \"sailing yacht ocean blue high contrast\"\n- \"watch product photography macro\"\n- \"fashion editorial studio portrait vivid\"", "Reference lock": "Primary reference/direction: Magnetism — wordmark-as-architecture agency\nportfolio, 99% achromatic UI, colour arriving only through campaign photography.\nPreserve (3-5 traits): bone white `#e5e7eb` canvas with graphite `#222222` ink, no\nchromatic UI colour anywhere; single typeface run at two extreme sizes (140px\nwordmark, 8-10px labels) with nothing intermediate; 0px radius and zero shadow on\nevery surface; bullet-separated nav with no borders or backgrounds; captions\nalways in a dedicated row below imagery, never overlaid.\nBorrow only (1-2): the repeating \"M\" watermark on the left margin; the faint\nconcentric field-line decorative graphic.\nRole rules: no accent hue is ever introduced, including for interaction states —\nuse the existing gray scale only; text never overlays a photograph; the wordmark\nnever renders above weight 300 or in a condensed/extended cut.\nMedia strategy: photo:unsplash — full-bleed, high-production campaign\nphotography and video in their native saturated colour; no illustration, no\nicons, no abstract graphics.\nReject: any chromatic UI element (button fill, link colour, badge); border-radius\non images or cards; box-shadow of any kind; text overlaid directly on\nphotography; nav dividers other than the bullet character.\nToken commitments: bg `#e5e7eb`, ink `#222222`, nav-ink `#343434`, muted `#aaaaaa`,\nhairline `#cccccc`, decorative-stroke `#dbdbdb`; wordmark 140px weight\n300/leading 1.0; body 14-16px/leading 1.5/1.4-1.6px tracking; micro-label 8-10px/\n0.22em tracking; radius 0px universal; section gap 64px."}, "has_extract": true}, {"slug": "mailchimp", "title": "Mailchimp (email dashboard)", "url": "", "captured": "2026-09-04", "family": "sample-data-analytics-console", "dna": "Email marketing analytics dashboard x sample-data disclosure banner", "register": "modern clean", "grammar": "live surface", "lane": "A white product console opens on a serif page title and a persistent sample-data disclosure banner, then rows of card-based analytics — revenue tiles, a replicate-email table, a funnel chart and a time-series line chart — fill the working canvas", "mode": "operate", "traits": ["white console ground", "left icon rail navigation", "serif page title beside a pill \\\"sample data\\\" tag", "persistent disclosure banner", "metric tiles with trend deltas", "sortable proof table with inline \\\"replicate\\\" actions", "funnel bar chart", "time-series line chart", "mascot logomark top-left"], "palette": ["#FFFFFF", "#FFE01B", "#241C15", "#0A5C56", "#E8623D", "#4F8A5B"], "type": ["\"serif display (visual match", "unverified)\"", "\"sans UI (visual match", "unverified)\""], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "", "origin": "raw-image", "extract": "none", "source_url": "https://mailchimp.com", "has_image": true, "img": "../design-catalogue/entries/mailchimp/fold.webp", "full": "../design-catalogue/entries/mailchimp/shot.webp", "sections": {"Why it works": "This is a working product console, not a marketing page, and it reads that way\nimmediately: a slim left icon rail for primary navigation, a serif page title\n(\"Email dashboard\") paired with a plain pill tag reading \"Sample data,\" and an\ninline banner beneath repeating the disclosure in full sentences (\"You're using\nMailchimp's sample data... upgrade to a Standard plan\"). Stating the same fact\ntwice, once as a two-word tag and once as a full sentence, means a user\nskimming and a user reading closely both get the same information at the\nspeed they're moving.\n\nThe serif page title is a small, telling choice for a data product: most\ndashboards default to sans-serif for headings to match their UI chrome, but a\nserif title here softens what is otherwise a dense grid of numbers, tables and\ncharts — a easy way to keep a data-heavy screen from feeling cold.\n\nThe layout stacks proof in increasing density: four metric tiles with trend\ndeltas first (fastest to scan), then a sortable table of past campaigns with an\ninline \"Replicate\" action per row (turns analysis directly into the next\naction), then a funnel chart and a time-series line chart (slowest, most\ndetailed). Each row of the page asks for a little more attention than the one\nabove it, which matches how someone actually works through a dashboard.", "What to borrow (principle)": "- **State a data-quality disclosure twice** — once as a compact pill tag, once\n  as a full-sentence banner — so it's legible at both skim and read speed.\n- **Use a serif for a dense dashboard's page title** to soften an otherwise\n  all-numbers, all-sans-serif screen.\n- **Order dashboard sections by increasing density**: scannable metric tiles\n  first, a sortable table next, charts last — matching how attention actually\n  degrades down a long screen.\n- **Put the next action directly inside the proof row** (a \"Replicate\" button\n  on a top-performing email), so analysis and action share one row instead of\n  requiring a separate step.", "What to leave": "- A persistent disclosure banner this prominent, if it can't be dismissed,\n  permanently claims real estate that could otherwise show more of the user's\n  actual data once available.\n- Mixing a percentage-format y-axis with dollar and count metrics in adjacent\n  charts (as the time-series chart does, showing \"700%\" on an open-rate axis)\n  risks reading as a data or formatting error rather than a design choice.", "Signature move": "The doubled disclosure: the same \"you're looking at sample data\" fact stated\nas both a two-word pill tag beside the page title and a full explanatory\nsentence in a banner directly beneath it — belt-and-braces communication for a\nfact users need to register instantly but also fully understand.", "Motion": "(inferred from image) No motion is visible in the capture; metric tiles,\ntable rows and charts read as static. A dashboard of this density likely\nanimates chart data in on load and supports row-level hover states, though\nthis isn't confirmed without a captured extract.", "Brief": "Build a dense but legible analytics-dashboard screen. Use a slim icon rail for\nprimary navigation, and set the page title in a serif to soften an otherwise\nall-numeric canvas. If showing placeholder or sample data, disclose it twice —\na compact pill tag beside the title and a full-sentence banner beneath — so\nthe fact registers at any reading speed. Order the page by increasing\ninformation density: scannable metric tiles with trend deltas first, a\nsortable proof table with an inline next-action button next, then detailed\ncharts (funnel, time-series) last. Keep the palette to a single bright brand\naccent plus warm/cool trend colours (green up, coral down) and neutral ink on\nwhite.", "Image recipe": "Not applicable — this reference is a product UI screenshot, not photography.\nIf illustrating a similar dashboard, keep imagery limited to a small mascot or\nbrand mark in the navigation only; the canvas itself should stay data (tables,\ncharts, tiles), not photographic.", "Photo search": "Not applicable — no photography used in this reference.", "Reference lock": "Primary reference/direction: Mailchimp email dashboard — doubled sample-data disclosure, serif page title, density-ordered analytics layout.\nPreserve (3-5 traits): a serif page title paired with a compact status pill beside dense, all-numeric UI; a data-quality or status disclosure stated both as a tag and as a full-sentence banner; dashboard sections ordered by increasing density (metric tiles, then a sortable table with inline actions, then charts); a next-action button embedded directly inside the proof table row, not a separate step.\nBorrow only (1-2): the small mascot logomark in the navigation rail; the warm/cool (coral down, green up) trend-delta colour convention.\nRole rules: any placeholder/sample-data state must be disclosed in at least two forms (tag + sentence); chart axis units must always match the metric being shown, never mixed formats.\nMedia strategy: no photography — this is a working product console; imagery limited to a small brand mark and functional icons only.\nReject: a single, easily-missed disclosure of placeholder data; charts with mismatched axis units; ordering a dashboard's densest content before its most scannable content.\nToken commitments: white `#FFFFFF`, brand-yellow `#FFE01B`, ink `#241C15`, teal-link `#0A5C56`, trend-down-coral `#E8623D`, trend-up-sage `#4F8A5B`; serif for the page title only, sans for all other UI and data type."}, "has_extract": false}, {"slug": "maloothifibar", "title": "Maloot Hifi Bar", "url": "https://www.maloothifibar.com", "captured": "2026-09-04", "family": "nightclub-wordmark-serif", "dna": "Amber-lit nightlife documentary photography x oversized geometric wordmark", "register": "cinematic dark", "grammar": "split stage", "lane": "A dark amber DJ photograph fills the hero under a nav rail, then a huge white geometric wordmark cuts across the image as its own band before the page drops to sage-green editorial copy and a filmstrip of interior photography", "mode": "experience", "traits": ["amber/red gel-lit interior photography", "oversized geometric wordmark with vinyl-record O", "sage green content ground", "italic serif pull quotes", "light/dark mode toggle", "horizontal photo filmstrip", "bilingual EN/FR nav"], "palette": ["#EFEEEC", "#A8A99E", "#191313", "#8E8F84", "#3D3A34", "#5C594C", "#A24F10", "#53180F"], "type": ["Times Now", "Inter Tight"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "hospitality", "category2": "playful", "origin": "raw-url", "extract": "ok", "source_url": "https://www.maloothifibar.com", "has_image": true, "img": "../design-catalogue/entries/maloothifibar/fold.webp", "full": "../design-catalogue/entries/maloothifibar/shot.webp", "sections": {"Why it works": "The hero is a single amber/red-lit documentary photograph of a DJ mid-set,\nrun full-bleed with no overlay treatment beyond the gel lighting already in the\nshot — the venue's own lighting design does the colour-grading work a filter\nusually would. A thin nav rail of three words (Hifi Bar / Cocktails / Vinyls)\nsits mid-frame in a fine serif, understated against the photo. Then the page's\none bold move: the wordmark MALOOT is set as an enormous geometric sans band\ncutting across the bottom of the hero image, with the second O replaced by a\nblack disc standing in for a vinyl record — a logotype that is also a pun on\nthe venue's own product.\n\nBelow the fold the palette flips hard, from the photograph's blacks and ambers\nto a flat sage-green ground, and the type flips with it — from the wordmark's\ngeometric weight to an italic-leaning serif (Times Now) for pull-quote copy set\nin short centred paragraphs. The serif's warmth reads as \"someone talking to\nyou,\" in contrast to the wordmark's graphic flatness. A horizontal filmstrip of\ninterior photography (bar, turntables, red-lit stair, booth seating) closes the\nsection, functioning as an on-site walkthrough rather than a curated gallery\ngrid.", "What to borrow (principle)": "- **Let real venue lighting be the colour treatment** — don't add a filter or\n  gradient overlay if the interior's own gel lighting already carries the mood.\n- **Turn the wordmark into a small pun or device** (a vinyl-record O, here) so\n  the logotype itself signals what the place is, not just its name.\n- **Flip ground colour hard between hero and body** (black photo to flat sage)\n  to mark the transition from \"arriving\" to \"reading,\" rather than fading\n  gradually.\n- **Use an italic serif for short pull-quote copy** against a graphic sans\n  logotype — the contrast reads as brand-voice vs. brand-mark.\n- **A horizontal filmstrip of real interior photography** sells atmosphere\n  faster than a captioned amenities list.", "What to leave": "- The oversized wordmark band, while a strong device, pushes the actual\n  address/hours/booking information further down the page than a venue site\n  usually wants.\n- The nav rail's fine serif is low-contrast against a busy photographic\n  background in places — legible but not high-skim.\n- Bilingual EN/FR toggle sits as two small letters in the top-right with no\n  visible active state in the capture — likely fine live, ambiguous in a still.", "Signature move": "The wordmark logotype where the second \"O\" is swapped for a solid black disc —\nreading simultaneously as typography and as a spinning record, doubling as the\nsite's visual pun on \"Hifi.\"", "Motion": "(from designlang extract) The extract rates overall feel \"responsive\" with\nconfirmed scroll-linked behaviour. Six duration steps span an almost-instant\n40ms up to a slow 800ms, split between a dominant ease-out family (191 uses,\nthree related out-quint-style curves) and a flat `linear` curve (120 uses) for\ncontinuous motion. A recurring `opacity 0.3s, filter 0.3s, transform 1s\ncubic-bezier(0.19, 1, 0.22, 1)` combination carries small incremental delays\n(0.04s per step), which reads as a staggered fade/rise-in — plausibly the\nmechanism behind the horizontal interior-photo filmstrip. No keyframe\nanimations are defined in the stylesheet; motion here is transition-driven,\nnot keyframe-driven. (inferred from image) A light/dark mode toggle (sun/moon\nicons) is visible at the bottom of the filmstrip section, implying a live\ntheme switch — not confirmed interactively. The hero photograph also differs\nsubtly in crop/composition between the raw source and the fresh capture,\nconsistent with a slow pan/zoom on the hero video.\n\n| kind | tokens |\n|---|---|\n| durations | instant 40ms · xs 120ms · sm 160ms · md 280ms · lg 450ms · xl 800ms |\n| easings | ease-out `cubic-bezier(0.23, 1, 0.32, 1)` / `cubic-bezier(0.19, 1, 0.22, 1)` / `cubic-bezier(0.075, 0.82, 0.165, 1)` (191×) · linear (120×) |", "Brief": "Build a nightlife venue site on a single full-bleed, amber/red gel-lit\ndocumentary photograph for the hero — no added colour treatment, let the\nvenue's real lighting carry the mood. Set a thin nav rail of two-to-three words\nin a fine serif at mid-frame. Close the hero with an oversized geometric\nwordmark band in white, incorporating one graphic pun tied to the venue's\nidentity (a record, a glass, an instrument). Flip hard to a flat sage or muted\nwarm-neutral ground below the fold, and switch to an italic-leaning serif for\nshort centred pull-quote copy. Close on a horizontal filmstrip of real interior\nphotography — bar, equipment, seating, stairwell — rather than a staged\ngallery grid. Offer a light/dark toggle if the brand has both moods.", "Image recipe": "Documentary interior photograph of [SUBJECT] in a warm-lit nightlife venue,\namber and red gel lighting mixed with practical fixtures, shallow depth of\nfield, slight grain, candid framing as if shot mid-service rather than staged,\nno flash, no colour-grading filter added in post — the venue's own lighting\ndesign is the palette.", "Photo search": "Unsplash first, Pexels second.\n- \"bar interior red amber lighting night\"\n- \"dj turntable vinyl close up warm light\"\n- \"cocktail bar candid nightlife documentary\"\n- \"speakeasy interior brick red lighting\"", "Reference lock": "Primary reference/direction: Maloot Hifi Bar — amber-lit venue photography,\noversized wordmark with vinyl-disc pun, sage-green editorial body.\nPreserve (3-5 traits): full-bleed venue photography carrying its own gel-lit\ncolour treatment with no added filter; an oversized geometric wordmark band\nclosing the hero, with one graphic pun built into a letterform; hard flip from\ndark photographic hero to flat sage/warm-neutral body ground; italic-leaning\nserif for pull-quote copy set short and centred; horizontal filmstrip of real\ninterior photography rather than a staged grid.\nBorrow only (1-2): the light/dark mode toggle; the bilingual nav toggle.\nRole rules: the wordmark device appears once, at full scale, never repeated\nsmaller elsewhere on the page; serif reserved for quote-style copy, never for\nthe wordmark or nav labels.\nMedia strategy: photo:unsplash — candid, gel-lit interior/nightlife\nphotography only; no studio product shots, no stock cocktail flat-lays.\nReject: a second display typeface competing with the wordmark; gradient\noverlays added on top of already-lit photography; a staged/gridded gallery in\nplace of the filmstrip.\nToken commitments: sage `#A8AA9E`, ink `#1A1313`, warm-amber `#A24F10`,\ndeep-red `#53180F`, stone `#8E8F84`; body/quote serif \"Times Now\"; wordmark\ncustom geometric sans (bespoke, not a stock family)."}, "has_extract": true}, {"slug": "mattis-studio", "title": "Mattis Studio (agency template)", "url": "https://mattis.framer.website/", "captured": "2026-09-04", "family": "grid-boxed-console-agency", "dna": "Software changelog framing x design/dev agency pitch", "register": "cinematic dark", "grammar": "split stage", "lane": "A black hero framed like a software console — version tag, live clock, slot counter — opens the page, then a single orange full-bleed block states the studio's thesis beside a fashion photograph, closing on plain grey display type", "mode": "persuade", "traits": ["grid-boxed console-style hero framing", "version-number tag", "live local-time clock", "availability slot counter", "founder signature overlay", "bold orange full-bleed thesis block", "fashion-editorial photography", "oversized flat-colour headline blocks", "condensed bold sans display"], "palette": ["#0B0B0B", "#F04E23", "#FFFFFF", "#E7E5E1", "#1C1C1C"], "type": ["Geist"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://mattis.framer.website/", "has_image": true, "img": "../design-catalogue/entries/mattis-studio/fold.webp", "full": "../design-catalogue/entries/mattis-studio/shot.webp", "sections": {"Why it works": "The hero borrows interface language from software, not marketing: a\n`(EST. 2019 — VERSION 1.0.4)` tag, a corner-marked grid frame around the\nwordmark card, a live local-time readout, and an availability counter\n(\"Slots for APR: |||||  2 left\"). None of this is a real product — it's an\nagency's own homepage — but framing the studio itself as a versioned, in-stock\npiece of software borrows urgency and precision language from a different\ncategory entirely.\n\nA founder photo and signature sit inside the same framed card as the wordmark,\nwhich personalises what would otherwise be a purely systemic, cold hero. It's a\nsmall human anchor inside a page that otherwise leans hard on grid lines,\ntimestamps and version numbers.\n\nThe page then commits fully to one flat, saturated orange for an entire\nfull-bleed section — a bold three-word thesis (\"STRATEGY BEFORE PIXELS.\") set\nin huge condensed type beside a black-and-white fashion-editorial photograph\nand a single stat (\"12+ Industries\"). The colour block does more branding work\nin one screen than a logo could, simply by being the loudest, most confident\nthing on the page.", "What to borrow (principle)": "- **Frame your own homepage like a software product**, with a version tag, a\n  live clock, and an availability counter, to borrow precision and urgency\n  language from a different category.\n- **Put a founder photo and signature inside the hero's framed card**, not in a\n  separate \"about\" section, to personalise an otherwise systemic layout.\n- **Commit an entire section to one flat saturated colour** for your core thesis\n  statement — it reads as more confident than a colour used sparingly.\n- **Pair a black-and-white editorial photograph against a saturated colour\n  block** rather than a colour photograph, so the photo and the colour don't\n  compete.", "What to leave": "- A \"slots left this month\" counter is a scarcity device borrowed from\n  consumer/booking products; for a design agency it can read as a gimmick\n  unless the scarcity is genuinely real and updated.\n- The console-style hero (version tag, clock, grid frame) is dense with small\n  metadata that risks distracting from the actual value proposition on first\n  glance — it rewards a second look more than a first one.", "Signature move": "The versioned, grid-framed hero card: the studio's name and pitch live inside a\nbordered card with corner marks (like a UI component being inspected),\ncarrying a version number, a founder signature, and a live clock — treating the\nagency's own brand as a piece of software with a release history.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed,\nthough the captured CSS is thin: a `200ms` custom ease\n(`cubic-bezier(0.44,0,0.56,1)`, a near-symmetric ease-in-out, 15 uses) drives\nlink/underline colour changes, plus the framework's `1ms` allow-discrete\noverflow transition. The one keyframe present is a generic loading spinner —\nno clock-tick or card-select animation was captured, so that read from the\nimage stays inferred rather than confirmed.\n\n| token | value | role |\n|---|---|---|\n| `instant` | 1ms | framework overflow transition |\n| `sm` | 200ms | link/underline colour changes |\n| custom | `cubic-bezier(0.44,0,0.56,1)` | only family found (15 uses) |", "Brief": "Build a dark, systems-minded agency homepage. Frame the hero as a bordered card\nwith corner marks, a version tag, a live local-time clock, and an availability\ncounter, with the founder's photo and signature inside the same card. Set the\nstudio name in a large bold wordmark within that frame. Immediately after,\ncommit one full-bleed section to a single flat saturated colour carrying a\nthree-to-five-word thesis statement in huge condensed type, paired with one\nblack-and-white editorial photograph and a single stat. Close on plain,\noversized display type stating what the studio actually builds.", "Image recipe": "Black-and-white editorial fashion photograph of [SUBJECT], studio-lit, high\ncontrast, one figure in three-quarter or profile pose against a plain\nbackground, shot to read as confident and slightly detached rather than warm\nor candid.", "Photo search": "Unsplash first, Pexels second.\n- \"black and white fashion editorial studio\"\n- \"monochrome portrait high contrast studio\"\n- \"editorial fashion photography plain background\"", "Reference lock": "Primary reference/direction: Mattis Studio — versioned software-style hero card with a founder signature, breaking into one flat-colour thesis block with black-and-white editorial photography.\nPreserve (3-5 traits): hero framed as a bordered, corner-marked card carrying a version tag and live clock; founder photo and signature placed inside that same card, not a separate section; one full-bleed section committed entirely to a single flat saturated colour for the core thesis; black-and-white (not colour) photography paired against the saturated colour block.\nBorrow only (1-2): the \"slots left this month\" availability counter, used only if genuinely accurate; the single stat paired with the thesis block.\nRole rules: only one saturated flat-colour section per page; photography stays black-and-white wherever it meets a saturated colour block; version/clock metadata stays confined to the hero card, never repeated elsewhere.\nMedia strategy: photo:unsplash — black-and-white editorial/fashion photography only where paired with the saturated colour block; no colour photography elsewhere on the page.\nReject: a fabricated scarcity counter that doesn't reflect real availability; colour photography competing against the flat saturated section; a hero card with no personal/human element.\nToken commitments: black `#0B0B0B`, orange `#F04E23`, white `#FFFFFF`, grey `#E7E5E1`, dark-grey `#1C1C1C`; condensed bold sans for all display type."}, "has_extract": true}, {"slug": "miti", "title": "Miti Navi", "url": "https://miti-navi.com/fr", "captured": "2026-09-04", "family": "linen-arch-chapbook", "dna": "Cathedral-arch yacht photography x monospaced editorial UI on unbleached linen", "register": "warm photographic", "grammar": "gallery/catalog", "lane": "A sand-linen page holds a full-bleed yacht photograph masked by a cathedral-arch clip-path beneath a three-cluster nav, with an oversized 180px serif headline and a persistent rotated side tab — every functional element rendered in a monospaced type that never once softens a corner", "mode": "experience", "traits": ["\"arch-masked hero", "the sole soft shape on the page\"", "\"0px radius everywhere else", "rigorously square\"", "\"one apricot underline", "no filled buttons at all\"", "\"monospace for every UI role", "serif for display only\"", "dark image-inset frames as prints behind glass", "rotated vertical side-tab as a persistent margin marker"], "palette": ["#e6dece", "#000e13", "#232323", "#999999", "#ffdead"], "type": ["Voyage", "GT Pressura Mono", "GTSectraDisplay"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "luxury-craft", "category2": "hospitality", "origin": "refero", "extract": "ok", "source_url": "https://miti-navi.com/fr", "has_image": true, "img": "../design-catalogue/entries/miti/fold.webp", "full": "../design-catalogue/entries/miti/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the\nlive capture. Linen `#e6dece` is not merely a background but the site's only\nsurface — cards, canvas and content blocks share the exact same value, so\nnothing \"lifts\" off the page; the source states white or light-gray tints\nare never introduced anywhere. Deep ink `#000e13` reserves itself for dark\nphotographic insets that function as \"prints mounted behind glass,\" giving\nthe palette exactly two roles: warm paper, and the occasional dark window\ninto deeper space.\n\nThe typography inverts the usual mono/serif hierarchy seen elsewhere in this\ncatalogue: GT Pressura Mono, not a humanist sans, runs the entire functional\ninterface — nav, body, links, buttons — with tracking that widens\nproportionally as size grows (0.71px at 10px up to 1.6px at 16px), giving\neven body paragraphs a technical, spaced-out cadence. Voyage, a theatrical\nhigh-contrast serif, is reserved exclusively for display at 46-180px and\nbanned below 46px, so the romantic curves of the brand voice never dilute\ninto small text.\n\nGeometry stays absolutely square (0px radius on every card, tag, image and\nbutton) with exactly one exception: the hero photograph itself, masked by a\ncustom arch clip-path that creates a cathedral-window silhouette. Because\nthat curve is the only soft shape anywhere on the site, it reads as a\ngenuine architectural gesture rather than a stylistic default — reinforced\nby a system with no filled buttons at all, where every action is a plain\nmono link marked only by a 1px apricot underline offset below the text.", "What to borrow (principle)": "- **Let type tracking widen proportionally with size, not shrink.** GT\n  Pressura Mono's 0.71px-to-1.6px curve keeps every size feeling\n  consistently \"spaced,\" rather than tight at large sizes and loose at\n  small ones.\n- **Reserve exactly one soft shape for one specific purpose.** A single\n  arch clip-path on the hero photograph, with 0px radius everywhere else,\n  makes that one curve read as an architectural signature, not decoration.\n- **Run the entire functional UI in a monospace face.** Using mono for body\n  copy as well as nav and buttons — not just for code or labels — gives an\n  editorial site an unexpectedly technical, precise register.\n- **Replace filled buttons with a single underline convention.** One\n  1px accent-colour rule, offset below the text, as the system's only CTA\n  style removes the temptation to invent multiple button treatments.\n- **Frame dark photography in a dark inset, not a light card.** Setting\n  secondary images inside a `#000e13` filled block (rather than the linen\n  canvas) makes them read as windows or framed prints, adding weight where\n  the flat linen system needs it.", "What to leave": "- Zero filled buttons anywhere is a hard commercial constraint — a booking\n  or contact flow needing a genuinely prominent action has no built-in\n  pattern beyond an underlined link.\n- The custom arch clip-path hero is a bespoke asset requiring careful\n  responsive handling; a naive rebuild risks either losing the cathedral\n  silhouette or clipping photography awkwardly at narrow viewports.\n- Running body copy in a monospace face at 14px with 1.4px tracking is a\n  legibility trade-off some readers find harder to scan at length than a\n  humanist sans — appropriate for a low-text, photography-led site but risky\n  for a copy-dense one.", "Signature move": "The arched hero mask: a full-bleed yacht photograph clipped by a tall,\ncustom cathedral-window silhouette against the linen canvas — the single\nsoft, curved shape on an otherwise rigorously square-edged site.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked —\ncorrecting the earlier \"no motion tokens\" read: shadowlessness and motion turn\nout to be separate design decisions here. A single custom curve,\n`cubic-bezier(0.82, 0, 0.36, 1)`, is used with striking consistency (102\nuses) across four durations, from a quick 200ms up to a slow 1.6s — a\nlate-accelerating \"held, then release\" shape fitting for measured, editorial\nreveals rather than snappy UI feedback. No keyframes are confirmed firing, so\nthis choreography lives entirely in property transitions. (observed in\ncapture) the live capture confirms the arch-masked hero and split\nthree-cluster navigation are present and match the structure closely; given\nthe flat, shadowless, printed-catalog register, interaction states most\nplausibly still apply the documented apricot underline to active links,\nriding that same custom curve rather than adding elevation.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 200ms | `cubic-bezier(0.82, 0, 0.36, 1)` |\n| lg | 600ms | `cubic-bezier(0.82, 0, 0.36, 1)` |\n| xl | 1s | `cubic-bezier(0.82, 0, 0.36, 1)` |\n| xxl | 1.6s | `cubic-bezier(0.82, 0, 0.36, 1)` |", "Brief": "Build a luxury yacht-builder site on a warm, editorial paper canvas. Set\nlinen `#e6dece` as the only surface colour across the entire site — no\nwhite, no light gray, ever. Deep ink `#000e13` is reserved for dark\nphotographic insets only. Cap every card, image, tag and button at 0px\nradius without exception. Run GT Pressura Mono for all functional text —\nnav, body, links, buttons — with tracking widening from 0.71px at 10px to\n1.6px at 16px; reserve Voyage, a theatrical serif, exclusively for display\nheadlines at 46-180px, never smaller. Open with a split three-cluster nav\n(left links, centred wordmark, right links, no background) beneath a\nfull-bleed hero photograph masked by a custom arch clip-path — the only\ncurved shape on the page. Mark every interactive element with a single\n1px apricot `#ffdead` underline offset below the text; no filled or\noutlined buttons exist. Pin a narrow vertical side tab with rotated\nuppercase text to the right viewport edge. Set secondary photography inside\ndark `#000e13` inset frames, like prints behind glass. Keep 60px section\ngaps and generous 30-60px outer gutters; no shadows anywhere.", "Image recipe": "Documentary-naturalistic photograph of [SUBJECT] — a sailing yacht on open\nwater shot from astern or three-quarter angle, high-key natural daylight\nwith no colour grading beyond natural blue water and sky, coastline visible\nin the background, no studio staging, presented full-bleed and masked by an\narch silhouette at the top edge for hero use, or set inside a dark inset\nframe for secondary editorial use.", "Photo search": "Unsplash first, Pexels second.\n- \"sailing yacht open water aerial astern\"\n- \"sailboat mediterranean coastline natural light\"\n- \"yacht deck teak detail natural light\"\n- \"sailing vessel wake ocean documentary\"", "Reference lock": "Primary reference/direction: Miti Navi — linen-paper yacht chapbook, arch-\nmasked hero, monospaced editorial UI with a single apricot underline accent.\nPreserve (3-5 traits): linen `#e6dece` as the site's only surface colour, no\nwhite or light-gray tint anywhere; 0px radius on every element except the\none arch-masked hero photograph; GT Pressura Mono for all functional text\nwith tracking widening at larger sizes; Voyage reserved for display only\n(46-180px), never below 46px; no filled buttons — every action is a plain\nmono link with a single 1px apricot underline.\nBorrow only (1-2): the arch clip-path hero mask; the rotated vertical\nside-tab margin marker.\nRole rules: apricot never becomes a fill or a large surface; Voyage never\nsets body copy, nav or buttons; dark `#000e13` insets are reserved for\nphotography, never for text-only cards.\nMedia strategy: photo:unsplash — documentary-naturalistic yacht and coastal\nphotography, high-key natural light, no studio staging; no illustration.\nReject: any filled or outlined (non-underline) button; border-radius on any\nelement outside the hero arch; box-shadow or elevation; white or light-gray\nsurfaces; Voyage below 46px.\nToken commitments: bg/card `#e6dece`, image-inset `#000e13`, ink `#232323`,\nmuted `#999999`, accent `#ffdead`, hard-black `#000000`; display Voyage 400\nat 46-180px/leading 0.90-0.94; body GT Pressura Mono 400 at 10-16px/leading\n1.4/0.71-1.6px tracking; radius 0px universal; page max-width 1200px,\nsection gap 60px."}, "has_extract": true}, {"slug": "mode", "title": "Mode", "url": "https://mode.com", "captured": "2026-09-04", "family": "sage-greenhouse-bi", "dna": "Botanical-editorial SaaS canvas x tight-tracked serif display headlines", "register": "modern clean", "grammar": "split stage", "lane": "A pale sage canvas replaces sterile SaaS white behind a tightly-tracked serif headline and a documentary photo of a real team, with depth built entirely from a sage-to-forest-to-chartreuse colour stack instead of shadows", "mode": "persuade", "traits": ["\"56-96px serif display", "single weight", "negative tracking\"", "\"sage canvas", "never pure white\"", "\"one chartreuse accent", "one filled button only\"", "\"4px radius interactive", "16px radius surfaces\"", "\"zero shadow", "colour-stack depth\"", "\"documentary human photography", "no stock\""], "palette": ["#eef2e3", "#fcfcfc", "#000000", "#043f2e", "#c8f169", "#2a6f2b"], "type": ["Grenette", "Graphik"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://mode.com", "has_image": true, "img": "../design-catalogue/entries/mode/fold.webp", "full": "../design-catalogue/entries/mode/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. Pale sage `#eef2e3` replaces the default SaaS white as the page canvas,\nwith true white (`#fcfcfc`) reserved strictly for elevated cards — a distinction\nthe source calls out as deliberate, not a fallback. Depth is built from a\nthree-layer colour stack (sage → forest → chartreuse) rather than shadow: each\nlayer is both a surface and a hierarchy signal, so \"how dark is this section\"\ndoubles as \"how important is this content.\"\n\nGrenette, a custom serif, is locked to display sizes 36px and above at a single\nweight (400) with aggressive negative tracking that intensifies with scale\n(-0.72px at 36px down to -2.98px at 96px) — the source is explicit that this\nserif/sans contrast at large sizes is the signature and must never be broken by\nsetting Graphik at display size instead. Graphik itself is reserved for\neverything functional, with positive tracking (0.06em) turning small uppercase\ntext into eyebrow labels.\n\nChartreuse `#c8f169` is fenced to exactly one job: it is \"the only filled button\ncolor in the system,\" never a decorative wash, never a second accent alongside\nVivid Green (which is fenced off in turn to data-visualization only). Combined\nwith a strict two-radius rule (4px for every interactive control, 16px for every\ncard and large surface, nothing between), the whole interface reads as warm and\nintellectual rather than corporate — \"BI without the corporate coldness,\" as the\nsource puts it.", "What to borrow (principle)": "- **Replace default white with a warm, named canvas colour.** Distinguishing\n  \"page background\" from \"elevated card background\" with two different near-\n  white values gives elevation meaning without a shadow.\n- **Lock a serif to a strict size floor, one weight only.** Grenette never\n  appearing below 36px, and never bolding, keeps the serif's \"editorial\n  authority\" from being diluted into a body-text role it can't carry.\n- **Increase negative tracking with size, not just leading.** Progressive\n  tightening (-0.72px to -2.98px) is what keeps a 96px serif headline from\n  reading as merely stretched.\n- **Fence the single accent colour to one component type.** Chartreuse existing\n  only as the filled-CTA background — never a wash, never a second badge colour\n  — keeps the \"singular chromatic punctuation\" claim actually true.\n- **Split radius into exactly two values by role.** 4px for anything clickable,\n  16px for anything that contains — an easy, auditable rule with no exceptions.", "What to leave": "- A dedicated data-visualization-only accent (Vivid Green) alongside the primary\n  action accent (Chartreuse) is a subtle distinction that's easy to blur under\n  product pressure — a chart accidentally reusing the CTA colour would break the\n  \"one accent, one job\" contract silently.\n- Grenette's display-only restriction (never below 36px) requires genuine\n  editorial discipline in a growing product; feature teams will be tempted to\n  reach for the serif at smaller sizes for \"brand feel\" and need a firm no.\n- The photography rule — \"documentary, human, never staged stock\" — is a real\n  production cost; a team without access to genuine team photography will\n  default to stock that breaks the register immediately.", "Signature move": "The forest stat card: a Deep Forest `#043f2e` card holding a single large metric\n(e.g. \"8.2K\") in Paper White, with its label set in Chartreuse — the one place\nthe accent colour is used as text rather than a fill, and the densest, most\ninformation-forward card in an otherwise airy system.", "Motion": "(from designlang extract) Feel reads as springy, correcting the earlier \"no\nmotion tokens\" read — this is a genuinely animated product page. A plain `ease`\ncurve carries the bulk of interactions (102 uses) across five duration steps\nfrom 150ms to 1s, but a true spring/overshoot curve, `cubic-bezier(0.75, 0,\n0.29, 1.01)`, also appears (3 uses) — the source of the \"springy\" feel rating,\nmost likely on a card or button press-state. A `scroll` keyframe (slide-x\ntransform, 2 uses) drives at least one horizontally-scrolling strip, separate\nfrom the third-party Calendly-widget bounce keyframe also present in the\nstylesheet (not brand motion). (observed in capture) the live capture shows a\ndismissible top announcement banner and a hero composed of overlapping sage and\nforest card shapes; the primary CTA's documented hover behaviour (chartreuse\ndarkening toward Forest Mid) is a colour shift, not movement — consistent with\ndepth staying in the colour stack even while other elements on the page do move.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 150ms | `ease` |\n| sm | 200ms | `ease` |\n| md | 350ms | `ease` |\n| lg | 500ms | `ease` |\n| xl | 1s | `ease` |\n| spring/overshoot | — | `cubic-bezier(0.75, 0, 0.29, 1.01)` |", "Brief": "Build a business-intelligence product marketing page. Canvas is pale sage\n`#eef2e3` — never pure white; elevated cards and the nav bar use paper white\n`#fcfcfc`. Deep Forest `#043f2e` carries dark sections and stat cards; Chartreuse\nLime `#c8f169` is the only filled-button colour in the entire system, with Forest\nMid as its hover state. Set every headline 36px and above in Grenette serif,\nweight 400 only, tracking tightening from -0.72px at 36px to -2.98px at 96px;\nkeep Graphik for all body, nav, and UI text, with 0.06em positive tracking on\nuppercase eyebrow labels. Radius is either 4px (buttons, inputs, tags) or 16px\n(cards, images, stat blocks) — nothing between. Open with a two-column hero: a\nGrenette headline plus a Deep Forest stat card on one side, a sage-matted\ndocumentary photograph of a real team on the other, a filled chartreuse \"Try for\nfree\" button paired with a ghost \"Request demo\" button. Alternate sage and white\nsection bands with 56-80px gaps below. No box-shadow anywhere — depth comes only\nfrom the colour stack.", "Image recipe": "Documentary photograph of [SUBJECT] — real people at desks or collaborating over\nscreens, candid unstaged body language, warm natural window light, genuine office\nor workspace setting, no posed corporate stock composition, no colour overlay or\nduotone treatment, presented uncropped within a 16px-radius sage-matted frame.", "Photo search": "Unsplash first, Pexels second.\n- \"team collaborating desk candid natural light\"\n- \"coworkers reviewing screen office documentary\"\n- \"data analyst workspace candid\"\n- \"colleagues meeting table natural light\"", "Reference lock": "Primary reference/direction: Mode — botanical-editorial BI product page, tight-\ntracked serif display, single chartreuse accent on a sage/forest colour stack.\nPreserve (3-5 traits): pale sage `#eef2e3` canvas distinct from paper-white\n`#fcfcfc` elevated cards; Grenette serif locked to 36px+ at weight 400 only,\ntracking tightening with size; Chartreuse `#c8f169` as the sole filled-button\ncolour, never a decorative wash; radius fixed at 4px (interactive) or 16px\n(surfaces), nothing between; zero box-shadow, depth from the sage → forest →\nchartreuse colour stack only.\nBorrow only (1-2): the Deep Forest stat card with chartreuse label text; the\ndismissible top announcement banner pattern.\nRole rules: Grenette never sets text below 36px or above weight 400; Vivid Green\nstays confined to data-visualization, never a UI accent; more than one\nchromatic accent never appears in a single viewport.\nMedia strategy: photo:unsplash — warm, candid, documentary workplace photography\nonly; no staged stock, no duotone or colour-overlay treatment.\nReject: pure white as page background; a bold or italic Grenette headline; a\nsecond filled-button colour; box-shadow on any card or button; radius values\noutside {4px, 16px}.\nToken commitments: bg `#eef2e3`, card `#fcfcfc`, accent `#c8f169`, accent-hover\n`#2a6f2b`, dataviz `#78c51c`, ink `#000000`, forest `#043f2e`; display Grenette\n400 at 36-96px/leading 0.90-1.10/-0.72px to -2.98px tracking; body Graphik\n400-600 at 12-18px; radius 4px buttons/inputs/tags, 16px cards/surfaces; page\nmax-width 1200px, section gap 56-80px."}, "has_extract": true}, {"slug": "monologue", "title": "Monologue", "url": "https://www.monologue.to/", "captured": "2026-09-04", "family": "velvet-library-cyan-spark", "dna": "400px italic-serif ghost wordmark x embossed physical product device", "register": "cinematic dark", "grammar": "split stage", "lane": "A near-black canvas carries an italic serif headline over generous whitespace while a 400px ghosted wordmark bleeds across the full viewport behind it, and a single physical-feeling white product device — complete with an embossed stamp badge — anchors the centre with the page's only saturated colour", "mode": "persuade", "traits": ["400px ghost wordmark as background layer", "italic Instrument Serif at every display size", "\"DM Mono for all UI chrome", "never prose\"", "\"one electric cyan spark", "2-3 uses per screen\"", "physical multi-layer shadow on the product device only", "\"fully rounded pills", "generous card radii\""], "palette": ["#000000", "#191919", "#282828", "#19d0e8", "#ffffff", "#7f7f7f"], "type": ["Instrument Serif", "Geist Mono", "Geist"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://www.monologue.to/", "has_image": true, "img": "../design-catalogue/entries/monologue/fold.webp", "full": "../design-catalogue/entries/monologue/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. The canvas is void black with a five-step gray scale for card surfaces\n(midnight → graphite → charcoal → slate), and exactly one chromatic accent,\nelectric cyan, is capped at \"2-3 times per screen\" — the source's own language\nfor it is \"a spark, not a wash.\" Everything else in the system, including the\nprimary CTA button, stays in white or near-black; cyan is reserved for punctuation\nonly, never for a large surface.\n\nThree typefaces carry three strictly separate jobs. Instrument Serif, always set\nin italic, is the only display face — it runs from a 400px ghosted background\nwordmark down to 28px pull-quotes, with negative tracking that intensifies at\nscale. Geist Mono owns every piece of UI chrome (labels, tags, button text,\nmetadata) with a slight positive tracking that gives small system text a\ndeliberate, spaced-out quality — the designlang extract shows this face\nself-hosted as `geistMono` and used across 1,372 elements, correcting the\noriginal \"DM Mono\" read to the actual Vercel Geist Mono cut. Geist, at a\nslightly-larger-than-default 17px, is reserved purely for prose. The rule the\nsource states outright — \"never mix these roles\" — is what keeps a three-font\nsystem from reading as inconsistent.\n\nElevation is rationed as tightly as colour: the void canvas and flat cards carry\nno shadow at all, but the one physical hero object — the white product device —\ngets a genuinely complex multi-layer inset-and-outset shadow stack that makes it\nread as a real object resting on a dark surface. Confining that shadow complexity\nto a single element is what makes the device feel tangible against an otherwise\npaper-flat interface.", "What to borrow (principle)": "- **Cap a chromatic accent to a stated frequency, not just \"sparingly.\"** \"2-3\n  times per screen\" is a rule a design review can actually check.\n- **Assign each typeface exactly one job and never let them overlap.** Serif for\n  voice, mono for system chrome, sans for prose — mixing any two roles breaks the\n  reading a viewer has learned.\n- **Reserve complex shadow layering for one hero object only.** A flat system\n  with a single, genuinely dimensional \"real thing\" makes that object read as\n  physically present rather than merely decorated.\n- **Let the wordmark become atmosphere, not chrome.** A giant, ghosted brand name\n  behind the content (rather than in a header) can carry identity continuously\n  without taking up functional space.\n- **Tighten serif tracking at scale, open mono tracking at small sizes.** Two\n  opposite tracking rules, each serving its own face's job, is more legible than\n  one flat tracking value applied everywhere.", "What to leave": "- A 400px background wordmark demands a short brand name and a very tall hero\n  section to avoid overwhelming the content sitting on top of it.\n- Complex multi-layer inset/outset shadows on a single \"hero object\" require a\n  genuinely well-modeled asset (the source lists four distinct shadow layers for\n  the product device) — a flatter illustration would not survive the same\n  treatment.\n- Locking Instrument Serif to italic-only at every size is a strong brand\n  commitment; any content team that needs an upright serif for a different\n  register will need to introduce a second face, which the system's \"never mix\n  roles\" rule doesn't accommodate.", "Signature move": "The embossed \"Made by [Parent]\" stamp badge: a small scalloped, postage-stamp-\nshaped badge with a heavy inset shadow, overlapping the top edge of the product\ndevice — a single physical-feeling attribution mark that reads as pressed into\nthe object rather than a flat logo lockup.", "Motion": "(from designlang extract) Feel reads as responsive, and the page is scroll-linked\n— this corrects the earlier \"no explicit tokens\" read substantially: the site\nruns a genuinely rich choreography system. Five duration steps run from an\ninstant 40ms up to 460ms, mostly on ease-out curves (69 uses across three related\nbeziers, e.g. `cubic-bezier(0.22, 1, 0.36, 1)`), with a slower custom\n`cubic-bezier(0.77, 0, 0.175, 1)` for a handful of larger moves. Ten distinct\nkeyframes are confirmed firing: `feature-app-float` (a slide-transform loop, 12\nuses) most likely gives the feature app icons a gentle floating bob;\n`feature-app-orbit-clockwise` (rotate) suggests at least one icon orbits the hero\nproduct device, extending the \"physical object\" metaphor into motion, not just\nshadow; `dictation-caret-blink`/`feature-caret-blink` (opacity fade) simulate a\nlive text cursor; `testimonial-enter`/`testimonial-progress` (slide-y + scale)\ndrive an auto-advancing testimonial carousel; `product-story-progress` (scale)\nand `product-story-copy-in` (slide-y) stage a scrollytelling reveal; and\n`trusted-logo-scroll` (slide) drives a logo marquee. (observed in capture) given\nthe \"physical device\" metaphor and multi-layer shadow treatment, the static hero\nframe the live capture caught is consistent with a page that is normally far more\nanimated than a single screenshot suggests.\n\n| Token | Value | Easing |\n|---|---|---|\n| instant | 40ms | ease-out family |\n| xs | 90ms | ease-out family |\n| sm | 160ms | ease-out family |\n| md | 260ms | ease-out family |\n| lg | 460ms | `cubic-bezier(0.77, 0, 0.175, 1)` (larger moves) |\n| feature-app-float | slide, loop | 12 uses |\n| feature-app-orbit-clockwise | rotate | 1 use |\n| testimonial-enter / -progress | slide-y + scale | carousel |", "Brief": "Build a dark-mode productivity-app landing page. Canvas is void black `#000000`;\ncards step through midnight `#191919`, graphite `#282828` and charcoal `#363636`\nwith no shadow at any of those levels. Electric cyan `#19d0e8` is the only\nchromatic accent, appearing at most 2-3 times per screen — an inline text\nemphasis, a thin border, or a product-screen gradient, never a button fill. Open\nthe hero with an italic Instrument Serif headline at 64-96px, negative tracking\nintensifying with size, over a 400px ghosted wordmark bleeding behind the content\nas a background layer. Use DM Mono, slightly positively tracked, for every label,\ntag, and button — including a white, fully-rounded pill download button, the\nsystem's one light-on-dark surface. Render a single hero product device with a\ngenuinely complex multi-layer shadow (inset and outset combined) so it reads as a\nphysical object, complete with a small embossed attribution stamp overlapping its\ntop edge. Keep body copy in Geist at 17px, left-aligned, never centred except for\ntestimonials and the wordmark itself. Section gaps run 80px.", "Image recipe": "Not primarily photographic — the hero visual is a rendered physical product\ndevice (a rounded white hardware object with a gradient teal screen) rather than\na photograph. Where supplementary imagery is needed: a dark, textured [SUBJECT]\nclose-up (fabric ripple, water undulation) at very low contrast, used purely as\natmospheric background texture behind type — never a literal photographic\nsubject, never lit brightly enough to compete with the headline.", "Photo search": "Unsplash first, Pexels second.\n- \"dark texture ripple abstract background\"\n- \"black fabric wave texture close up\"\n- \"dark water surface ripple minimal\"\n- \"abstract dark gradient texture\"", "Reference lock": "Primary reference/direction: Monologue — void-black productivity app with a\n400px ghost-wordmark hero and a single physical product device.\nPreserve (3-5 traits): void-black `#000000` canvas stepping through a five-tier\ngray card scale, no shadow at any card level; italic Instrument Serif as the only\ndisplay face at every size, DM Mono for all UI chrome, Geist for prose only —\nnever mixed; electric cyan `#19d0e8` capped at 2-3 appearances per screen, never\na button fill; complex multi-layer shadow reserved for exactly one hero product\nobject; fully-rounded pill radius for buttons and tags, 12-40px for cards and the\ndevice body.\nBorrow only (1-2): the ghosted 400px background wordmark; the embossed\nscalloped attribution stamp badge.\nRole rules: cyan never becomes a large surface fill; Instrument Serif never sets\nbody prose or drops below 28px; DM Mono never carries paragraph copy.\nMedia strategy: 3D/product render for the hero device; supplementary photography\nstays dark, textural, and low-contrast — no lifestyle or people photography.\nReject: a bright or warm second accent colour; heavy shadow on flat text cards;\na proportional (non-mono) font for system labels; centred body paragraphs\noutside testimonials.\nToken commitments: bg `#000000`, card `#191919`, interactive `#282828`, accent\n`#19d0e8`, ink `#ffffff`, muted `#7f7f7f`; display Instrument Serif italic 400 at\n28-96px/
