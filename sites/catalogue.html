\"", "Reference lock": "Primary reference/direction: HappyRobot — cream enterprise pitch, serif claims over sans\nproof, stat pairs as the persuasion device.\nPreserve (3-5 traits): warm cream ground `#ECE8E3` with near-black ink `#1B1814`; old-style\nserif (Tobias-class) reserved for headlines only; small functional-grotesque kickers and\nbody in one weight; proof delivered as logo walls and paired stat cards, never prose\nclaims; black pill CTAs as the only saturated shape on the page.\nBorrow only (1-2): the single tan/accent announcement bar at the very top; the dark\nembedded-video frame as a mid-page break.\nRole rules: serif never sets a label or button; sans never sets a headline; colour\nappears on at most two elements per screen (announcement bar, CTA); photography stays\ndesaturated within the page's tonal range, never full-saturation.\nMedia strategy: photo:unsplash — documentary industrial/logistics stills, muted and cool,\nalways cropped into a grid tile, never a full-bleed emotional hero.\nReject: full-bleed saturated hero photography; decorative line-art with no informational\nrole; more than one accent colour; centred marketing copy blocks; animated counters or\ngradient CTAs.\nToken commitments: bg `#ECE8E3`, bg-alt `#B7B2AA`, ink `#1B1814`, ink-soft `#584736`,\nstone `#7F7D72`; display `Tobias` (or nearest old-style serif), body/label `Suisse Intl`\n(or Suisse-class grotesque); headline set large with tight leading, body and labels one\nconsistent small size; grid strictly ruled, generous vertical whitespace between chapters."}, "has_extract": true}, {"slug": "harkcap", "title": "Hark Capital", "url": "https://www.harkcap.com", "captured": "2026-09-04", "family": "glass-monolith-finance", "dna": "3D glass-render hero x flat institutional finance grid", "register": "modern clean", "grammar": "split stage", "lane": "A rotating 3D glass monolith fills the hero under one restrained headline, then the page drops to flat white sections of stats, story and a hoverable team roster", "mode": "persuade", "traits": ["3D rendered glass hero object", "steel-blue to white gradient ground", "flat white content sections", "numeric stat tiles on photographic band", "hover-reveal team photo list", "sparse dot-labelled section kickers", "expandable corner nav"], "palette": ["#F3F3F3", "#181818", "#062541", "#114167", "#235E80", "#00F2E5", "#919598", "#D4D4D4"], "type": ["Aeonikpro", "Suisseworks Webs"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "institutional", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://www.harkcap.com", "has_image": true, "img": "../design-catalogue/entries/harkcap/fold.webp", "full": "../design-catalogue/entries/harkcap/shot.webp", "sections": {"Why it works": "The hero is doing one job: a large, glossy, 3D-rendered glass volume — closer to\nproduct-render than illustration — fills almost the entire first viewport behind\na two-line headline (\"Pioneers in NAV financing\") set small relative to the\nobject. The type stays modest deliberately; the render carries the authority\nsignal that a finance site usually gets from photography of a skyline or a\nhandshake. One typeface (Aeonikpro, a plain geometric grotesque) runs the whole\npage at every size, so nothing about the type competes with the object — the\nrender is the only \"designed\" element, everything else is quiet infrastructure\naround it.\n\nBelow the fold the page flattens hard: pure white ground, small dot-prefixed\nkickers (\"Who We Are\", \"Core Stats\"), body copy in the same grotesque at\nparagraph size. The one return to the blue-glass palette is a stat band —\n2013 / $2.1B+ / 70+ / 4 — laid directly over a close crop of the same rendered\nmaterial, tying the numbers visually back to the hero object rather than\npresenting them as a generic dashboard.\n\nThe team section swaps the pattern again: a plain list of names in light grey,\nwith the row under the cursor turned to solid black text and a portrait photo\nappearing beside it. Identity is withheld until the reader engages — a quieter,\nmore editorial way to present a roster than the usual grid-of-headshots.\n\nThe extract also surfaces a real electric-cyan accent (`#00f2e5`, used 60\ntimes in CSS) and a secondary display face, Suisseworks Webs, used sparingly\nalongside Aeonikpro — the render's blue-grey material isn't the whole\nbrand palette, and the \"one grotesque\" read holds for scale but not for\nabsolute exclusivity.", "What to borrow (principle)": "- **Use one 3D-rendered hero object as the entire authority signal**, and keep\n  the headline small enough that the object, not the type, is what the eye\n  reads first.\n- **Return to the hero's exact material once, for the numbers** — stats sitting\n  on the same glass-blue crop reads as \"these numbers come from that thing,\"\n  not as a disconnected metrics widget.\n- **Withhold team photos until hover** — a roster of grey names with one photo\n  revealed at a time reads more restrained than a wall of headshots, and gives\n  the page an interaction moment in an otherwise static list.\n- **Run the whole page on one grotesque at every weight** so a heavy visual hero\n  never has to fight a second typeface for attention.", "What to leave": "- The stat band's numbers sit low-contrast against the glass photography in\n  places (white-on-light-blue) — legibility is closer to \"reads at full\n  attention\" than \"reads on a skim.\"\n- The expandable \"Click to Expand\" corner nav is a small extra interaction step\n  before the reader can see the primary nav items, which are otherwise just\n  three links.\n- The hero object, while striking, carries no explicit metaphor tied to NAV\n  financing in the copy — it's abstract polish rather than idea made visual.", "Signature move": "The hover-reveal team roster: a stacked list of names in flat grey, with the\nrow under the pointer turning solid black and a portrait photograph appearing\nbeside it — identity given only to the person currently being read, not to the\nwhole list at once.", "Motion": "(from designlang extract) The extract rates overall feel \"smooth\" with\nconfirmed scroll-linked behaviour. Duration steps run from an effectively\ninstant 1ms state toggle up to 300ms, almost entirely on a plain `ease-in-out`\ncurve (186 uses, just `ease`) rather than a custom bezier or spring — restrained\nby design, in keeping with the render-carries-the-authority read above. A\n`--transition-smooth: all 400ms ease-out` custom property also appears,\nlikely governing the hero object itself. Two named keyframes in the\nstylesheet, `move-in` (a clip-path polygon wipe from a closed sliver to full\nreveal) and `move-out` (opacity 1→0.4), read as the mechanism behind the\nhover-reveal team roster in the Signature move below — a wipe-in for the row\ngaining focus, a dim-out for the rest — though neither registers as \"in use\"\nin the extract's runtime scan, so this is inferred from the keyframes'\ndefinitions and names, not confirmed live. A `spin` keyframe is also defined\nbut unused. (inferred from image) The hero object's framing differs between\nthe raw screenshot and the fresh capture, still consistent with the render\nrotating or the camera moving on load/scroll.\n\n| token | duration | easing |\n|---|---|---|\n| `instant` | 1ms | ease-in-out (`ease`) |\n| `sm` | 200ms | ease-in-out (`ease`) |\n| `md` | 300ms | ease-in-out (`ease`) |\n| `--transition-smooth` | 400ms | ease-out |", "Brief": "Build an institutional finance hero around one large 3D-rendered glass or metal\nobject, ideally something evoking the firm's structure, filling most of the\nfirst viewport in cool blue-grey tones (`#81A0B0`, `#446A87`, `#263240`) against\na light ground. Keep the headline to two short lines, set small relative to the\nobject, in one plain geometric grotesque used everywhere on the page. Drop to a\nflat white body with small dot-prefixed section kickers and modest paragraph\ncopy. Present core stats as large numerals laid over a close crop of the same\nhero material, not on a plain background. For a team page, list names in flat\ngrey and reveal a portrait photo only for the row under the pointer.", "Image recipe": "Photorealistic 3D render of an abstract glass or brushed-metal geometric\nvolume, cool blue-grey lighting, soft studio gradient background fading from\nsteel blue to near-white, glossy specular highlights along hard edges, shallow\ncamera angle emphasising one corner or fold of the object, no text or logo\nbaked into the render.", "Photo search": "Unsplash first, Pexels second (for the team/office secondary imagery only — the\nhero itself is a bespoke 3D render, not stock photography).\n- \"abstract glass geometric render blue\"\n- \"corporate team portrait studio grey background\"\n- \"office glass architecture minimal\"", "Reference lock": "Primary reference/direction: Hark Capital — 3D glass-render hero, flat white\ninstitutional body, hover-reveal team roster.\nPreserve (3-5 traits): one large 3D-rendered glass/metal object filling the\nhero, restrained two-line headline set small against it; one grotesque\n(Aeonikpro or equivalent) at every size on the page; stat numerals laid over a\ncrop of the hero's own material rather than a plain background; team roster as\na list of names with photo revealed only on hover.\nBorrow only (1-2): the \"Click to Expand\" corner nav pattern; dot-prefixed\nsection kickers.\nRole rules: the hero object is the only large-scale visual device on the page —\nno second hero-scale image competes with it; body sections stay flat white with\nno gradient; stat band is the only place the hero's blue-glass material recurs.\nMedia strategy: 3D render (bespoke, not stock) for the hero material; plain\nstudio portrait photography for team headshots, revealed on hover only.\nReject: photographic skyline/handshake hero imagery in place of the rendered\nobject; grid-of-headshots team layout; a second display typeface.\nToken commitments: ink `#181818`, ground `#F3F3F3`, glass-light `#81A0B0`,\nglass-mid `#5786A6`, glass-deep `#446A87`, glass-shadow `#263240`; body/display\n\"Aeonikpro\" throughout."}, "has_extract": true}, {"slug": "horai", "title": "Hōrai", "url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/horai.html", "captured": "2026-09-03", "family": "lacquer-house", "dna": "Kaiseki menu card x Roman inscriptional caps", "register": "cinematic dark", "grammar": "chaptered editorial", "lane": "Full-bleed dining photograph, then alternating cream menu leaves and near-black lacquer chapter panels, each menu a ruled row with a Roman numeral and a price, closing on a dark reservations spread", "mode": "persuade", "traits": ["alternating cream/lacquer panels", "Cinzel inscriptional caps", "Vollkorn body serif", "kanji section marks", "lacquer red accent", "Roman-numeral menu rows", "SEK prices set large", "word-by-word lede reveal", "fixed multiply grain"], "palette": ["#F8F1E8", "#F1E6D7", "#E5D9C8", "#241713", "#3D2F2B", "#77706B", "#A9000F", "#720000", "#2A5745"], "type": ["Cinzel", "Vollkorn", "Noto Serif JP"], "kind": "example", "source": "claude", "status": "ready", "category": "hospitality", "category2": "editorial", "origin": "example-site", "extract": "none", "source_url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/horai.html", "has_image": true, "img": "../design-catalogue/entries/horai/fold.webp", "full": "../design-catalogue/entries/horai/shot.webp", "sections": {"Why it works": "The page is built as a restaurant's own printed matter: a cream menu leaf, then a\nblack lacquer card, then a cream leaf again. The alternation does the chaptering,\nso the page needs no navigation and no scroll cues — you always know whether you\nare reading the house talking (cream) or the house posing (lacquer).\n\nThree typefaces, three jobs, no overlap. Cinzel — an inscriptional Roman capital —\nis used only for names, numerals and prices, never for a sentence. Vollkorn sets\nevery sentence and nothing else. Noto Serif JP carries a single kanji per section\n(家 house, 献 menus, 予約 reservations) as a section mark, not as decoration. The\nkanji is the only thing on the page allowed to be purely graphic, and it earns it\nby being the section's index.\n\nPrices are the loudest type on the page. `1,480` and `2,180` are set in Cinzel at\ndisplay size in lacquer red with `SEK · PER GUEST` in tracked caps underneath. A\ntasting-menu restaurant that hides its price loses the guest at the door; this one\nmakes the number the visual reward at the end of each row.\n\nRestraint in the accent is what keeps it expensive-looking. Lacquer red `#A9000F`\nappears on kanji, section titles, prices and one URL — perhaps eight elements on a\npage of this length. Everything else is warm ink on warm paper, or cream on\nnear-black. There is no second accent and no gradient anywhere.\n\nThe menu rows are honest three-part records: numeral and name at the left, spec\nline in tracked caps beneath (`世界 · NINE COURSES · THE HOUSE MENU`), service days\nat the bottom, price at the right, hairline rule between rows. It reads as a card\nyou could hand to a guest, which is the point.", "What to borrow (principle)": "- **Let alternating grounds do the chaptering.** Cream leaf / dark panel, repeated,\n  replaces section headers, dividers and a nav bar all at once.\n- **One face per job, enforced.** Inscriptional caps for names and numbers, a\n  bookish serif for sentences, a third face for exactly one glyph per section. Never\n  let the caps face set a sentence.\n- **Set the price at display size.** The number, in the accent colour, with the\n  currency and unit in small tracked caps beneath it, is the strongest close on the\n  page.\n- **One glyph as section index.** A single kanji (or any non-Latin mark) above each\n  section title indexes the page memorably without a numbering system.\n- **Cap the accent at a handful of elements.** One red, used on kanji, titles,\n  prices and one link — nothing else gets colour.", "What to leave": "- The fixed `mix-blend-mode: multiply` grain at 0.42 opacity — a full-screen\n  composited layer for a texture that mostly just mutes the food photography, which\n  is the one thing a restaurant page must keep appetising.\n- Hero body copy set directly on the busy photograph at the right edge. In the\n  capture it is unreadable — the plate behind it is bright and there is no scrim.\n  Text over food photography needs a plate or a gradient, always.\n- The blanket `document.querySelectorAll('article, figure, h2, h3')` reveal at 1.3s.\n  In the middle of a long menu list it means half the rows are still faded when the\n  reader arrives at them.\n- The word-by-word lede fade (`.word { opacity: 0.18 }`). It is charming for one\n  paragraph and it means that paragraph is unreadable for the first second — use it\n  on the lede only, and never on anything a reader might scroll back to.", "Signature move": "The menu row as a ledger line: Roman numeral · romanised name in inscriptional\ncaps · kanji and course count in tracked micro-caps · a paragraph of what the menu\nactually is · service days · and the price alone at the far right in red at display\nsize, with a hairline rule closing the row. Three registers of type in one row,\neach doing exactly one job, and the number winning.", "Motion": "", "Brief": "Build a dark-and-cream restaurant page that alternates full-width cream paper\nleaves (`#F1E6D7`) with near-black lacquer panels (`#241713`), one alternation per\nchapter, no nav beyond a fixed wordmark and a single outlined RESERVATIONS button.\nOpen on a full-bleed documentary photograph of a dining room with the restaurant\nname set into it in cream inscriptional caps at ~14vw. Set all names, numerals and\nprices in Cinzel with 0.03–0.06em tracking; set all sentences in Vollkorn at\n1.15rem/1.75; put one kanji per section in Noto Serif JP above the section title.\nUse exactly one accent, a lacquer red `#A9000F`, on kanji, section titles, prices\nand one URL. Build the menu as ruled rows: Roman numeral, name, tracked micro-caps\nspec line, description, service days, and the SEK price at the right at display\nsize in red. Close on a dark reservations spread split by a vertical hairline, with\nthe address in cream caps and a footer line that names the typefaces.", "Image recipe": "Documentary interior and plate photography of [SUBJECT], shot available-light on\n35mm, warm tungsten and candle sources, shallow depth of field, one plane crisp,\ndeep unlit background falling to near-black, muted warm colour with cream\nhighlights and no colour-cast correction, taken from a guest's seated eye level —\nnever overhead, never on white, no styling props, no strobe.", "Photo search": "Unsplash first, Pexels second.\n- \"restaurant dining room candlelight documentary\"\n- \"plated tasting menu dish natural light dark\"\n- \"chef counter service warm interior\"\n- \"izakaya interior wood slats evening\"", "Reference lock": "Primary reference/direction: Hōrai — alternating cream-leaf and lacquer-panel restaurant page, Cinzel + Vollkorn + one kanji, price set at display size.\nPreserve (3-5 traits): alternation of cream `#F1E6D7` leaves and near-black `#241713` lacquer panels as the only chaptering device; Cinzel for names/numerals/prices and Vollkorn for all sentences, never crossed; one kanji per section as its index mark; menu rows as ruled ledger lines ending in a large red SEK price; lacquer red `#A9000F` as the only accent.\nBorrow only (1-2): the full-bleed photographic overture with the name set into it; the footer line that names the typefaces.\nRole rules: Cinzel never sets a sentence; Vollkorn never sets a label or a price; kanji appears once per section and never inside body copy; accent red on at most eight elements per page; tracked micro-caps capped at 11px and 0.18em.\nMedia strategy: photo:unsplash — available-light documentary interiors and plates, always captioned with menu and course number; never a bright white-background food shot.\nReject: fixed grain overlays; unscrimmed text over food photography; blanket scroll reveals on list rows; a second accent colour; any sans-serif; gradients.\nToken commitments: paper `#F8F1E8`, paper-warm `#F1E6D7`, paper-deep `#E5D9C8`, lacquer `#241713`, lacquer-soft `#3D2F2B`, stone `#77706B`, red `#A9000F`, red-deep `#720000`, jade `#2A5745`; display `Cinzel`, body `Vollkorn`, mark `Noto Serif JP`; display tracking 0.03–0.06em, micro-caps tracking 0.18em, body 1.15rem/1.75."}, "has_extract": false}, {"slug": "hungry-tiger", "title": "Hungry Tiger", "url": "https://www.eathungrytiger.com/", "captured": "2026-09-04", "family": "tandoor-wall-poster", "dna": "Spice-market signage type x raw unframed jar on a monochrome-warm canvas", "register": "illustrated dark", "grammar": "typographic poster", "lane": "A dark rust canvas carries dotted-gold section rules and display type up to 213px in a single wide-tracked face, with a raw product jar sitting straight on the canvas as the only image content on an otherwise 90%-type page", "mode": "persuade", "traits": ["\"up to 213px display", "single typeface everywhere\"", "\"gold-on-rust", "one heat-red badge exception\"", "\"pill radius on every control", "6px only on cards\"", "dotted gold rule as section divider", "\"raw unframed product", "no card\"", "low-opacity botanical watermark texture"], "palette": ["#faae33", "#823513", "#9f531b", "#402011", "#281006", "#d1255c"], "type": ["Salmond", "Graphikx"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "consumer-brand", "category2": "playful", "origin": "refero", "extract": "ok", "source_url": "https://www.eathungrytiger.com/", "has_image": true, "img": "../design-catalogue/entries/hungry-tiger/fold.webp", "full": "../design-catalogue/entries/hungry-tiger/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. Every surface in the system stays inside one warm-brown family — page\ncanvas, card, and deepest recess step from `#823513` to `#402011` to `#281006` with\nno box-shadow anywhere — so the single chromatic accent, Tiger Gold `#faae33`, is\nthe only thing capable of reading as \"lit.\" A second saturated colour, chili red\n`#d1255c`, exists but is fenced off entirely to heat-level badges, which keeps the\ngold-on-rust relationship from ever being diluted.\n\nA single typeface, Salmond, runs the entire page from an 11px caption to a 213px\ndisplay headline, with letter-spacing that scales inversely to size — tight\n(-0.02em) at monument scale, open (0.02em) at the smallest UI text. That inverse\nrelationship is what keeps a headline this large from reading as merely stretched:\nthe tightening at scale makes the huge type feel pressed together rather than\nblown up.\n\nImagery discipline mirrors the type discipline: the page is stated to run \"90%\ntype, 10% product,\" and the product itself is never framed — no card, no\nbackground plate — it simply sits raw on the Ember Rust canvas with a warm\nbacklight rim. Low-opacity botanical watermarks provide all the atmospheric\ntexture the page needs without ever competing with the display type sitting on\ntop of them.", "What to borrow (principle)": "- **Fence a second saturated colour to one narrow use.** Reserving chili red\n  strictly for heat-badges keeps the primary gold-on-brown relationship from ever\n  being diluted by a second \"loud\" hue.\n- **Scale letter-spacing inversely to size.** Tightening tracking as type grows\n  (and opening it as type shrinks) is what makes both extremes of a huge type\n  range feel intentional rather than merely resized.\n- **State an explicit image-to-type ratio.** Declaring the page \"90% type, 10%\n  product\" is a concrete brief that keeps photography from creeping into a\n  typography-led system.\n- **Let the product sit raw, with no card.** Skipping the frame/background-plate\n  convention makes the object read as physically present on the canvas rather\n  than as a photographed asset.\n- **Replace whitespace dividers with a printed rule.** A dotted line in the\n  accent colour gives \"label-printed\" section rhythm that plain whitespace\n  wouldn't provide on a single-colour dark canvas.", "What to leave": "- Display type up to 213px with a single-typeface-only rule leaves no room for a\n  secondary display face if a future sub-brand or campaign needs a different\n  voice — everything must be Salmond, at every scale.\n- The all-brown, no-cool-neutral constraint (\"do not dilute the gold-on-brown\n  palette with white, blue, green, or cool neutrals\") makes accessibility\n  contrast checking harder than a system with a neutral-white fallback surface.\n- Raw, unframed product photography with a backlight rim depends on genuinely\n  excellent studio lighting on every shot; a flat or poorly lit product photo\n  would read as a mistake rather than a deliberate \"no frame\" choice.", "Signature move": "The raw product showcase: the jar sits directly on the Ember Rust canvas with no\ncard, no background plate, and a subtle warm backlight rim — positioned as a\nsmall, precise anchor beneath 200px+ of display type, rather than as a\nconventional hero product shot.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked.\nDurations run 400ms, 450ms and a long 1.5s tier, with no named easing family\nconfidently parsed (interactions likely use inline, per-element bezier values\nrather than a shared token). The one keyframe the extract confirms firing is\n`spin` (a rotate transform) — direct confirmation of the live capture's read: the\nproduct jar animates in with a genuine rotation, not just a fall or fade.\n(observed in capture) the product jar sits mid-tumble/rotation over the \"TIKKA\nMASALA\" headline on load, so the spin most plausibly plays on entrance before the\njar settles into its resting position beneath the display type — consistent with\nthe poster-first, type-crowns-everything layout the source describes.\n\n| Token | Value | Easing |\n|---|---|---|\n| md | 400ms | — |\n| lg | 450ms | — |\n| xxl (entrance) | 1.5s | — |\n| spin keyframe | rotate transform | 1 use, drives product-jar entrance |", "Brief": "Build a maximalist condiment-brand landing page. Canvas is Ember Rust `#823513`\neverywhere, no max-width container; card surfaces step to Dark Spice `#402011`\nand the deepest recess to Charred Clove `#281006` — never a box-shadow. Tiger Gold\n`#faae33` is the only chromatic accent permitted to interrupt the brown family;\nreserve chili red `#d1255c` strictly for heat-level badges. Set a single typeface\neverywhere: 130-213px weight 700 at 0.80-0.90 line-height for hero/section\ndisplay, dropping to 11-18px for nav, badges and body, with letter-spacing that\ntightens at display size and opens at small sizes. Every button, badge, input and\nicon container is a full pill (9999px radius); reserve 6px radius for cards only.\nCrown each viewport with massive type first, then anchor a small raw product jar\nbelow with no frame or card. Use a 1px dotted gold rule as the divider between\nmajor sections, and a faint low-opacity botanical watermark layer behind content\nfor texture. Keep the page roughly 90% type, 10% product imagery.", "Image recipe": "Studio product photograph of [SUBJECT] — a single jar or bottle centred on a flat\nwarm-rust background, tight crop, subtle warm backlight rim suggesting practical\nlight rather than a studio softbox, sharp focus, no props, no surface reflection,\nno card or background plate — the object floats directly on the canvas colour.", "Photo search": "Unsplash first, Pexels second.\n- \"sauce jar product shot dark background rim light\"\n- \"spice jar warm background studio\"\n- \"condiment bottle product photography dark\"\n- \"botanical fern leaf illustration texture dark\"", "Reference lock": "Primary reference/direction: Hungry Tiger — tandoor-wall poster condiment page,\nsingle typeface at 213px, raw unframed product on warm-brown monochrome.\nPreserve (3-5 traits): warm-brown monochrome stepping `#823513` → `#402011` →\n`#281006`, zero box-shadow; Tiger Gold `#faae33` as the sole chromatic accent,\nchili red `#d1255c` fenced to heat badges only; single typeface (Salmond) at every\nsize, letter-spacing tightening at display scale and opening at UI scale; every\nbordered/filled control a full pill, 6px radius reserved for cards only; product\nphotography raw and unframed, page kept roughly 90% type / 10% image.\nBorrow only (1-2): the 1px dotted gold rule as section divider; the low-opacity\nbotanical watermark texture layer.\nRole rules: chili red never leaves badge context; no cool or white neutrals enter\nthe palette; display type never drops below 130px or exceeds 0.90 leading; a\nsecondary display typeface is never introduced.\nMedia strategy: photo:unsplash — tightly cropped, warm-backlit single-object\nproduct photography only; no lifestyle context, no hands, no kitchen setting.\nReject: box-shadow or glow on any component; a second bright accent outside heat\nbadges; framed/carded product imagery; solid alternating section-colour bands\n(every section stays Ember Rust); a secondary display face.\nToken commitments: bg `#823513`, card `#402011`, deepest `#281006`, accent\n`#faae33`, accent-2 `#9f531b`, heat `#d1255c`; display 130-213px weight 700/leading\n0.80-0.90/-0.02em to -0.005em tracking; body 11-18px/leading 1.2-1.43; radius 6px\ncards, 9999px everything interactive; page max-width 1440px, section gap 80-120px."}, "has_extract": true}, {"slug": "hyperborea", "title": "Hyperborea", "url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/hyperborea.html", "captured": "2026-09-03", "family": "nordic-solstice", "dna": "Conference poster x observatory diagram", "register": "illustrated dark", "grammar": "chaptered editorial", "lane": "Midnight-blue conference page lit by one amber sun that recurs as hero disc, drawn speaker portraits and a sundial diagram, running through day columns, a ruled ticket table and a letter-not-a-form close", "mode": "persuade", "traits": ["midnight blue ground", "single amber light source", "Italiana display", "Archivo micro-caps", "code-native SVG portraits", "day-column programme", "ruled ticket tiers with kr prices", "speaker name marquee", "kanji subtitle pairs"], "palette": ["#020916", "#0E1927", "#202A36", "#F2EADE", "#DDD3C4", "#FFA23D", "#C8682C", "#B3222A"], "type": ["Italiana", "Archivo", "Noto Serif JP"], "kind": "example", "source": "claude", "status": "ready", "category": "institutional", "category2": "editorial", "origin": "example-site", "extract": "none", "source_url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/hyperborea.html", "has_image": true, "img": "../design-catalogue/entries/hyperborea/fold.webp", "full": "../design-catalogue/entries/hyperborea/shot.webp", "sections": {"Why it works": "The whole page is lit by one light. An amber disc sits behind the headline, and\nevery subsequent illustration is a variation on it: a circled sun in an orbit, a\nsun setting behind a curve, two mountains, a fourteen-metre sundial. Nothing else\non the page is warm. Because the light source is single and consistent, a\nmidnight-blue page with no photography still reads as a place, not as a template.\n\nItaliana — a high-contrast didone display face — is used only in large sizes, where\nits hairlines survive; Archivo, a plain grotesque, takes every size below about\n18px. This is the correct division for a face like Italiana, and the page never\ncheats it: there is not one line of Italiana at caption size, and not one headline\nin Archivo.\n\nThe programme is three day columns, deliberately unaligned — Day 01 sits high, Day\n02 lower, Day 03 lower still, each under its own rule. The stagger reads as three\ndays descending rather than as a table of three equal cells, and it makes the whole\nprogramme legible in one glance without any timeline chrome.\n\nThe speakers are not photographed. Each gets a small drawn panel — a sun in an\norbit, two triangles, a horizon — built from flat shapes in the same amber, rust\nand slate. It sidesteps the mismatched-headshot problem that ruins most conference\npages, and it costs nothing to add a speaker.\n\nThe ticket tiers are set as ruled ledger rows: name, seat count and condition in\nmicro-caps, price at the right in Italiana. `0 kr · SEK · FUNDED` for the bursary\nrow is the most persuasive line on the page, precisely because it uses the same\nformat as the paid rows instead of being dressed up as a badge.", "What to borrow (principle)": "- **One light source, repeated.** Pick a single warm accent, give it a physical\n  identity (here: a sun), and let every illustration be a restatement of it. A dark\n  page with one consistent light needs no gradients and no second colour.\n- **Split the type by size, not by section.** A high-contrast display face above a\n  size threshold, a plain grotesque below it, with no exceptions in either\n  direction.\n- **Stagger parallel columns.** Three descending columns say \"three days\" better\n  than three aligned boxes.\n- **Draw the people.** Flat geometric panels in the page's own palette beat mixed\n  headshots, and they scale to any number of speakers.\n- **Put the free tier in the same table as the paid ones.** `0 kr` in the price\n  column, with the same rule above and the same micro-caps condition, sells harder\n  than any callout.", "What to leave": "- The hero copy collides at 1440×900: the lede paragraph overlaps the `WHERE\n  Studieshuset / Helgonavägen 3` block. Two absolutely-placed blocks in the same\n  region with no reserved space — give the hero a real grid row.\n- The 70-second infinite name marquee. It never stops, it says nothing a static\n  row of names would not, and it is a permanently animating layer behind every\n  scroll.\n- The blanket reveal on `section, h1, h2, h3, article, li, blockquote, figure` at\n  1.4s. On a page with a sixteen-item speaker grid that is sixteen staggered fades\n  the reader must wait out.\n- The fixed `mix-blend-mode: screen` overlay at 0.35 — it lifts the blacks of a\n  page whose whole argument is a dark room with one light in it.\n- The 18-second looping \"rise\" animation on the hero sun. The sun is a good idea\n  standing still; breathing it makes it decorative.", "Signature move": "Speakers as drawn panels. Every speaker gets a flat SVG built from the same four\nshapes — circle, triangle, arc, dot — in the page's amber, rust and slate, with the\nname in Italiana and the role and city in Archivo micro-caps beneath. The page\ngains a consistent portrait gallery that no photo commission could match for\ncoherence, and the illustration budget is a few dozen lines of markup.", "Motion": "", "Brief": "Build a midnight-blue conference page (`#020916` ground, `#0E1927` panels) lit by a\nsingle amber `#FFA23D`. Open with an oversized Italiana headline whose last word is\namber, a Japanese subtitle line beneath it in the same amber, and a large amber sun\ndisc bleeding off the right edge. Set every display line in Italiana and everything\nunder 18px in Archivo with 0.14em tracking — never cross them. Run a top status bar\nwith edition, tagline and dates in micro-caps. Lay the programme out as three\ndescending day columns, each with a rule above it, an amber day number, an English\ntitle, a Japanese title and one paragraph. Give every speaker a flat geometric SVG\npanel drawn from circles, triangles and arcs in amber, rust `#B3222A` and slate.\nSet ticket tiers as ruled rows with the price in Italiana at the right and the\nbursary row priced `0 kr`. Close on a two-column contact spread split by a vertical\nhairline, headline reading \"Write us a letter, not a form.\"", "Image recipe": "Flat geometric vector composition of [SUBJECT], drawn with three or four primitives\nonly — filled circle, triangle, thin arc, small dot — on a midnight-blue panel,\nsingle amber light source with one rust accent, no gradients, no texture, no\noutlines except a 1px amber orbit, generous empty space around the motif, motif\ncentred and small relative to the panel. Reads as an instrument diagram, not as an\nillustration.", "Photo search": "Code-native — draw in SVG, do not source photography. If a photograph is\nunavoidable:\nUnsplash first, Pexels second.\n- \"midnight sun horizon minimal\"\n- \"nordic winter landscape dark blue\"", "Reference lock": "Primary reference/direction: Hyperborea — midnight-blue conference page lit by one amber sun, Italiana over Archivo, code-native geometric speaker portraits.\nPreserve (3-5 traits): midnight-blue ground `#020916` with a single amber `#FFA23D` light source restated in every illustration; Italiana above 18px and Archivo below it, never crossed; three descending day columns as the programme; flat SVG panels instead of speaker photographs; ticket tiers as ruled rows with the price in Italiana at the right.\nBorrow only (1-2): the English/Japanese headline pairing; the \"letter, not a form\" contact close.\nRole rules: Italiana never sets anything under 18px; Archivo never sets a headline; amber is the only warm colour and rust `#B3222A` appears only inside illustrations; micro-caps capped at 11px and 0.14em; no photograph anywhere.\nMedia strategy: code-native — every image is flat SVG built from circle, triangle, arc and dot in the page palette.\nReject: infinite marquees; fixed screen-blend overlays; blanket scroll reveals across list items; looping ambient animation on the hero; gradients; stock speaker headshots.\nToken commitments: night `#020916`, panel `#0E1927`, slate `#202A36`, bone `#F2EADE`, bone-dim `#DDD3C4`, amber `#FFA23D`, amber-deep `#C8682C`, rust `#B3222A`; display `Italiana`, body `Archivo`, mark `Noto Serif JP`; display size floor 18px, micro-caps tracking 0.14em, body 1rem/1.6."}, "has_extract": false}, {"slug": "indoek", "title": "Indoek", "url": "https://indoek.com", "captured": "2026-09-04", "family": "cobalt-surf-wordmark", "dna": "Surf shop signage x gallery wordmark poster", "register": "warm photographic", "grammar": "typographic poster", "lane": "A cobalt outline wordmark fills the fold with a product photo windowed through its middle, then drops straight into a ruled shop/gallery grid — cream ground and one blue ink throughout", "mode": "experience", "traits": ["cream ground", "single cobalt-blue ink", "oversized outline wordmark", "photo windowed through headline letters", "surf-shop product photography", "ruled product grid", "no serif anywhere", "gallery + shop in one nav"], "palette": ["#EEEBE3", "#03315C", "#1B58A0", "#7294B0", "#B3C7D2", "#96775C"], "type": ["Calibre"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "editorial", "category2": "consumer-brand", "origin": "raw-url", "extract": "ok", "source_url": "https://indoek.com", "has_image": true, "img": "../design-catalogue/entries/indoek/fold.webp", "full": "../design-catalogue/entries/indoek/shot.webp", "sections": {"Why it works": "The entire page runs on one typeface and one ink colour. Calibre, a plain grotesque, sets\nthe giant outline wordmark, the nav, the body copy and the price tags identically — there\nis no display/body split at all. What creates hierarchy instead is pure scale: the\nwordmark is set at a size that breaks the viewport, everything else sits at conservative\nreading size, and the jump between the two is the entire type system. Cobalt blue\n(`#03315C`–`#1B58A0`) is the only ink on cream; it never competes with the product\nphotography because nothing else is coloured.\n\nThe hero repeats Indoek's own version of the windowed-photo device seen elsewhere in this\nset (compare theequityfund.org): a single product or gallery photograph sits inside the\ncounters of the wordmark, so the giant letters frame real merchandise rather than floating\nas empty branding. Because the photo changes (surf shack interior, gallery opening, a\ncraftsman at work) while the wordmark stays fixed, the hero can rotate content without\never needing a second layout.\n\nBelow the fold the page drops immediately into a ruled, ungapped product/gallery grid —\nbooks, prints, editorial features — with the same blue ink and the same Calibre labels.\nThe lack of a second visual register (no card shadows, no rounded corners, no accent) is\nwhat lets a shop, a gallery and a magazine share one page without feeling like three\ndifferent sites stitched together.\n\nThe copy voice stays third-person throughout rather than addressing the reader as \"we,\"\nwhich matches the gallery/catalog distance of the layout more than a typical direct-address\ncommerce voice (from designlang extract).", "What to borrow (principle)": "- **One typeface, hierarchy by scale alone.** Skipping a display/body split entirely and\n  using size as the only lever keeps the whole system legible and fast to extend.\n- **Window content through the wordmark, not beside it.** A hero photo inset into the\n  counters of oversized outline letters gets an image and a logo lockup in one move.\n- **One ink colour, unlimited photography.** Restricting the palette to a single blue lets\n  product and editorial photography carry all the colour variation.\n- **Let commerce and editorial share the same grid.** Shop items and gallery features in\n  identical ruled cells read as one coherent publication, not a store bolted onto a blog.", "What to leave": "- The wordmark's photo window can clip mid-word depending on image aspect ratio (visible\n  in both captures, different crops) — needs a locked mask ratio so the letterforms never\n  read as broken.\n- Long, information-dense hero copy set at the same weight as the wordmark's surrounding\n  text (\"CELEBRATING COASTAL CREATIVE CULTURE\") competes with the product photo for the\n  same visual band; a size step down would separate them more cleanly.\n- Outline-only letterforms at this scale rely entirely on screen anti-aliasing for\n  crispness; thin strokes shimmer at in-between browser zoom levels.", "Signature move": "The photo-windowed wordmark: a real product or gallery photograph is masked into the open\ncounters of the giant \"INDOEK\" outline type, so the logo and the hero image are the same\nobject rather than stacked elements — and because the wordmark's outline weight is\nconstant, any photo can rotate through it without a redesign.", "Motion": "Feel reads as mixed and the page is marked scroll-linked, but almost nothing here is\nbespoke: the only keyframes present in the DOM are Shopify/Swiper platform boilerplate — a\ncheckout-skeleton opacity pulse, a cart-icon rotator, a dash-offset \"drawing\" loader, and\ntwo generic spin loops for carousel/checkout preloaders — none of which the extract curates\nas identity-bearing motion. Hover and link-state transitions run short, 150-300ms, on two\neasing families: a standard decelerate `cubic-bezier(0.4,0,0.2,1)` for colour/border/fill\nchanges, and the browser-default `ease` for a couple of max-height/background-size moves.\nThis confirms what the compositional signature move already implies: Indoek's identity\ndevice is the photo-windowed wordmark, not a timed animation, so the hero reads as a static\nor simple-crossfade rotation rather than a choreographed sequence (from designlang\nextract).\n\n| token | value | used for |\n|---|---|---|\n| xs | 150ms | link/colour/border/fill hover states |\n| md | 300ms | background-size, max-height moves |\n| ease (custom) | `cubic-bezier(0.4,0,0.2,1)` | colour/border/fill/opacity/transform hovers |\n| ease (browser) | `ease` | max-height, background-size transitions |", "Brief": "Build a single-typeface commerce-and-gallery page for a coastal creative brand. Ground\neverything in warm cream with one cobalt-blue ink; use no second colour and no second\ntypeface. Open on an oversized outline wordmark sized to break the viewport, with a\nrotating product or gallery photograph masked into its open counters, plus one line of\nmission copy and a caption line beneath. Set nav, captions, prices and body copy in the\nsame grotesque at conservative reading size — hierarchy comes from scale jumps only, never\nfrom a second face or weight family. Below the fold, run shop and gallery items in one\nruled, ungapped grid with no card shadows or rounded corners. Keep photography as the only\nsource of colour variation on the page.", "Image recipe": "Documentary lifestyle photograph of [SUBJECT] — a surf shack interior, a craft studio, a\ngallery opening — shot in warm natural daylight, true-to-life colour (not desaturated),\nhandmade objects and real texture in frame (wood, ceramic, textile), composed with a clear\nopen band through the centre so it can be masked into large outline letterforms without\nlosing legibility.", "Photo search": "Unsplash first, Pexels second.\n- \"surf shack interior wood shelves\"\n- \"ceramic studio craftsman daylight\"\n- \"coastal gallery opening warm light\"\n- \"surfboard shop pegboard display\"", "Reference lock": "Primary reference/direction: Indoek — cobalt single-ink surf/gallery wordmark, photo\nwindowed through oversized outline type, one grotesque for everything.\nPreserve (3-5 traits): cream ground with a single cobalt ink, no second accent colour; one\ngrotesque typeface for wordmark, nav, body and prices, hierarchy by scale only; a hero\nphotograph masked into the open counters of the giant wordmark; commerce and editorial\ncontent sharing one ruled, ungapped grid with no card chrome.\nBorrow only (1-2): the arrow-plus-caption link style under hero images; the rotating\nfeatured-item strip directly beneath the hero.\nRole rules: no second typeface is ever introduced, including for prices or labels; blue is\nthe only ink — photography carries all other colour; the wordmark is always photo-\nwindowed, never shown as flat solid type on the homepage.\nMedia strategy: photo:unsplash — warm, true-colour lifestyle/craft photography with a\nclear open band for letterform masking; never desaturated or heavily graded.\nReject: a second typeface for any role; rounded corners or drop shadows on grid cells;\nflat (non-windowed) wordmark treatment; a second accent colour; centred hero copy.\nToken commitments: bg `#EEEBE3`, ink `#03315C`, ink-mid `#1B58A0`, ink-tint `#7294B0`,\nink-pale `#B3C7D2`, wood-accent (photography only) `#96775C`; type `Calibre` for every\nrole; wordmark set at viewport-breaking scale, all other text at one conservative reading\nsize; grid ruled, zero card radius, zero shadow."}, "has_extract": true}, {"slug": "insidermadeira", "title": "Insider Madeira", "url": "https://www.insidermadeira.com", "captured": "2026-09-04", "family": "coastal-serif-concierge", "dna": "Cinematic coastal travel film x quiet concierge ledger", "register": "warm photographic", "grammar": "filmic one-shot", "lane": "A full-bleed cinematic coastal photograph carries a large serif wordmark and a single exclusivity claim, then the page drops to a plain off-white section of centred serif headings and three quiet outline-icon value cards", "mode": "persuade", "traits": ["full-bleed dramatic coastal photography", "large serif wordmark over the photo", "pill-shaped CTA buttons", "dark 'Members only' badge", "off-white second section", "centred serif subheadings", "thin outline icon cards", "bilingual language toggle"], "palette": ["#F9F9F9", "#000000", "#4D4634", "#786A53", "#84969B", "#C6C7C3"], "type": ["GT Super Display", "PP Mori"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "hospitality", "category2": "luxury-craft", "origin": "raw-url", "extract": "ok", "source_url": "https://www.insidermadeira.com", "has_image": true, "img": "../design-catalogue/entries/insidermadeira/fold.webp", "full": "../design-catalogue/entries/insidermadeira/shot.webp", "sections": {"Why it works": "The hero is a single cinematic photograph — a cliff-top figure over deep blue Atlantic\nwater, or aerial sailboats in a cove — with the serif wordmark and headline set directly\nonto it in white, no scrim beyond a light gradient at the top. Because the photo is doing\nall the emotional work, the type stays restrained: a large serif logotype top-left, a\ntwo-line serif headline bottom-right, one short sans sentence beneath it, and a single\npill CTA. Nothing competes with the landscape.\n\nThe moment the page drops below the fold, both the photography and the drama disappear at\nonce — a plain off-white ground, centred serif headings in conservative sizes, and short\nsans body copy. This is a deliberate register shift rather than a loss of energy: the hero\nsells the destination, the second section sells the operator's credibility (\"The Essence\nof Our Legacy,\" \"Why work with Insider\"), and the two use visibly different tools —\nphotography and scale for the first, restraint and legibility for the second.\n\nThe three value-proposition cards use identical thin-line outline icons, cream card\nbackgrounds and one consistent caption format (bold label, one sentence beneath), which\nkeeps the credibility section from needing any additional colour or photography to feel\ncomplete. A \"Members only\" badge in solid black, distinct from the pill-outline CTAs\naround it, marks exclusivity as a different tier of action from \"plan your trip.\"", "What to borrow (principle)": "- **Let one full-bleed cinematic photograph carry the entire hero, unassisted by\n  gradients, cards or multiple text blocks.** Serif type in white, minimal copy, one CTA.\n- **Change tools, not just tone, when the page moves from emotional pitch to\n  credibility.** Drop the photography and the scale entirely — plain ground, centred\n  serif, short copy — so the shift itself signals \"now the facts.\"\n- **Give a rare action (membership, an exclusive tier) a different button treatment than\n  the everyday action**, so hierarchy of commitment is visible without extra copy.\n- **Use one outline-icon style and one caption format across all value cards.** Consistency\n  here reads as competence more than any single card's content does.", "What to leave": "- The hero headline sits in the lower-right of the frame, close to where a cliff edge or\n  boat silhouette naturally falls in this photography — legible in this capture but a\n  layout that depends on every future hero photo having empty space in the same spot is\n  fragile.\n- The bilingual EN/PT toggle is styled identically to plain nav links, easy to miss at a\n  glance; a slightly more distinct treatment (flag, divider) would aid discoverability\n  without adding visual weight.", "Signature move": "The register break at the fold: a cinematic, almost silent full-bleed photograph with\nminimal white serif type gives way, with no transitional device, to a plain off-white\ncredibility section — the page uses the abruptness of the change itself to mark \"now we\nprove it,\" instead of softening the transition with a gradient or shared background.", "Motion": "Overall feel reads as smooth on a scroll-linked page — the extract's one named easing\nfamily is plain `ease-in-out` (29 uses), a conventional decelerate/accelerate cubic with no\nspring or overshoot. Two duration steps cover it: `sm` 250ms and `lg` 500ms. The slower\n500ms `ease-in-out` pair (`background-color`, `color`) reads as a nav/link colour fade;\nthe faster 250ms group mixes `ease-in-out` on `transform` with `ease-in` on `z-index` and\n`background-color`, consistent with a card hover-lift that also needs to jump layer order.\nTwo keyframes are declared: a plain `spin` (loader icon) and a `translateX` that only\ndefines a `100%` state (`translateX(-100%)`) — a full-width slide-out, most likely a mobile\nnav panel or carousel slide moving completely off-frame rather than a partial reveal. No\nstagger/choreography pattern is documented. (from designlang extract)\n\n| Token | Value | Curve |\n|---|---|---|\n| `sm` | 250ms | `ease-in` / `ease-in-out` (transform, z-index, background-color) |\n| `lg` | 500ms | `ease-in-out` (background-color, color) |\n| `spin` keyframe | rotate 0deg → 360deg | unspecified (loader) |\n| `translateX` keyframe | → translateX(-100%) | unspecified (slide-out) |", "Brief": "Build a luxury-travel-concierge landing page opening on one full-bleed cinematic coastal\nphotograph with a large serif wordmark top-left and a two-line serif headline positioned\nin open space within the frame, white type with only a light top gradient for legibility.\nSet one short sans sentence and a single pill CTA beneath the headline; place a distinct,\nsolid-fill \"members only\" or exclusive-tier badge separately from the primary CTA style.\nBelow the fold, break registers completely: plain off-white ground, centred serif\nsubheadings at conservative size, short sans body copy, and a three-card row of thin\noutline icons with a consistent bold-label-plus-sentence caption format. Offer a simple\nlanguage toggle in the nav, styled consistently with other nav links.", "Image recipe": "Cinematic coastal or landscape photograph of [SUBJECT] — a cliff edge, a hidden cove, a\nmountain trail — shot at golden hour or soft overcast light, deep saturated blues and\nwarm earth tones, a small human figure for scale, composed with clear open space in the\nlower third or a corner for headline type to sit without a scrim.", "Photo search": "Unsplash first, Pexels second.\n- \"Madeira cliff coastline aerial\"\n- \"hidden cove sailboats aerial blue water\"\n- \"cliff edge hiker ocean view\"\n- \"volcanic coastline dramatic aerial\"", "Reference lock": "Primary reference/direction: Insider Madeira — cinematic coastal hero with a serif\nwordmark, hard register break into a plain off-white credibility section.\nPreserve (3-5 traits): one full-bleed cinematic photograph carrying the entire hero, white\nserif type with minimal supporting copy and a single CTA; a hard, ungraded shift from\nphotographic hero to plain off-white credibility section on scroll; centred conservative\nserif subheadings for credibility content; three-card value row using one outline-icon\nstyle and one caption format; a visually distinct badge treatment for a rare/exclusive\naction versus the everyday primary CTA.\nBorrow only (1-2): the light top gradient limited to nav legibility only; the simple\nEN/PT language toggle styled as a plain nav link.\nRole rules: the display serif is reserved for the wordmark and section headings, never\nbody copy or buttons; hero section never carries more than one CTA plus one badge; value\ncards always share one icon style and one caption format, never mixed.\nMedia strategy: photo:unsplash — cinematic golden-hour or soft-overcast coastal/landscape\nphotography with a human figure for scale; never a flat travel-brochure daylight shot.\nReject: gradients or scrims beyond what nav legibility requires; a second display\ntypeface; card shadows or borders breaking the flat cream card treatment; centring the\nhero headline dead-centre rather than in open photographic space.\nToken commitments: bg `#F9F9F9`, ink `#040810`, ink-warm `#4D4634`, tan `#786A53`, blue-\ngrey `#84969B`, stone `#C6C7C3`; display `GT Super Display`, body/UI `PP Mori`; headline\nserif large and left- or corner-anchored in the hero, subheadings centred and\nconservative below the fold."}, "has_extract": true}, {"slug": "insign", "title": "Insign", "url": "https://www.insign.se/", "captured": "2026-09-04", "family": "colour-blocked-service-bands", "dna": "Swedish full-service agency ledger x saturated colour-blocked service chapters", "register": "modern clean", "grammar": "chaptered editorial", "lane": "A plain white hero with a serif logotype and a dark abstract photo gives way to a mosaic collage strip, then three fully saturated colour-blocked service bands, a white project archive, and a dark stats-and-team close", "mode": "persuade", "traits": ["serif logotype on plain white nav", "dark abstract hero photograph", "mosaic photo collage strip", "fully saturated colour-blocked service bands", "device-mockup photography per service", "dark stats band with large numerals", "team headshot grid", "dark footer CTA band"], "palette": ["#FFFFFF", "#1A1818", "#ECF58F", "#D1C8D6", "#F2895C", "#484B48"], "type": ["Neue Haas Grotesk RoundDots"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "portfolio", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://www.insign.se/", "has_image": true, "img": "../design-catalogue/entries/insign/fold.webp", "full": "../design-catalogue/entries/insign/shot.webp", "sections": {"Why it works": "The page opens conventionally — white ground, serif logotype, plain sans headline over a\ndark abstract photograph — before committing to its real device: three service categories\n(Webbdesign, Marknadsföring, Design), each rendered as a full-width band in one fully\nsaturated flat colour (chartreuse, lavender, orange), with no two adjacent bands sharing a\ncolour family. Because each band is a completely different hue and each pairs a bold\nsans heading with a small device-mockup photograph relevant to that service, a visitor\ncan identify which service they're looking at from a glance at colour alone, before\nreading a word — the palette itself becomes the navigation.\n\nEverything outside those three bands stays deliberately plain: white for the hero and\nproject archive, near-black for the stats and footer. This means the saturated colour\nbudget is spent entirely on the service bands, so they read as the loudest, most\nmemorable part of the page rather than competing with hero or proof sections for\nattention.\n\nThe proof strategy is literal and cumulative rather than persuasive copy: a dark stats\nband states three plain numbers (5.0/5.0, 180+, 2002) with no chart or illustration, a\nfull team headshot grid follows immediately after (\"a long-term partner\"), and a news\nstrip closes with real, dated articles. Each proof element uses a different but equally\nunadorned format — numerals, faces, dates — so the credibility argument doesn't repeat\nitself. That plain-spoken restraint carries into the copy itself: the extract's brand-voice\nread is neutral in tone and written in third person rather than the direct-address \"you\"\ncommon elsewhere in this set, matching the page's unadorned, ledger-like proof strategy\n(from designlang extract).", "What to borrow (principle)": "- **Assign one fully saturated, non-repeating colour to each service or product\n  category**, so the palette itself functions as a navigation and recognition system.\n- **Spend your colour budget entirely on the differentiator (the service list)** and keep\n  every surrounding section — hero, proof, footer — plain, so the coloured bands stay the\n  memorable part of the page.\n- **Pair each coloured service band with one small, specific photograph** (a device\n  mockup, a real deliverable) rather than an abstract icon alone — it grounds the claim in\n  an actual output.\n- **Vary your proof formats** (plain numerals, a face grid, dated news) rather than\n  repeating the same testimonial-card pattern three times.", "What to leave": "- Three adjacent fully saturated colour bands (chartreuse, lavender, orange) in quick\n  succession is a high-intensity sequence; a visitor scrolling quickly experiences three\n  hard colour jumps in a row with no neutral pause between them.\n- The service band headlines wrap awkwardly at this viewport width (\"Webbdesig / n\"),\n  visible in this capture — worth a tighter line-length rule for the bold display size\n  used there.\n- The hero's cookie-consent panel and the dark abstract photo compete for the same lower-\n  right screen quadrant on load in this capture; sequencing so only one overlay commands\n  attention at a time would help.", "Signature move": "The colour-per-service system: each of the three core service categories gets one\ncompletely saturated, non-repeating flat colour as its entire band background, so the\npage's palette becomes a direct index of what the agency offers — a visitor can navigate\nby colour memory alone on a return visit.", "Motion": "Motion feel reads as springy, and the page is scroll-linked. The duration scale runs six\nsteps from 100ms to 750ms, plus an outlier `xxl` token at 4.001s that is almost certainly\ntiming a slow background loop — a hero crossfade or an auto-advancing carousel — rather\nthan a UI transition. Easing is the most varied of this batch: a plain `ease-in-out`\n(\"ease\") covers the large majority of uses, a custom decelerate curve\n(`cubic-bezier(0.2, 0, 0.3, 1)`) covers a third family, and single uses each of `linear`,\n`ease-in`, and `ease-out` round it out — alongside one explicit spring/overshoot curve,\n`cubic-bezier(0.68, -0.55, 0.265, 1.55)`, flagged by the extract itself for its negative\ncontrol point. That one spring curve, despite firing only once, is the likely source of\nthe page's overall \"springy\" rating. Keyframe use is the busiest in this set and reads as\nstock UI-library chrome rather than an authored system: `fadeIn` recurs across several\nelements, `ball-scale-multiple` (a scale-plus-opacity \"reveal\") matches a typical\nloading-spinner pattern, `dipi_fade` names the Divi WordPress builder as its source, and\n`mc_slideOut` (animating the `bottom` property) is consistent with a slide-up/out panel —\nplausibly the same cookie-consent overlay flagged in \"What to leave\" above as competing\nwith the hero photo for attention. No stagger choreography is recorded (from designlang\nextract).\n\n| kind | name/family | value |\n|---|---|---|\n| duration | `xs` | 100ms |\n| duration | `sm` | 200ms |\n| duration | `md` | 275ms |\n| duration | `lg` | 500ms |\n| duration | `xl` | 750ms |\n| duration | `xxl` | 4.001s (likely a background loop, not a UI transition) |\n| easing | ease-in-out | `ease` |\n| easing | custom | `cubic-bezier(0.2, 0, 0.3, 1)` |\n| easing | spring/overshoot | `cubic-bezier(0.68, -0.55, 0.265, 1.55)` |\n| easing | ease-in | `cubic-bezier(0.44, 0, 1, 1)` |\n| easing | ease-out | `cubic-bezier(0.23, 1, 0.32, 1)` |\n| easing | linear | `linear` |", "Brief": "Build a full-service agency landing page opening on a plain white hero with a serif\nlogotype, a plain sans headline, and one dark abstract photograph. Immediately below,\ninclude a mosaic collage strip previewing client work in small mixed-aspect tiles. Then\ndedicate one full-width, fully saturated flat-colour band to each core service category —\nno two adjacent bands sharing a colour family — pairing a bold sans service name with a\nshort description, a link list of sub-services, and one small photograph of a real\nrelevant deliverable (a device mockup, a printed piece). Return to plain white for a\nproject archive grid. Close with a dark section stating plain, unadorned proof numerals,\na full team headshot grid, and a short dated news strip, ending on a dark footer CTA band.", "Image recipe": "Documentary or product photograph of [SUBJECT] relevant to a specific service — a device\ndisplaying a real website mockup, a printed marketing piece, a branded vehicle or\npackaging — shot with clean, neutral studio or on-location lighting, true-to-life colour\nthat will sit inside a saturated flat-colour band without clashing, cropped tightly to the\nobject itself rather than run full-bleed.", "Photo search": "Unsplash first, Pexels second.\n- \"tablet mockup website design display\"\n- \"phone mockup app interface hand\"\n- \"branded delivery van signage\"\n- \"printed marketing material flatlay\"", "Reference lock": "Primary reference/direction: Insign — colour-per-service band system for a full-service\nagency, plain white/black framing every saturated section.\nPreserve (3-5 traits): one non-repeating fully saturated flat colour assigned to each core\nservice category, functioning as navigation by colour; every other section (hero, project\narchive, proof, footer) kept plain white or near-black so the service bands stay the\nloudest element; each coloured band paired with one small, specific photograph of a real\ndeliverable, not an abstract icon; proof presented in varied unadorned formats (plain\nnumerals, a face grid, dated news) rather than repeated testimonial cards.\nBorrow only (1-2): the mosaic collage strip directly beneath the hero; the small\naccessibility-icon affordance persistently visible in the corner.\nRole rules: no two adjacent full-width bands share a colour family; saturated colour never\nappears in the hero, proof, or footer sections; each service band carries exactly one\nsupporting photograph, never more.\nMedia strategy: photo:unsplash — clean, true-colour product/device-mockup photography\ncropped to the object; never full-bleed atmospheric photography inside a colour band.\nReject: a single-hue palette across all service listings; illustrated icons replacing real\ndeliverable photography; testimonial-card carousels in place of varied proof formats;\nsaturated colour bleeding into the hero or footer sections.\nToken commitments: bg `#FFFFFF`, ink `#1A1818`, ink-soft `#484B48`, band-1 (chartreuse)\n`#ECF58F`, band-2 (lavender) `#D1C8D6`, band-3 (orange) `#F2895C`; `Neue Haas Grotesk\nRoundDots` for logotype, headlines and body throughout; each service band uses exactly\none flat background colour, no gradients or tints within a band."}, "has_extract": true}, {"slug": "kinhive", "title": "Kinhive", "url": "https://kinhive.com", "captured": "2026-09-04", "family": "warm-founder-matchmaking", "dna": "Founder-portrait warmth x SaaS matchmaking ledger", "register": "warm photographic", "grammar": "split stage", "lane": "A pale-yellow signup card floats over a warm documentary photo of real founders, an orange marquee ticker bridges to a dark-brown chapter of floating skill tags and an italic serif claim, then a photo-and-quote block closes the argument", "mode": "persuade", "traits": ["pale-yellow floating signup card", "warm documentary founder photography", "serif with italic emphasis words", "orange marquee ticker band", "dark brown chapter with floating pill tags", "hexagon/clover/starburst outline icons", "pastel-blue pull-quote block", "rounded card corners throughout"], "palette": ["#FD8143", "#22201F", "#F8F9B8", "#91ADB4", "#936C4F", "#CEB89E"], "type": ["Affairs", "FigtreeKH"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "product-focused", "category2": "playful", "origin": "raw-url", "extract": "ok", "source_url": "https://kinhive.com", "has_image": true, "img": "../design-catalogue/entries/kinhive/fold.webp", "full": "../design-catalogue/entries/kinhive/shot.webp", "sections": {"Why it works": "The hero doesn't choose between product-marketing convention and photography — it layers\nthem. A pale-yellow, rounded signup card sits on top of a warm documentary photograph of\ntwo real women (one seated with a laptop, one standing), so the product's actual claim\n(\"find the women you're missing from your network\") reads over real human context instead\nof an abstract UI screenshot. The card's serif headline mixes roman and italic within one\nsentence, italicising exactly the words that carry the emotional weight (\"missing from\nyour network\") — the same accent-word device this catalogue keeps finding across\notherwise unrelated brands.\n\nAn orange marquee ticker (\"BUILD BETTER TOGETHER\") running full-width beneath the hero\nphoto is the hinge between two very different chapters: a bright, photographic top and a\ndark, saturated brown middle section where the page's boldest claim (\"Nothing great is\nbuilt **alone**.\") appears in large orange serif type, italic again on the single word\nthat matters, surrounded by floating pill-shaped skill tags (+ CO-FOUNDER, + LEGAL, +\nMARKETING) scattered like sticky notes. The tags do double duty as decoration and as a\nliteral preview of what the matching product surfaces.\n\nThe closing block pairs a candid photo with a pastel-blue statistic/quote panel, citing a\nreal source (Harvard Business Review) in the same serif used throughout — closing not on a\nCTA repeat but on external credibility, which is a different persuasion tool than the\nrest of the page has used up to that point.", "What to borrow (principle)": "- **Layer the primary conversion card directly over documentary photography** instead of\n  placing it beside or below the image — the product claim and its human context share\n  one frame.\n- **Italicise only the emotionally load-bearing word in a headline**, repeatedly, so the\n  device reads as a system rather than a one-off flourish.\n- **Use a full-width marquee band as a chapter hinge**, not a message — it's there to mark\n  a tonal shift (light photographic hero to dark saturated claim block), not to be read\n  word for word.\n- **Scatter floating pill tags around a headline as both texture and literal product\n  preview** — they decorate the claim while also showing exactly what categories the\n  product covers.\n- **Close on a cited external quote, not a CTA restatement.** A credible outside voice is\n  a different, complementary persuasion tool from repeating your own pitch.", "What to leave": "- The floating skill-tag pills are positioned close enough to the large serif headline\n  that at some viewport widths they risk overlapping descenders — worth locking a minimum\n  clearance.\n- The transition from the bright hero to the near-black brown chapter is a hard cut with\n  no gradient; effective as a chapter break here, but readers with motion/contrast\n  sensitivity may find the jump abrupt without a scroll-based easing.\n- Font measurement could not be completed live (the site did not reach network idle\n  within the capture budget) — treat the typeface identification in this entry as\n  visually read off the image, not confirmed via computed styles.", "Signature move": "The photo-layered signup card: rather than a hero image and a separate conversion panel,\nthe card sits physically on top of the documentary photograph with rounded corners and a\ndrop shadow, so the product pitch reads as an annotation on a real moment rather than a\ncompeting UI element.", "Motion": "Motion reads as mixed rather than one register: short, utilitarian UI-state transitions\n(colour, background, border-colour, transform) sit alongside one continuous marquee\nscroll. Scroll-linked: yes. Every transition in the extract relies on the browser's\ndefault ease — no cubic-bezier, spring or overshoot curve appears anywhere. Two\nkeyframes are actually in use: `custom-marquee-anim`, a straight `translate3d(0)` to\n`translate3d(-50%)` slide that drives the orange \"BUILD BETTER TOGETHER\" ticker's\ncontinuous horizontal auto-scroll (confirming what the still capture only implied), and\n`spin`, a plain 0deg-to-360deg rotation on a small element (icon-scale, not a hero\ndevice). A larger keyframe set ships in the CSS bundle — `fa-spin`, `flipCycleLoop`, four\nnumbered opacity-pulse keyframes — but none of these register as \"in use,\" so they read\nas unused icon-font/library boilerplate rather than live page motion (from designlang\nextract).\n\n| Duration | Applies to |\n|---|---|\n| 200ms (`sm`) | colour, background, border-colour |\n| 250ms (unnamed) | transform |\n| 300ms (`md`) | background, padding-top/bottom |\n| default ease | all of the above — no named/custom easing curve found |", "Brief": "Build an AI matchmaking product page for a specific underserved audience, opening on a\nwarm documentary photograph of real people in the target audience, with a rounded,\npastel-coloured signup card floating directly on top of the image. Set the card's\nheadline in a serif that mixes roman and italic within one sentence, italicising only the\nemotionally central words. Bridge to a second chapter with a full-width marquee ticker\nband in a saturated accent colour, then drop into a dark, saturated section carrying the\npage's boldest claim in large italic-accented serif type, surrounded by floating pill-\nshaped tags previewing product categories. Use simple geometric outline icons (three,\none per core feature) beneath the claim. Close on a photo-plus-quote panel citing a real,\nattributed external source rather than repeating the CTA.", "Image recipe": "Warm documentary photograph of [SUBJECT] — real founders or professionals in a lived-in\ninterior (wood panelling, plants, natural light), candid poses (working, mid-conversation,\nlooking at camera with genuine expression), true-to-life warm colour, no studio lighting\nor posed stock-photo energy, composed with clear open space for a floating card overlay.", "Photo search": "Unsplash first, Pexels second.\n- \"female founders working together candid\"\n- \"women in home office laptop candid warm light\"\n- \"diverse businesswomen portrait natural light\"\n- \"coworking women conversation candid\"", "Reference lock": "Primary reference/direction: Kinhive — photo-layered signup card, marquee-hinged dark\nchapter with floating skill tags and italic-accented serif claim.\nPreserve (3-5 traits): a rounded conversion card floated directly on top of documentary\nphotography, never placed beside it; a serif headline mixing roman and italic, italic\nreserved for the emotionally central word only; a full-width marquee ticker as the hard\nchapter hinge between a bright photographic hero and a dark saturated claim section;\nfloating pill-shaped tags as both decoration and literal feature preview around the main\nclaim; a closing photo-plus-quote panel citing a real external source.\nBorrow only (1-2): the three-icon feature row using simple geometric outline marks\n(hexagon, clover, starburst); the pastel-blue quote panel as a colour break from the\nbrown chapter.\nRole rules: italic is reserved for the single load-bearing word or phrase per headline,\nnever a full sentence; the marquee band carries a repeated short phrase, never primary\ninformation; floating tags never obscure headline text at any viewport.\nMedia strategy: photo:unsplash — warm, candid, true-colour documentary photography of the\ntarget audience in real environments; never posed stock-photo compositions.\nReject: a hero photo with no overlay card; italic used for entire headlines; a marquee\nband carrying essential information; more than three feature icons in the core-value row;\nuncited internal-only claims in the closing block.\nToken commitments: accent-orange `#F88043`, ink `#22201F`, paper `#DEDFD7`, blue-tint\n`#91ADB4`, warm-brown `#936C4F`, warm-tan `#CEB89E`; serif with roman/italic pairing for\nall headlines; rounded card corners and soft drop shadow on the floating signup card\nthroughout."}, "has_extract": true}, {"slug": "limon", "title": "Limón", "url": "https://www.limon.no/", "captured": "2026-09-04", "family": "candlelit-signage-poke", "dna": "Neon-signage tracking on an olive-black canvas x edge-to-edge editorial food photography", "register": "warm photographic", "grammar": "chaptered editorial", "lane": "A dark olive canvas floats a wide-tracked wordmark and a filled lemon CTA over a cream-and-olive rhythm of unframed, edge-to-edge food photography, with the display wordmark overlaid directly onto the dish itself", "mode": "persuade", "traits": ["wide positive tracking scaling with size", "\"one lemon accent", "dark-canvas only\"", "near-zero 1px radius everywhere but the FAB", "unframed edge-to-edge food photography", "dark hero into cream content sections", "\"flat", "zero-shadow surfaces\""], "palette": ["#1d0b0d", "#103b15", "#f7ea48", "#fcf9f0", "#dbe2dc"], "type": ["VenusCom"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "hospitality", "category2": "consumer-brand", "origin": "refero", "extract": "ok", "source_url": "https://www.limon.no/", "has_image": true, "img": "../design-catalogue/entries/limon/fold.webp", "full": "../design-catalogue/entries/limon/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens. The captured fold shows\na lighter, food-forward moment (a sage-green tabletop of poke and ceviche bowls\nunder a cream nav bar) rather than the deep olive-black hero the tokens describe as\ndominant — evidence that the page alternates a dark, signage-lit hero with brighter\nphotographic sections rather than staying dark throughout. Either way, Lemon Zest\n`#f7ea48` is treated as a rule, not a decoration: it is reserved for filled CTAs and\ndisplay text on dark surfaces only, and the source is explicit that placing it on\nthe cream background destroys its contrast — so the accent's placement is\nload-bearing, not optional.\n\nTypography carries an unusually wide, positive letter-spacing that scales with\nsize (0.06em at 75px display down to 0.02–0.04em at body), which the source\ndescribes as \"almost hand-stenciled\" — wide-set enough that display lines read as\npressed onto glass or neon rather than typeset normally. Because tracking loosens\nrather than tightens at scale (the opposite of the convention several sibling\nentries in this set use), the brand voice reads as illuminated signage specifically,\nnot merely \"bold.\"\n\nGeometry stays almost entirely unsoftened: buttons, cards, inputs and badges sit\nat 1px radius, and the sole exception — a 40px fully-round back-to-top control — is\nreserved for exactly one utility element. Food photography runs edge-to-edge with\nno frame, border or shadow, so the \"cards\" in any grid are effectively bare\nphotographs; the confident, near-square geometry keeps the system from reading as\neither app-soft or brutalist-hard.", "What to borrow (principle)": "- **Fence a bright accent to one surface only.** Lemon Zest working exclusively\n  on the dark canvas — and explicitly failing on the light one — is a rule that's\n  easy to state and easy to violate by accident; stating it prevents the mistake.\n- **Open tracking with size instead of closing it.** Positive, size-scaling\n  letter-spacing is a legible way to make display type feel like lit signage\n  rather than merely large.\n- **Reserve the one soft radius for one utility control.** A near-zero-radius\n  system with a single fully-round exception (here, back-to-top) makes that one\n  element instantly recognisable as \"different,\" i.e. floating and persistent.\n- **Let photography be the card.** Food or product tiles with zero chrome — no\n  border, no shadow, no frame — read as more appetizing than the same image\n  boxed in a container.\n- **Pair a filled accent CTA with a same-colour ghost link nearby.** A filled\n  lemon button next to a ghost \"ORDER NOW\" link in forest ink establishes\n  hierarchy through fill-vs-outline rather than through a second colour.", "What to leave": "- A near-zero (1px) radius system paired with a single 40px circular exception is\n  a narrow rule set — any additional rounded element (a badge, a modal) would\n  need to justify itself against that one exception or the system reads as\n  inconsistent.\n- Wide positive tracking at display size depends on a typeface with enough\n  internal counter space to survive being spaced out; a tightly-fit or condensed\n  substitute will look broken rather than \"neon.\"\n- Lemon-on-dark-only is a real constraint for a brand extending into print or a\n  light-mode context — the system as documented offers no accent treatment for a\n  cream-canvas CTA.", "Signature move": "The overlaid display wordmark: the brand name and short phrases (LIMÓN, FRESH\nCATCH) set at up to 75px in Lemon Zest, laid directly onto the food photograph\nitself rather than on a plain background plate — the dish and the type share one\nsurface.", "Motion": "(from designlang extract) Feel reads as smooth, and the page is scroll-linked.\nTwo durations are in use — a quick 250ms on a plain `ease` curve (7 uses) for\nshort state changes, and a slower 1s step for larger transitions. No keyframe\nanimations are confirmed firing. The 1s duration is consistent with a hero\ncrossfade: long enough to be a deliberate dissolve between dish photographs\nrather than a UI micro-interaction. (observed in capture) the wordmark set\ndirectly onto shifting food photography suggests the hero may cycle between\nmultiple dish photographs (a slideshow or crossfade) rather than holding a\nsingle static image, and the ghost \"ORDER NOW\" links likely reveal an underline\nonly on hover, per the source's stated hover convention.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 250ms | `ease` |\n| xl (crossfade) | 1s | `ease` |", "Brief": "Build a fast-casual restaurant landing page. Alternate a Black Olive `#1d0b0d`\nhero/dark section with Warm Cream `#fcf9f0` content sections — never a shade\nbetween. Set the wordmark and display lines in a single grotesque at up to 75px,\nline-height ~1.0, with letter-spacing that opens from 0.02em at body to 0.06em at\ndisplay. Overlay display text directly onto full-bleed food photography rather\nthan a plain background. Reserve Lemon Zest `#f7ea48` for filled CTA buttons and\ndisplay text on the dark canvas only — never on cream, never as a text colour on\nits own fill. Use Forest Ink `#103b15` for headings, links and dividers on the\nlight sections. Cap every button, card, input and badge at 1px radius; the one\nexception is a 40px fully-round back-to-top control, fixed bottom-right. Lay food\nphotography edge-to-edge with zero frame, border or shadow — the grid's \"cards\"\nare simply the photographs, captioned below with a heading, body copy, and a\nghost \"ORDER NOW →\" link. Keep section gaps around 60px.", "Image recipe": "Editorial food photograph of [SUBJECT] — a plated dish shot overhead or at a\nthree-quarter angle, tight crop, warm-toned surface (terracotta, peach, mauve)\nbeneath
