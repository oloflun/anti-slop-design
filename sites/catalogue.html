rue}, {"slug": "snapifye", "title": "Snapifye", "url": "https://snapifye.webflow.io/", "captured": "2026-09-04", "family": "vintage-polaroid-portfolio", "dna": "Vintage photo-booth polaroids x condensed poster headline", "register": "warm photographic", "grammar": "gallery/catalog", "lane": "A dark maroon hero scatters tilted vintage-toned polaroids beside a huge condensed headline with one script-italic word, then the page shifts to a salmon-pink featured-work gallery of tilted photo cards before closing on a purple neon portrait and a dark footer", "mode": "experience", "traits": ["dark maroon hero ground", "salmon-pink gallery section", "tilted polaroid-style photo frames", "condensed bold display sans", "single script-italic accent word", "horizontal marquee text band", "warm vintage colour grading", "purple neon closing photo"], "palette": ["#701E1F", "#EC7672", "#F8DCC6", "#3D1219", "#914D56", "#882048"], "type": ["GT Walsheim", "Libre Caslon Text"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "portfolio", "category2": "playful", "origin": "raw-url", "extract": "ok", "source_url": "https://snapifye.webflow.io/", "has_image": true, "img": "../design-catalogue/entries/snapifye/fold.webp", "full": "../design-catalogue/entries/snapifye/shot.webp", "sections": {"Why it works": "The page runs on a colour-field structure rather than a grid: a dark maroon hero, a\nsalmon-pink featured-work section, a purple neon closing photo, and a near-black footer,\neach a full-bleed flat colour rather than a bordered card. Photography supplies almost all\nthe remaining colour and texture — every field is populated with tilted, slightly\nrotated photo frames that read as physical prints scattered on a table rather than\nuniformly cropped grid tiles.\n\nType carries a small but deliberate second voice: the condensed bold display sans sets\nevery headline (\"VINTAGE THROUGH LENS\", \"OUR FEATURED\"), but exactly one word per\nheadline breaks into a script italic (\"**experiences**\", \"**work**\") — the same device as\nEXAMPLE and Picnic in this set, where the accent typeface marks the word the sentence\nturns on rather than adding random flourish. Because it's always one word, never a full\nline, the condensed voice stays dominant.\n\nA horizontal marquee band of oversized type (\"...ENCY CREATIV...\") runs between the\ngallery and the closing photo, functioning as a rhythm break between two very different\ncolour fields — the same technique this set has already seen used to bridge intensity\nshifts rather than to hold a message. The vintage colour grading (warm reds, faded film\ntones) unifies photography shot in very different settings — studio portraits, street\ncandids, a neon-lit club scene — into one continuous mood.", "What to borrow (principle)": "- **Use full-bleed flat colour fields as the only section divider you need**, and let\n  photography carry the texture within each field.\n- **Tilt photos slightly and let them overlap their container** to read as physical,\n  handled prints rather than a uniform grid — works especially well for portfolio/gallery\n  content.\n- **Break exactly one word per headline into a second, softer typeface.** Never a whole\n  line — the accent stays an accent.\n- **Grade all photography toward one consistent vintage/warm tone**, even when subject\n  matter and lighting vary wildly between shots, so the gallery reads as one body of work.", "What to leave": "- The floating template-marketplace widget (Figma/Buy button, bottom-right of the hero) is\n  a Webflow showcase artifact, not part of the design — exclude entirely from any build.\n- Photo tilt applied inconsistently in density (heavily scattered in the hero, more\n  regular in the featured-work grid) reads as two different systems; picking one tilt\n  range and applying it everywhere would tighten the identity.\n- The marquee band's cropped-at-both-edges text (\"ENCY CREATIV\") gives no readable message\n  in a static capture — fine if genuinely scrolling live, but a static fallback state\n  should show a complete word.", "Signature move": "The scattered tilted-polaroid hero: several small, rotated, warm-toned photographs\narranged loosely around the headline rather than in a single hero image slot, so the page\nreads as a photographer's contact sheet spilled across the screen rather than a single\ncurated hero shot.", "Motion": "Overall feel reads as mixed on a scroll-linked page. Three duration steps cover\ninteraction states: `xs` 100ms, `sm` 250ms and `md` 300ms. Several transitions animate\n`text-decoration-color` specifically (0.25s and, combined with `color`, folded into the\n0.3s/0.35s group) rather than plain `color` alone — a tell for an underline-sweep hover\nstate, where the underline's colour fades in on its own timing separate from the text.\nOther pairs (`background-color`/`color` at 0.1s, `color`+`background-color` at 0.35s)\nsuggest fast link/button state swaps. No easing function is declared on any transition, so\nall fall through to the browser default rather than a spring/overshoot curve. The one\nkeyframe present is a plain 360° `spin` (loader icon), not the marquee itself — the extract\ngives no evidence for a staggered scroll-reveal on the scattered polaroids, so that remains\nunconfirmed. (from designlang extract)\n\n| Token | Value | Curve |\n|---|---|---|\n| `xs` | 100ms | default ease (bg/color swap) |\n| `sm` | 250ms | default ease (`text-decoration-color`) |\n| `md` | 300ms | default ease (color + background-color) |\n| `spin` keyframe | rotate 0deg → 360deg | unspecified (loader) |", "Brief": "Build a photography-studio portfolio page structured as stacked full-bleed colour fields\nrather than a bordered grid: a dark warm-red hero, a salmon-pink featured-work section, a\nsaturated neon closing photo, and a near-black footer. Populate every field with tilted,\noverlapping photographs graded toward one consistent warm/vintage tone, regardless of the\noriginal shoot's lighting. Set headlines in a condensed bold display sans, breaking\nexactly one word per headline into a script italic accent — never a full line. Use a\nhorizontal marquee band of oversized type as the transition between two colour fields\nrather than a rule or gap. Close on a quote block with a small avatar and a dark footer\nrestating the studio's tagline.", "Image recipe": "Vintage-toned portrait or candid photograph of [SUBJECT] — a photo-booth style portrait, a\nstreet candid, a neon-lit night scene — shot with warm film-like colour grading (reds and\nambers pushed, shadows warm rather than cool), slight grain, cropped to a small\npolaroid-like frame that can be rotated a few degrees without losing legibility.", "Photo search": "Unsplash first, Pexels second.\n- \"vintage film portrait warm tone\"\n- \"photo booth style portrait candid\"\n- \"neon lit portrait night club\"\n- \"street candid film grain warm\"", "Reference lock": "Primary reference/direction: Snapifye — full-bleed colour-field portfolio with scattered\ntilted vintage polaroids and a script-italic accent word per headline.\nPreserve (3-5 traits): stacked full-bleed flat colour fields as the only section\nstructure; tilted, overlapping photo frames rather than a uniform grid; exactly one\nscript-italic accent word per condensed headline; consistent warm/vintage colour grading\nacross all photography regardless of original shoot conditions; a horizontal marquee band\nas the transition device between colour fields.\nBorrow only (1-2): the quote block with small circular avatar; the \"SEE MORE\" arrow-link\nstyling.\nRole rules: script italic never sets more than one word per headline; every photograph\ngets the same vintage colour grade, no exceptions; colour fields are always flat and\nfull-bleed, never gradient or textured.\nMedia strategy: photo:unsplash — warm, film-toned portrait and candid photography, single\nconsistent grade applied across the whole set, no cool/neutral outliers.\nReject: a uniform, untilted photo grid; more than one accent word per headline; template-\nmarketplace UI chrome (buy buttons, tool badges) left in the design; cool or desaturated\nphotography breaking the warm grade.\nToken commitments: hero-bg `#701E1F`, gallery-bg `#EC7672`, tint `#F8DCC6`, footer-bg\n`#3D1219`, closing-accent `#882048`, warm-mid `#914D56`; display `GT Walsheim` (condensed\nbold), accent script/italic serif for single headline words; photo frames rotated a few\ndegrees, never axis-aligned in hero/gallery sections."}, "has_extract": true}, {"slug": "solva", "title": "Solva (AI support copilot template)", "url": "https://solva-template.framer.website/", "captured": "2026-09-04", "family": "floral-gradient-copilot", "dna": "AI-copilot dashboard proof x soft floral gradient backdrop", "register": "modern clean", "grammar": "live surface", "lane": "A cream page opens on a plain headline beside a floating support-inbox screenshot set against a soft floral gradient photograph, then three cards repeat the same gradient-backed screenshot treatment as a feature triad", "mode": "persuade", "traits": ["cream ground", "plain black wordmark with square mark", "\\\"new feature\\\" pill tag", "floating chat-UI screenshot over a soft floral gradient photo", "partner logo row", "repeated gradient-backed screenshot cards as feature proof", "black filled CTA", "minimal colour beyond the gradient photo"], "palette": ["#F7F3EC", "#17140F", "#E8B9C9", "#8FC3B8", "#FFFFFF"], "type": ["Sentient", "Onest"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://solva-template.framer.website/", "has_image": true, "img": "../design-catalogue/entries/solva/fold.webp", "full": "../design-catalogue/entries/solva/shot.webp", "sections": {"Why it works": "The product screenshot — a support inbox with ticket threads and AI-drafted\nreplies — doesn't float on a flat colour or a device frame; it sits on a soft,\nout-of-focus floral gradient photograph, pink blurring into teal. That single\nchoice softens what would otherwise be a fairly technical, dense UI screenshot,\ngiving an \"AI support copilot\" product a calmer, warmer visual register than\nthe category default (dark, technical, terminal-styled dashboards).\n\nThe same gradient-photo backdrop reappears behind all three feature cards\nfurther down the page (\"Resolve in seconds,\" \"Learn from your docs,\" \"Know\nwhen to escalate\"), each showing a different, smaller UI moment on the\nidentical soft background. Reusing one backdrop image across four separate\nscreenshots ties the whole page together visually without needing four\ndifferent photographs — one asset, repeated with different UI crops, reads as\na system rather than a scattered set of illustrations.\n\nA small \"NEW — Auto-resolution is now live\" pill sits above the headline,\ndoing lightweight, low-commitment news signalling before the reader has\ncommitted to reading the full pitch — a habit borrowed from changelog-driven\nproducts.", "What to borrow (principle)": "- **Set product screenshots against a soft, out-of-focus photographic\n  gradient** rather than a flat colour or device frame, to warm up an\n  otherwise technical UI.\n- **Reuse one backdrop image behind multiple feature screenshots** so a set of\n  otherwise-unrelated UI crops reads as one consistent system.\n- **Post a small \"what's new\" pill above the headline** for returning visitors,\n  without dedicating a whole section to it.\n- **Keep the palette almost entirely photographic** (the gradient backdrop) plus\n  cream and black — no separate brand accent colour needed.", "What to leave": "- A soft floral/watery gradient backdrop, while calming, is a fairly common\n  choice across current AI-product templates — it risks reading as a category\n  default rather than a considered brand choice unless paired with a specific,\n  ownable colour combination.\n- Repeating the identical backdrop image behind four different screenshots can\n  flatten the sense of product depth if the crops are too similar in\n  composition — each card needs a genuinely distinct UI moment to earn the\n  repetition.", "Signature move": "The single reused gradient backdrop: one soft, out-of-focus floral-to-teal\nphotograph appears behind the hero screenshot and all three feature-card\nscreenshots, unifying four different UI crops into one visual system with a\nsingle image asset.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed,\nthough the captured CSS carries only a bare `transition: all` and a generic\nloading-spinner keyframe — no duration tokens, easing families or reveal\nkeyframes were captured. Consistent with the entry's own read: whatever\nfade/rise choreography brings the floating screenshot and feature cards in on\nscroll is most likely handled by Framer's inline whileInView animation rather\nthan static CSS, so it isn't visible to this extraction.", "Brief": "Build a calm, cream-and-photographic AI-product page. Choose one soft,\nout-of-focus gradient photograph (floral, watery, or abstract) as a single\nrecurring backdrop asset. Open with a small \"what's new\" pill above a plain\nheadline, with the primary product screenshot floating on the gradient\nbackdrop beside the copy. Run a partner/integration logo row beneath. Build a\nthree-card feature grid where each card reuses the same backdrop image behind\na distinct, smaller UI screenshot. Keep the palette to cream, near-black and\nwhatever colours live inside the one photographic backdrop — no separate brand\naccent.", "Image recipe": "A soft, out-of-focus floral or watery gradient of [SUBJECT] — pink blossoms\nblurring into teal or green, shot or rendered with heavy bokeh so no distinct\nshape is legible, only colour and soft gradient transition, bright and airy.", "Photo search": "Unsplash first, Pexels second.\n- \"soft floral bokeh pink teal blur\"\n- \"out of focus flowers pastel gradient\"\n- \"abstract watercolor gradient soft pastel\"", "Reference lock": "Primary reference/direction: Solva — one reused soft-gradient photographic backdrop behind every product screenshot on the page.\nPreserve (3-5 traits): a single soft, out-of-focus gradient photograph reused as the backdrop behind every product screenshot on the page; a small \"what's new\" pill above the headline; a three-card feature grid where each card pairs the shared backdrop with a distinct UI crop; cream-and-near-black palette with no separate brand accent beyond the photographic backdrop.\nBorrow only (1-2): the partner/integration logo row; the black filled primary CTA.\nRole rules: the backdrop image never changes within the page, only the UI crop shown against it; no additional accent colour introduced outside what the backdrop photograph contains.\nMedia strategy: photo:unsplash — one soft, abstract, out-of-focus gradient image reused throughout; product screenshots are real UI, not illustrated mockups.\nReject: a different backdrop photograph per section (breaks the unifying system); a flat-colour or device-framed screenshot in place of the photographic backdrop; introducing a separate brand accent colour.\nToken commitments: cream `#F7F3EC`, ink `#17140F`, backdrop-pink `#E8B9C9`, backdrop-teal `#8FC3B8`, white `#FFFFFF`; serif display for the headline, sans for UI and body."}, "has_extract": true}, {"slug": "springsummer", "title": "Spring/Summer", "url": "https://springsummer.dk/", "captured": "2026-09-04", "family": "celadon-annual-report", "dna": "Scandinavian design-annual celadon paper x crushed 386px display type", "register": "editorial print", "grammar": "typographic poster", "lane": "A pale sage page carries a whisper-thin nav band and flush-left plum headlines crushed to near-touching leading, with a horizontal project carousel of oversized image cards scrolling off the right edge like spreads in a printed annual", "mode": "portfolio", "traits": ["\"386px display at 0.75 leading", "letters nearly touch\"", "\"five-colour palette total", "no accent hue\"", "4px radius on every rectangular element", "\"white overlay caption strip", "not a full card\"", "\"live clock + city in nav", "typeset not badged\"", "typographic arrows as the only scroll control"], "palette": ["#fe3939", "#ffffff", "#000000", "#dedcd3"], "type": ["Supply", "Montreal", "Grotesk"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://springsummer.dk/", "has_image": true, "img": "../design-catalogue/entries/springsummer/fold.webp", "full": "../design-catalogue/entries/springsummer/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens. Note: the designlang\nextract, run against the current live page, measures a dramatically different\npalette than the one documented below — a saturated red `#fe3939` is now the\nsingle most-used colour on the page (1792 uses, more than white or black), and\nneither plum ink `#44394c` nor the two warm-gray borders appear anywhere in the\nlive colour inventory. The typeface picture shifts too: \"Supply\" (331 elements,\nused for all) is the actual dominant functional face, not documented below at\nall, while Grotesk registers only 3 elements — still plausibly display-only\n(a single hero headline is often just 1-3 DOM nodes) but no longer the\nsystem's clear second voice. This reads as a full brand relaunch since\ncapture, not a measurement artifact; the sage/plum \"annual report\" reading\nbelow describes the captured screenshot faithfully, but no longer describes\nthe live site. The system holds to exactly five colours — sage paper, plum ink,\nwhite, and two warm-gray borders — with no accent hue anywhere; the source\nstates plainly that \"color never decorates; it only separates ink from\npaper.\" Because sage paper is the sole background and white is the only\nelevated surface, depth is a single binary step, which keeps the whole page\nreading as one continuous printed sheet rather than a stack of UI panels.\n\nGrotesk, the display face, exists at one weight only and is used exclusively\nat 170-386px with a crushed 0.75-0.76 line-height — tight enough that letters\n\"nearly touch\" and the type feels \"carved rather than set.\" Montreal, at a\nsingle weight with slight positive tracking (0.02-0.023em), handles literally\neverything else, including the 43px agency descriptor, which the source\ntreats as a large caption rather than a second display size — there is no\nintermediate heading tier between whisper-small Montreal and monumental\nGrotesk.\n\nInteraction chrome is reduced to typography itself: carousel navigation is a\npair of plain arrow glyphs with no button container, the contact form uses an\nunderline-only input with no box, and even the live clock in the nav reads as\ninline type rather than a widget. Combined with 4px radius as the single\nallowed corner value system-wide, the page commits fully to reading as a\nprinted agency annual that happens to scroll rather than a software product.", "What to borrow (principle)": "- **Hold a genuine five-colour ceiling with zero accent.** Declaring the exact\n  colour count and enforcing \"no sixth colour\" prevents an accent from\n  creeping in through buttons or badges over time.\n- **Crush display leading until letters nearly touch.** A 0.75 line-height at\n  300px+ sizes is what turns \"big type\" into a carved, architectural mass\n  rather than merely oversized text.\n- **Treat a large caption as a caption, not a second display tier.** Keeping\n  the 43px agency descriptor in the body typeface (not the display face)\n  avoids inventing an unnecessary in-between heading size.\n- **Make scroll controls purely typographic.** Plain arrow characters with no\n  button background or padding read as editorial page-turning, not app\n  navigation.\n- **Use underline-only inputs on the page canvas.** A form field with no box,\n  just a 1px bottom border, keeps even functional UI inside the printed-page\n  metaphor.", "What to leave": "- Zero intermediate heading sizes between ~43px and 170px is a genuine content\n  constraint — any section needing a \"medium\" headline has no native size to\n  reach for without introducing a new scale step.\n- A single elevation step (sage to white, nothing between) works for a\n  portfolio with few content types; a denser product interface would need more\n  surface levels than this system provides.\n- The live clock and city label in the nav is a bespoke, agency-specific\n  flourish; reproducing it elsewhere requires genuinely live data, not a\n  decorative placeholder.", "Signature move": "The typeset live-status nav element: a real-time clock (\"18:35:18\") paired\nwith a city name (\"Copenhagen\"), rendered as plain inline Montreal type with\nno badge, icon frame, or background — presented as fact rather than as a\ndecorative widget.", "Motion": "(from designlang extract) Feel reads as smooth, and the page is scroll-linked.\nA plain `ease` curve dominates overwhelmingly (186 uses) across five duration\nsteps from 200ms to 1.3s, with a single fast ease-out\n(`cubic-bezier(0, 0.55, 0.45, 1)`) appearing once. The one keyframe confirmed\nfiring, `sweep` (a slide transform, 1 use), most plausibly drives a hover-wipe\neffect on a link or the carousel's arrow controls rather than a page-load\nreveal. (observed in capture) the live capture confirms the horizontal project\ncarousel and the live clock/status indicator are present and functioning,\nconsistent with a genuinely real-time nav element; given the flat,\nshadow-free system and the extract's own heavy reliance on plain `ease`, the\ncarousel most plausibly still scrolls via native horizontal drag/scroll rather\nthan a custom-eased animation.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 200ms | `ease` |\n| md | 300ms | `ease` |\n| lg | 500ms | `ease` |\n| xl | 800ms | `ease` |\n| xxl | 1.3s | `ease` |\n| sweep | slide transform | 1 use |", "Brief": "Build a Scandinavian design-agency portfolio homepage. Canvas is sage paper\n`#e5ebda` — the only background colour on the page; white `#ffffff` is the\nsole elevated surface, used only for project-card image fills and caption\noverlays. Plum ink `#44394c` carries every piece of text, with warm-gray\nborders (`#c0c3b6`, `#b0b2a9`) as hairline dividers only — no sixth colour is\never introduced. Set the hero display in Grotesk at one weight, 170-386px,\ncrushed to 0.75 line-height, flush left with no background or decoration. Use\nMontreal at one weight throughout for nav, body, captions and the 43px agency\ndescriptor, with consistent +0.02-0.023em tracking. Build a horizontal project\ncarousel of large image cards (480-640px wide) with a small white caption\nstrip inset bottom-left, navigated by two plain typographic arrow glyphs with\nno button chrome. Cap every rectangular corner at 4px. Show a live clock and\ncity label in the nav, styled as inline type, not a widget. No drop shadows or\ngradients anywhere; elevation is the single sage-to-white step only.", "Image recipe": "Editorial documentary photograph of [SUBJECT] — environmental or campaign\nphotography from real project work, landscape-cropped, full-bleed within its\n4px-radius card frame, natural or venue lighting rather than studio-lit,\npresented at large scale as a standalone visual paragraph with no overlay\ntext beyond a small caption strip.", "Photo search": "Unsplash first, Pexels second.\n- \"creative agency event photography documentary\"\n- \"design studio work environmental photography\"\n- \"brand campaign editorial photography wide\"\n- \"creative award ceremony stage photography\"", "Reference lock": "Primary reference/direction: Spring/Summer — celadon-paper Scandinavian design\nannual, crushed 386px display type, five-colour ceiling with no accent.\nPreserve (3-5 traits): sage paper `#e5ebda` as the sole background, white as\nthe only elevated surface; Grotesk at one weight, 170-386px, 0.75-0.76 leading\nso letters nearly touch, never used below 40px; Montreal at one weight for\neverything else including the 43px descriptor; exactly five colours total,\nzero accent hue; 4px radius as the single allowed corner value.\nBorrow only (1-2): the live clock-plus-city status element in the nav; the\nplain typographic arrow scroll controls with no button container.\nRole rules: Grotesk never sets body copy or sizes under 40px; Montreal never\nsets display headlines above 43px; no colour beyond the declared five is ever\nintroduced, including for CTAs.\nMedia strategy: photo:unsplash — full-bleed editorial documentary photography\nof real work/events; no illustration, no icons beyond the monogram and status\ndot.\nReject: a sixth colour anywhere; drop shadows or gradients; radius above 4px;\na filled/coloured CTA button; an intermediate heading size between caption and\ndisplay.\nToken commitments: bg `#e5ebda`, surface `#ffffff`, ink `#44394c`, border-1\n`#c0c3b6`, border-2 `#b0b2a9`; display Grotesk 400 at 170-386px/leading 0.75;\nbody Montreal 400 at 12-43px/leading 1.1-1.5/+0.02-0.023em tracking; radius\n4px universal; page max-width 1440px, section gap 64-96px."}, "has_extract": true}, {"slug": "squarespace", "title": "Squarespace", "url": "https://www.squarespace.com", "captured": "2026-09-04", "family": "cinematic-monochrome-gallery", "dna": "0% colourfulness black/white contrast x whisper-weight 72px cinematic headlines", "register": "modern clean", "grammar": "chaptered editorial", "lane": "The page alternates pure black and pure white bands, each announcing itself through scale rather than colour, opening on full-bleed documentary video with a weight-300 headline floating over it and no accent colour anywhere on the marketing surface", "mode": "persuade", "traits": ["\"0% colourfulness", "pure black/white bands only\"", "\"weight 300 at 64-96px", "-0.06em tracking\"", "\"0px radius on buttons", "100px on pills only\"", "sharp/soft radius contrast by component type", "full-bleed documentary photo/video hero", "user content is the only source of colour"], "palette": ["#000000", "#ffffff", "#2f2f2f", "#898989", "#dddddd", "#999999"], "type": ["Clarkson", "Clarkson Serif"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://www.squarespace.com", "has_image": true, "img": "../design-catalogue/entries/squarespace/fold.webp", "full": "../design-catalogue/entries/squarespace/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the\nlive capture. The system declares itself \"0% colourfulness by design\" — six\ntokens total, all black, white, or gray, with the explicit rule that\nchromatic colour is never introduced anywhere on the marketing surface. That\nabsolute constraint is strategic, not merely minimal: because Squarespace\nsells websites, reserving all colour for the user-built sites shown in\nscreenshots and video makes the product itself the only vivid thing on the\npage.\n\nClarkson runs the whole system at three weights with a precise inverse\nrelationship between size and tracking: whisper-light 300 at 64-96px display\n(-0.06em, tight enough to feel \"serif-like\" in density despite being a\ngeometric sans), regular 400 for body, and 500 reserved for active nav and\ntab labels only. That weight-300-at-display choice, paired with real\ndocumentary photography (a barber cutting hair, \"no studio lighting, no\nstaged perfection\") rather than stock imagery, is what keeps a purely\nachromatic system from reading as cold.\n\nRadius is split by component type with clear intent: 0px on buttons (a\ndeliberate sharp contrast to the pill shapes used elsewhere), 8px on cards,\n100px reserved exclusively for pill-shaped filter tabs. The source calls this\n\"sharp-to-soft radius contrast... intentional\" — mixing a hard-edged CTA\nagainst soft pill tabs on the same page reads as a considered choice rather\nthan an inconsistency, because each shape is confined to exactly one role.", "What to borrow (principle)": "- **Declare an exact colourfulness percentage and hold to it.** \"0%\n  colourfulness by design\" is a stricter, more auditable commitment than \"use\n  colour sparingly\" — it forces every chromatic need onto user content instead.\n- **Reserve all saturated colour for the product being sold.** When the\n  product itself is visually rich (websites, in this case), an achromatic\n  marketing shell makes that richness the only thing worth looking at.\n- **Split radius by component role, not by a single scale.** Sharp buttons\n  next to fully-rounded pill tabs reads as intentional when each shape has\n  exactly one job, never overlapping.\n- **Use real, unstaged documentary footage for the hero.** A candid, non-\n  studio moment (rather than posed stock photography) keeps a black-and-white\n  page from feeling sterile.\n- **Reserve the higher font weight for active states only.** Weight 500\n  appearing only on active nav/tab labels, never elsewhere, makes that single\n  weight jump meaningful as a state signal.", "What to leave": "- Zero chromatic colour anywhere is a genuinely hard constraint for anything\n  beyond a confident, established brand — a newer brand may need at least a\n  functional colour for error/success states that this system doesn't\n  provide a pattern for.\n- Weight-300 Clarkson at 64-96px depends on a typeface with a true light cut\n  that survives at that scale without becoming illegible; a generic sans\n  substitute risks looking merely thin rather than \"editorial.\"\n- The sharp-button/soft-pill radius split requires strict component\n  discipline — a single rounded button introduced elsewhere would blur the\n  otherwise clear role distinction between the two shapes.", "Signature move": "The stat display block: a massive number (80-100px, weight 300) on a pure\nblack band, with the decimal or comma point rendered as a small superscript\nelement beside the digits — treating a statistic as a typographic sculpture\nrather than a data callout.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked —\nthis is a substantially richer system than \"no tokens documented\" suggested.\nFive easing families cover 345+ combined uses across five durations\n(100-750ms): two custom curves dominate (216 uses,\n`cubic-bezier(0.455, 0.03, 0.515, 0.955)` and `cubic-bezier(0.645, 0.045,\n0.355, 1)`), a fast ease-out family follows (67 uses), and — distinctively for\nthis catalogue — a `steps()` timing function appears 49 times\n(`steps(1, start)` / `steps(1)`), the discrete, non-interpolated stepping\nusually reserved for frame-by-frame or \"ticking\" reveals. That's a strong fit\nfor the stat-display block's massive counted numbers, which would plausibly\ntick digit-by-digit rather than tween smoothly. No named keyframes are\nconfirmed firing, so this choreography lives in property transitions and the\nstep function, not custom `@keyframes`. (observed in capture) the live\ncapture confirms the hero displays autoplaying documentary video (a barber\ncutting hair, with visible pause/play control) rather than a static\nphotograph, and shows a distinct second hero variant on reload (two people in\nconversation) — the hero video/photo rotates or is served dynamically, and the\ndocumented nav behaviour (transparent over hero, transitions to `#000000` on\nscroll) plausibly rides the same fast ease-out family.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 100ms | custom family |\n| sm | 200ms | custom family |\n| md | 300ms | ease-out family |\n| lg | 450ms | ease-out family |\n| xl | 750ms | `steps(1, start)` (stat ticking) |", "Brief": "Build a website-builder marketing homepage with zero chromatic colour on the\nmarketing surface. Alternate pure black `#000000` and pure white `#ffffff`\nfull-bleed section bands — no gray-blend transition, no colour anywhere else\nin the system beyond charcoal `#2f2f2f` (filled buttons) and three gray text\ntones (`#898989`, `#dddddd`, `#999999`). Open full-bleed on real, unstaged\ndocumentary video or photography with a centred weight-300 headline at\n64-96px, tracking -0.06em, and a sharp-cornered (0px radius) ghost button\nbelow it. Follow with a black stat band: three columns of massive weight-300\nnumbers (80-100px) with small uppercase labels beneath. Drop to white for a\ncentred section headline, a row of 100px-radius pill filter tabs (inactive\ntransparent, active `#dddddd` fill), and a 3-4-column card grid of dark,\nfull-bleed feature cards at 8px radius with white headline/body text and a\nbottom-right arrow icon. Cap buttons at 0px radius always; reserve 100px\nexclusively for pill tabs; use 8px for cards. No drop shadows, no gradients\nbeyond one permitted decorative atmospheric wash — never a UI fill.", "Image recipe": "Real, unstaged documentary photograph or video of [SUBJECT] — a genuine\nmoment captured with available or practical light, no studio setup, no posed\nperfection, full-bleed with no crop constraint, presented in natural colour\n(the imagery itself is the system's only source of chromatic richness against\nan otherwise black-and-white UI).", "Photo search": "Unsplash first, Pexels second.\n- \"candid documentary portrait natural light\"\n- \"small business owner at work authentic\"\n- \"creative studio candid moment\"\n- \"artisan craftsperson working documentary\"", "Reference lock": "Primary reference/direction: Squarespace — cinematic monochrome gallery,\nweight-300 display type, zero chromatic colour on the marketing surface.\nPreserve (3-5 traits): strictly achromatic palette (black, white, three\ngrays), 0% colourfulness with all saturated colour confined to user/product\ncontent; Clarkson at weight 300 for display (64-96px, -0.06em tracking),\nweight 500 reserved for active states only; radius split by role — 0px\nbuttons, 8px cards, 100px pill tabs exclusively; full-bleed documentary\n(unstaged) photography or video for the hero, never stock.\nBorrow only (1-2): the superscript decimal/comma treatment on stat numbers;\nthe single decorative (non-UI) gradient wash reserved for one atmospheric\nmoment only.\nRole rules: no chromatic colour enters any UI component under any\ncircumstance; weight 700+ is never used on Clarkson; pill radius (100px)\nnever applies to a rectangular button or card.\nMedia strategy: photo:unsplash/video — real, unstaged documentary photography\nand video only; no stock-posed imagery, no illustration.\nReject: any chromatic accent colour on a button, badge, or link; box-shadow on\nany card; pill radius on rectangular elements; body copy below 14px or\nlooser than the documented gray hierarchy.\nToken commitments: bg `#ffffff`/`#000000`, filled-button `#2f2f2f`, muted\n`#898989`, border `#dddddd`, tertiary `#999999`; display Clarkson 300 at\n40-72px/leading 0.93-1.0/-0.05 to -0.06em tracking; body 400 at 14-15px;\nradius 0px buttons, 8px cards, 100px pills; page max-width 1200px, section\ngap 80-120px."}, "has_extract": true}, {"slug": "studio-dado", "title": "Studio DADO", "url": "https://www.studiodado.com/", "captured": "2026-09-04", "family": "form-follows-feeling", "dna": "Cruise-ship interior photography x empathy-led design thesis", "register": "warm photographic", "grammar": "chaptered editorial", "lane": "A warm cabin-interior photograph carries a stacked all-caps thesis line crossing the photo/white boundary, then a bold empathy statement in oversized caps sits above a plain two-column studio description", "mode": "persuade", "traits": ["warm interior photography (cruise cabin)", "stacked oversized headline crossing the photo/white boundary", "small quadrant logomark", "plain nav labels", "giant all-caps empathy statement", "small inset project thumbnail", "two-column plain-prose body", "\"minimal added colour", "photography carries it\""], "palette": ["#7A5A3A", "#F7F5F0", "#1A1714", "#C9A15C", "#3A2C22"], "type": ["\"plain sans (visual match", "unverified)\""], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://www.studiodado.com/", "has_image": true, "img": "../design-catalogue/entries/studio-dado/fold.webp", "full": "../design-catalogue/entries/studio-dado/shot.webp", "sections": {"Why it works": "The headline — \"FORM FOLLOWS FEELING\" — is set so large it spans the boundary\nbetween the photograph and the white section beneath it, with the last word\n(\"FEELING\") landing entirely on white ground while the first two sit on the\nphoto. That single typographic decision does the studio's whole argument for\nit: the words literally move from image to plain page, echoing \"form\" (the\nphotographed space) giving way to \"feeling\" (the white, textual, conceptual\npart of the page).\n\nThe photography itself is warm and specific — a real, warmly lit cabin\ninterior with a canopy bed frame, brass details and patterned wallcovering —\nrather than a generic \"luxury interior\" stock shot, which matters for a studio\nwhose actual client base is cruise lines and hospitality: the reference photo\nneeds to look like a real commission, not an aspiration board.\n\nBelow the headline break, the page states its thesis in plain block caps\n(\"EMPATHY SHAPES EVERYTHING WE CREATE...\") directly above a small inset project\nthumbnail and a two-column plain-prose description — no bullet list, no\nfeature grid, just two paragraphs of continuous prose. For a studio selling\nemotional/experiential design thinking, writing in continuous sentences rather\nthan fragmented marketing copy matches the message to the medium.", "What to borrow (principle)": "", "What to leave": "- A headline spanning the image/white boundary is a striking one-time device;\n  it needs careful responsive handling since the split point depends on exact\n  photo crop and viewport width.\n- Two full paragraphs of continuous prose this early risks losing visitors who\n  want to see project variety before reading a philosophy — a \"see our work\"\n  link near the thesis would help.", "Signature move": "The boundary-spanning headline: \"FORM FOLLOWS FEELING\" set at a scale where the\nfirst words sit on the hero photograph and the final word lands on the white\nsection below, so the type itself performs the transition from image to\nargument.", "Motion": "(from designlang extract) Feel is \"responsive\" with scroll-linked motion\nconfirmed. The captured transitions sit on a slow `500ms`–`1s` pair, almost\nentirely on one strong decelerating ease-out (`cubic-bezier(0.23,1,0.32,1)`,\n29 uses) with a smaller `ease` group for opacity crossfades — a slower,\nheavier settle than most of this catalogue's Framer/Tailwind pages, which\nfits a photography-led studio site more invested in a considered image\ntransition than snappy UI feedback. No keyframes were captured beyond these\ntransitions, consistent with the \"simple crossfade\" read already in this\nentry.\n\n| token | value | role |\n|---|---|---|\n| `lg` | 500ms | transform/opacity transitions |\n| `xl` | 1s | slower transform settle |\n| ease-out | `cubic-bezier(0.23,1,0.32,1)` | dominant (29 uses) |\n| ease-in-out | `ease` | opacity crossfades (8 uses) |", "Brief": "Build a warm, photography-led interior-design studio page around a single\nconceptual thesis. Open on one real, specific commissioned-space photograph\n(not generic luxury stock) with a short nav and a small quadrant logomark.\nSet a 2-3 word thesis headline at a scale large enough to span the boundary\nbetween the photograph and the white section beneath it, so the type visually\nperforms the argument. Below, restate the thesis in plain oversized block caps,\npaired with a small inset project thumbnail and two columns of continuous\nprose — no bullet lists. Keep the palette almost entirely photographic, adding\nminimal separate accent colour.", "Image recipe": "A warm, specific interior of [SUBJECT] — real commissioned space, brass or\ngold fixture details, patterned or textured wallcovering, warm lamp light\nagainst cooler ambient light, shot at a considered angle that shows both\ntexture and layout, no visible people.", "Photo search": "Unsplash first, Pexels second.\n- \"luxury cabin interior warm brass lamp\"\n- \"hotel suite interior warm lighting detail\"\n- \"boutique interior canopy bed textured wall\"", "Reference lock": "Primary reference/direction: Studio DADO — a headline spanning the photograph/white boundary, thesis restated in block caps above continuous two-column prose.\nPreserve (3-5 traits): a real, specific commissioned-space photograph (not generic luxury stock) for the hero; a short thesis headline set large enough to span the image/white boundary, its meaning tracking the visual transition; thesis restated in plain block caps directly above continuous prose, no bullet lists; palette carried almost entirely by the photography itself.\nBorrow only (1-2): the small inset project thumbnail beside the prose; the small quadrant logomark.\nRole rules: boundary-spanning headline used once per page (the primary thesis only); prose sections stay in continuous sentences, never bulleted; added accent colour capped at what the photography itself contains.\nMedia strategy: photo:unsplash — real, warm, specific interior photography only; no CGI renders, no generic \"luxury lifestyle\" stock.\nReject: a bulleted feature list in place of continuous prose; a generic aspirational interior photo standing in for real commissioned work; adding a separate brand accent colour beyond what the photography carries.\nToken commitments: warm-brown `#7A5A3A`, paper `#F7F5F0`, ink `#1A1714`, brass-gold `#C9A15C`, umber `#3A2C22`; plain sans for all type, headline set in oversized block caps."}, "has_extract": true}, {"slug": "studioagriculture", "title": "Studio Ag", "url": "https://studioagriculture.co", "captured": "2026-09-04", "family": "red-rounded-agri-wordmark", "dna": "Agri-tech product photography x gutsy rounded-sans wordmark poster", "register": "modern clean", "grammar": "typographic poster", "lane": "A giant rounded red wordmark straddles a photograph of a hand sketching on a tablet mockup, then the page opens into plain white space carrying a short mission paragraph and a bold black manifesto line", "mode": "persuade", "traits": ["oversized rounded bold red wordmark", "photo bleeding through wordmark baseline", "small red italic sub-tagline", "generous white negative space", "bold black condensed manifesto line", "copyright mark as a design element", "minimal top nav", "warm wood-and-hand product photo"], "palette": ["#FFFFFF", "#E7371E", "#000000", "#EEEEEE", "#671235"], "type": ["PP Neue Montreal", "Times New Roman"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "portfolio", "category2": "playful", "origin": "raw-url", "extract": "ok", "source_url": "https://studioagriculture.co", "has_image": true, "img": "../design-catalogue/entries/studioagriculture/fold.webp", "full": "../design-catalogue/entries/studioagriculture/shot.webp", "sections": {"Why it works": "The hero repeats a device this catalogue has already logged from Indoek and EXAMPLE — a\ngiant wordmark that a photograph bleeds through — but tunes it for a different tone. Here\nthe wordmark (\"Studio Ag\") is set in a rounded, friendly, saturated red rather than an\noutline or a neutral colour, and the photo peeking above its baseline (a hand annotating a\ntablet mockup on a wooden desk) is genuine work-in-progress documentation, not styled\nlifestyle imagery — appropriate for an agency selling \"gutsy design,\" not polish. A small\nitalic red sub-tagline (\"Turning dated into daring\") sits quietly beneath, doing the same\njob the italic accent word does elsewhere in this set, but as a full short phrase rather\nthan one word.\n\nAfter the loud red hero, the page opens into a large amount of plain white negative\nspace before a short, centred mission paragraph appears — the pacing itself communicates\nconfidence; the agency doesn't need to fill the screen to keep the visitor's attention.\nThat confidence continues into the next statement, \"GUTSY DESIGN FOR THE BRANDS THAT\nFEED US,\" set in bold black condensed capitals with no photography or colour at all —\na second, harder claim delivered in a completely different register from the playful red\nhero.\n\nThe tiny circled \"©\" beside the wordmark, sized and weighted to match the wordmark\nitself, functions as a design flourish rather than legal boilerplate — it's been folded\ninto the logotype's shape instead of relegated to a footer.", "What to borrow (principle)": "- **Choose a wordmark colour and photo pairing that matches your positioning.** A\n  friendly rounded red plus an unstyled work-in-progress photo signals approachable and\n  hands-on, differently from an outline wordmark with a curated lifestyle shot.\n- **Let a large amount of plain negative space follow a loud hero.** The contrast itself\n  reads as confidence, not emptiness.\n- **State your positioning twice, in two different registers** — once playful (wordmark +\n  sub-tagline), once flatly declarative (a bold black manifesto line) — so both a scanning\n  and a reading visitor get the message.\n- **Fold a legal or copyright mark into the logotype's own visual weight** rather than\n  demoting it to fine print — it becomes a design detail instead of an afterthought.", "What to leave": "- This entry's images are derived from the archived raw capture, not a fresh render — the\n  live site returned HTTP 200 but did not complete the capture pipeline within budget, so\n  treat exact copy and layout as approximate.\n- A large gap of unstructured white space between the hero and the mission paragraph\n  (roughly a full viewport height in the raw capture) risks reading as a loading or layout\n  error on a first visit rather than a deliberate pacing choice, especially without a\n  scroll cue.\n- The rounded wordmark's baseline sits close enough to the photo above it that a taller\n  or busier hero photo would risk collision — the device depends on the specific crop\n  used here.", "Signature move": "The photo bleeding through the wordmark's ascenders while the mark itself stays in a\nwarm, friendly red rather than a neutral or outline treatment — combining the \"logo as\nwindow\" device with a colour choice that signals warmth and craft rather than restraint.", "Motion": "Motion feel reads as mechanical, and the page is scroll-linked. The duration scale runs\nunusually long for a landing page — five steps from 200ms up to a 1.25s top end — and\neasing is limited to a single curve, plain `linear` (6 uses), with no ease-in or ease-out\ncurve anywhere in the extract; the total absence of deceleration is consistent with the\n\"mechanical\" feel rating, since linear motion reads as machine-driven rather than organic.\nKeyframe use is small: `fadeIn` (a plain opacity fade) and `scroll-left` (a horizontal\ntranslate to -100%, most likely powering a continuously-scrolling marquee such as a\nclient-logo or work strip) are the only two logged as in-use; `fadeOut` and a\n`swiper-preloader-spin` keyframe also sit in the raw stylesheet — the latter naming a\nSwiper.js carousel dependency, so a slider/gallery component is present on the page even\nthough it isn't counted as in-use here. No stagger pattern is recorded (from designlang\nextract).\n\n| kind | name | value |\n|---|---|---|\n| duration | `sm` | 200ms |\n| duration | `md` | 300ms |\n| duration | `lg` | 500ms |\n| duration | `xl` | 750ms |\n| duration | `xxl` | 1.25s |\n| easing | linear | `linear` |\n| keyframe | `scroll-left` | slide-x marquee, translateX(0 → -100%) |", "Brief": "Build a branding-agency landing page for a specific-niche client base (here, agriculture\nand food brands) opening on a giant rounded, warm-coloured wordmark with a photograph\nbleeding through its ascenders — the photo should be genuine work-in-progress\ndocumentation (hands, tools, a mockup), not styled lifestyle imagery. Add one small\nitalic sub-tagline beneath in the same accent colour. Follow with generous plain white\nnegative space before a short, centred mission paragraph in plain sans. State the\nagency's core claim a second time as a bold black condensed manifesto line, in a\ncompletely different register from the hero — no colour, no photography. Fold any legal\nmark into the wordmark's own visual weight rather than relegating it to a footer.", "Image recipe": "Documentary work-in-progress photograph of [SUBJECT] — a hand annotating a tablet or\nsketch, a desk with real tools and materials, a design process moment — shot in natural\nwarm daylight on a wooden or textured surface, true-to-life colour, unstaged framing,\ncomposed so the top portion (where a wordmark's ascenders would sit) has open, uncluttered\nspace.", "Photo search": "Unsplash first, Pexels second.\n- \"hand sketching tablet design process desk\"\n- \"designer working wooden desk natural light\"\n- \"apple pencil ipad mockup hand\"\n- \"creative process desk overhead warm light\"", "Reference lock": "Primary reference/direction: Studio Ag — rounded red wordmark bleeding through a work-in-\nprogress photo, generous white space before a bold black manifesto line.\nPreserve (3-5 traits): a giant rounded, warm-coloured wordmark with a genuine work-in-\nprogress (not styled lifestyle) photograph bleeding through its ascenders; a small italic\nsub-tagline in the same accent colour beneath the wordmark; generous plain white negative\nspace between the hero and the next content block; the core claim restated a second time\nin a completely different, colourless, bold condensed register; a legal/copyright mark\nfolded into the wordmark's own visual weight.\nBorrow only (1-2): the centred, understated mission paragraph in plain sans; the minimal\ntwo-item nav split left and right.\nRole rules: the wordmark's accent colour never appears more than twice on the page (mark\nand sub-tagline); the manifesto line stays black and colourless, never mixed with the\nhero's red; negative space between sections is generous, never filled just to avoid gaps.\nMedia strategy: photo:unsplash — natural-light, unstaged work-in-progress/process\nphotography; never a polished, professionally lit lifestyle shot.\nReject: a neutral or outline wordmark treatment where the brief calls for warmth; styled\nstock lifestyle photography in place of documentary process shots; cramming the hero and\nmission statement together without a negative-space pause; relegating the copyright mark\nto a small footer line.\nToken commitments: bg `#FFFFFF`, accent-red `#E8381E`, green (photography/UI accent)\n`#04674C`, warm-tan `#C3A781`, ink-warm `#312819`, ink-deep `#100904`; rounded bold\ngrotesque for the wordmark, plain sans for body copy, bold condensed sans for the\nmanifesto line; wordmark and sub-tagline share the one accent red, manifesto line stays\npure black."}, "has_extract": true}, {"slug": "tidvatten", "title": "Tidvatten", "url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/tidvatten.html", "captured": "2026-09-03", "family": "slate-harbour", "dna": "Grotesk poster x bathhouse ledger", "register": "editorial print", "grammar": "chaptered editorial", "lane": "A cold slate reading column punctuated twice by full-bleed dark panels — the sea hero and a scroll-scrubbed temperature diptych — closing on a dark practical footer", "mode": "persuade", "traits": ["cold slate ground", "Familjen Grotesk display over Literata body", "Fragment Mono kickers at 10.5px/0.22em", "sticky label column on a 12-col grid", "§-numbered bylaw rows", "scroll-scrubbed 2°/85° diptych", "ember orange as sole accent", "full-bleed dark interludes"], "palette": ["#E7ECF0", "#D9E1E6", "#ECF1F3", "#0D171F", "#151B22", "#1A252F", "#4B545B", "#AFB9BF", "#AB3E00", "#D87339", "#396250"], "type": ["Familjen Grotesk", "Literata", "Fragment Mono"], "kind": "example", "source": "claude", "status": "ready", "category": "hospitality", "category2": "institutional", "origin": "example-site", "extract": "none", "source_url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/tidvatten.html", "has_image": true, "img": "../design-catalogue/entries/tidvatten/fold.webp", "full": "../design-catalogue/entries/tidvatten/shot.webp", "sections": {"Why it works": "Three typefaces, three jobs, no overlap. Familjen Grotesk set tight at `-0.02em`\ndoes every headline, price and address — it is the club shouting across a pier.\nLiterata at 18px does every sentence of actual prose. Fragment Mono, locked at\n10.5px and 0.22em and never once larger, does every label, time, counter and\nbyline. Because each face is confined to one register, the page needs no chrome\nto signal hierarchy: the reader can tell a fact from a voice from a label by\nshape alone.\n\nThe ground is the argument. `#E7ECF0` is not white — it is the specific cold\nslate of Öresund light in February, and everything warm on the page is\nrationed against it. Ember `#AB3E00` appears on kickers, on prices, on the\nmailto, and nowhere else; the only other heat is photographic, in two fires.\nA cold-bath club that used a warm ground would be lying about the product.\n\nThe layout commits to an asymmetry and holds it: a mono kicker plus a grotesk\nhead sit in columns 1–3, sticky, while the reading column runs 4–12. The label\ncolumn staying pinned as the prose scrolls means the reader never loses which\nchapter they are in, and it makes the empty left margin structural rather than\ndecorative.\n\nThe persuasion is done entirely in administrative register. The philosophy\nsection quotes its own bylaws — `§4 Tystnad på lavarna före klockan sju` —\nruled like a statute. The programme is four numbered fixtures with times and\nseasons, not four benefit cards. The membership is three roman-numeraled tiers\nagainst real kronor, closing on `Ingen platinanivå finns. Piren är lika kall\nför alla.` Nothing is claimed that is not also scheduled or priced.", "What to borrow (principle)": "- **Three faces, three sealed jobs.** Grotesk speaks, serif explains, mono\n  records. Cap the mono at caption size and never let it carry a sentence.\n- **Pick a ground with a latitude.** A specific cold grey commits the whole\n  palette; ration exactly one warm accent against it and let photography carry\n  the rest of the heat.\n- **Sticky label column, scrolling content column.** Kicker plus head in cols\n  1–3 pinned, prose in 4–12. Cheap, and it keeps orientation without a nav.\n- **Sell by quoting your own paperwork.** Bylaw numbers, opening hours, a\n  ledger of tiers with prices. Rules are more credible than adjectives because\n  they cost the writer something.\n- **Scrub a set-piece, don't trigger it.** Drive the animation off the section's\n  distance from viewport centre so it runs backwards on the way up, and author\n  the CSS base state as the *finished* state so a dead script leaves it legible.", "What to leave": "- The fixed grain overlay: a full-screen `mix-blend-mode: multiply` SVG\n  turbulence layer at 0.45 opacity, `z-index: 60`. It buys a texture almost no\n  one consciously registers, costs a permanently composited layer over\n  everything, and muddies an already low-chroma palette — visibly so on the\n  ember accents.\n- Tailwind via `cdn.tailwindcss.com`, with the nav toggling `bg-hav/90` and\n  `backdrop-blur-md` by `classList.add` at runtime. It works only because the\n  Play CDN watches the DOM; it is a production tell and a hard dependency on a\n  script that is explicitly not for production.\n- Vertical pacing in the middle third. The dark set-piece section and the gap\n  below `.04 Gästeldare` both run close to a full viewport of near-empty\n  ground. Restraint reads as confidence once; twice in a row reads as an\n  unfinished layout.\n- The blanket `.reveal` — a 1.25s opacity-and-translate transition applied to\n  most blocks on the page. The four guard clauses around it (mount check, zero\n  threshold, 3s failsafe, noscript fallback) are the right engineering, but\n  they are engineering spent defending a decision worth reversing: if\n  everything eases in, nothing is emphasised.", "Signature move": "The temperature diptych. On a full-bleed dark panel lit by one fire photograph,\n`2°` in cold grey and `85°` in ember sit either side of a single hairline, each\nunder a mono label — `HAVET`, `BASTUN` — with `DÄREMELLAN: FYRTIO STEG PÅ BLÖT\nEK.` beneath. Both numerals are scrubbed continuously by the section's distance\nfrom viewport centre, so the contrast builds as you arrive and unwinds as you\nleave. The entire proposition of a cold-bath club stated as two numbers and the\nwalk between them.", "Motion": "", "Brief": "Build a cold-slate editorial page for a members' club whose product is physical\ndiscomfort. Ground everything on `#E7ECF0`, a specific February grey, with deep\nsea `#0D171F` for full-bleed interludes and a single ember `#AB3E00` as the only\nwarm colour on the page. Use three faces with sealed jobs: a grotesk (Familjen\nGrotesk) tracked `-0.02em` for all display, prices and addresses; a serif\n(Literata) at 18px for every sentence of prose; a mono (Fragment Mono) fixed at\n10.5px and 0.22em uppercase for every label, time and counter. Open full-bleed\non the subject photographed at eye level, wordmark set huge along the bottom\nedge under a three-stop scrim. Below, run a 12-column grid where a mono kicker\nand grotesk head sit sticky in columns 1–3 and prose runs 4–12. Prove the club\nby quoting its own paperwork — numbered bylaws, a `.01–.04` programme with real\ntimes and seasons, and a roman-numeraled membership ledger with real prices.\nBreak the light column exactly twice with dark panels, one of them a\nscroll-scrubbed pair of temperatures. Close on a dark contact panel with an\naddress, a ruled hours table and nothing else.", "Image recipe": "Documentary photograph of [SUBJECT] in northern winter light, shot on 35mm at\ndusk or first light, natural available light only — no strobe, no fill. Cool\ndesaturated slate blues throughout with heat confined to a single practical\nsource (fire, ember, low sun) occupying under a fifth of the frame. Water or\ntimber at eye level rather than shot from above. Human figures, if any, in\nsilhouette and mid-action, never posed or looking at camera. Grain retained,\nhighlights allowed to clip, no colour grading toward teal-and-orange.", "Photo search": "Unsplash first, Pexels second.\n- \"cold sea surface eye level winter\"\n- \"wood fired sauna interior dark\"\n- \"beach bonfire silhouette dusk\"\n- \"nordic harbour pier winter fog\"", "Reference lock": "Primary reference/direction: Tidvatten — cold slate bathhouse ledger, Familjen Grotesk + Literata + Fragment Mono, membership sold as paperwork.\nPreserve (3-5 traits): cold slate ground `#E7ECF0` against deep sea `#0D171F`; three faces with sealed jobs (grotesk display / serif prose / mono metadata at 10.5px, 0.22em); 12-col grid with sticky kicker-and-head column at 1-3 and prose at 4-12; administrative persuasion — numbered bylaws, `.01–.04` fixtures with real times, roman-numeraled priced tiers; exactly two full-bleed dark interludes in an otherwise light column.\nBorrow only (1-2): the scroll-scrubbed `2° / 85°` temperature diptych; ember `#AB3E00` on kickers and prices only.\nRole rules: grotesk never sets prose, serif never sets a label, mono never sets a sentence; mono capped at 10.5px and 0.22em uppercase; ember reserved for kickers, prices and the mailto — never a filled button; every claim must carry a time, a rule number or a price.\nMedia strategy: photo:unsplash — available-light documentary frames at eye level, heat confined to one practical source; every figure captioned in mono with a date or a time.\nReject: fixed grain overlays; Tailwind Play CDN in anything shipped; blanket reveal transitions; warm or pure-white grounds; a second accent colour; icon-card \"our values\" rows; centred hero with two buttons; teal-and-orange grading."}, "has_extract": false}, {"slug": "tomo", "title": "TOMO", "url": "https://tomoseattle.com/", "captured": "2026-09-04", "family": "zine-fridge-collage", "dna": "Torn-paper sticker navigation x rubber-stamp tomato-red marquee", "register": "illustrated dark", "grammar": "gallery/catalog", "lane": "A warm linen page opens on a red marquee ribbon and a viewport-wide serif wordmark, then unfolds as an art-directed collage of overlapping food and street photography with torn-paper sticker labels — no card grid, no menu accordion, no reservation widget", "mode": "experience", "traits": ["\"120px wordmark", "single line", "no padding\"", "\"torn-paper sticker nav", "not a bar\"", "\"one red", "marquees and stamps only", "never a button\"", "\"0px radius", "1px black hairline everywhere\"", "\"full-bleed collage", "overlapping and rotated\"", "no max-width container on the homepage"], "palette": ["#eee2d4", "#000000", "#ffffff", "#ff6347", "#efefef"], "type": ["Recife", "Times"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "hospitality", "category2": "playful", "origin": "refero", "extract": "ok", "source_url": "https://tomoseattle.com/", "has_image": true, "img": "../design-catalogue/entries/tomo/fold.webp", "full": "../design-catalogue/entries/tomo/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the\nlive capture. Warm linen `#eee2d4` is the sole canvas — the source states\nwhite is a surface only, never the page background — and tomato red\n`#ff6347` is fenced entirely to marquee ribbons and rubber-stamp text, with\nan explicit ban on ever using it as a button fill. That restriction is what\nkeeps the one loud colour reading as printed ink (a stamp, a strip of taped\npaper) rather than as UI chrome asking to be clicked.\n\nRecife carries the entire display voice at a single light weight (300),\nscaled from the 96px section titles up to a ~120px wordmark that spans the\nviewport with no padding — \"the heaviest typographic moment on any page.\"\nTimes, kept deliberately small at 13px, exists only for functional fine\nprint, so the system never confuses \"large and serif\" with \"small and\nserif\" — the two sit at opposite, non-overlapping ends of the scale with\nnothing in between.\n\nThe layout refuses every restaurant-website convention by name: no\naccordion menus, no floating reservation widget, no colour-coded CTAs. Every\nphotograph sits at 0px radius with only a 1px black hairline (or nothing),\noverlapping and bleeding off the frame like a collage taped to cream paper\nrather than a card grid — and navigation itself becomes physical objects\n(torn-paper stickers with borders) instead of a conventional nav bar.", "What to borrow (principle)": "- **Fence the one accent colour to non-interactive surfaces only.** Banning\n  red from ever being a button fill — reserving it for marquees and stamps —\n  keeps a bold colour readable as ink, not as a call to action.\n- **Turn navigation into physical objects, not a bar.** Rendering nav items\n  as individual bordered \"stickers\" with gaps between them, rather than a\n  unified nav container, reinforces the collage/zine metaphor structurally.\n- **Refuse category-specific web conventions by name.** Explicitly ruling out\n  accordion menus and floating reservation widgets forces genuinely different\n  solutions instead of defaulting to industry templates.\n- **Let photography overlap and bleed instead of gridding it.** Images placed\n  at irregular scale and position, allowed to overlap type and each other,\n  read as a collage rather than a card layout.\n- **Keep a whisper-weight display serif at genuinely extreme scale.** Weight\n  300 at 80-120px only works because the size itself carries the authority —\n  adding weight would collapse the \"elegant, not heavy\" effect the source\n  names directly.", "What to leave": "- Zero max-width container on the homepage is a deliberate full-bleed choice\n  that depends on carefully art-directed positioning at every breakpoint; a\n  responsive rebuild without that same care will collapse into visual noise.\n- Banning shadows, radius, and any elevation language entirely removes a\n  common toolkit for signalling \"this is clickable\" — every interactive\n  element instead needs a border or fill-change to read as actionable.\n- A single-accent, no-CTA-button system genuinely limits conversion-focused\n  design; a reservation flow or checkout would need to invent its own\n  affordance language within these constraints.", "Signature move": "The rubber-stamp section title: large display text (80-120px) rendered with\na distressed, slightly rotated offset-print texture, floating art-directed\n(never centred) over a photography collage — treating a section header as a\nprinted stamp mark rather than a typeset heading.", "Motion": "(from designlang extract) Feel reads as smooth, and the page is scroll-linked.\nThe system is genuinely minimal: one duration (200ms) on a plain `ease` curve.\nTwo keyframes are confirmed firing — `fade-pulse-in` (an opacity fade) and\n`spin-loading` (a rotate transform) — the latter almost certainly a loading\nspinner rather than brand choreography, consistent with the \"surfaces never\nlift... this is a printed page, not a glass UI\" elevation philosophy holding\nfor everything except a functional loading state. (observed in capture) the\nlive capture confirms a static, collage-composed layout matching the\nstructure (marquee, wordmark, sticker nav, photo collage) with no visible\nanimated reveal beyond that; any interaction state most plausibly relies on a\nborder or fill swap on the sticker nav, on the same 200ms `ease`.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 200ms | `ease` |\n| fade-pulse-in | opacity fade | 1 use |\n| spin-loading | rotate transform | loading spinner |", "Brief": "Build a full-bleed, collage-style restaurant homepage with no max-width\ncontainer. Canvas is warm linen `#eee2d4` everywhere; white is a surface\ncolour only (sticker fills, reverse-type panels), never the background. Open\nwith a full-bleed tomato-red `#ff6347` marquee ribbon of uppercase Recife\ntext, then a single-line wordmark at up to 120px, weight 300, spanning the\nviewport with no padding. Render navigation as individual white, 1px-\nbordered \"sticker\" labels with small gaps between them, not a bar. Lay\nphotography as an art-directed collage — 0px radius, 1px black hairline\nborders or none, images overlapping and bleeding off the frame at varying\nscale, never in an equal-gutter grid. Float rubber-stamp section titles\n(80-120px, rotated 2-4°, distressed texture) over the photo collage,\npositioned asymmetrically. Reserve tomato red strictly for marquees and\nstamp ink — never a button fill, never a CTA. Keep body/caption text small\n(13-26px) and functional. Space sections with 65-115px padding; no shadows,\nno gradients, no rounded corners anywhere.", "Image recipe": "Tightly cropped documentary photograph of [SUBJECT] — food close-ups or\nneighbourhood street scenes shot in natural light with saturated, unfiltered\ncolour, no soft-focus or styled food-photography lighting, cropped tight and\nplaced to overlap or bleed off the frame edge as a collage element rather\nthan a standalone hero image.", "Photo search": "Unsplash first, Pexels second.\n- \"food close up natural light saturated\"\n- \"neighborhood street photography documentary\"\n- \"restaurant interior candid natural light\"\n- \"vintage sign storefront street photography\"", "Reference lock": "Primary reference/direction: TOMO — zine-collage restaurant homepage, torn-\npaper sticker nav, tomato-red marquees and stamps only.\nPreserve (3-5 traits): warm linen `#eee2d4` as the sole background, white as\na surface colour only; tomato red `#ff6347` confined to marquee ribbons and\nstamp text, never a button or CTA fill; Recife weight 300 for every display\nmoment (80-120px), Times reserved for 13px fine print only, nothing between;\n0px radius and 1px black hairline as the only border language; full-bleed,\noverlapping, asymmetric photo collage with no max-width container.\nBorrow only (1-2): the rotated rubber-stamp section-title texture; the\ntorn-paper sticker nav-item treatment.\nRole rules: red never fills a button or clickable chip; Times never sets\ndisplay text; the layout is never centred by default — composition is\nalways art-directed and asymmetric.\nMedia strategy: photo:unsplash — tightly cropped, saturated documentary food\nand street photography; no soft-focus styling, no lifestyle staging.\nReject: any filled red CTA button; box-shadow or gradient anywhere; rounded\ncorners on any element; a centred/gridded card layout; a max-width container\non the homepage.\nToken commitments: bg `#eee2d4`, ink `#000000`, surface `#ffffff`, accent\n`#ff6347`, neutral `#efefef`; display Recife 300 at 80-120px/leading 1.0;\nbody 13-26px; radius 0px universal; base spacing unit 6px, section gap\n65-115px."}, "has_extract": true}, {"slug": "veloura", "title": "Veloura Hotel Template", "url": "https://veloura-hotel-template.webflow.io", "captured": "2026-09-04", "family": "chocolate-vignette-boutique", "dna": "Boutique hotel serif signage x continuous chocolate-vignette atmosphere", "register": "cinematic dark", "grammar": "continuous world", "lane": "One deep chocolate-brown vignette ground persists from the hero through the photo grid and into a warm serif pull-quote, so the whole scroll reads as one dim, candlelit hotel corridor rather than stacked sections", "mode": "experience", "traits": ["deep chocolate-brown vignette ground", "warm serif display headline", "small-caps tracked nav and kickers", "three-photo interior grid", "pill CTA with icon", "warm pull-quote serif sentence", "room card with arrow link", "consistent warm interior photography"], "palette": ["#2A0800", "#EEE3E0", "#BA6957", "#9E4632", "#703324"], "type": ["Ltremark", "Funnel Display", "Funnel Sans"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "hospitality", "category2": "luxury-craft", "origin": "raw-url", "extract": "ok", "source_url": "https://veloura-hotel-template.webflow.io", "has_image": true, "img": "../design-catalogue/entries/veloura/fold.webp", "full": "../design-catalogue/entries/veloura/shot.webp", "sections": {"Why it works": "Unlike most of this set, which marks section boundaries with hard colour-field changes,\nVeloura keeps one continuous deep chocolate-brown vignette ground running from the hero\nthrough the photo grid and into the pull-quote sentence — the background never resets to\nwhite or a different hue. Because the ground stays constant, the page reads as one dim,\nwarmly lit space the visitor walks through rather than a series of discrete screens, which\nsuits a boutique-hotel brief better than hard chapter breaks would.\n\nTypography carries the hierarchy the colour system doesn't: a serif display (Ltremark) at\nlarge size for headlines, small-caps tracked labels for nav and section kickers, and a\nplain grotesque (Funnel Sans) for everything else. The serif headline is warm off-white,\nnever pure white, which keeps it sitting inside the vignette rather than cutting through\nit — a small but deliberate restraint that a brighter white would break.\n\nPhotography does the only real colour work on the page: three interior shots (a café\nbanquette, a floral atrium staircase, a champagne pour) sit in a plain three-up grid\ndirectly on the brown ground, each keeping its own warm-toned lighting rather than being\ngraded to match. Because the surrounding ground is already warm and dark, the photos read\nas windows into the same building rather than inserted stock imagery.", "What to borrow (principle)": "- **Let one dark, vignetted ground colour persist across multiple scroll sections**\n  instead of resetting per section — it reads as one continuous space rather than stacked\n  screens, which suits an immersive, atmospheric brief.\n- **Keep display type warm off-white, not pure white, against a warm dark ground** so\n  headlines sit inside the atmosphere instead of puncturing it.\n- **Use a plain, ungraded photo grid and let the vignette ground supply the mood** —\n  photography doesn't need heavy colour treatment if the surrounding page is already\n  doing the atmospheric work.\n- **Reserve small-caps tracked type for structural labels only** (nav, kickers, section\n  markers), keeping the serif free to carry every actual sentence.", "What to leave": "- A vignette this dark and this consistent risks flattening contrast between adjacent\n  photo tiles and their surrounding ground at low screen brightness; worth confirming\n  minimum contrast against accessibility guidance before shipping.\n- The template-marketplace \"Buy the template\" pill button sits inside the live hero grid\n  in this capture — a marketplace artifact to exclude from any derived build, same caution\n  as the Snapifye entry in this set.\n- Long serif pull-quote sentences set at a large size against a very dark, low-contrast\n  ground (the \"Cozy interiors, warm tones...\" line) sit close to the comfortable reading\n  contrast floor; fine as a short accent line, risky if copy grows.", "Signature move": "The persistent vignette: rather than resetting the background between hero, gallery and\nquote sections, Veloura keeps one radial dark-brown gradient running the full scroll\nlength, so the transition between \"sections\" is invisible — the page feels like one dim\nroom rather than a sequence of screens.", "Motion": "The designlang extract (separate from the static `capture.py` scroll-through) reads the\noverall feel as responsive and confirms scroll-linked behaviour. Five durations are in\nuse, from a near-instant 1ms discrete toggle up to a full 1 second, plus an unnamed 1.2s\ntransform transition that runs longer than any named token. A single custom easing\nfamily, `cubic-bezier(0.075, 0.82, 0.165, 1)` (8 uses), is a fast-out ease — it commits\nmost of its motion very early (y already at 0.82 by x=0.075) then eases gently into\nplace — with no spring or overshoot; it's reserved for a 1.2s transform-plus-background\npairing (likely a hover/parallax move) and a 0.6s padding-plus-opacity pairing (likely an\nexpanding card or accordion). Everything else — colour, background-colour, opacity,\nbackground-position — uses default browser ease. Only one keyframe (`spin`, a plain\n360deg rotation) is defined in the CSS bundle and it does not appear in the \"in use\" set,\nso no dedicated fade/slide keyframe backs the vignette's soft radial glow — a per-section\nglow shift, as implied by the still frames, remains unconfirmed rather than disproven\n(from designlang extract).\n\n| Duration | Value | Notes |\n|---|---|---|\n| `instant` | 1ms | discrete overflow toggle |\n| `xs` | 100ms | — |\n| `sm` | 200ms | colour, background-colour, opacity, background-position |\n| `lg` | 600ms | padding (paired with the ease-out curve) |\n| `xl` | 1s | border-colour |\n| unnamed | 1.2s | transform (paired with the ease-out curve) |\n| ease-out | `cubic-bezier(0.075, 0.82, 0.165, 1)` | fast-out, no overshoot; 8 uses |", "Brief": "Build a boutique-hotel landing page on one continuous deep, warm dark vignette ground that\npersists unbroken from the hero through at least two subsequent sections — no hard\ncolour-field resets. Set headlines in a warm off-white (never pure white) serif at large\nsize; use small-caps tracked type only for nav items and section kickers; set all other\ncopy in a plain grotesque. Open on a two-line serif headline with a small discover-arrow\nlink. Follow with a plain three-up grid of warm interior photography, each photo kept in\nits own native lighting rather than colour-graded to match. Use a large serif pull-quote\nsentence directly on the vignette ground as a mid-page accent, then introduce individual\nroom or feature cards with a simple arrow-link affordance.", "Image recipe": "Warm interior photograph of [SUBJECT] — a boutique hotel lobby, a café banquette, a\nchampagne service, a floral atrium — shot with warm practical or candle-like lighting,\nrich ambers and browns, shallow depth of field, real texture (velvet, brass, glass) in\nframe, no cool or flat daylight tones that would fight the page's warm vignette.", "Photo search": "Unsplash first, Pexels second.\n- \"boutique hotel lobby warm lighting\"\n- \"hotel cafe banquette evening ambiance\"\n- \"champagne pour celebration warm light\"\n- \"floral atrium staircase hotel interior\"", "Reference lock": "Primary reference/direction: Veloura — continuous chocolate-vignette boutique hotel page,\nserif display over one unbroken dark ground.\nPreserve (3-5 traits): one continuous, unbroken deep-brown vignette ground running across\nmultiple scroll sections with no hard colour resets; warm off-white (never pure white)\nserif display headlines; small-caps tracked type reserved for nav and kickers only; a\nplain, ungraded photo grid where each image keeps its native warm lighting; a large serif\npull-quote sentence used as a mid-page atmospheric accent.\nBorrow only (1-2): the discover-arrow link beneath the hero headline; the small dot-\nbracketed section kicker style (`· BOUTIQUE HOTEL ·`).\nRole rules: the ground colour never resets to white or a contrasting hue within the\nprimary scroll journey; display serif never drops to pure white; small-caps type never\ncarries a full sentence, only labels.\nMedia strategy: photo:unsplash — warm, practically-lit boutique hotel interior\nphotography, each image ungraded and kept in its native warm tone; never cool or flat\ndaylight interiors.\nReject: hard white or contrasting section breaks; pure-white display type against the\ndark ground; heavy colour-grading applied uniformly across the photo grid; template-\nmarketplace UI chrome left in the design.\nToken commitments: bg-vignette `#2B0800` (radial, darkest at edges), ink-warm `#EFE4E0`,\ntint `#BFA9A0`, warm-mid `#7D6457`, warm-deep `#563629`; display `Ltremark` / `Funnel\nDisplay` for headlines, body/UI `Funnel Sans`; small-caps tracking reserved for nav and\nkickers only."}, "has_extract": true}, {"slug": "vestris", "title": "Vestris", "url": "https://vestris.ai/", "captured": "2026-09-04", "family": "ivy-framed-fintech", "dna": "Renaissance still-life vines x real-estate ops dashboard", "register": "editorial print", "grammar": "live surface", "lane": "A serif-italic headline in parentheses sits on a sage ground, framed by painted ivy vines crawling in from both edges around a floating product screenshot, then a numbered four-step proof sequence", "mode": "persuade", "traits": ["sage/cream ground", "painterly ivy-vine illustration framing the hero", "serif-italic parenthetical headline", "YC badge", "floating product UI card", "numbered proof steps", "document-card stack visual", "olive CTA buttons"], "palette": ["#7C8F6E", "#F0ECDD", "#33402B", "#FFFFFF", "#FF6600"], "type": ["Instrument Serif", "Geist"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://vestris.ai/", "has_image": true, "img": "../design-catalogue/entries/vestris/fold.webp", "full": "../design-catalogue/entries/vestris/shot.webp", "sections": {"Why it works": "The headline is set inside literal parenthesis marks — \"( The file moves itself\n)\" — in a serif italic,
