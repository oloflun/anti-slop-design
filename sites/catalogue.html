 which does two things at once: it reads as an aside, a\nquiet confident claim rather than a shouted one, and the parentheses themselves\nbecome a graphic device the eye tracks. That restraint is unusual for a YC-\nbacked AI startup, most of which default to bold sans headlines; here the\nsoftware claim is dressed in editorial, almost literary type.\n\nPainted ivy vines, rendered in a soft old-master illustration style, crawl in\nfrom both edges of the hero and frame the floating product screenshot at the\ncentre. It's a strange, memorable pairing — botanical illustration around a\ndocument-automation dashboard — and it works because the vines never touch or\nobscure the screenshot itself; they stay in the margins, doing atmosphere while\nthe UI does proof.\n\nThe proof structure below is procedural rather than promotional: four numbered\nsteps (`01` documents find their file, `02` the next step kicks off, `03`\ngenerate closing docs, `04` title searches complete) each paired with a plain\nsentence and, for the visual anchor, a stack of scanned document cards showing\nreal file types (Purchase Contract, Invoice, HOA Disclosure) routing into an\norder. It reads like a systems diagram dressed as a feature list.", "What to borrow (principle)": "- **Set a plainly confident claim inside literal parentheses**, in serif italic,\n  to lower the temperature of an AI-automation headline without weakening it.\n- **Frame a product screenshot with illustration that stays in the margins** —\n  vines, borders, ornament — never overlapping the UI itself.\n- **Number your proof steps and pair each with one plain sentence**, not a\n  paragraph, so the sequence reads as a process rather than a features list.\n- **Show real document types moving through the system** (contract, invoice,\n  disclosure) rather than abstract icons, when the product's job is document\n  handling.", "What to leave": "- The old-master ivy illustration is distinctive but sits in tension with the\n  otherwise crisp, modern product screenshot — it risks reading as decorative\n  rather than integrated if it doesn't recur anywhere else on the page.\n- A YC badge this prominent works as credibility shorthand for a narrow\n  investor/technical audience but says little to the actual buyer (a title\n  company); it may be over-indexed for the wrong reader.", "Signature move": "The parenthetical headline: the entire hero claim wrapped in literal `( )`\nmarks, set in serif italic. It turns a bold software claim into something closer\nto a whispered aside — confident without needing volume.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed,\nbut the captured CSS is nearly empty: the only duration token is an\n`instant` (1ms) allow-discrete overflow transition and a generic `transition:\nall`, with a single spinner keyframe. This is consistent with a page whose\nreal content motion (the document-card stack settling into the order, the ivy\nvines framing in) is likely driven by inline JS/whileInView animation rather\nthan CSS, so it isn't visible to static extraction — the \"cards animate in\"\nread stays inferred from the image, not confirmed by the extract.\n\n| token | value | role |\n|---|---|---|\n| `instant` | 1ms | baseline transition duration (framework default) |", "Brief": "Build a sage-and-cream product page for a document-automation platform. Open on\na parenthetical headline in serif italic, small YC/investor badge above it, a\nsingle \"meet your assistant\" CTA. Frame the hero's floating product screenshot\nwith painterly botanical illustration entering from both edges, never\noverlapping the UI. Below, lay out a numbered four-step process, each step one\nplain sentence, paired with a visual of real document types stacking into an\norder. Keep buttons olive-filled, sans-serif, fully lowercase.", "Image recipe": "Illustrated botanical vine or ivy, painted in a soft old-master still-life\nstyle, muted sage and olive tones with occasional warm highlight, rendered to\nframe empty negative space at the centre — the vine reads as a border\nornament, never as the subject.", "Photo search": "Unsplash first, Pexels second (illustration, not photography, is primary here).\n- \"botanical illustration vine ivy vintage\"\n- \"old master still life leaves painting\"\n- \"sage green foliage illustration border\"", "Reference lock": "Primary reference/direction: Vestris — parenthetical serif-italic headline framed by painterly ivy vines around a floating product screenshot.\nPreserve (3-5 traits): headline set inside literal parenthesis marks in serif italic; botanical illustration framing the hero screenshot without ever overlapping the UI; numbered process steps paired with real document-type visuals; sage-and-cream ground with olive-filled CTAs.\nBorrow only (1-2): the YC/investor badge above the headline; the document-card stack visual.\nRole rules: illustration stays confined to hero margins, never inside a UI screenshot; parenthetical headline device used once per page, not repeated as a section-header pattern; numbered steps capped at one sentence each.\nMedia strategy: illustration only for the hero frame (no photography); product screenshots are real UI, never mockup placeholders.\nReject: bold, shouted AI-startup headline type in place of the parenthetical serif italic; illustration overlapping or obscuring the product screenshot; abstract icons replacing real document-type visuals in the proof section.\nToken commitments: sage `#7C8F6E`, cream `#F0ECDD`, olive-ink `#33402B`, white `#FFFFFF`, badge-orange `#FF6600`; serif italic for the hero headline only, sans for all UI and body copy."}, "has_extract": true}, {"slug": "vintergatan", "title": "Vintergatan", "url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/vintergatan.html", "captured": "2026-09-03", "family": "paper-atelier", "dna": "Antiquarian ledger x scroll-scrubbed setpiece", "register": "editorial print", "grammar": "chaptered editorial", "lane": "Warm paper column carrying a photographic overture, a priced weekly acquisitions ledger and a numbered bindery process, interrupted once by a dark workshop setpiece scrubbed word by word, closing on hours and address", "mode": "persuade", "traits": ["warm paper ground", "Cormorant Garamond display", "IBM Plex Mono labels", "oxblood + gold accents", "priced ledger rows with FÖRV numbers", "roman-numeral process steps", "dark scrubbed setpiece", "documentary book photography", "Swedish copy"], "palette": ["#F4F0E4", "#F0EBDD", "#E9E3D2", "#211712", "#201610", "#5D5349", "#842A24", "#B45249", "#C8A65F"], "type": ["Cormorant Garamond", "EB Garamond", "IBM Plex Mono"], "kind": "example", "source": "claude", "status": "ready", "category": "editorial", "category2": "consumer-brand", "origin": "example-site", "extract": "none", "source_url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/vintergatan.html", "has_image": true, "img": "../design-catalogue/entries/vintergatan/fold.webp", "full": "../design-catalogue/entries/vintergatan/shot.webp", "sections": {"Why it works": "The page speaks the shop's own vocabulary and refuses to translate it. Acquisitions\ncarry `FÖRV. 2 311` numbers, a shelf is `HYLLA XIV, TOPOGRAFI OCH RESOR`, a status\nis `UNDER BESKRIVNING`, and Monday in the opening-hours table is not a time at all\nbut the word `verkstadsdag`. None of that is explained. A visitor who knows the\ntrade is recognised; one who does not learns the trade from the page. That is what\nmakes it read as a real shop rather than a template with a books photo.\n\nType is split three ways and never crossed: Cormorant Garamond for display,\nEB Garamond for reading, IBM Plex Mono for every label, catalogue number, price\nunit and caption. The mono is what carries the ledger feeling — set small, in caps,\nletter-spaced, it looks typed rather than designed, which is exactly right for a\nrecord kept at a counter.\n\nItalics are used as a punctuation mark, not as emphasis. Each headline ends with\none italic word in gold — *kvar*, *förvärv*, *till*, *skriv* — always the last\nword, always the only coloured thing in the line. One rule, applied four times, and\nthe page has a voice.\n\nThe weekly acquisitions section is the commercial engine and it is set as a plain\nruled table: `.01` index, title in display serif, two lines of condition prose,\ncatalogue number and status in mono, price at the right with `SEK` in mono beneath.\nFive rows, real prices from 340 kr to 48 000 kr. The range is the argument — it\nsays this is a shop you can walk into, not only a dealer's showroom.\n\nThe one dark chapter is placed exactly where a page like this gets tiring, and it\nis about the workshop rather than the shop. Ground flips to `#211712`, the labels\nstay mono, and three verbs stack — Syr. Lagar. Förgyller. — scrubbed in by scroll\nposition rather than triggered once. The interruption is earned because the\ncontent genuinely changes rooms.", "What to borrow (principle)": "- **Use the trade's own words as UI.** Catalogue numbers, shelf marks, status\n  strings and a non-time entry in the hours table do more for credibility than any\n  \"about us\" paragraph.\n- **Three faces, three jobs.** Display serif for headlines, text serif for reading,\n  mono for every label and number. Mono is what makes a page feel like a record.\n- **One italic word per headline, in the accent colour, always last.** A single\n  repeatable typographic gesture beats varied emphasis.\n- **Price the full range.** Showing 340 kr next to 48 000 kr tells the reader who\n  the shop is for; showing only the top price tells them to leave.\n- **Guard your reveals.** This page adds the reveal class in JS (so a\n  no-JS reader sees everything), marks anything already on screen as revealed at\n  mount, and then runs two timeouts — 1.8s for near-viewport elements, 6s for\n  everything — that force the un-revealed visible. A scroll animation that cannot\n  strand content is the only kind worth shipping.", "What to leave": "- The fixed `mix-blend-mode: multiply` grain at 0.45 opacity. Same objection as\n  every other page in this family: a permanent composited full-screen layer that\n  mostly just dulls the photographs.\n- The reveal set is still broad — every `h1, h2, h3, figure, li` outside the\n  setpiece. The failsafes make it safe, not necessary. Reveal section openings, not\n  list items.\n- The scrubbed setpiece is beautiful in place and unreadable in a screenshot, a\n  print, a PDF export or a slow scroll — anything that captures a scroll position\n  mid-way gets blurred type. If the content matters, it must be legible at every\n  scroll offset, not only at the end of one.\n- Four consecutive gold italic closers is one more than the device can carry. Two\n  land as a signature; four start to read as a mannerism.", "Signature move": "The workshop setpiece: at one point the paper ground flips to near-black, and three\nverbs — Syr. Lagar. Förgyller. — are scrubbed in word by word as a function of\nscroll position, with a hairline \"thread\" drawing itself down the left. Both\ndirections work, the CSS resting state is the finished state (so no-JS and\nreduced-motion readers get the type outright), and `?preview=setpiece` locks it\nopen for capture. Ambition and a way out of it, shipped together.", "Motion": "", "Brief": "Build a Swedish antiquarian bookshop page on warm paper `#F4F0E4` with near-black\n`#211712` ink. Set headlines in Cormorant Garamond, body in EB Garamond at\n1.05rem/1.75, and every label, catalogue number, price unit and caption in IBM Plex\nMono at 11px, caps, 0.1em tracking. End each headline with one italic word in gold\n`#C8A65F`. Open on a full-bleed documentary photograph of shelves with the headline\nset into it and a small mono-labelled address block at the lower right. Present the\nweek's acquisitions as a ruled table: `.01` index, title, two lines of condition\nprose, `FÖRV.` number and status in mono, price at the right with `SEK` beneath —\nfive rows spanning a wide price range. Interrupt once with a full-width near-black\nworkshop chapter carrying three stacked verbs and a hairline rule. Set the bindery\nprocess as roman-numeraled rows: `i Brevet`, `ii Genomgången`, `iii Arbetet`, each\nwith one paragraph. Close on a two-column contact panel with an hours table where\none weekday is a word, not a time.", "Image recipe": "Documentary photograph of [SUBJECT] in a working antiquarian shop, available light\nfrom a shop window, warm tungsten fill, shallow depth of field with one shelf plane\ncrisp, muted colour with cream highlights and deep brown shadows, dust and wear\nleft in, no styling, no props arranged for the camera, no white background, shot at\nstanding eye level as a customer would see it.", "Photo search": "Unsplash first, Pexels second.\n- \"antiquarian bookshop shelves warm light\"\n- \"old books stacked spines close up\"\n- \"bookbinding workshop hands tools\"\n- \"fountain pen writing ledger paper\"", "Reference lock": "Primary reference/direction: Vintergatan — warm-paper Swedish antiquarian shop page, Cormorant + EB Garamond + IBM Plex Mono, priced acquisitions ledger, one dark workshop chapter.\nPreserve (3-5 traits): warm paper `#F4F0E4` with near-black `#211712` ink; three-way type split (display serif / text serif / mono labels) never crossed; trade vocabulary as UI — catalogue numbers, shelf marks, status strings, a weekday that is a word; the ruled priced acquisitions table spanning a wide price range; exactly one dark full-width workshop chapter.\nBorrow only (1-2): the single gold italic closing word per headline; the three-failsafe reveal guard.\nRole rules: mono never sets a sentence and never exceeds 11px/0.1em; display serif never sets a label; gold `#C8A65F` only on the italic closing word; oxblood `#842A24` only on acquisition titles; at most two gold italic closers per page.\nMedia strategy: photo:unsplash — available-light documentary shots of the actual premises and stock, always captioned in mono with shelf mark or catalogue number.\nReject: fixed grain overlays; scroll-scrubbed type on content that must be readable in a screenshot; blanket reveals on list items; a third accent colour; sans-serif anywhere; centred layouts.\nToken commitments: papper `#F4F0E4`, benvit `#F0EBDD`, benvit-djup `#E9E3D2`, mörk `#211712`, svart `#201610`, sten `#5D5349`, oxblod `#842A24`, oxblod-ljus `#B45249`, guld `#C8A65F`; display `Cormorant Garamond`, body `EB Garamond`, mono `IBM Plex Mono`; display tracking -0.015em, mono tracking 0.1em at 11px, body 1.05rem/1.75."}, "has_extract": false}, {"slug": "vinterspelen", "title": "Vinterspelen", "url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/vinterspelen.html", "captured": "2026-09-03", "family": "gustavian-salon", "dna": "Opera playbill x museum wall label", "register": "historical art", "grammar": "chaptered editorial", "lane": "Deep teal salon lit by candle ochre, alternating with paper programme pages of numbered acts and dot-leader cast lists, interrupted by a scroll-driven stage machine that slides painted wing flats aside", "mode": "persuade", "traits": ["deep teal salon ground", "candle ochre accent", "Bodoni Moda display", "Newsreader body", "public-domain museum art only", "gilt-framed image plates", "dot-leader cast lists", "roman-numeral acts", "scroll-driven wing flats", "inventory-number captions"], "palette": ["#091C1F", "#13282B", "#213537", "#0B0603", "#EAE3D5", "#DAD1C0", "#ECE7DE", "#281E17", "#DAAE50", "#704100", "#A23432"], "type": ["Bodoni Moda", "Newsreader"], "kind": "example", "source": "claude", "status": "ready", "category": "editorial", "category2": "institutional", "origin": "example-site", "extract": "none", "source_url": "file:///C:/Users/Anton%20L/anti-slop-design/sites/vinterspelen.html", "has_image": true, "img": "../design-catalogue/entries/vinterspelen/fold.webp", "full": "../design-catalogue/entries/vinterspelen/shot.webp", "sections": {"Why it works": "Every image on the page is public-domain museum art — Pilo, Hilleström, Roslin,\nDesprez, Piranesi — pulled from Nationalmuseum and The Met, and every one is\ncaptioned with artist, title, year and inventory number (`Nationalmuseum, NM\n18007`). A page about an eighteenth-century theatre is therefore illustrated with\neighteenth-century pictures rather than with a modern photograph pretending to be\nold. It costs nothing, it cannot be mistaken for stock, and the credit line becomes\npart of the design instead of a legal afterthought.\n\nThe colour scheme is a lit room. Deep teal `#091C1F` is the darkened salon, ochre\n`#DAAE50` is candlelight, and the paper sections `#EAE3D5` are the programme in\nyour hands. Because there are only two states — room and paper — the alternation\nreads as house lights down, house lights up, and the reader always knows which\nthey are in.\n\nThe programme is set as an actual playbill. Roman-numeral act, work title in Bodoni\nitalic, composer and librettist line in tracked micro-caps, a paragraph, then a\ncast list with dot leaders running from role to singer — `Orfeo ......... Elin\nNorlander`. Dot leaders are a typographic convention from printed programmes that\nalmost no website uses, and they do the job here perfectly: two columns, no table,\nno borders.\n\nThe facts are specific enough to be checkable, and they are set as display type:\n`2.20` playing time, 214 wax candles, 415 hertz, gut strings, 62 kilos in the\nflying rig, 9 surviving back cloths of which four can still be hung. A page that\ntells you the orchestra tunes low and the theatre has no amplification is selling\nthe constraint as the product.\n\nImages are framed rather than bled. Each plate sits in a double gilt-line frame on\nthe teal ground with the caption in italic beneath — the exact treatment of a\npicture hung on a wall or reproduced in a catalogue. Full-bleed would have been the\nobvious move and would have destroyed the museum register.", "What to borrow (principle)": "- **Illustrate from open museum collections.** Nationalmuseum, The Met, Rijksmuseum\n  and Wikimedia Commons are free, period-accurate and unmistakably not stock. Caption\n  with artist, title, year and inventory number and the provenance becomes design.\n- **Two states, not five.** One dark \"room\" ground and one paper ground, alternating,\n  will chapter a long page better than a palette of section colours.\n- **Steal conventions from the printed artefact you are replacing.** Dot leaders,\n  roman-numeral acts, a composer line in micro-caps — a playbill already solved this\n  layout in 1777.\n- **Frame the pictures.** A thin double rule and a caption in italic reads as\n  collection; a full-bleed crop reads as marketing.\n- **Sell the constraint.** No amplification, no recording, doors closed during act\n  one, 214 candles — the limitations are the argument, set at display size.", "What to leave": "- Every image is hotlinked from `upload.wikimedia.org` at 1280px. Public domain is a\n  licence, not a CDN — rehost the files, or the page breaks when Commons rate-limits\n  or a file gets renamed.\n- The stage-machine setpiece animates `letter-spacing` and `filter: blur()` on every\n  frame of a scroll scrub. Both force layout or a full-frame repaint; the same effect\n  is available from `transform` and `opacity` on a pre-blurred layer.\n- The scrub region is a tall sticky block: several viewport-heights of scrolling that\n  advance the page by one image. Beautiful once, tedious on a second visit, and\n  invisible to anyone who lands mid-page from a link.\n- Ochre is used on the wordmark, the nav button, the kickers, the act numerals, the\n  stat figures and the closing headline — it is doing so much work that nothing it\n  touches reads as emphasised any more. Pick two roles for it.", "Signature move": "The stage machine. A sticky section holds six painted wing flats — cut from a real\nDesprez scene drawing — that slide outward in staggered order as you scroll, outer\npair first, inner pair travelling furthest, while the back cloth behind them\nun-blurs and the caption line tightens from 0.42em tracking to almost none. It is\na working model of the 1777 machinery the page is describing: the same drawing, the\nsame seven-second wing change, driven by the reader's own scroll. Reduced motion\nand `?preview=scen` both render the finished state outright.", "Motion": "", "Brief": "Build a page for a period theatre festival on a deep teal salon ground `#091C1F`\nalternating with warm paper `#EAE3D5`, with a single candle-ochre accent `#DAAE50`.\nSet all display type in Bodoni Moda (italic for work titles) and all body in\nNewsreader at 1.05rem/1.7; use tracked micro-caps at 11px for kickers, composer\nlines and stat labels. Illustrate exclusively with public-domain museum art,\nhosted by you, each plate inside a thin double gilt frame with an italic caption\ncarrying artist, title, year and inventory number. Set the programme as a playbill:\nroman-numeral act, italic work title, composer and librettist in micro-caps, one\nparagraph, then a cast list with dot leaders from role to performer, and playing\ntime set as a large numeral at the right. Add a stat band of three checkable\nnumbers in ochre display type. Interrupt once with a scroll-driven stage sequence\nin which painted flats slide aside to reveal a second scene. Close on a dark\ncandle-lit panel with ticket prices and travel directions.", "Image recipe": "Public-domain collection artwork, not generated. Search museum open-access\narchives for [SUBJECT] in eighteenth-century Swedish or French painting, theatre\nscene design or architectural etching; prefer oil sketches, stage drawings and\nPiranesi-style etchings with deep chiaroscuro and warm varnish tone. Download the\nfull-resolution file, rehost it, and caption it with artist, title, year,\ninstitution and inventory number. If a photograph is genuinely required, shoot\ncandle-lit interiors at ISO 3200 with no fill.", "Photo search": "Museum open access first, stock never.\n- Nationalmuseum (Sweden) — \"Desprez scenbild\", \"Pilo\", \"Hilleström\", \"Roslin\"\n- The Met Open Access — \"Piranesi Carceri\", \"18th century candlestick\", \"viola da gamba\"\n- Wikimedia Commons — \"Gustavian theatre\", \"Drottningholms slottsteater\"\n- Rijksmuseum — \"theatre machinery engraving\"", "Reference lock": "Primary reference/direction: Vinterspelen — deep teal salon alternating with paper programme, Bodoni Moda + Newsreader, illustrated entirely with credited public-domain museum art.\nPreserve (3-5 traits): two grounds only — teal salon `#091C1F` and paper `#EAE3D5` — alternating as house-lights-down/up; candle ochre `#DAAE50` as the single accent; all imagery public-domain museum works in thin double gilt frames with artist/title/inventory captions; the playbill programme with roman-numeral acts and dot-leader cast lists; checkable specifics (candle count, pitch, playing time) set as display numerals.\nBorrow only (1-2): the scroll-driven wing-flat sequence; the stat band of three ochre numerals.\nRole rules: Bodoni Moda never below 18px, Newsreader never in a headline; micro-caps capped at 11px/0.16em; ochre limited to two roles per page; images always framed, never bled; every image carries a full credit.\nMedia strategy: public-domain museum collections, rehosted locally — never stock photography, never generated imagery for a historical subject.\nReject: hotlinking Commons or museum URLs; animating letter-spacing or blur per scroll frame; multi-viewport sticky scrubs on a primary path; full-bleed crops of collection art; a second accent colour; sans-serif.\nToken commitments: sal `#091C1F`, sal2 `#13282B`, sal3 `#213537`, natt `#0B0603`, papper `#EAE3D5`, papper2 `#DAD1C0`, kalk `#ECE7DE`, tryck `#281E17`, ockra `#DAAE50`, ockra-djup `#704100`, karmin `#A23432`; display `Bodoni Moda`, body `Newsreader`; max-width 1480px, micro-caps tracking 0.16em, body 1.05rem/1.7."}, "has_extract": false}, {"slug": "vistal", "title": "Vistal", "url": "https://vistal.webflow.io", "captured": "2026-09-04", "family": "floating-house-wordmark", "dna": "Floating glass-house dusk photography x giant outline wordmark poster", "register": "modern clean", "grammar": "typographic poster", "lane": "A giant white outline wordmark sits over a dusk photograph of a floating glass house, then the page cuts hard to a flat yellow section of centred black type and a fanned stack of project photo cards", "mode": "persuade", "traits": ["oversized outline wordmark over photo", "dusk architectural photography", "flat saturated yellow second section", "fanned overlapping photo cards", "black pill CTAs", "copyright mark beside wordmark", "small-caps dot-marked section kicker", "centred black sans headline"], "palette": ["#F1D359", "#F8F8F5", "#616059", "#22221D", "#3F3B35", "#131313"], "type": ["Inter"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "portfolio", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://vistal.webflow.io", "has_image": true, "img": "../design-catalogue/entries/vistal/fold.webp", "full": "../design-catalogue/entries/vistal/shot.webp", "sections": {"Why it works": "The hero repeats this catalogue's photo-through-wordmark device (see Indoek) but in a\nsingle-colour outline treatment against a moody dusk photograph of a floating glass\narchitecture piece — the wordmark's open counters let the photograph's warm interior\nlighting show through the letterforms rather than masking a separate image inside them.\nSupporting copy stays minimal: a two-line statement, one short sentence, and a single\npill CTA, all kept to the lower half of the frame so the architecture photograph and the\nwordmark share the visual weight evenly.\n\nThe page then cuts, with no gradient or transition, from the dusk photograph straight into\na flat, fully saturated yellow section — one of the hardest colour-field breaks in this\nset. Centred black sans type states the value proposition plainly, and a fanned stack of\nthree overlapping project photo cards (each captioned with a project type) sits beneath\nit, the cards' white borders and drop shadows reading as physical printed photographs laid\non a yellow desk rather than a browser grid.\n\nThe small circled \"©\" beside the wordmark, echoed exactly in Studio Ag elsewhere in this\nset, again turns a legal mark into a piece of the logotype rather than footer boilerplate\n— a small but recognisable convention this catalogue is now seeing across unrelated\ntemplates.", "What to borrow (principle)": "- **Let a photograph show through an outline wordmark's counters directly**, rather than\n  masking a second cropped image inside them — the letterforms and the photo's own\n  lighting merge into one object.\n- **Use one hard, saturated colour-field cut as the entire transition between hero and\n  next chapter.** No gradient needed if the cut itself is confident.\n- **Fan overlapping photo cards with visible borders and shadows** to read as physical\n  prints rather than a uniform digital grid — effective for portfolio/gallery previews.\n- **Fold a copyright or trademark mark into the wordmark's own scale and weight** instead\n  of relegating it to a footer line.", "What to leave": "- This entry's images are derived from the archived raw capture, not a fresh render — the\n  live site did not complete the capture pipeline within budget (background attempt also\n  failed), so treat exact copy and layout as approximate.\n- A fully saturated flat yellow field this large, directly following a moody dusk\n  photograph, is a high-contrast jump that could read as jarring rather than confident\n  depending on the surrounding brand tone — worth testing against the specific palette\n  before committing.\n- The fanned photo-card stack's drop shadows are heavier than anything else on the page,\n  introducing a dimensionality (depth, physical stacking) that the rest of the flat-colour\n  system doesn't otherwise use.", "Signature move": "The photo-lit outline wordmark: rather than a flat white or black outline logotype, the\nletterforms are transparent enough (or positioned precisely enough) that the dusk\nphotograph's own warm interior lighting reads through them, so the wordmark appears to be\nglowing from the same light source as the architecture behind it.", "Motion": "Motion feel is smooth and the page is scroll-linked. The duration scale is short — just\nthree steps, 100ms to 300ms — noticeably tighter than the other extracts in this batch, and\neasing draws from only two families: a plain `ease-in-out` (\"ease\", 5 uses) and a gentle\ndecelerate curve (`ease-out`, `cubic-bezier(0.25, 0.46, 0.45, 0.94)`, 2 uses) — neither is a\nspring or overshoot curve. No keyframe animation is logged as in-use at all; a generic\n`spin` (360° rotation) sits in the raw stylesheet, presumably for a loading state, but\nnothing is recorded as actually applied to page content. The motion here appears to run\nentirely on property transitions (opacity, transform, background-color) rather than\nkeyframe reveals — consistent with the \"smooth\" feel rating and the extract's soft,\nlow-key shadow profile. No stagger pattern is recorded (from designlang extract).\n\n| kind | name/family | value |\n|---|---|---|\n| duration | `xs` | 100ms |\n| duration | `sm` | 200ms |\n| duration | `md` | 300ms |\n| easing | ease-in-out | `ease` |\n| easing | ease-out | `cubic-bezier(0.25, 0.46, 0.45, 0.94)` |", "Brief": "Build an architecture-studio or property template opening on a giant outline wordmark\npositioned over a moody dusk photograph of a distinctive building, so the photograph's own\nlighting reads through the wordmark's open counters. Keep supporting hero copy — a two-\nline statement, one sentence, one pill CTA — confined to the lower half of the frame.\nCut hard, with no gradient, into a flat, fully saturated accent-colour section carrying a\ncentred black sans value-proposition headline. Beneath it, fan two or three overlapping\nproject photo cards with visible white borders and drop shadows, each captioned with a\nshort project type and description, so they read as physical prints rather than a grid.\nFold any copyright/trademark mark into the wordmark's own visual scale.", "Image recipe": "Moody dusk or blue-hour architectural photograph of [SUBJECT] — a distinctive modern\nbuilding (glass, timber, floating or waterside structure) — shot with warm interior\nlighting visible through glass against a cool dusk exterior, sharp architectural lines,\nsome natural surroundings (water, greenery) in frame, composed with open sky or water\nspace at the top for a large outline wordmark to sit over.", "Photo search": "Unsplash first, Pexels second.\n- \"modern glass house dusk lit interior\"\n- \"floating architecture waterside blue hour\"\n- \"contemporary building warm interior lighting dusk\"\n- \"architectural photography glass timber dusk\"", "Reference lock": "Primary reference/direction: Vistal — dusk architecture photograph glowing through a\ngiant outline wordmark, hard cut into a flat yellow section with fanned project cards.\nPreserve (3-5 traits): a giant outline wordmark positioned so a dusk photograph's own warm\nlighting reads through its open counters; minimal hero copy confined to the lower half of\nthe frame; a hard, ungraded cut from the photographic hero into a flat saturated accent-\ncolour section; a fanned stack of overlapping, bordered project photo cards reading as\nphysical prints; a copyright/trademark mark folded into the wordmark's own scale.\nBorrow only (1-2): the small dot-marked section kicker (\"• ABOUT VISTAL\"); the black pill\nCTA style with a circular arrow icon.\nRole rules: the wordmark is always photo-lit, never a flat solid colour on the homepage\nhero; the colour-field cut between hero and next section is always hard, never a\ngradient; photo cards always carry a visible border and shadow, never flush/borderless.\nMedia strategy: photo:unsplash — moody dusk/blue-hour architectural photography with warm\ninterior light against a cool exterior; never a bright daylight or interior-only shot.\nReject: a flat, non-photo-lit wordmark treatment; a gradient transition between the hero\nand the accent-colour section; a flush, borderless photo grid in place of fanned cards;\nrelegating the copyright mark to a small footer line.\nToken commitments: accent-yellow `#F1D359`, paper `#F8F8F5`, ink `#22221D`, ink-soft\n`#3F3B35`, stone `#616059`, warm-tan `#887661`; grotesque sans for wordmark and headlines\nthroughout; wordmark always set large and photo-lit in the hero, black sans centred for\nthe yellow section's headline."}, "has_extract": true}, {"slug": "whatmatters", "title": "What Matters (Agency)", "url": "https://www.whatmattersagency.com", "captured": "2026-09-04", "family": "overhead-feast-agency-poster", "dna": "Overhead hospitality feast photography x condensed black poster claims", "register": "warm photographic", "grammar": "typographic poster", "lane": "A giant white condensed headline sits over an overhead photo of hands sharing a dessert, then the page drops to white for a client-logo wall and a black condensed manifesto statement with one photo wedged mid-sentence", "mode": "persuade", "traits": ["overhead candid dining photograph", "oversized condensed white headline", "yellow pill CTA in nav", "parenthetical qualifier in small caps", "client logo wall in native typography", "black condensed manifesto statement", "small photo wedged inside a headline", "outlined secondary CTA"], "palette": ["#FFFFFF", "#050505", "#FEF073", "#6C6B6A", "#5A92E7", "#312821"], "type": ["Denim Ink", "Neue Haas Display", "Inter"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "portfolio", "category2": "hospitality", "origin": "raw-url", "extract": "ok", "source_url": "https://www.whatmattersagency.com", "has_image": true, "img": "../design-catalogue/entries/whatmatters/fold.webp", "full": "../design-catalogue/entries/whatmatters/shot.webp", "sections": {"Why it works": "The hero photograph — an overhead, candid shot of two people's hands sharing a plated\ndessert at a dark restaurant table — is doing the same job EXAMPLE and Picnic use\nelsewhere in this set: proving the agency's category (hospitality) before a single word is\nread. The huge condensed white headline \"WHAT MATTERS\" sits directly on the photo with a\nsmall parenthetical qualifier, \"(AGENCY)\", set at a fraction of the size beside it —\nenough to clarify the wordmark is also the company name without diluting its scale as a\nheadline.\n\nA single yellow pill CTA in the top-right nav is the only saturated colour on the entire\npage; everything else is white, black, or drawn from the warm, dark-red tones of the food\nphotography itself. This restraint means the CTA is never competing with anything for\nattention — there's exactly one coloured shape on the page at any time.\n\nBelow the fold, the page states its positioning as three short, stacked, ultra-bold\ncondensed lines (\"CREATIVE-FIRST. HOSPITALITY FOCUSED. SYSTEMS ENABLED.\") with a single\nsmall photograph wedged directly into the gap between two lines via a bracketed\ndown-arrow — a smaller, quieter cousin of the wedged-photo device seen in the EXAMPLE\nentry. Client logos, kept in each brand's own native typography, sit above this statement\nas a plain, unstyled wall — proof arrives before the pitch is even fully stated.", "What to borrow (principle)": "- **Let one candid, category-appropriate photograph state your specialism before your\n  headline does.** An overhead hospitality photo says \"we work in restaurants\" faster\n  than a sentence could.\n- **Reserve your one accent colour for a single small UI element** (here, the nav CTA)\n  when the rest of the page draws its warmth entirely from photography.\n- **Wedge a small photograph into the gap of a stacked manifesto statement** rather than\n  running it as a separate image block — it keeps the claim and its proof in one visual\n  unit.\n- **Show a client-logo wall in each brand's native typography, unstyled**, above your own\n  positioning statement — proof precedes pitch.", "What to leave": "- This entry's images are derived from the archived raw capture, not a fresh render — the\n  live site returned HTTP 200 but did not complete the capture pipeline within budget, so\n  treat exact copy and layout as approximate.\n- The \"(AGENCY)\" qualifier's small size next to the massive headline risks being missed\n  entirely on a quick scan — worth testing whether first-time visitors correctly parse the\n  company name.\n- Stacking three ultra-bold condensed manifesto lines at full viewport width with no\n  supporting copy between them is a high-commitment device; it depends entirely on the\n  three lines being genuinely differentiated claims, not filler.", "Signature move": "The wedged manifesto photo: a single small photograph sits inside the vertical gap of a\nthree-line stacked bold statement, marked by a bracketed arrow, so the image reads as\nsupporting evidence for the middle claim specifically rather than a generic illustration\nof the whole paragraph.", "Motion": "Motion feel is mixed and the page is scroll-linked. Durations run a full micro-to-macro\nramp from a 20ms `instant` step up to a 420ms `lg` step. Easing is more varied than most\nentries in this set: a standard decelerate curve (`ease-out`) handles light touches, a\n\"custom\" family of three steep, front-loaded cubics (all control points stay within 0–1,\nso none are true spring/overshoot curves, but they read as snappier than a plain ease)\ncarries the bulk of the transitions at 275 uses, and a plain `linear` covers continuous\nmotion. Keyframe use is narrow — only `translateXCursor`, a horizontal slide to -100%,\nconsistent with a custom cursor-follow or marquee element; a `spin` (360° rotation) exists\nin the stylesheet but isn't logged as in-use. The raw transitions do show one explicit\nchoreography pattern: seven `transform 0.5s` rules share the same custom cubic-bezier but\neach adds an incremental 0.02s delay (0.02s → 0.14s), a classic staggered-reveal for a list\nof items entering in sequence (from designlang extract).\n\n| kind | name/family | value |\n|---|---|---|\n| duration | `instant` | 20ms |\n| duration | `xs` | 100ms |\n| duration | `sm` | 160ms |\n| duration | `md` | 260ms |\n| duration | `lg` | 420ms |\n| easing | ease-out | `cubic-bezier(0.165, 0.84, 0.44, 1)` |\n| easing | custom | `cubic-bezier(0.625, 0.05, 0, 1)` |\n| easing | custom | `cubic-bezier(0.75, 0, 0.25, 1)` |\n| easing | custom | `cubic-bezier(0.625, 0.5, 0, 1)` |\n| easing | ease-in-out | `ease` |\n| easing | linear | `linear` |", "Brief": "Build a hospitality-focused content/creative-agency landing page opening on one full-\nbleed, candid overhead photograph of shared dining (hands, food, a set table) with a\nmassive condensed white headline set directly on the photo, paired with a small\nparenthetical qualifier clarifying the company type. Reserve one saturated accent colour\nfor a single small CTA element only. Below the fold, show a client-logo wall in each\nbrand's own native typography, unstyled and ungridded beyond simple horizontal spacing.\nFollow with the agency's positioning stated as three short, stacked, ultra-bold condensed\nlines at large scale, with one small supporting photograph wedged into the gap between two\nof the lines via a simple bracketed arrow mark.", "Image recipe": "Overhead candid photograph of [SUBJECT] — a shared restaurant meal, hands reaching for\nfood, a plated dessert or dish — shot from directly above, warm ambient restaurant\nlighting (candlelight, low warm bulbs), true-to-life saturated warm tones, genuine motion\nand gesture (cutlery mid-use, hands overlapping), no studio food-photography lighting.", "Photo search": "Unsplash first, Pexels second.\n- \"overhead restaurant table hands sharing food\"\n- \"candid dining hands dessert warm light\"\n- \"bartender at work restaurant candid\"\n- \"restaurant table overhead ambient lighting\"", "Reference lock": "Primary reference/direction: What Matters (Agency) — overhead dining photo hero with a\nmassive condensed headline, black manifesto statement with a wedged photo.\nPreserve (3-5 traits): one full-bleed candid overhead hospitality photograph carrying a\nmassive condensed white headline with a small parenthetical qualifier; exactly one\nsaturated accent colour, reserved for a single small CTA; a client-logo wall shown in\neach brand's native typography, unstyled; a stacked, ultra-bold condensed manifesto\nstatement with one small photo wedged into its gap via a simple arrow mark.\nBorrow only (1-2): the outlined secondary CTA style (\"LEARN ABOUT US\"); the small\nbracketed down-arrow as a wedge-photo marker.\nRole rules: the accent colour never appears on more than one element per screen; the\nmanifesto statement's stacked lines stay condensed and bold, never mixed with a lighter\nweight; client logos are never normalised to one typeface.\nMedia strategy: photo:unsplash — warm, candid, overhead hospitality/dining photography\nwith genuine ambient restaurant lighting; never a staged, evenly-lit food-styling shot.\nReject: a second accent colour; a normalised (single-typeface) client-logo wall; a\nmanifesto statement broken into more than three lines; illustrated or iconographic\nsubstitutes for the wedged photo.\nToken commitments: bg `#FFFFFF`, hero-warm-dark `#301414`, warm-mid `#8D5A43`, warm-tan\n`#AE836A`, ink-warm `#60544B`, stone `#C9C3BA`; condensed bold grotesque for headlines and\nmanifesto lines, plain sans for nav/body/captions; one accent colour reserved for the\nprimary nav CTA only."}, "has_extract": true}, {"slug": "wild", "title": "wild (Craft, Engineered.)", "url": "https://craft.wild.as/", "captured": "2026-09-04", "family": "vienna-pixel-atelier", "dna": "Studio manifesto x pixel-art skyline banner", "register": "modern clean", "grammar": "chaptered editorial", "lane": "White ground opens on a stacked all-caps headline, drops into a full-width pixel-art skyline banner, then alternates a case-study thumbnail row with two long-form essay chapters on craft history and AI", "mode": "persuade", "traits": ["\"white ground", "black ink\"", "stacked all-caps display headline", "pixel-art skyline banner in brand blue/gold", "case-study thumbnail row with captions", "long-form essay copy", "colour reserved to one banner element", "small grid-icon mark", "Vienna/Wiener Werkstätte origin story"], "palette": ["#FFFFFF", "#111111", "#3D5AFE", "#F5B400", "#C0392B"], "type": ["Sneak"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://craft.wild.as/", "has_image": true, "img": "../design-catalogue/entries/wild/fold.webp", "full": "../design-catalogue/entries/wild/shot.webp", "sections": {"Why it works": "The page opens with almost no colour at all — black type on white, a small\ngrid-icon mark, a plain all-caps headline (\"CRAFT, ENGINEERED.\") — and then spends\nits one splash of colour on a single full-width pixel-art skyline banner in the\nstudio's blue and gold. Because everything else on the page is monochrome, that\nbanner becomes the entire brand-colour system in one image; it doesn't need to\nrepeat anywhere else to be remembered.\n\nThe case-study row is understated on purpose: three small thumbnails (a laptop\nmockup, a robot product shot, an illustrated character) each captioned in plain\nsentence case, no hover flourish implied. The studio is trusting recognisable\nclient names (Replit, Serve Robotics) to do the selling rather than dressing the\nthumbnails up.\n\nThe real weight of the page is in its two essay chapters, set as plain justified\nor left-aligned reading columns — one on the studio's Vienna/Wiener Werkstätte\nlineage, one a point of view on AI and craft. For a design studio, choosing to\nargue a position in prose, rather than show a portfolio grid first, is itself a\ncredibility move: it says the thinking came before the deliverables.\n\nThe restraint reads static in a screenshot but isn't: the headline and its\nunderline rules genuinely animate in on scroll, and a couple of stepped,\nstop-motion-style easter eggs (a spinning mark, a jumping/heart-burst icon)\nsit under the surface — the monochrome discipline is a choice about where to\nspend colour, not motion.", "What to borrow (principle)": "- **Spend your entire brand-colour budget on one image.** A single pixel-art or\n  illustrated banner in your two brand colours does more identity work than\n  scattering the colours across UI chrome.\n- **Let recognisable client names caption small thumbnails plainly** instead of\n  building an elaborate case-study grid — the names carry the proof.\n- **Open a studio site with a point of view, not a portfolio grid.** An essay on\n  how you think earns more trust than a wall of thumbnails before it.\n- **Keep 90% of the page monochrome** so the one colour moment reads as deliberate,\n  not decorative.", "What to leave": "- Essay-length copy this early risks losing visitors who came to see work, not\n  read a manifesto — it needs a visible portfolio link within the first screen.\n- The pixel-art banner, while distinctive, doesn't repeat or echo anywhere else on\n  the page, so it risks reading as a one-off flourish rather than a system.", "Signature move": "The pixel-art skyline banner: a full-width mosaic cityscape rendered in large\ncoloured blocks (blue night sky fading to gold dawn, a black skyline silhouette),\nused exactly once, directly under the hero headline, as the studio's entire\ncolour statement.", "Motion": "(from designlang extract) Despite reading as static in the screenshot, the\nextract shows a genuinely animated page: feel is \"mixed\" with scroll-linked\nmotion confirmed. The hero headline rises in on a soft `heroIn` fade-and-lift\nwhile individual lines draw in with `heroLine` (a 115%→0% translateY reveal);\nunderlines and rules grow open with `lineGrowX`/`lineGrowY` scale transforms.\nA handful of micro-interactions carry the studio's playful side — `wSpin`\nrotates a mark a full 360°, `smJump` and `smHeart` are a bouncing/heart-burst\neaster egg — animated on stepped easing (`steps(4)`–`steps(6)`) rather than\nsmooth curves, which reads mechanical/print-like next to the one continuous\n`cubic-bezier(0.16,1,0.3,1)` ease-out used elsewhere.\n\n| token | value | role |\n|---|---|---|\n| `xs`–`sm` | 100–200ms | micro state changes |\n| `md` | 300ms | default reveal |\n| `lg`/`xl` | 450/800ms | headline & line-draw reveals |\n| ease-out | `cubic-bezier(0.16,1,0.3,1)` | continuous motion (3 uses) |\n| steps | `steps(4)`–`steps(6)` | mechanical/stop-motion accents (53 uses) |", "Brief": "Build a monochrome studio-manifesto page: white ground, black ink, one small\nmark, a stacked all-caps headline stating the studio's position in four words or\nfewer. Immediately below, run one full-width illustrated or pixel-art banner in\nexactly two brand colours — this is the only colour on the page. Follow with a\nplain three-thumbnail case-study row, each captioned with a real client name and\none line of description, no elaborate hover treatment. Below that, run two\nlong-form essay sections in a single reading column — one origin/history\nchapter, one point-of-view chapter — set in the same sans throughout, no serif,\nno pull quotes.", "Image recipe": "A pixel-art or large-block mosaic skyline of [SUBJECT], rendered in exactly two\nbrand colours plus black, gradient from cool to warm across the width, silhouette\nbuildings only — no photographic detail, no gradients beyond the two-colour\ntransition.", "Photo search": "Unsplash first, Pexels second.\n- \"city skyline silhouette dusk to dawn\"\n- \"pixel art cityscape illustration\"\n- \"minimal skyline gradient blue gold\"", "Reference lock": "Primary reference/direction: wild — monochrome studio manifesto with a single two-colour pixel-art banner as its entire colour system.\nPreserve (3-5 traits): white-ground, black-ink monochrome base for all type and UI; exactly one full-width illustrated banner carrying both brand colours; plain-captioned case-study thumbnails naming real clients; long-form essay chapters set in a single reading column.\nBorrow only (1-2): the Vienna/craft-history origin chapter as a trust device; the small grid-icon mark in place of a wordmark logo.\nRole rules: brand colour appears only inside the one banner image, never in UI chrome or text; case-study thumbnails never exceed one caption line; essay columns never exceed ~65 characters per line.\nMedia strategy: illustration/pixel-art only for the banner — no photography anywhere else on the page.\nReject: scattering the brand colours into buttons or links; hover-heavy case-study cards; a portfolio grid before the point-of-view copy.\nToken commitments: bg `#FFFFFF`, ink `#111111`, banner-blue `#3D5AFE`, banner-gold `#F5B400`, banner-red `#C0392B`; single grotesk sans for all type; headline in stacked all-caps, body in sentence case."}, "has_extract": true}, {"slug": "zanzibar", "title": "Zanzibar (Framer template)", "url": "https://zanzibar.framer.website", "captured": "2026-09-04", "family": "inverted-portrait-agency", "dna": "Upside-down moody portrait hero x condensed serif agency wordmark", "register": "cinematic dark", "grammar": "split stage", "lane": "A dark maroon hero holds a deliberately inverted portrait photograph beside a two-column service list, then the page drops to a cream numbered-benefits section and a deep blue-green About panel with draped fabric photography", "mode": "persuade", "traits": ["inverted/upside-down hero portrait", "dark maroon photographic ground", "condensed serif display wordmark", "two-column service/outcome list", "numbered benefit list with dot icons", "outline pill CTA buttons", "cream content panel with accent photography", "small four-dot logo mark"], "palette": ["#FFFAF6", "#5A6967", "#294A5F", "#100C08", "#60221B", "#D9DAD5", "#9A9992", "#795E44"], "type": ["Libre Caslon Condensed Variable", "Inter"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "portfolio", "category2": "institutional", "origin": "raw-url", "extract": "ok", "source_url": "https://zanzibar.framer.website", "has_image": true, "img": "../design-catalogue/entries/zanzibar/fold.webp", "full": "../design-catalogue/entries/zanzibar/shot.webp", "sections": {"Why it works": "This is a Framer marketplace template (\"Buy Template\" badge visible in the\ncapture), built to sell a creative-agency layout rather than one specific\nstudio — worth naming since it explains why the copy is generic (\"Digital\nmarketing,\" \"Brand Identity,\" \"Creative Design\") while the visual system is\ndoing all the actual persuasion. That system's one real idea is the hero: a\nmoody, dark maroon-toned portrait is flipped upside down relative to the\npage's reading direction, so the subject's face reads sideways against the\nwordmark. It's disorienting for a beat, then reads as confident art direction\nrather than a template default — the kind of single deliberate break from\nconvention that makes an otherwise generic layout feel considered.\n\nAround that image, a condensed serif display face (Libre Caslon Condensed)\nsets the wordmark large and quiet, while a two-column list of service/outcome\npairs runs in a plain grotesque at small size to the image's right — service\nname on the left, benefit phrase on the right, both in the same weight, so the\nlist reads as a single considered pairing rather than a hierarchy.\n\nBelow the fold, the palette breaks completely: cream ground, a numbered\nbenefits list with small dot-badge icons, and one accent photograph (a\nbacklit cocktail glass) that has no obvious connection to a branding agency's\nservices — a common template tell, image chosen for mood/colour fit rather\nthan for content relevance. The \"About us\" section shifts again to a deep\nblue-green ground with wind-blown fabric photography, keeping the pattern of\none new colour world and one new image per section.", "What to borrow (principle)": "- **Invert or flip one hero image deliberately** as the single break from\n  expected convention — used once, it reads as intentional direction; used\n  as a general habit it would just read as broken layout.\n- **Pair service and outcome in two aligned columns at equal weight** instead\n  of a hierarchy of headline-then-description — it reads as a considered\n  one-to-one mapping rather than a feature list.\n- **Change ground colour and photography together at each section boundary**\n  so scrolling reads as moving through distinct rooms.\n- **Use a condensed serif for a wordmark at generous scale** against dark,\n  moody photography — the condensed width keeps a long name from overwhelming\n  the image.", "What to leave": "- The accent photography (cocktail glass, draped fabric) has no evident\n  relationship to the agency's stated services — chosen for colour/mood match\n  rather than content relevance, a common template-genre shortcut worth\n  replacing with real work samples in production.\n- Generic service copy (\"Innovative Solutions,\" \"Forward-thinking ideas\") is\n  template placeholder language, not brand voice — needs full rewriting before\n  use.\n- The \"Buy Template\" / \"Made in Framer\" badges are template-marketplace\n  chrome, not brand content.", "Signature move": "The hero portrait photograph deliberately inverted — the subject's face\nreading upside down against the wordmark and nav — a single disorienting break\nfrom convention used once, at maximum scale.", "Motion": "(from designlang extract) The extract rates overall feel \"responsive\" with\nconfirmed scroll-linked behaviour, but the token set itself is nearly bare: a\nsingle 400ms `md` duration on one ease-out curve\n(`cubic-bezier(0.075, 0.82, 0.165, 1)`), applied to colour transitions. No\nbespoke keyframe animations are defined — the only keyframe in the stylesheet\nis Framer's built-in loading spinner. This matches the template's\ngeneric-competence read above: just enough motion to feel alive (hover\ncolour changes) without investing in a signature choreography of its own.\n(inferred from image) A \"Scroll down\" label sits in the hero footer, implying\na scroll-cued reveal into the next section; no pinned, parallax or\nscroll-scrub behaviour is otherwise evident from the fold capture alone.\n\n| kind | tokens |\n|---|---|\n| durations | md 400ms |\n| easing | ease-out `cubic-bezier(0.075, 0.82, 0.165, 1)` (1×) |", "Brief": "Build a creative-agency landing page anchored on one deliberately inverted or\notherwise disoriented hero photograph — flipped, mirrored, or unusually\ncropped — paired with a condensed serif wordmark at generous scale. Beside the\nimage, list services and their outcomes in two aligned columns at equal type\nweight, not as a headline-and-description hierarchy. Change both ground colour\nand accent photography at each section boundary so the page reads as a\nsequence of distinct rooms: dark and moody for the hero, cream and quiet for a\nnumbered-benefits section, a saturated accent colour (deep blue-green, forest,\noxblood) for an About section. Use outline pill buttons throughout, never\nfilled, to keep the surface quiet against the photography.", "Image recipe": "Moody environmental portrait of [SUBJECT], warm dark maroon or deep-toned\nlighting with strong shadow, shot from an unconventional angle (inverted,\ntilted, or cropped tight) so the final composition reads as deliberately\nart-directed rather than a straightforward headshot, shallow depth of field,\nminimal retouching.", "Photo search": "Unsplash first, Pexels second.\n- \"moody portrait dark red tone dramatic\"\n- \"creative professional editorial portrait\"\n- \"backlit glass drink moody photography\"\n- \"fabric drape wind motion dark background\"", "Reference lock": "Primary reference/direction: Zanzibar (Framer template) — inverted moody\nportrait hero, condensed serif wordmark, room-by-room colour shifts per\nsection.\nPreserve (3-5 traits): one hero photograph deliberately flipped/inverted or\nunconventionally cropped, used once at maximum scale; condensed serif\nwordmark set generously against dark photography; two-column service/outcome\nlist at equal type weight; a distinct ground colour and accent photograph\nchange at every section boundary; outline (never filled) pill CTA buttons.\nBorrow only (1-2): the numbered benefit list with small dot-badge icons; the\nfour-dot logo mark.\nRole rules: the inverted/disoriented image treatment is used exactly once per\npage, in the hero only; each section's accent photograph should relate to\nactual brand content in production use, not be chosen for colour/mood alone.\nMedia strategy: photo:unsplash — moody, art-directed portrait and object\nphotography with strong colour identity per section; replace with real\nclient/work imagery before shipping a production site.\nReject: generic template placeholder copy in production use; filled CTA\nbuttons; repeating the inverted-image device more than once per page.\nToken commitments: cream `#FFFAF5`, maroon-dark `#0F0203`, maroon-accent\n`#60221B`, teal-deep `#294A5F`, sage `#5A6967`, stone `#9A9992`; display\n\"Libre Caslon Condensed Variable\", body/UI \"Inter\"."}, "has_extract": true}], "categories": [{"category": "portfolio", "count": 24, "description": "a person or studio showing work; the work is the content, the page is the frame; name, selected projects, contact."}, {"category": "product-focused", "count": 24, "description": "software or a tool sold on what it does; product surface as hero, feature choreography, pricing, proof by demo."}, {"category": "consumer-brand", "count": 11, "description": "D2C objects and drinks; packshots, colour worlds, campaigns, shop."}, {"category": "hospitality", "count": 11, "description": "hotels, restaurants, cabins, destinations, retreats; place and atmosphere first, booking as the single action."}, {"category": "institutional", "count": 9, "description": "authority through calm: funds, firms, agencies with a mandate, public bodies; restraint, hierarchy, few devices, long-lived."}, {"category": "luxury-craft", "count": 8, "description": "materials, provenance, restraint at a high price; slow pages, fewer words, texture over colour."}, {"category": "editorial", "count": 4, "description": "journals, magazines, publishers, brands that behave like print: columns, plates, kickers, chapters, reading rhythm."}, {"category": "playful", "count": 4, "description": "colour, motion or illustration carries the mood; the page is allowed to be fun before it is efficient (consumer brands, apps for people, snacks, events)."}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const grid=document.getElementById('grid'),chips=document.getElementById('chips'),dlg=document.getElementById('dlg');
let active='all';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderChips(){
  const all=[{category:'all',count:D.entries.length}].concat(D.categories);
  chips.innerHTML=all.map(c=>`<button class="chip" aria-pressed="${c.category===active}" data-c="${esc(c.category)}">${esc(c.category)}<b>${c.count}</b></button>`).join('');
}
function renderGrid(){
  const list=D.entries.filter(e=>active==='all'||e.category===active||e.category2===active);
  grid.innerHTML=list.length?list.map((e,i)=>`<article class="card" tabindex="0" data-slug="${esc(e.slug)}">
   <img src="${esc(e.img)}" alt="${esc(e.title)} fold" loading="lazy">
   <div class="b"><h2>${esc(e.title)}</h2><p class="dna">${esc(e.dna||e.lane)}</p>
   <div class="t">${(e.traits||[]).slice(0,5).map(t=>`<span>${esc(t)}</span>`).join('')}${(e.traits||[]).length>5?`<span>+${e.traits.length-5}</span>`:''}</div>
   <div class="m"><span>${esc(e.category)}${e.category2?' · '+esc(e.category2):''}</span><span>${String(i+1).padStart(2,'0')} / ${list.length}${e.has_extract?' · ext':''}</span></div></div></article>`).join('')
   :'<p class="empty">No entries in this category yet.</p>';
}
function open(slug){
  const e=D.entries.find(x=>x.slug===slug);if(!e)return;
  document.getElementById('dimg').src=e.full;document.getElementById('dtitle').textContent=e.title;
  document.getElementById('dmeta').textContent=[e.category,e.category2,e.register,e.grammar,e.mode,e.origin,'extract '+e.extract].filter(Boolean).join(' · ');
  document.getElementById('dpal').innerHTML=(e.palette||[]).map(c=>`<i style="background:${esc(c)}" title="${esc(c)}"></i>`).join('');
  const o=document.getElementById('dopen');if(e.url&&e.url.startsWith('http')){o.href=e.url;o.hidden=false}else{o.hidden=true}
  document.getElementById('dsecs').innerHTML=Object.entries(e.sections).filter(([k,v])=>v).map(([k,v])=>`<h3>${esc(k)}</h3><p>${esc(v)}</p>`).join('');
  dlg.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(e.sections[b.dataset.copy]||'');b.textContent='Copied';setTimeout(()=>b.textContent=b.dataset.copy==='Brief'?'Copy brief':b.dataset.copy==='Reference lock'?'Copy reference lock':'Copy image prompt',1200)});
  dlg.showModal();
}
chips.addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;active=b.dataset.c;renderChips();renderGrid()});
grid.addEventListener('click',ev=>{const c=ev.target.closest('.card');if(c)open(c.dataset.slug)});
grid.addEventListener('keydown',ev=>{const c=ev.target.closest('.card');if(c&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();open(c.dataset.slug)}});
document.getElementById('dclose').onclick=()=>dlg.close();
dlg.addEventListener('click',ev=>{if(ev.target===dlg)dlg.close()});
renderChips();renderGrid();
</script></body></html>
