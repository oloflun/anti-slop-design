:root{--bg:#F4F2EC;--bg2:#EAE7DF;--ink:#16171A;--ink2:#5C5F66;--line:#D6D2C8;--acc:#1E5E9C;--chip:#E3E0D7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}

.dl img{width:100%;display:block;object-fit:cover;object-position:top;max-height:calc(100vh - 40px)}
.dr{padding:28px 28px 32px;overflow:auto;max-height:calc(100vh - 40px)}

.pal{display:flex;gap:4px;margin:6px 0}.pal i{width:22px;height:22px;border-radius:3px;border:1px solid rgba(0,0,0,.1)}
.empty{grid-column:1/-1;color:var(--ink2);padding:40px 0}
@media (max-width:820px){.dl{grid-template-columns:1fr}.dl img{max-height:40vh}}

<script id="data" type="application/json">{"entries": [{"slug": "aarke", "title": "Aarke", "url": "https://aarke.com", "captured": "2026-09-04", "family": "monospace-kitchen-editorial", "dna": "Warm in-situ product photography x typewriter-monospace campaign headlines", "register": "warm photographic", "grammar": "gallery/catalog", "lane": "A full-bleed styled kitchen photograph carries a monospace campaign headline over one hero product, then the page runs a plain grotesque product grid before returning to monospace for a two-up lifestyle gallery and an editorial mission statement", "mode": "persuade", "traits": ["typewriter-monospace campaign headlines", "plain grotesque wordmark and UI", "warm in-situ kitchen/counter photography", "outline pill CTA button", "two-up split lifestyle photo gallery", "on-image product name tags", "steel/matte product finishes", "promo utility bar (shipping/Klarna)"], "palette": ["#FFFFFF", "#000000", "#3C3C3C", "#EFEFEF", "#ADADAD", "#101010", "#7E6247", "#2C190C"], "type": ["monospace (campaign/editorial headlines)", "grotesque sans (wordmark/UI/body)"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "luxury-craft", "category2": "consumer-brand", "origin": "raw-url", "extract": "ok", "source_url": "https://aarke.com", "has_image": true, "img": "../design-catalogue/entries/aarke/fold.webp", "full": "../design-catalogue/entries/aarke/shot.webp", "sections": {"Why it works": "The hero is one warm, styled photograph of the product in a real kitchen\nsetting (wood cabinetry, natural counter light, a bowl of pears) rather than a\nstudio cutout — the product looks lived-with, not merely photographed. Over\nit, the campaign headline \"The new drip\" is set in a monospace/typewriter\nface, a deliberate departure from the clean grotesque used for the wordmark\nand every UI element (nav, prices, buttons). That contrast recurs later at\n\"Everyday Engineering,\" confirming the monospace isn't a one-off hero\ntreatment but the brand's consistent voice for editorial/campaign statements,\nwhile the grotesque stays reserved for wordmark, navigation and commerce.\n\nThe product grid below is almost aggressively plain — white ground, product\nphotography on white, name/price/description in small grotesque type, arrow\ncarousel controls — letting the hero's warmth and the monospace headline be\nthe only \"designed\" moments on an otherwise catalogue-standard shop layout.\nFurther down, a two-up split gallery pairs two products in two different\nlifestyle settings (a cool marble counter, a warm wood counter with food\nstyling) side by side, each labelled with a simple on-image name tag rather\nthan a caption block — letting the photography's own warm/cool contrast do\nthe differentiation work between products.", "What to borrow (principle)": "- **Reserve a second typeface (here, monospace) exclusively for\n  editorial/campaign headlines**, never for UI or commerce copy — the split\n  gives the brand a distinct \"voice\" moment without touching functional type.\n- **Photograph hero products in situ, styled with unrelated but thematically\n  consistent objects** (fruit, food, natural materials) rather than isolated\n  on a plain background — it reads as lifestyle, not spec sheet.\n- **Keep the commerce grid catalogue-plain** (white ground, small type, no\n  extra ornament) so any editorial styling elsewhere reads as considered\n  rather than diluted across the whole site.\n- **Pair two products in contrasting lighting/material settings side by side**\n  to let photography, not copy, carry the comparison.", "What to leave": "- The promo utility bar (shipping/Klarna) at the very top competes with the\n  wordmark for the first thing a visitor reads — standard e-commerce\n  necessity, but worth noting it's the actual first line on the page.\n- A live chat bubble sits fixed bottom-right across every section, a\n  functional necessity that adds visual noise to otherwise very clean\n  photography-led sections.", "Signature move": "A typewriter-monospace face reserved exclusively for campaign and editorial\nheadlines, kept completely separate from the grotesque used everywhere\nelse — a two-typeface system where the split marks \"brand speaking\" versus\n\"store functioning.\"", "Motion": "(from designlang extract) The extract rates overall feel \"smooth\" with\nconfirmed scroll-linked behaviour. Five duration steps span 100ms to 800ms,\ndominated by a plain `ease-in-out` (`ease`, 143 uses) with a lighter ease-out\n(27 uses) and two more dramatic custom curves (28 uses combined, including\n`cubic-bezier(0.86, 0, 0.07, 1)`, a near-stepped ease-in-out) reserved for\nless frequent moves. Three keyframes are confirmed in use: `movingText`, a\nhorizontal slide — plausibly the mechanism carrying the monospace campaign\nheadline or an on-image name tag into place; `slideOut` and\n`msSelectboxSlideOut`, both vertical slide+fade combinations, read as\ndropdown/selector close states rather than hero or gallery motion.\n`shopify-rotator` and `shopify-dash` (a rotating stroke-dashoffset ring) are\nShopify's own loading-spinner keyframes, confirming the storefront runs on\nShopify rather than bespoke tooling. (inferred from image) The hero\nphotograph differs between the raw and fresh captures (different product,\ndifferent styling, same \"Shop now\" CTA position and monospace headline\ntreatment), indicating a rotating/seasonal hero campaign. A carousel with\nleft/right arrow controls is visible under the \"Most popular\" product row,\nconfirming horizontal scroll/swipe interaction on that section.\n\n| kind | tokens |\n|---|---|\n| durations | xs 100ms · sm 200ms · md 300ms · lg 500ms · xl 800ms |\n| easings | ease-in-out `ease` (143×, dominant) · ease-out `cubic-bezier(0.215, 0.61, 0.355, 1)` (27×) · custom `cubic-bezier(0.86, 0, 0.07, 1)` / `cubic-bezier(0.37, 0, 0, 1)` (28×) |\n| keyframes in use | `movingText` (slide-x) · `slideOut` · `msSelectboxSlideOut` |", "Brief": "Build a design-forward kitchenware/homeware brand on warm, in-situ lifestyle\nphotography for the hero — real counters, real natural light, incidental\nstyling objects (fruit, food, textiles) around the product rather than a\nplain studio background. Reserve one monospace/typewriter face exclusively\nfor campaign and editorial headlines, keeping a plain grotesque for the\nwordmark, navigation, prices and all commerce copy — never mix the two roles.\nKeep the product grid itself catalogue-plain: white ground, small grotesque\nlabels, a simple arrow carousel. For a features/comparison section, pair two\nproducts in two different lifestyle settings side by side with only a small\non-image name tag, letting the photography contrast do the comparison work.", "Image recipe": "Styled lifestyle photograph of [SUBJECT] — a design object in active use on a\nreal kitchen counter — natural window light, warm or cool colour temperature\ndepending on setting, incidental food/organic styling objects nearby but not\noverpowering the product, shallow depth of field, materials (steel, matte\nceramic, wood, marble) rendered with true tonal accuracy.", "Photo search": "Unsplash first, Pexels second.\n- \"kitchen counter natural light product styled\"\n- \"coffee maker steel kitchen morning light\"\n- \"marble counter minimal styling natural\"\n- \"wood counter food styling warm light\"", "Reference lock": "Primary reference/direction: Aarke — monospace campaign headlines against a\ngrotesque commerce system, warm in-situ product photography.\nPreserve (3-5 traits): monospace/typewriter face reserved exclusively for\neditorial and campaign headlines, never for UI or commerce; plain grotesque\nfor wordmark, nav, prices and body copy; hero and feature photography always\nstyled in situ on a real counter with incidental organic objects, never on a\nplain studio background; a catalogue-plain product grid (white ground, small\ntype, simple carousel) as the visual \"quiet zone\" around styled photography.\nBorrow only (1-2): the on-image product name tag (simple white label, no\nextra ornament); the outline-only \"Shop now\" CTA button.\nRole rules: monospace never appears in navigation, pricing or product-grid\ncopy; product-grid photography stays on plain white, styled photography stays\nin situ — the two never mix within one section.\nMedia strategy: photo:unsplash — warm, in-situ lifestyle photography with\ntrue material colour for hero/feature sections; plain white-background\nproduct photography for the commerce grid.\nReject: studio-only photography for hero/feature sections; a second display\ntypeface beyond the monospace/grotesque pair; heavy ornament on the product\ngrid.\nToken commitments: paper `#FFFFFF`, ink `#000000`, stone `#99968E`, wood-mid\n`#7E6247`, wood-deep `#2C190C`, wood-accent `#563A26`, grey `#DEDEDD`,\ngrey-mid `#BDBFBB`; editorial monospace for campaign headlines, plain\ngrotesque for wordmark/UI/body."}, "has_extract": true}, {"slug": "aevi-wellness", "title": "Aevi Wellness", "url": "", "captured": "2026-09-04", "family": "nordic-apothecary", "dna": "Clinical apothecary x editorial magazine spread", "register": "modern clean", "grammar": "chaptered editorial", "lane": "A full-bleed product-photo hero with the wordmark set as a giant overlay, then a strict rhythm of white and powder-blue chapters, each one a hairline-bordered card or a full-bleed image with a caption in the corner", "mode": "persuade", "traits": ["weight-300 headlines", "hairline borders only", "achromatic + one slate accent", "2px radii except the pill", "full-bleed overlapping product photography", "powder-blue chapter bands", "no shadows"], "palette": ["#d5e0ea", "#a3bfdb", "#231f20", "#000000", "#ffffff", "#5f6368"], "type": ["\"Display Sans (custom", "weight 300)\"", "\"Primary Sans (custom", "serif-influenced grotesque)\""], "kind": "reference-style", "source": "anton", "status": "ready", "category": "consumer-brand", "category2": "editorial", "origin": "refero", "extract": "none", "source_url": "", "has_image": true, "img": "../design-catalogue/entries/aevi-wellness/fold.webp", "full": "../design-catalogue/entries/aevi-wellness/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens: an almost entirely\nachromatic system (near-black `#231f20` ink, white `#ffffff` surface, powder-blue\n`#d5e0ea` bands) with exactly one chromatic accent, slate-blue `#a3bfdb`, reserved\nfor the single primary button. Everything else — cards, inputs, ghost buttons — is\ncapped at a 2px radius; only that one pill button is allowed the soft 60px curve.\nThe restriction of colour and radius to a single component each is what keeps a\nskincare page from turning into wallpaper.\n\nType weight does the same job as colour: every size in the system, from a 10px\ncaption to the 54px hero display, runs at weight 300. Nothing is ever bolded for\nhierarchy — hierarchy is size and line-height (1.08 on display, 1.3+ on body), not\nweight. That whisper-weight type is only legible as confident because the\nphotography is doing the visual work it usually does: bottles and droppers overlap\nedge-to-edge across full-bleed hero and category images, with captions floating in\nplain white type over the bottom corner rather than sitting in a card.\n\nElevation is banned outright — no shadow, no glow, no blur anywhere in the system.\nDepth instead comes from the alternation of white and powder-blue bands (press\nstrip, testimonial block) and from hairline borders in ink or powder-blue. The page\nreads as a sequence of printed chapters rather than a stack of elevated UI panels,\nwhich is exactly the \"clinical-luxury\" register the brand wants: nothing about the\ninterface competes with the product for attention.", "What to borrow (principle)": "- **Spend colour on exactly one component.** A single muted accent, reserved for\n  the primary action only, reads as more confident than a full accent palette.\n- **Let one weight carry the whole system.** Using the same light weight at\n  caption size and display size forces every other cue (size, leading, colour) to\n  do the hierarchy work honestly.\n- **Cap radius everywhere except one shape.** A near-flat 2px system with a single\n  soft pill makes that one curve feel like punctuation, not decoration.\n- **Replace shadow with band contrast.** Alternating background bands (white,\n  tinted) can carry the same \"section break\" job a shadow usually does, without\n  the cost of a blurred layer.\n- **Let photography overlap its container.** Product shots that bleed past the\n  card or grid line read as more editorial than photography boxed inside padding.", "What to leave": "- The near-total achromatic palette risks reading as clinical-to-cold outside\n  skincare/beauty; most categories need at least a second warm neutral.\n- Weight-300-only typography sets a high bar for font choice and rendering —\n  it fails on typefaces without a true light weight or on low-DPI displays.\n- Hairline-border-only cards need genuinely high-contrast photography behind them\n  to read as separated sections; on a duller image the band system collapses.", "Signature move": "The wordmark set as an oversized, semi-transparent display overlay directly on top\nof the hero product photograph — not a logo in a header, but a headline-scale\ntypographic watermark the photography shows through. It turns the brand name into\npart of the image rather than a UI chrome element.", "Motion": "No motion or interaction data is captured in the Refero export (components and\nsurfaces are described statically). Inferred from the image: the flat, hairline,\nshadow-free system and the full-bleed photographic hero suggest restrained\ncrossfades between hero images and simple opacity reveals on section bands, rather\nthan parallax or scroll-scrubbed choreography — motion would be an interruption in\na system this quiet. (inferred)", "Brief": "Build a clinical-editorial skincare landing page. Ground is white with powder-blue\n`#d5e0ea` chapter bands; ink is warm near-black `#231f20`; the single accent is\nslate-blue `#a3bfdb`, reserved for the primary CTA pill. Set every headline and\nmost body copy at weight 300 — caption at 10px, display at 54px, both at the same\nweight, differentiated only by size and tight display leading (1.08). Cap every\nradius at 2px except the primary button, which gets a 60px pill. Open on a\nfull-bleed product photograph with the wordmark overlaid at display scale in\ntranslucent white. Follow with a press-logo strip on a powder-blue band, an\neditorial split section (photography left, copy right), a testimonial block on\nanother powder-blue band, and a 3-column product-category grid where images bleed\nto the card edge and captions float in the bottom corner. No shadows anywhere;\ndepth comes only from hairline borders and band-to-band contrast.", "Image recipe": "Editorial still life of [SUBJECT] — glass or frosted-plastic apothecary bottles and\ndroppers, overlapping at close range, shot in soft diffused daylight with warm\nhighlights and cool desaturated shadow, tight crop with objects bleeding past the\nframe edge, no props, no gradient backdrop, a grainy high-contrast black-and-white\ntreatment reserved for press or editorial inserts only.", "Photo search": "Unsplash first, Pexels second.\n- \"skincare bottles overlapping flat lay natural light\"\n- \"dropper bottle apothecary product close up\"\n- \"minimal beauty product photography desaturated\"\n- \"hand applying serum close up natural light\"", "Reference lock": "Primary reference/direction: Aevi Wellness — achromatic clinical-apothecary\nskincare page, weight-300 type throughout, single slate-blue accent on one button.\nPreserve (3-5 traits): white canvas with powder-blue `#d5e0ea` chapter bands and\nnear-black `#231f20` ink; weight 300 on every text size from caption to display;\n2px radius on every element except the one 60px primary pill; hairline borders\n(1px, ink or powder-blue) as the only structural device; full-bleed, overlapping\nproduct photography with captions floating in plain type over the image corner.\nBorrow only (1-2): the oversized translucent wordmark overlay on the hero image;\nthe grainy black-and-white treatment for press/editorial-only imagery.\nRole rules: slate-blue `#a3bfdb` appears only on the primary button, never as text,\nborder or decorative fill; no shadow, glow or blur anywhere; headings never exceed\nweight 300.\nMedia strategy: photo:unsplash — tight, overlapping product stills and natural-\nlight close-ups; no illustration, no 3D render, no icon-heavy decoration.\nReject: any bolded heading; any radius above 2px outside the primary button; drop\nshadows or elevation cards; a second accent colour; padded/framed product images.\nToken commitments: bg `#ffffff`, band `#d5e0ea`, accent `#a3bfdb`, ink `#231f20`,\nink-heavy `#000000`, mist `#5f6368`; display + body weight 300 throughout; display\nleading 1.08-1.11, body leading 1.29-1.33; radius 2px default, 60px pill only;\nbase spacing unit 4px; page max-width 1200px, section gap 48px."}, "has_extract": false}, {"slug": "alet", "title": "ALET Agency", "url": "https://aletagency.com/", "captured": "2026-09-04", "family": "taupe-contact-sheet", "dna": "Whisper-small caption typography x a scattered contact-sheet image field", "register": "editorial print", "grammar": "gallery/catalog", "lane": "A single warm taupe surface holds the entire site with no section ever changing colour, while an asymmetric, irregularly-offset field of editorial photography scatters across it like a contact sheet, ringed by floating uppercase category captions and a widely-tracked serif masthead", "mode": "portfolio", "traits": ["\"11-13px UI text", "never scaled up for 'primary'\"", "\"one monolithic taupe surface", "no section changes\"", "\"0px image radius", "9999px pill exclusively for the toggle\"", "\"wordmark at 0.5-0.8em tracking", "letters detached\"", "\"scattered irregular-offset image field", "no grid\"", "\"zero accent colour", "photography is the only chroma\""], "palette": ["#ada59b", "#000000", "#252525", "#101010", "#454545"], "type": ["SilkSerif", "WorkSans"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://aletagency.com/", "has_image": true, "img": "../design-catalogue/entries/alet/fold.webp", "full": "../design-catalogue/entries/alet/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the\nlive capture. Taupe paper `#ada59b` is not a \"canvas colour\" in the usual\nsense — it is the entire site: the source states no section ever changes\nbackground, so there is no light/dark alternation, no card surface, nothing\nbut one monolithic warm gray that every element floats on directly. Because\nwhite, off-white and near-black are all explicitly forbidden as backgrounds,\nphotography becomes the only source of colour or contrast variation on the\nwhole page.\n\nTypography stays deliberately tiny across every functional role — 11-13px\nWorkSans for navigation, labels, and body, with an explicit rule against ever\nscaling up \"for a primary label.\" That restraint is what makes the one\nexception, the SilkSerif wordmark at 23px with letter-spacing opened to\n0.5-0.8em, read as a masthead rather than a logo: the letters are so widely\ntracked they nearly detach from each other, and because nothing else on the\npage is set in serif, that single word instantly reads as the title plate of\na magazine.\n\nThe image field is the structural centrepiece: photographs are placed with\nirregular margin offsets (101-209px) rather than on a grid, so the layout\nreads as a scattered contact sheet, not a portfolio grid. A working\nLINEAR/RANDOM toggle — the only rounded (9999px) element in the entire\nsystem — lets a viewer switch between an ordered and a scattered arrangement\nof the same images, making the \"contact sheet\" metaphor an actual, operable\nfeature rather than just a visual style. Note: the designlang extract flags a\nred `#dc3545` (31 uses, Bootstrap's default \"danger\" hue) not present in the\ncaptured screenshot or documented anywhere in the source — most plausibly an\nincidental form-validation or \"sold out\"-style state colour triggered during\nthe crawl rather than a deliberate brand accent, so it is not added to the\npalette above; the exact taupe hex also reads slightly differently live\n(`#e5ddc4`, `#a2a093`) than in the captured tokens, consistent with warm-gray\nsampling variance rather than a different brand colour.", "What to borrow (principle)": "- **Make the canvas a single, unchanging surface across the entire site.**\n  Refusing section-to-section colour changes forces every other design\n  decision (spacing, scatter, photography) to carry the visual rhythm\n  instead.\n- **Cap UI text size with an explicit rule, not just a habit.** \"Never scale\n  up for a primary label\" keeps a whisper-small system from eroding under\n  the pressure to make one thing \"important.\"\n- **Reserve the one rounded shape for exactly one interactive feature.**\n  A 9999px pill appearing only on a working layout toggle — nowhere else —\n  makes that single curve meaningful rather than decorative.\n- **Offer a genuinely operable metaphor, not just a visual one.** A real\n  LINEAR/RANDOM toggle that rearranges the same photographs turns \"contact\n  sheet\" from a style reference into an interactive feature.\n- **Open tracking on a masthead word until letters nearly detach.** Extreme\n  positive letter-spacing (0.5-0.8em) on a short serif word is what makes a\n  wordmark read as a printed title rather than a typed logo.", "What to leave": "- A monolithic single-colour canvas with zero section variation is a\n  demanding constraint — any content type that needs visual separation (a\n  pricing table, a form) has no built-in surface-shift tool to reach for.\n- Irregular image offsets (101-209px, scattered) require genuine art\n  direction per breakpoint; a naive responsive collapse would either overlap\n  badly or lose the contact-sheet read entirely.\n- Zero accent colour anywhere means the system offers no built-in way to\n  signal state (hover beyond a colour swap to pure ink, active, error)\n  without inventing a convention from scratch.", "Signature move": "The LINEAR/RANDOM layout toggle: a stroke-only pill switch that rearranges\nthe same scattered photographs between an ordered and a randomized\ncomposition — the only rounded, only interactive-feeling component on the\nentire site, and the one place the \"contact sheet\" concept becomes literally\noperable.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked.\nFour durations are confirmed — 200ms, 300ms, 1s and a notably slow 2s — though\nno easing curve is confidently identified (no dominant named family\nregisters). That wide spread, especially the 2s outlier, fits a genuinely\ndeliberate grid-rearrange animation: images repositioning across the scattered\nfield when the LINEAR/RANDOM toggle fires would plausibly need a slower,\nchoreographed duration rather than a snap cut. No keyframes are confirmed\nfiring. (observed in capture) the live capture confirms the scattered,\nirregularly-offset image field and the LINEAR/RANDOM toggle are present and\nmatch the described layout.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 200ms | — |\n| md | 300ms | — |\n| xl | 1s | — |\n| xxl (toggle rearrange) | 2s | — |", "Brief": "Build a Copenhagen-style creative-studio portfolio with a single unchanging\ncanvas. Set the entire page on warm taupe `#ada59b` — no section, card, or\ncomponent ever uses a different background; white, off-white and near-black\nare all forbidden as surfaces. Cap all UI text (nav, labels, body, metadata)\nat 11-13px WorkSans Regular — never scale up for emphasis. Set the studio\nname in a light serif at 23px with letter-spacing opened to 0.5-0.8em, tight\n0.94 leading, centred in the top bar as the only serif moment on the site.\nArrange 6-8 photographs in an asymmetric scattered field with irregular\nmargin offsets (roughly 100-210px), each at 0px radius with no border or\nshadow, ringed by floating uppercase category labels positioned at irregular\ncoordinates (top-left, top-centre, top-right, bottom-left, bottom-centre,\nbottom-right). Add a working LINEAR/RANDOM toggle — a stroke-only 9999px\npill with a small circular thumb, the only rounded element anywhere — that\nrearranges the image field between ordered and scattered layouts. Centre a\nsingle studio-statement paragraph below at 13px with generous (180px) top\npadding. No accent colour, no shadows, no elevation anywhere.", "Image recipe": "Editorial documentary photograph of [SUBJECT] — packaging, interior, product-\non-table or portrait-detail shots at high resolution, warm and slightly\ndesaturated, lit naturally rather than in a studio, cropped tight at varying\naspect ratios (1:1, 4:5, 3:2) so the collection reads as a contact sheet\nrather than a uniform grid.", "Photo search": "Unsplash first, Pexels second.\n- \"editorial product photography warm natural light\"\n- \"interior photography natural light desaturated\"\n- \"packaging design close up studio\"\n- \"portrait detail natural light editorial\"", "Reference lock": "Primary reference/direction: ALET Agency — single-surface taupe portfolio,\nscattered contact-sheet image field, whisper-small caption typography.\nPreserve (3-5 traits): warm taupe `#ada59b` as the entire site's only\nbackground, never white/off-white/near-black; all UI text capped at 11-13px\nWorkSans, no scaling up for emphasis; the SilkSerif masthead at 23px with\n0.5-0.8em tracking as the only serif moment; photographs at irregular\nscattered offsets (not gridded), 0px radius, no border or shadow; 9999px\nradius reserved exclusively for the LINEAR/RANDOM toggle.\nBorrow only (1-2): the working LINEAR/RANDOM layout toggle that rearranges\nthe same image set; the floating category-label positioning around the\nimage field.\nRole rules: no chromatic accent is ever introduced; the wordmark's letter-\nspacing formula (0.5-0.8em) never applies to body or nav text; body text\nnever centres except the single studio-statement block.\nMedia strategy: photo:unsplash — warm, naturally-lit editorial documentary\nphotography at varying tight crops; no illustration, no icons beyond fine\nline-art strokes.\nReject: any second background colour; box-shadow or gradient; radius above\n0px outside the toggle and rare small inset frames; a display weight above\nLight/Regular; a centred multi-column body layout.\nToken commitments: bg `#ada59b`, ink `#000000`, nav-text `#252525`,\nsecondary `#101010`, inset `#454545`; wordmark SilkSerif 300 at 23px/leading\n0.94/0.5-0.8em tracking; body WorkSans 400 at 11-13px/leading 1.0-1.5;\nradius 0px images, 9999px toggle only, 10.8px rare small frames; section gap\n101-180px, base spacing unit 6px."}, "has_extract": true}, {"slug": "altitude-beverages", "title": "Altitude Beverages", "url": "https://altitudebev.com", "captured": "2026-09-04", "family": "mono-gallery-catalog", "dna": "Fashion-magazine monochrome x saturated can photography", "register": "editorial print", "grammar": "chaptered editorial", "lane": "A near-white gallery page that opens on one massive compressed headline, then alternates single-statement chapters of full-bleed gradient-lit can photography against an all-black watermark section, never mixing colour into the UI itself", "mode": "persuade", "traits": ["160px compressed display", "serif/sans/mono three-way voice split", "\"monochrome UI", "chromatic photography only\"", "100px pill nav + 44px card radius", "\"no shadows", "tone-step depth\"", "dark gradient watermark interlude"], "palette": ["#fafafa", "#d9d9d9", "#cdcdce", "#07060b", "#000000", "#ddfcff"], "type": ["HelveticaNowDisplay", "EditorialNew", "DepartureMono"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "consumer-brand", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://altitudebev.com", "has_image": true, "img": "../design-catalogue/entries/altitude-beverages/fold.webp", "full": "../design-catalogue/entries/altitude-beverages/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens. The system deliberately\nempties itself of colour — canvas, cards and text stay inside four near-neutral\nvalues — so that the only saturated thing on the page is the product itself: cans\nphotographed on gradient backdrops (orange, amber, teal) that read as almost lurid\nagainst the gallery-white UI. That contrast is the whole strategy: colour is a\nproperty of the product, not of the interface.\n\nType carries the identity work colour would normally do. Three faces are kept in\nstrict, non-overlapping roles — HelveticaNowDisplay at weight 800 owns the single\n160px hero line, EditorialNew at weight 200 owns mid-scale pull-quote subheads, and\nDepartureMono owns every functional label (nav, buttons, ingredient lists). Because\nthe ultra-bold display and the whisper-thin serif never appear at the same size,\nthe 800-vs-200 weight jump reads as tension rather than inconsistency, and the\nmonospace signals \"this is UI, not editorial\" wherever it shows up.\n\nDepth is entirely tonal: canvas white steps to warm-ash grey for the pill nav and\ncards, with no shadow anywhere. That flatness is what lets the one dark, full-bleed\ngradient section — a near-black band with a faint watermark wordmark and nothing\nelse — land as a genuine tonal event rather than just another card.", "What to borrow (principle)": "- **Let the product own the only saturated colour on the page.** Keeping UI chrome\n  monochrome makes the photography, not the brand palette, feel chromatic.\n- **Split type roles by function, not by size alone.** One face for the singular\n  hero statement, one for editorial mid-copy, one monospace for everything\n  functional — never let two of them share a size class.\n- **Use radius as a register signal.** A 100px pill on nav/buttons and 44px on\n  cards, with nothing in between, keeps the geometry legible as one family of\n  shapes rather than an arbitrary scale.\n- **Spend a full-bleed dark section as punctuation.** One tonal reset with almost\n  no content reads as a pause in a page that is otherwise dense with photography.", "What to leave": "- A single 160px headline with -0.05em tracking depends entirely on having one\n  short, strong line of copy; it fails immediately with anything but a tight\n  sentence.\n- The near-invisible watermark wordmark on the dark section only works once — used\n  twice on a page it reads as a template, not a device.\n- Zero brand-colour UI chrome is a hard constraint: any hover or active state that\n  needs to signal \"brand\" rather than \"neutral\" has nowhere to live in this system.", "Signature move": "The dark full-bleed gradient interlude: a section with no headline, no button, no\ncard — just a top-to-bottom black-to-light gradient and a faintly legible watermark\nwordmark centred in it. It functions purely as a tonal breath between two\nphotographic, high-energy product chapters.", "Motion": "(from designlang extract) Feel reads as mixed rather than a single house style, and\nthe page is scroll-linked — sections and cards animate in relative to scroll\nposition rather than firing purely on load. Interaction transitions are fast and\nutilitarian: hover/focus states on links, buttons and form fields resolve in 150ms,\nwhile larger content changes (image or opacity swaps) take 500ms. Both run on a\nsingle standard easing curve, no springs or overshoot are used anywhere in the\nsystem. No custom keyframe animations are defined beyond Tailwind's stock\npulse/bounce/spin/ping utilities, which are reserved, not visibly driving the page.\nThe flat, shadow-free system reads as considered rather than kinetic — motion\nsupports state changes, it doesn't perform. (observed in capture) the alternating\nlight/dark full-bleed sections and overlapping product-card compositions suggest\nsimple crossfades between chapters and a light, parallax-free reveal on scroll.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs (state changes) | 150ms | `cubic-bezier(0.4, 0, 0.2, 1)` |\n| lg (content swaps) | 500ms | `cubic-bezier(0.4, 0, 0.2, 1)` |", "Brief": "Build a monochrome product-gallery landing page for a canned beverage brand. Canvas\nis near-white `#fafafa`, elevated surfaces step to warm ash `#d9d9d9`, text is\nnear-black `#07060b`; the only chromatic colour anywhere is in product photography.\nOpen on a single HelveticaNowDisplay weight-800 headline at up to 160px with tight\n-0.05em tracking, paired with an EditorialNew weight-200 subhead and a DepartureMono\nuppercase pill button. Float a pill navigation (100px radius, warm-ash fill) over\nthe hero. Below, alternate full-bleed product feature cards — 44px radius, gradient-\nlit can photography, a smaller overlapping card in the corner — with a single dark,\nnear-black full-bleed section carrying only a faint watermark wordmark. No shadows\nanywhere; depth is tone-stepping only. Keep section gaps generous (36-80px) and let\neach chapter read as one uninterrupted statement.", "Image recipe": "Studio product shot of [SUBJECT] — a beverage can lit against a saturated gradient\nbackdrop (orange-to-amber or teal-to-green), condensation beading on the metal,\none sprig of fresh garnish (rosemary, citrus, flower) resting against the can,\ndramatic raking light creating a dark-to-light gradient wrap on the can surface\nitself, tight crop with the object bleeding past the frame edge, no studio props\nbeyond the single garnish, no visible background horizon.", "Photo search": "Unsplash first, Pexels second.\n- \"beverage can product shot gradient background studio\"\n- \"condensation can drink close up\"\n- \"rosemary garnish drink flat lay\"\n- \"citrus fruit product photography saturated colour\"", "Reference lock": "Primary reference/direction: Altitude Beverages — monochrome editorial-gallery UI\naround saturated gradient-lit can photography, three-way type role split.\nPreserve (3-5 traits): near-white canvas `#fafafa` stepping to warm-ash `#d9d9d9`\nfor surfaces, near-black `#07060b` ink, zero brand colour in UI chrome; strict type\nrole split (HelveticaNowDisplay hero only, EditorialNew mid-copy only, DepartureMono\nfunctional labels only); 100px pill radius on nav/buttons, 44px on cards, nothing\nbetween; no shadows, tone-step depth only; alternating light photographic chapters\nwith one dark full-bleed watermark interlude.\nBorrow only (1-2): the 160px single-line display headline; the overlapping\nfeature-card + floating-card product composition.\nRole rules: EditorialNew never appears below 14px or above 60px; HelveticaNowDisplay\nnever carries body text; DepartureMono is the only face permitted in buttons, nav\nand metadata; product photography is the sole source of saturated colour.\nMedia strategy: photo:unsplash — tightly cropped, gradient-lit product stills with\none garnish accent; no illustration, no icon-heavy decoration.\nReject: any UI chrome in brand colour; card radius outside 44px/100px; drop shadows;\nline-height above 1.06 on headlines; icons or illustration in the interface.\nToken commitments: bg `#fafafa`, surface `#d9d9d9`, border `#cdcdce`, ink `#07060b`,\nink-hard `#000000`, micro-accent `#ddfcff`; display weight 800 at 160px/-0.05em,\neditorial weight 200 at 40-60px, mono uppercase at 11-12px/-0.071em; radius 44px\ncards, 100px pills; page max-width 1440px, section gap 36-80px."}, "has_extract": true}, {"slug": "amrit-palace", "title": "Amrit Palace", "url": "https://amritpalace.com", "captured": "2026-09-04", "family": "candlelit-parchment-menu", "dna": "Fine-dining candlelight photography x whisper-weight serif editorial", "register": "warm photographic", "grammar": "chaptered editorial", "lane": "A dark, candlelit dining-room photograph carries a whisper-thin serif headline, then the page drops onto a warm parchment canvas of sharp-cornered, hairline-ruled editorial sections with a single saffron accent and a scrolling marquee of signature dishes", "mode": "persuade", "traits": ["115px weight-300 serif display", "0px radius everywhere except 3px buttons", "\"warm parchment canvas", "no white\"", "\"single saffron accent", "2-3 uses per fold\"", "dark full-bleed candlelight photography", "hairline column-rule dividers", "27s linear dish marquee"], "palette": ["#d8cbb8", "#bfb4a3", "#b6ab9c", "#2c2c2c", "#292622", "#d49653"], "type": ["TT Ramillas Variable", "Satoshi"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "hospitality", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://amritpalace.com", "has_image": true, "img": "../design-catalogue/entries/amrit-palace/fold.webp", "full": "../design-catalogue/entries/amrit-palace/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. Warm parchment `#d8cbb8` replaces white as the base canvas everywhere, and\nwarm onyx `#2c2c2c` replaces pure black as the ink — the whole page runs a few\ndegrees warmer than a typical editorial site, which is what makes candlelit\nphotography feel continuous with the UI rather than pasted onto it. Saffron\n`#d49653` is the one chromatic note, rationed to star ratings and one or two\ndecorative moments per fold; everything else in the system is a warm neutral.\n\nType performs a duet the md calls out explicitly: TT Ramillas Variable at weight\n300 sings the display voice at extreme sizes (up to 115px, always uppercase, always\nweight 300 — never bolded), while Satoshi at weight 500 handles every functional\nline — nav, buttons, captions, the 199px hero wordmark. The serif never drops below\n22px and the sans never exceeds 42px outside that one wordmark exception, so the\ntwo faces never compete at the same size class.\n\nGeometry reinforces the restraint: 0px radius on every card and section, 3px only\non buttons and tags, no shadows anywhere. Depth comes from tonal steps (parchment →\nlinen → walnut) and 1px hairline rules that behave like column rules in a printed\nmenu, not from elevation. Photography does the atmospheric work instead — full-\nbleed, dark, candlelit table shots bookend the page before it opens onto the flat\nparchment editorial spread.", "What to borrow (principle)": "- **Warm every neutral by a few degrees.** Replacing white and black with parchment\n  and warm onyx makes candlelit or golden-hour photography feel native to the page.\n- **Ration the accent color to a literal count.** \"No more than 2-3 times per fold\"\n  is a concrete, checkable rule that keeps a single accent from creeping into\n  decoration.\n- **Split radius into exactly two values.** 0px for structure, one small radius for\n  interactive controls — nothing in between reads as decisive rather than fussy.\n- **Use hairlines as column rules, not decoration.** A 1px divider that behaves like\n  a typographic element (full-width, no padding logic) reads as editorial, not as\n  UI chrome.\n- **Reserve one motion device.** A single scrolling marquee, used once, gives the\n  page its only kinetic personality without turning motion into wallpaper.", "What to leave": "- Zero border-radius on every card is a hard commitment — any component borrowed\n  from a softer system (rounded chips, pill tags) will visibly clash.\n- The 115px uppercase serif headline needs real display weight in the chosen\n  typeface; a serif without a genuine weight-300 cut will look thin and broken,\n  not intentional.\n- Full-bleed dark photography before any parchment content means the fold has no\n  UI signifiers at all beyond the headline — risky outside a category where\n  atmosphere alone is expected to sell the product.", "Signature move": "The horizontal marquee of signature dish names, scrolling continuously at 27s\nlinear — the only extended motion the system permits, deployed once, and reserved\nspecifically for the menu's signature items rather than for generic content.", "Motion": "(from designlang extract) Feel reads as responsive, and the page is scroll-linked —\ncontent resolves relative to scroll position rather than firing purely on load.\nInteractive transitions run on a single ease-out family, `cubic-bezier(0.25, 0.46,\n0.45, 0.94)`, at two durations: a 350ms step for smaller state changes and 450ms for\nlarger reveals; the extract's broader transition log adds a 400ms variant on the\nsame curve, matching the 0.4s figure the Refero export's Motion Philosophy states\ndirectly. The one keyframe confirmed in use is `marquee`, a slide-x transform\ndriving the horizontal scrolling dish-name band — the extract also carries a\nvideo-player's own spin/fade/popup keyframes (from the embedded Plyr player), which\nare library chrome, not page design. (observed in capture) the live capture\nconfirms a flat, non-parallax scroll: sections resolve as static parchment panels\nbeneath the dark hero, consistent with \"turning pages of a printed menu, not a web\napp.\"\n\n| Token | Value | Easing |\n|---|---|---|\n| md (state change) | 350ms | `cubic-bezier(0.25, 0.46, 0.45, 0.94)` |\n| lg (reveal) | 450ms | `cubic-bezier(0.25, 0.46, 0.45, 0.94)` |\n| marquee (signature) | 27s linear | `linear` |", "Brief": "Build a fine-dining restaurant page. Canvas is warm parchment `#d8cbb8`, stepping to\nlinen `#bfb4a3` for secondary tone and warm onyx `#2c2c2c` / midnight `#292622` for\ndark surfaces; saffron `#d49653` is the sole accent, used only for star ratings and\none or two decorative marks per screen. Open full-bleed on a dark, candlelit dining\nphotograph with a floating transparent nav and a TT Ramillas weight-300 uppercase\nheadline at up to 115px, flanked by small Satoshi meta labels (\"Serving ___\",\n\"Established ___\"). Drop to the parchment canvas for editorial content: 0px-radius\nsections divided by 1px hairline rules, generous 120-160px gaps, left-aligned copy\nin Satoshi 500 at 14-15px. Use ghost-outlined buttons only (1px border, 3px radius,\nuppercase Satoshi label) — no filled chromatic buttons. Include a testimonial row on\nthe parchment canvas and a horizontally scrolling marquee of signature dish names as\nthe one kinetic moment. Transitions run 0.4s ease.", "Image recipe": "Documentary interior photograph of [SUBJECT] — a candlelit fine-dining table set\nwith glassware and linen, shot at table height with shallow depth of field, warm\namber practical lighting only (no flash, no cool fill), rich wood and copper tones\nin the background falling into soft shadow, natural imperfection in the flame and\nreflections retained, no styled overhead flat-lay.", "Photo search": "Unsplash first, Pexels second.\n- \"candlelit restaurant table setting warm light\"\n- \"fine dining interior moody amber light\"\n- \"table setting glassware candle close up\"\n- \"Indian cuisine plated dish dark background\"", "Reference lock": "Primary reference/direction: Amrit Palace — candlelit fine-dining hero into a warm\nparchment editorial menu, whisper-weight uppercase serif display.\nPreserve (3-5 traits): parchment `#d8cbb8` canvas with warm onyx `#2c2c2c` ink, no\npure white or black anywhere; TT Ramillas weight 300 uppercase for all display,\nnever bolded; 0px radius on every card/section, 3px only on buttons and tags; 1px\nhairline dividers used as column rules; saffron `#d49653` rationed to 2-3 uses per\nfold, reserved for ratings and single decorative marks.\nBorrow only (1-2): the 199px Satoshi hero wordmark exception; the 27s linear dish\nmarquee.\nRole rules: serif never appears below 22px, sans never exceeds 42px outside the\nhero wordmark; no filled chromatic buttons, ghost/outline only; no shadows, no\ngradients; body text left-aligned only, never centred.\nMedia strategy: photo:unsplash — dark, candlelit, table-height interior and dish\nphotography only; no illustration, no stock lifestyle smiling-diner shots.\nReject: rounded cards; a second accent colour; bold serif headings; centred body\ncopy; parallax or scroll-triggered reveals beyond the single marquee.\nToken commitments: bg `#d8cbb8`, tone-1 `#bfb4a3`, hairline `#b6ab9c`, ink `#2c2c2c`,\nink-deep `#292622`, accent `#d49653`; display weight 300, uppercase, tracking\n-0.03 to -0.04em, leading 0.8-0.9; body Satoshi 500 14-15px; radius 0px default, 3px\ninteractive; transitions 0.4s ease / cubic-bezier(0.25,0.46,0.45,0.94); page\nmax-width 1440px, section gap 120-160px."}, "has_extract": true}, {"slug": "andre-candido", "title": "André Cândido", "url": "https://www.andre-candido.com/", "captured": "2026-09-04", "family": "highlighter-editorial", "dna": "Near-monochrome editorial studio x one highlighter-yellow footer", "register": "editorial print", "grammar": "gallery/catalog", "lane": "A cream-and-ink portfolio that opens on a huge whisper-thin didone headline over capsule-shaped project tiles in full client colour, then closes on one dramatic ink-black panel where the yellow accent finally appears", "mode": "portfolio", "traits": ["160px whisper-thin didone display", "\"97% achromatic UI", "client colour in work only\"", "800px capsule image radius", "tracked-out 0.107em small type", "single dark footer inversion", "circular rotating text badge"], "palette": ["#111118", "#ffffff", "#dddddd", "#bdbdbd", "#7c7c7c", "#fef199"], "type": ["Editorial New", "PP Mori"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "playful", "origin": "refero", "extract": "ok", "source_url": "https://www.andre-candido.com/", "has_image": true, "img": "../design-catalogue/entries/andre-candido/fold.webp", "full": "../design-catalogue/entries/andre-candido/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens. The studio's own UI stays\n97% achromatic — ink black `#111118` and paper white carry almost everything — which\nmeans the one place colour is allowed to exist, the work itself, reads as maximally\nvivid by contrast. Capsule-shaped project tiles (800px radius, practically a\nlozenge) bleed whatever client palette they carry straight onto the cream page, so\nthe portfolio grid becomes a controlled burst of colour inside an otherwise\ndisciplined frame.\n\nType does the same restraint-then-release move as the page's colour: PP Mori\ncarries every functional voice (nav, labels, body) at weights 200-600 with an\nunusually wide 0.107em tracking on small sizes, while Editorial New — a didone\nserif at weight 200 only — is reserved exclusively for display headlines from 48px\nup to 160px. Because the thin serif never appears below 48px and the sans never\ncarries a display headline, the pairing reads as two distinct instruments rather\nthan a font stack.\n\nThe single dramatic gesture is saved for the end: the entire page is light until\nthe footer, which inverts to `#111118` and is the only place the highlighter-yellow\n`#fef199` accent appears — outlining a massive pill CTA. Holding one colour and one\ninversion in reserve for the close makes the last screen feel like a different room,\nnot a louder button.", "What to borrow (principle)": "- **Let client/project colour be the only colour.** A near-achromatic studio UI\n  makes a portfolio grid read as more vivid, not less, because nothing competes\n  with it.\n- **Reserve an accent for exactly one section.** Saving a colour for the footer\n  alone turns the close into an event instead of diluting the accent everywhere.\n- **Pair one ultra-thin display face with one workhorse sans, never at the same\n  size.** A 200-weight serif above 48px against a 200-600 weight sans below it\n  keeps the tension legible instead of muddy.\n- **Use one dramatic shape as a signature, sparingly.** An 800px \"capsule\" image\n  radius reads as a device precisely because nothing else on the page shares it.\n- **Track out small type generously.** 0.107em letter-spacing at 12-15px is what\n  makes nav and labels read as fashion-editorial rather than default UI.", "What to leave": "- The \"Don't\" list is empty in the source export — the system's constraints are\n  implicit in its Do's, which makes fidelity harder to check without the live site.\n- An 800px capsule radius depends on generous card width; at narrow/mobile\n  breakpoints it will collapse toward a pill or a circle, losing the lozenge shape.\n- A single reserved accent colour for one section only works if that section is\n  genuinely the page's close — used mid-page it would read as an unexplained\n  one-off.", "Signature move": "The circular rotating text badge — \"AVAILABLE NOW\" set on an invisible circle,\nused once as a floating decorative element beside the hero headline rather than as\na repeatable component. It is deliberately not part of the design system; it is a\nsingle ornament.", "Motion": "(from designlang extract) Feel reads as smooth, and the page is scroll-linked.\nInteractive transitions run on a plain `ease` curve at three short durations —\n100ms, 200ms and 300ms — the fastest tier for hover/colour changes, the slowest for\nlarger reveals; the broader transition log adds a 400ms opacity fade for section\nentrances. The one keyframe confirmed in use is `slide`, a slide-x transform (3\nuses) driving translateX motion — most likely the capsule-tile image slider/marquee\nbehaviour rather than the rotating text badge, since no rotate keyframe registers\nas in-use (a `spin` keyframe exists in the stylesheet but isn't confirmed firing).\n(observed in capture) the capsule-shaped image containers and the circular rotating\nbadge suggest the badge text itself may continuously rotate, and hover states on\nghost/filled pill buttons likely invert fill and text colour rather than adding\nmovement — consistent with the flat, shadow-free, editorial register of the rest of\nthe system.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 100ms | `ease` |\n| sm | 200ms | `ease` |\n| md | 300ms | `ease` |\n| slide keyframe | — | translateX, 3 uses |", "Brief": "Build a visual-design-studio portfolio. Canvas is paper white, ink is near-black\n`#111118`, with soft-ash and stone-gray for muted borders and dividers — the whole\nUI stays achromatic except for the highlighter-yellow `#fef199` reserved for the\nfooter only. Open on a full-width Editorial New weight-200 headline (48-160px,\nline-height 1.0, no uppercase) stating the studio's promise in one or two lines.\nBelow, lay out a portfolio grid of capsule-shaped project tiles (800px radius,\n8px on the outer card) bleeding full client-project colour and imagery. Use PP Mori\nat 0.107em tracking for all nav, labels and body copy; reserve 24px pill radius for\nbuttons and 8px for cards and links. Add one floating circular rotating text badge\nnear the hero as a one-off ornament. Close on a full-width `#111118` inverted\nfooter panel with a giant 150px-radius CTA pill outlined in highlighter yellow.", "Image recipe": "Not applicable as a primary photographic recipe — the site's imagery is client\nproject work (screenshots, illustration, branded colour blocks) rather than\nphotography. Where a portrait or process shot is needed: a plain, evenly lit studio\nheadshot or workspace detail of [SUBJECT], neutral background, no heavy retouching,\nconsistent with an achromatic UI that lets the subject's own colour read clean.", "Photo search": "Unsplash first, Pexels second.\n- \"designer workspace desk minimal flat lay\"\n- \"portrait studio lighting neutral background\"\n- \"laptop screen mockup UI design work\"\n- \"colour palette swatches paper minimal\"", "Reference lock": "Primary reference/direction: André Cândido — near-monochrome editorial portfolio,\nwhisper-thin didone display, colour reserved for client work and one footer accent.\nPreserve (3-5 traits): 97% achromatic UI (`#111118` ink on white); Editorial New\nweight 200 exclusively for display headlines 48px and above, never smaller, never\nheavier; PP Mori at 0.107em tracking for all functional text; 800px capsule radius\non portfolio images vs. 8px on cards and 24px on buttons; a single dark `#111118`\nfooter inversion where highlighter yellow `#fef199` appears for the first and only\ntime.\nBorrow only (1-2): the circular rotating \"AVAILABLE NOW\" text badge; the 150px-\nradius oversized footer CTA pill.\nRole rules: yellow never appears outside the footer panel; serif never carries body\ncopy or UI labels; sans never sets a display headline; client-project colour is the\nonly large colour field permitted pre-footer.\nMedia strategy: none (no external photography) — client-work screenshots and\ncolour blocks carry all chromatic content; any supplementary photography stays\nneutral and desaturated to match the UI.\nReject: a second accent colour anywhere outside the footer; rounded corners below\n8px or above 24px except the 800px image capsule; shadows or elevation; a bolded\nEditorial New headline.\nToken commitments: bg `#ffffff`, ink `#111118`, border `#dddddd`/`#bdbdbd`, muted\ntext `#7c7c7c`, footer accent `#fef199`; display weight 200 at 48-160px/leading 1.0;\nbody PP Mori 200-600 at 12-24px, 0.107em tracking on 12-15px sizes; radius 8px\ncards, 24px buttons, 800px images, 150px footer CTA; base spacing unit 8px, section\ngap 80-120px."}, "has_extract": true}, {"slug": "apollo", "title": "Apollo", "url": "https://apolloworkspace.com", "captured": "2026-09-04", "family": "brick-atelier-membership", "dna": "Golden-hour brick photography x print-brochure membership copy", "register": "warm photographic", "grammar": "chaptered editorial", "lane": "A full-bleed golden-hour photograph of members walking through a brick archway carries an engraved whisper-thin serif wordmark, then the page settles onto a cream canvas of sharp 3px-radius, hairline-ruled two-column chapters", "mode": "persuade", "traits": ["47px engraved-thin serif hero", "\"3px radius everywhere", "no pill buttons\"", "\"warm linen canvas", "never white\"", "terracotta accent rationed to borders", "golden-hour lifestyle photography only", "uppercase wide-tracked section kickers"], "palette": ["#3c261c", "#e97451", "#4a43dd", "#f9f8f0", "#dddedf", "#fcede8"], "type": ["paradigm-pro", "MonaSans"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "hospitality", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://apolloworkspace.com", "has_image": true, "img": "../design-catalogue/entries/apollo/fold.webp", "full": "../design-catalogue/entries/apollo/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. Warm linen `#f9f8f0` stands in for white across the entire canvas, and\nespresso `#3c261c` stands in for black — a page-wide warm shift that makes the\ngolden-hour brick photography feel like it belongs to the same light as the UI,\nrather than sitting on top of a colder digital frame. Terracotta `#e97451` is\nrationed hard: primary-action borders, the active nav underline, and the logo\nmonogram, never a filled surface — the \"Do\" list is explicit that it must never\nbecome a large fill.\n\nThe typographic tension is the same whisper-vs-workhorse move seen across this\nfamily of editorial sites: paradigm-pro at weight 300 only, used purely for the\nhero display and a handful of brand-voice headings, against MonaSans's uppercase,\nwide-tracked (0.07-0.1em) workhorse voice for everything structural — nav, section\nkickers, body. The serif is deliberately restricted to 36-47px so it never has to\ncarry small text, which is where an ultra-light weight would fail.\n\nA flat 3px radius on literally every interactive element and image — buttons,\ncards, photos, inputs — rejects SaaS pill-button softness outright. Combined with\nzero shadows and Ash Mist hairlines as the only structural device, the page reads\nas a printed membership brochure rather than a software product, which matches the\nbrief: a physical, curated workspace, not a tech tool.", "What to borrow (principle)": "- **Shift every neutral warm, uniformly.** Replacing both white and black with a\n  single warm-shifted pair (linen, espresso) makes golden-hour or warm-toned\n  photography read as native rather than composited.\n- **Cap radius at one small value across every element type.** 3px everywhere —\n  buttons, cards, images — rejects the \"soft SaaS\" register on sight and reads as\n  print instead.\n- **Ration the accent to structural marks only.** Terracotta on borders and\n  underlines, never as a fill, keeps a warm accent from tipping into \"loud.\"\n  colour.\n- **Reserve the display serif for a narrow size band.** Locking a whisper-weight\n  face to 36-47px only avoids the legibility failure that comes from setting an\n  ultra-light weight small.\n- **Let uppercase wide-tracked kickers do the \"magazine\" work.** A 12px kicker at\n  0.1em tracking above every section heading reads as an editorial index, not a\n  UI label.", "What to leave": "- Iris Ink `#4a43dd` as a \"decorative headline only\" colour is a fragile rule —\n  one accidental reuse in body copy or a link would immediately read as a bug, not\n  a feature, since it has no other role in the system.\n- 3px radius on every element, including images, is a hard constraint that will\n  visibly clash with any borrowed component using pill or fully-rounded geometry.\n- The single architectural illustration described in the source (a painted\n  building facade) is a bespoke, one-off asset — it isn't a repeatable pattern and\n  shouldn't be treated as a template for future imagery.", "Signature move": "The engraved-serif hero: paradigm-pro weight 300 at 47px with 0.08em positive\nletter-spacing over a darkened full-bleed photograph — spaced out enough, and thin\nenough, that the wordmark reads as etched into the image rather than typeset on\ntop of it.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked —\ncorrecting the earlier read that no motion system exists. Two easing families do\ndistinct jobs: a standard `cubic-bezier(0.4, 0, 0.2, 1)` curve (25 uses) covers\ncolour, border and gradient-stop transitions at 150ms; a slower, named\n\"ease-editorial\" curve `cubic-bezier(0.22, 1, 0.36, 1)` (3 uses) covers the same\nproperties at 300ms, giving hover/link states a softer, more decelerated finish\nthan plain UI chrome gets. A `max-height` transition at 300ms on the fast curve\npoints to at least one accordion/reveal panel. No keyframe animations are defined —\nconsistent with the flat, shadow-free print-brochure register, motion here lives\nentirely in property transitions, not choreographed sequences. (observed in\ncapture) the flat 3px-radius system with no shadows and generous 68px section gaps\nis consistent with simple crossfades between the hero photograph and the cream\ncontent sections, with alternating text-left/image-right two-column reveals on\nscroll rather than parallax.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs (UI chrome) | 150ms | `cubic-bezier(0.4, 0, 0.2, 1)` |\n| md (reveal / accordion) | 300ms | `cubic-bezier(0.4, 0, 0.2, 1)` |\n| md (editorial hover) | 300ms | `cubic-bezier(0.22, 1, 0.36, 1)` \"ease-editorial\" |", "Brief": "Build a boutique-workspace membership page. Canvas is warm linen `#f9f8f0`\nthroughout — never pure white; ink is espresso `#3c261c` — never pure black.\nTerracotta `#e97451` appears only on button borders, the active-nav underline and\nthe logo monogram. Cap every radius at 3px: buttons, cards, images, inputs alike.\nOpen full-bleed on a golden-hour lifestyle photograph with a dark Espresso nav bar\noverlaid, an uppercase MonaSans eyebrow label, a paradigm-pro weight-300 hero\nwordmark at 47px/0.08em tracking, and a ghost-outlined CTA. Below the hero, run\nalternating two-column chapters (text ~40% width, photography ~45%, generous\ngutters) with a MonaSans uppercase kicker, a MonaSans uppercase section heading,\n18px body copy, and terracotta-dot bulleted feature lists. Keep 68px vertical gaps\nbetween chapters and no shadows anywhere; Ash Mist `#dddedf` hairlines are the only\nstructural divider.", "Image recipe": "Documentary lifestyle photograph of [SUBJECT] — people walking or working through a\nwarm brick or masonry setting, shot in genuine golden-hour light with long shadows\nand warm highlight falloff, candid unposed body language, natural depth of field\nwith the background softly out of focus, no studio lighting, no cool colour\ntemperature anywhere in the frame.", "Photo search": "Unsplash first, Pexels second.\n- \"golden hour brick archway people walking\"\n- \"coworking space warm natural light interior\"\n- \"entrepreneurs walking city street candid\"\n- \"workspace desk warm afternoon light\"", "Reference lock": "Primary reference/direction: Apollo — golden-hour membership-brochure workspace\npage, engraved whisper-thin serif hero, terracotta rationed to structural marks.\nPreserve (3-5 traits): warm linen `#f9f8f0` canvas and espresso `#3c261c` ink,\nnever pure white or black; 3px radius on every element without exception; terracotta\n`#e97451` restricted to borders, underlines and the monogram, never a fill;\nparadigm-pro weight 300 restricted to 36-47px display only; Ash Mist `#dddedf`\nhairlines as the sole structural divider, no shadows.\nBorrow only (1-2): Iris Ink `#4a43dd` for a single brand-voice display heading; the\none painterly architectural illustration as a rare hand-crafted accent.\nRole rules: terracotta never becomes a large fill; the display serif never sets\nbody text or UI labels; uppercase 0.07-0.1em tracking applies to all section\nkickers and nav, never to body copy.\nMedia strategy: photo:unsplash — candid, golden-hour lifestyle photography of\npeople and brick/masonry interiors only; no studio product shots, no cool lighting.\nReject: pill buttons or radius above 3px on any element; drop shadows; Iris Ink in\nbody text or links; more than one accent colour active in a single view.\nToken commitments: bg `#f9f8f0`, hairline `#dddedf`, accent `#e97451`, decorative\n`#4a43dd`, ink `#3c261c`, hover-warm `#fcede8`; display paradigm-pro weight 300 at\n36-47px/leading 0.95-0.97; body MonaSans 400 at 18px/leading 1.55; uppercase\nkickers 0.07-0.1em tracking; radius 3px universal; page max-width 1200px, section\ngap 68px."}, "has_extract": true}, {"slug": "archline", "title": "Archline (architecture template)", "url": "https://archline.framer.website/", "captured": "2026-09-04", "family": "dusk-house-manifesto", "dna": "Dusk architectural photography x mismatched product-copy tell", "register": "warm photographic", "grammar": "chaptered editorial", "lane": "A dusk photograph of a modern house carries a plain two-line claim and a scroll cue, then an about section pairs office and portrait photography beside body copy that drifts into unrelated product-design language", "mode": "persuade", "traits": ["dusk architectural photograph hero", "registered-trademark wordmark", "plain two-line claim", "scroll-down cue", "paired interior+portrait photography", "copy that drifts off-topic (template tell)", "four-stat achievement row", "generic professional-services structure"], "palette": ["#4A5A6E", "#D9A860", "#F2EEE6", "#1D1B18", "#8B8577"], "type": ["Inter Display"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://archline.framer.website/", "has_image": true, "img": "../design-catalogue/entries/archline/fold.webp", "full": "../design-catalogue/entries/archline/shot.webp", "sections": {"Why it works": "The hero is competent, generic-good: a real modern house photographed at dusk,\nwarm interior light glowing against a cooling sky, a plain two-line claim\n(\"Harmony shaped by light, material, and space\") and a small \"[SCROLL DOWN]\"\ncue. Nothing here is wrong — it's the correct recipe for an architecture-studio\nhero, warm light against cool sky, plain confident copy, a registered wordmark.\n\nThe interesting failure shows up in the \"about\" copy just below the fold, which\ndrifts, mid-paragraph, from architecture language into unrelated software\nlanguage: \"every detail we design — from a color system to a dashboard\nlayout — is rooted in user behavior...\" A studio it claims to have \"founded\nwith a vision to craft spaces\" is, one sentence later, talking about ensuring\n\"every product scales beautifully, performs seamlessly across platforms.\" This\nis copy written for a SaaS product, pasted into an architecture template\nwithout being reread — a genuine tell of templated or AI-generated content that\nnever got a human edit pass.\n\nEverything else on the page follows the category's honest defaults: a paired\ninterior-photo-plus-portrait \"about\" block, and a four-stat achievement row\n(`95+ Curated Interiors`, `7 Years of Expertise`...). It's a useful reference\nprecisely because it shows how far competent visual defaults can carry a page\neven when the copy underneath them has stopped meaning anything specific.", "What to borrow (principle)": "", "What to leave": "- Copy that drifts from the stated category (architecture) into unrelated\n  vocabulary (color systems, dashboards, \"scales beautifully... across\n  platforms\") within the same paragraph — this is the single clearest tell\n  that content was templated or generated without a domain-specific edit pass,\n  and it undermines every other well-executed choice on the page.\n- A registered-trademark symbol on a studio wordmark with no other markers of\n  an established, litigation-aware brand reads as borrowed gravitas rather than\n  earned.", "Signature move": "Not a device worth reusing — the notable \"move\" here is a cautionary one: the\nabout-section copy silently swaps industries mid-paragraph, moving from spatial\ndesign language to software-product language without the switch being\nacknowledged or corrected. It's the page's most instructive feature precisely\nbecause it's a mistake.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed,\nthough the captured CSS is minimal — a single `1ms` allow-discrete overflow\ntransition and a bare `transition: all`, with only a generic loading-spinner\nkeyframe present. No scroll-prompt animation on the \"[SCROLL DOWN]\" cue was\ncaptured; that read stays inferred from the image, consistent with this being\na template whose content (see Why it works) also wasn't fully finished.\n\n| token | value | role |\n|---|---|---|\n| `instant` | 1ms | framework overflow transition |", "Brief": "If borrowing this direction: keep the dusk architectural hero, the paired\nportrait-plus-interior \"about\" block, and the four-stat achievement row — all\ngenuinely solid defaults for the category. Replace the about-section copy\nentirely with language specific to the actual practice (materials, process,\ntypology, geography) and have it read by someone who would notice a stray\n\"dashboard layout\" or \"scales across platforms\" reference before it ships.\nNever let generic or copy-pasted template language survive into a page whose\nwhole pitch is bespoke, considered craft.", "Image recipe": "A modern architectural [SUBJECT] photographed at dusk, warm interior light\nglowing through glazing against a cooling blue-grey sky, wide establishing\nshot with the building's full form visible, natural landscaping in the\nforeground, no visible people.", "Photo search": "Unsplash first, Pexels second.\n- \"modern house dusk warm light exterior\"\n- \"architecture twilight glass facade\"\n- \"residential building blue hour warm windows\"", "Reference lock": "Primary reference/direction: Archline — dusk architectural photography hero with a paired portrait/interior about-section, undermined by mismatched template copy.\nPreserve (3-5 traits): dusk photography of real completed work, warm interior light against a cooling sky; a paired designer-portrait-plus-interior-photo \"about\" block; a plain four-stat achievement row directly following the about copy; a plain two-line claim in the hero with a scroll-down cue.\nBorrow only (1-2): the registered-trademark wordmark treatment, only if the brand is genuinely established; the small \"[SCROLL DOWN]\" cue.\nRole rules: every paragraph of body copy must stay within the stated practice's actual vocabulary — no cross-industry language may survive an edit pass; stats must be real and verifiable, not template placeholders.\nMedia strategy: photo:unsplash — dusk, warm-lit architectural photography of real (or realistic) completed work only; portraits must be genuine or plausibly genuine, not generic stock \"professional headshot\" imagery.\nReject: shipping copy that drifts between unrelated industries within a paragraph; unverified achievement stats; a registered-trademark mark on an unestablished brand.\nToken commitments: dusk-blue `#4A5A6E`, warm-amber `#D9A860`, paper `#F2EEE6`, ink `#1D1B18`, stone `#8B8577`; plain sans for all type."}, "has_extract": true}, {"slug": "areto", "title": "Areto (Webflow template, Home Two demo)", "url": "https://areto.webflow.io/home-two", "captured": "2026-09-04", "family": "dark-hero-consulting-template", "dna": "Dark photographic hero x marketplace-template consulting tropes", "register": "modern clean", "grammar": "split stage", "lane": "A dark-toned hero photo of a founder at a laptop carries a two-line headline and a floating vertical service list, then the page runs a stock sequence of icon-plus-percentage stat rows, gradient-fade headlines and a yellow scribble accent", "mode": "persuade", "traits": ["dark-toned founder-at-work hero photo", "floating vertical keyword list (Strategies/Optimization/Analytics)", "yellow-highlight underline on one word", "icon + percentage stat rows", "two-tone fade-out headline", "hand-drawn scribble accent line", "pill CTA buttons", "yellow badge chip"], "palette": ["#ece7e4", "#000000", "#f8fa8d", "#36503f", "#120a0e", "#e0d8cb", "#4d4d4d"], "type": ["Inter Tight"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "institutional", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://areto.webflow.io/home-two", "has_image": true, "img": "../design-catalogue/entries/areto/fold.webp", "full": "../design-catalogue/entries/areto/shot.webp", "sections": {"Why it works": "This is a Webflow marketplace template (\"Areto\"), captured from its \"Home Two\"\ndemo — worth naming up front, because the page is built to demonstrate a\ncomponent library rather than to sell one specific consulting firm. The hero\ndoes one thing well: a dark, desaturated founder-at-a-laptop photograph anchors\na small two-line headline on the left and a vertical list of four keywords\n(Strategies / Optimization / Analytics / Execution) floating on the right, with\none word underlined in a bright yellow accent. The vertical list works as a\nlightweight alternative to a nav-style feature summary — it reads at a glance\nwithout needing icons or cards.\n\nEverything below the fold, though, runs through a recognisable set of\nconsulting-template devices: a trust badge pill (\"Join the 850+ companies...\"),\na headline that fades from solid black to light grey partway through the\nsentence, icon-plus-percentage stat rows (95%, 85%) next to a hand-drawn yellow\nscribble, and repeated \"Discover more →\" links on a four-item services grid.\nNone of these are wrong individually, but stacked together they read as the\ntemplate industry's current default vocabulary for \"trustworthy B2B services\nsite\" rather than anything specific to a firm's own voice — useful to study\nprecisely because it shows what generic competence looks like at this genre.\n\nOne typeface (Inter Tight) runs the whole page at every weight, which does keep\nthe surface calm even where the content patterns are formulaic. The extracted\nbrand voice confirms the impersonal read: third-person, friendly tone,\nverbose sentence-case headings — copy built to describe a category of service\nrather than address one specific reader.", "What to borrow (principle)": "- **A floating vertical keyword list beside a hero photo** is a lighter way to\n  summarise service areas than a horizontal nav strip or icon row.\n- **Underline exactly one word in an accent colour** in the hero to create a\n  single focal point without a second display typeface.\n- **Real workplace photography (not stock-posed) grounds an otherwise generic\n  page** — the founder-at-laptop and team-huddle photos read as documentary\n  enough to avoid pure stock-photo flatness.", "What to leave": "- The gradient-fade headline (solid to light grey mid-sentence) is a template\n  tell at this point — it reads as decoration applied to any headline rather\n  than a considered emphasis device.\n- The hand-drawn yellow scribble beside a stat number is decorative filler with\n  no connection to the number's meaning.\n- Icon-plus-percentage stat rows (\"Strategy development — 95%\") state\n  confidence with no defined denominator — the pattern reads as trust signal\n  regardless of what the percentage actually measures.\n- The trust badge pill, stat rows, \"Discover more\" service cards and gradient\n  headline are all stock components of this template genre — none is wrong on\n  its own, but together they read as assembled rather than designed for one\n  specific brand's voice.", "Signature move": "The floating vertical keyword list beside the hero photo, with exactly one word\nunderlined in the accent colour — a lighter-weight way to state \"what we do\"\nthan a nav bar or a row of icon cards.", "Motion": "(from designlang extract) The extract labels overall feel \"responsive\" and\nconfirms scroll-linked behaviour. Two duration tokens cover nearly everything\nin use — a 300ms `md` for hover/state changes and a 500ms `lg` for larger\ntransforms — both riding the same ease-out family rather than a spring or\novershoot curve, so nothing bounces. Two keyframes are actually in use:\n`rtvpulse`, a box-shadow ring pulse (reads as a live-status/badge dot), and\n`rtvL`, a horizontal `translateX` slide that drives a marquee-style strip. A\n`spin` keyframe is also defined in the stylesheet but doesn't register as\nin-use, suggesting a loader state that rarely fires. No choreography or\nstagger pattern is reported.\n\n| token | duration | easing |\n|---|---|---|\n| `md` | 300ms | ease-out `cubic-bezier(0.22, 1, 0.36, 1)` |\n| `lg` | 500ms | ease-out `cubic-bezier(0.16, 1, 0.3, 1)` |", "Brief": "This entry is best used as a genre reference for \"generic-competent B2B\nconsulting template,\" not as a direction to imitate wholesale. If borrowing\nfrom it: anchor a hero on one dark, desaturated documentary-style photo of a\nreal person at work, with a short two-line headline and a floating vertical\nlist of 3-4 keywords beside it, one word underlined in a single accent colour.\nRun the whole page on one grotesque. Avoid the gradient-fade headline, the\ndecorative scribble, and stat rows without a stated basis — replace percentage\nclaims with concrete, sourced numbers if using the stat-row pattern at all.", "Image recipe": "Documentary workplace photograph of [SUBJECT] — a founder or team working at a\nlaptop or in a huddle — natural window light, desaturated/cool colour grading,\ncandid framing rather than posed-for-camera, shallow depth of field, no studio\nlighting rig visible.", "Photo search": "Unsplash first, Pexels second.\n- \"founder working laptop office candid\"\n- \"team huddle office glass window\"\n- \"business meeting laptop natural light\"", "Reference lock": "Primary reference/direction: Areto (Home Two) — dark documentary hero with a\nfloating vertical keyword list; used here as a genre study of consulting-\ntemplate defaults, not a direction to reproduce wholesale.\nPreserve (3-5 traits): dark desaturated hero photograph with a short two-line\nheadline; a floating vertical keyword list beside the hero, one word\nunderlined in a single accent colour; one grotesque typeface at every weight;\nreal (not obviously staged) workplace photography throughout.\nBorrow only (1-2): the pill-shaped trust badge; the \"Discover more →\" link\nstyle on service cards.\nRole rules: accent colour underlines at most one hero word and nothing else at\nthat scale; stat numbers, if used, must cite a real basis in the copy next to\nthem.\nMedia strategy: photo:unsplash — candid, desaturated workplace photography;\navoid overtly posed corporate stock.\nReject: gradient-fade headlines; decorative hand-drawn scribbles with no\nsemantic link to the content beside them; unsourced percentage stat claims;\nmore than one accent colour.\nToken commitments: ground `#F6F6F6`, ink `#0D0F0F`, accent-yellow `#F8F9C6`,\nforest `#324A3A`, taupe `#967E6C`, stone `#A1A59E`; display/body \"Inter\nTight\" throughout."}, "has_extract": true}, {"slug": "aveon", "title": "Avéon (interior design template)", "url": "https://aveon.framer.website/", "captured": "2026-09-04", "family": "brooklyn-bento-atelier", "dna": "Live-clock console header x interior photo bento grid", "register": "warm photographic", "grammar": "gallery/catalog", "lane": "A cream header carries a live clock and a small show-reel thumbnail rather than a full hero photo, drops into a giant black headline, then opens into a dense nine-photo interior bento grid on black", "mode": "persuade", "traits": ["cream header with live date
