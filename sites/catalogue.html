F3F3", "#7A4B2E", "#380907", "#0F141B", "#730909", "#907663"], "type": ["American Grotesk Compressed", "Ppeditorialnew"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "portfolio", "category2": "hospitality", "origin": "raw-url", "extract": "ok", "source_url": "https://www.weareexample.com", "has_image": true, "img": "../design-catalogue/entries/example/fold.webp", "full": "../design-catalogue/entries/example/shot.webp", "sections": {"Why it works": "The page opens with one device doing double duty: an oversized, ultra-bold condensed\nheadline (\"AN EARNED-LED CULTURE AGENCY\") that reads as pure typography from a distance,\nbut has two small client-work photographs wedged directly into its negative space, tucked\nbetween letters at an angle. The headline is the hero image and the proof point at once —\nthere's no separate \"our work\" gallery competing for the same attention in the first\nscreen.\n\nDirectly beneath it, a full-bleed, warm red-lit hotel-lounge photograph carries a second\ntypographic device: a horizontal marquee of oversized white type (\"...AND HOTELS TRAVEL\n...\") scrolling across the image at a scale that partially exceeds the viewport, with a\nsmall `02/03` counter centred at the top. Because both the headline and the marquee use\nthe same ultra-condensed, ultra-bold face, the page reads as one continuous typographic\nvoice even though the mechanism (static wedge vs. scrolling band) changes.\n\nAn italic script line — \"We Make It Happen\" — sits alone in the quiet gap between the two\nloud sections, functioning as the page's only soft, humanising mark against two very hard\ntypographic devices. The restraint of introducing a second type voice exactly once, at the\nlowest-intensity moment, keeps it from diluting the condensed system.", "What to borrow (principle)": "- **Wedge real work photography into the negative space of giant type**, rather than\n  running a headline and a portfolio grid as separate zones — the credibility and the\n  hook arrive in the same glance.\n- **Reuse one condensed, ultra-bold voice across both a static headline and a moving\n  marquee.** The mechanism can change (static vs. scrolling) as long as the type doesn't.\n- **Save a second, softer typeface for exactly one low-intensity moment** — a tagline, a\n  closing line — so it reads as a considered break, not a second system.\n- **Let a full-bleed photo carry oversized type that exceeds the frame.** Type running off\n  both edges signals scale and confidence without needing more copy.", "What to leave": "- Tucking a small square photo behind a headline letter at a rotated angle (top left) is\n  legible here only because the photo has a light background matching the page ground —\n  it would fail against a busier client photo.\n- The marquee band's line-height and the interior photo's horizon line nearly collide\n  (visible in the raw capture), leaving little breathing room above the scrolling text —\n  worth a fixed minimum contrast scrim behind the marquee band.\n- This entry's `fold.webp`/`shot.webp` are derived from the archived raw capture, not a\n  fresh render — the live page returned HTTP 200 but did not reach network-idle within the\n  capture budget (likely continuous marquee/video network activity), so treat exact crops\n  and any since-changed copy as approximate.", "Signature move": "The marquee band: a strip of oversized type scrolling horizontally across a full-bleed\nphotograph, with a slide counter (`02/03`) marking it as one frame in a sequence rather\nthan a one-off flourish — turning a scrolling ticker, usually a low-craft device, into a\nstructured, numbered chapter.", "Motion": "Overall feel reads as mixed — quick UI-chrome transitions layered under a page that is\notherwise scroll-linked. Interaction states run on two short durations: a `sm` 200ms for\nopacity fades (link/nav hover) and a `md` 300ms for border-color changes (form-input focus\nrings). Neither transition declares an explicit easing function, so both fall through to\nthe browser's plain default ease — nothing here signals a spring or overshoot curve. The\nonly keyframe animation the extract captured is a plain 360° `spin`, almost certainly a\nloading-icon rotation rather than the hero/marquee effect; the extract's DOM/CSS pass\ndoesn't confirm how the marquee band itself is driven (likely a scroll-triggered script\nrather than a declared `@keyframes` rule), and no stagger/choreography pattern is\ndocumented. (from designlang extract)\n\n| Token | Value | Curve |\n|---|---|---|\n| `sm` (opacity) | 200ms | default ease (unspecified) |\n| `md` (border-color) | 300ms | default ease (unspecified) |\n| `spin` keyframe | rotate 0deg → 360deg | unspecified (loader) |", "Brief": "Build a culture/PR-agency landing page anchored on one oversized, ultra-condensed bold\nheadline set on an off-white ground, with one or two small real-work photographs wedged\ninto the headline's negative space at a slight rotation. Beneath it, run a full-bleed,\nwarm-lit interior or lifestyle photograph carrying a horizontal marquee of oversized white\ntype in the same condensed face, scrolling past the frame edges, with a small numbered\ncounter (`NN/total`) marking it as one of several sequential slides. Use an italic script\nline as the only second typeface, reserved for a single soft tagline between the two loud\nsections. Keep the palette to off-white, near-black and one warm red/brown drawn from the\nphotography — no separate brand accent colour.", "Image recipe": "Warm, red-lit interior photograph of [SUBJECT] — a hotel lounge, a members' club, a\ndestination bar — shot at dusk or with practical warm lighting, saturated reds and ambers,\nreal furniture and real guests or staff in soft focus, composed with a clear horizontal\nband through the middle third so scrolling marquee type can run across it without losing\nlegibility.", "Photo search": "Unsplash first, Pexels second.\n- \"hotel lounge red lighting interior\"\n- \"members club warm ambient interior\"\n- \"rooftop bar dusk skyline\"\n- \"boutique hotel lobby evening light\"", "Reference lock": "Primary reference/direction: EXAMPLE — condensed manifesto headline with photos wedged\ninto letterforms, marquee band over a red-lit hotel photo.\nPreserve (3-5 traits): off-white ground with near-black condensed display type as the\ndominant voice; small work photography wedged into the headline's negative space rather\nthan shown in a separate grid; a full-bleed warm interior photograph carrying an oversized\nscrolling marquee in the same face; a numbered slide counter marking sequential content; a\nsingle italic script line as the only second typeface, used once.\nBorrow only (1-2): the slight rotation on wedged photos; the thin horizontal progress\nline beneath the marquee photo.\nRole rules: the condensed display face is used for both static headlines and the marquee,\nnever mixed with a third face; the italic script appears at most once per page; accent\ncolour is drawn only from the photography (warm red/brown), never a separate brand hue.\nMedia strategy: photo:unsplash — warm, saturated interior/hospitality photography with a\nclear horizontal band for marquee-type legibility; never a flat, evenly-lit product shot.\nReject: a conventional separate \"our work\" grid competing with the hero; more than one\naccent colour; a second display typeface; centred, static (non-scrolling) proof sections.\nToken commitments: bg `#F3F3F3`, ink `#0F141B`, warm-deep `#380907`, warm-red `#730909`,\nwarm-mid `#7A4B2E`, warm-tint `#907663`; display: ultra-condensed bold grotesque for\nheadline and marquee; script/italic serif for the single soft tagline; marquee type scaled\nto exceed the viewport edges."}, "has_extract": true}, {"slug": "future-fur", "title": "Future Fur", "url": "https://futurefur.com.au/", "captured": "2026-09-04", "family": "electric-blue-eco-fur", "dna": "Split hero texture+lifestyle x eco manifesto copy", "register": "modern clean", "grammar": "split stage", "lane": "A giant electric-blue wordmark sits over a two-up split hero — product texture beside lifestyle action — then a blue manifesto paragraph and a colour-swatch product list", "mode": "persuade", "traits": ["giant electric-blue wordmark overlaid on photo", "two-up split hero (texture + lifestyle)", "single saturated brand blue as the only colour", "manifesto-style sustainability copy in brand colour", "colour-swatch dot list beside product name", "heavy bold sans throughout", "no serif anywhere"], "palette": ["#00A000", "#E4DCC8", "#000000", "#FFFFFF", "#D32C00"], "type": ["Inter"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "consumer-brand", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://futurefur.com.au/", "has_image": true, "img": "../design-catalogue/entries/future-fur/fold.webp", "full": "../design-catalogue/entries/future-fur/shot.webp", "sections": {"Why it works": "The hero is a literal two-up split: on the left, a tight macro crop of the\nblanket's own fur texture; on the right, a lifestyle shot of someone laughing\nunder the same blanket outdoors. Texture and use-case sit side by side in one\nframe, so the page proves \"it feels like this\" and \"it's used like this\"\nsimultaneously, with the giant blue wordmark stamped across both halves tying\nthem into one image.\n\nOne saturated brand blue is the only colour on the page — wordmark, captions,\nCTA button — set against the product's own neutral cream and the lifestyle\nphoto's natural tones. Because nothing else competes with it, the blue reads as\nthe brand's entire identity in a single hue, doing the job a multi-colour\npalette would otherwise need.\n\nThe sustainability claim (\"Made from 100% recycled plastic bottles diverted\nfrom landfill... a resounding 'no thank you' to fast fashion and animal\ncruelty\") is set in the same blue, same weight, same size as the headline —\nso the ethical pitch and the brand pitch are typographically equal, not a\nsmaller-print afterthought below a bigger marketing claim.\n\nA later designlang extraction of the live site shows a different single-colour\nscheme than the captured screenshot — a saturated green (2,372 uses) paired\nwith a red-orange (430 uses) rather than the blue this entry describes,\nsuggesting the brand colour was changed after this capture. The one-colour\nprinciple below still holds; the hex just moved.", "What to borrow (principle)": "- **Split the hero literally in two**, texture on one side, lifestyle use on the\n  other, so material quality and real-world use are proven in the same glance.\n- **Commit to exactly one saturated brand colour** and let it carry wordmark,\n  copy emphasis and CTA — no secondary accent needed.\n- **Set your sustainability or values claim at headline weight**, not as\n  smaller-print supporting copy, if it's core to the brand's differentiation.\n- **List colourways as small dots beside the product name and price**, not a\n  separate swatch grid, when the range is simple.", "What to leave": "- A single saturated colour this loud, used for both wordmark and long-form\n  copy, can fatigue readability over paragraph-length text — reserve it for\n  headline-length claims and short labels.\n- The split-hero crop needs careful art direction so neither half reads as an\n  afterthought; a tighter, higher-contrast texture crop would balance the more\n  detailed lifestyle photo better.", "Signature move": "The two-up split hero with the wordmark stamped across both halves: texture\nphotography and lifestyle photography sit as equal, adjacent panels, unified\nonly by the giant blue \"FUTURE FUR\" type running across the seam between them.", "Motion": "(from designlang extract) Feel is \"responsive\" with scroll-linked motion\nconfirmed. Hover/UI transitions run fast (`100–500ms`) on a decelerating\nease-out pair (`cubic-bezier(0.39,0.58,0.57,1)`, `cubic-bezier(0.25,0.46,\n0.45,0.94)`, 35 uses) alongside a sharper custom curve for menu/width moves\n(`cubic-bezier(0.52,0,0.61,0.99)`, 12 uses). Most of the actual keyframes are\nShopify commerce plumbing — checkout skeleton, accelerated-checkout spinner —\nplus real UI choreography for the announcement bar (`translateAnnouncement\nSlideIn`/`Out`) and mobile menu (`animateMenuOpen`, `appear-down`), which\nslide/fade in on a consistent negative-Y or negative-X entrance.\n\n| token | value | role |\n|---|---|---|\n| `xs`–`sm` | 100–200ms | hover/small UI states |\n| `md`/`lg` | 300/500ms | menu & announcement transitions |\n| ease-out | `cubic-bezier(0.39,0.58,0.57,1)` | dominant (35 uses) |\n| custom | `cubic-bezier(0.52,0,0.61,0.99)` | menu/width moves (12 uses) |", "Brief": "Build a bold, single-colour D2C product page. Open on a two-up split hero: a\ntight macro texture crop on one side, a lifestyle action photo on the other,\nwith the product wordmark stamped in the brand's one saturated colour across\nboth halves. Set the sustainability or values claim directly beneath, at the\nsame type weight and colour as the headline, not smaller. Follow with a simple\nproduct list where each item shows its name, price and a small row of colour\ndots rather than a full swatch grid. Use the one brand colour for wordmark,\nemphasis and CTA only — everything else stays neutral (cream, black, white).", "Image recipe": "Two paired shots of [SUBJECT]: (1) an extreme macro texture crop, soft\ndirectional light, shallow depth of field showing individual fibre detail; (2)\na candid lifestyle action shot of a person using the product outdoors, natural\nlight, genuine motion or laughter, both graded to the same neutral warm-cream\npalette.", "Photo search": "Unsplash first, Pexels second.\n- \"faux fur texture macro close up\"\n- \"blanket outdoor laughing candid lifestyle\"\n- \"soft throw blanket texture detail\"", "Reference lock": "Primary reference/direction: Future Fur — two-up split hero (texture + lifestyle) unified by a giant single-colour wordmark, sustainability claim at headline weight.\nPreserve (3-5 traits): literal two-up split hero pairing macro texture with lifestyle use; exactly one saturated brand colour carrying wordmark, emphasis copy and CTA; sustainability/values claim set at the same weight as the headline, never smaller print; colour-swatch dots placed inline beside product name and price.\nBorrow only (1-2): the \"Shop Now\" CTA anchored at the seam of the split hero; the heavy bold sans used at every scale from wordmark to body.\nRole rules: only one accent colour on the page, no secondary; split-hero panels always paired (texture + use-case), never texture alone; sustainability copy never demoted below headline-weight type.\nMedia strategy: photo:unsplash — macro texture photography paired with candid outdoor lifestyle photography; both graded to the same neutral warm palette so the split reads as one image.\nReject: a second accent colour; a conventional single-image hero in place of the split; a separate swatch-grid page instead of inline colour dots; sustainability claims demoted to fine print.\nToken commitments: brand-blue `#1E9FE0`, cream `#E4DCC8`, black `#000000`, white `#FFFFFF`, blanket-terracotta `#B5522E`; heavy bold sans for all type, no serif anywhere."}, "has_extract": true}, {"slug": "garden-eight", "title": "Garden Eight", "url": "https://garden-eight.com/", "captured": "2026-09-04", "family": "monumental-parchment-gallery", "dna": "Museum wall-text typography x floating biomorphic cream sculpture", "register": "editorial print", "grammar": "typographic poster", "lane": "A warm parchment canvas at near-museum gutter width holds a single 215px headline against floating cream-toned 3D sculptural forms, with nothing else above the fold — one typographic moment, one sculptural moment, separated by silence", "mode": "portfolio", "traits": ["215px display at 0.77-1.30 leading", "\"binary two-tone palette", "no accent\"", "\"1440px pill or 30px card", "nothing between\"", "180px gallery-scale gutters", "biomorphic cream 3D forms as sole imagery", "\"zero UI shadow", "only the sculpture casts one\""], "palette": ["#dbd6d0", "#1e1f1f", "#000000"], "type": ["Lausanne", "Gunsan"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://garden-eight.com/", "has_image": true, "img": "../design-catalogue/entries/garden-eight/fold.webp", "full": "../design-catalogue/entries/garden-eight/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens. The system commits to a\ngenuinely binary palette — parchment `#dbd6d0` and carbon ink `#1e1f1f`, nothing\nelse, ever — and re-routes every signal a typical interface would encode in colour\n(hover, active, emphasis) into weight, scale, or a border instead. That single\nconstraint is what keeps a studio homepage reading like a gallery wall rather than\na product.\n\nTwo display voices share the same monumental 215px size but oppose each other in\nweight and leading: Gunsan at 600 with an extremely tight 0.77 line-height reads as\na magazine cover, while Lausanne at 200 with 1.30 leading reads as whisper-weight\nexhibition text. Because both live at the identical size, the choice between them\nis purely a register decision, not a scale decision — the page either shouts or\nmurmurs, never something in between, and there is no intermediate heading tier at\nall (the type scale jumps straight from 12-15px reading size to 215px monument\nsize).\n\nRadius carries the same binary discipline as colour and type: every bordered\ninteractive element is a 1440px true pill, and 30px is the only other permitted\nradius, reserved for cards and image containers. The one place the system allows\nitself a shadow is the floating biomorphic 3D sculptural forms — soft, cream-toned,\norganic shapes that are the sole imagery mode and the only thing in the system with\nliteral depth, deliberately set apart from the flat, shadowless UI around them.", "What to borrow (principle)": "- **Enforce a genuinely binary palette.** Two tones only, with every UI state\n  re-encoded in weight/scale/border, produces a calmer, more confident register\n  than even a \"restrained\" three- or four-colour system.\n- **Give one size two opposing voices.** Running the identical display size at a\n  heavy tight weight and a whisper light weight turns a single scale value into\n  two distinct instruments.\n- **Skip the intermediate heading tier entirely.** Jumping straight from reading\n  size to monument size (no 24/32/48px steps) is what makes the \"poster, not\n  page\" reading hold.\n- **Reserve radius for exactly two jobs.** Pill for every interactive/bordered\n  element, one mid-radius for cards/images, nothing between — an easy rule to\n  audit visually.\n- **Let only the \"real\" 3D object cast a shadow.** Confining elevation to a single\n  imagery type keeps the rest of the UI legibly flat by contrast.", "What to leave": "- A 215px minimum display size with \"if it doesn't fit, the layout is wrong\" is\n  an extremely high floor — it demands short, poster-length headline copy and\n  will not accommodate a typical multi-line marketing sentence.\n- 180px horizontal gutters are a genuinely spacious, low-density choice that\n  only reads as \"gallery\" rather than \"empty\" at large viewport widths; it will\n  collapse awkwardly without a deliberate mobile rethink.\n- Zero functional colour (no error red, no success green) is a real gap for\n  anything beyond a static portfolio — a studio adding a contact form or booking\n  flow will need to invent a convention this system doesn't provide.", "Signature move": "The two-display-voice system at identical size: the same 215px scale rendered\neither in Gunsan 600 at 0.77 leading (a magazine-cover shout) or Lausanne 200 at\n1.30 leading (gallery wall-text whisper) — the choice between the two is the\npage's entire register vocabulary.", "Motion": "(from designlang extract) Feel reads as responsive, and the page is scroll-linked\n— there is in fact a well-developed motion system, contrary to the earlier \"no\ntokens\" read. A single ease-out curve, `cubic-bezier(0.32, 0.94, 0.6, 1)`, is\nused with unusual consistency (37 uses) across six duration tiers spanning\ninstant (50ms) micro-feedback up through a 1.4s long-form reveal — that wide\nrange, on one disciplined curve, corroborates the \"GARDEN ZERO\" loading sequence\nthe live capture caught mid-animation: a system built for both snappy UI\nfeedback and a slow, deliberate entrance sequence. (observed in capture) given\nthe \"binary palette, no shadow except on sculpture\" rule, hover states most\nlikely invert border/fill (as described for the pill button) rather than adding\nmovement, and the floating 3D forms plausibly drift or rotate slowly on the same\nlong-duration tier.\n\n| Token | Value | Easing |\n|---|---|---|\n| instant | 50ms | `cubic-bezier(0.32, 0.94, 0.6, 1)` |\n| xs | 100ms | `cubic-bezier(0.32, 0.94, 0.6, 1)` |\n| sm | 200ms | `cubic-bezier(0.32, 0.94, 0.6, 1)` |\n| md | 300ms | `cubic-bezier(0.32, 0.94, 0.6, 1)` |\n| lg | 600ms | `cubic-bezier(0.32, 0.94, 0.6, 1)` |\n| xxl (entrance) | 1.4s | `cubic-bezier(0.32, 0.94, 0.6, 1)` |", "Brief": "Build a design-studio homepage with museum-scale restraint. Canvas is parchment\n`#dbd6d0` everywhere, text is carbon ink `#1e1f1f` — no third colour, ever. Use\n180px horizontal gutters and no max-width container. Open on a single 215px\ndisplay headline (Gunsan 600 at 0.77 leading for a bold cover voice, or Lausanne\n200 at 1.30 leading for a whisper voice) with no supporting copy above the fold,\ncomposed against floating cream-toned biomorphic 3D sculptural forms that bleed to\nthe edges. A minimal transparent top bar carries the wordmark left and nav items\nright, all at 12px Lausanne 400 with wide tracking — no background, no sticky\nelevation. Every bordered interactive element (buttons, tags) is a 1440px pill\nwith a 1px border and no default fill; every card or image container uses a 30px\nradius and a 1px border, never a background fill or shadow. Keep body/caption text\nlocked to 12-15px — there is no intermediate heading size. Let one editorial\nspread occupy each screen, separated by 60px+ of silence rather than alternating\ncolour bands.", "Image recipe": "Abstract biomorphic 3D render of [SUBJECT] — soft, organic, matte-cream sculptural\nform (twisted ribbon, soft pod, melted geometry) in the same warm hue family as\nthe parchment canvas, subsurface-scattered lighting, no hard edges or mechanical\ngeometry, floating with a soft cast shadow, no environment or ground plane visible.", "Photo search": "Unsplash first, Pexels second.\n- \"abstract sculptural form cream studio render\"\n- \"organic 3D shape soft lighting minimal\"\n- \"biomorphic sculpture neutral background\"\n- \"matte clay abstract form studio photography\"", "Reference lock": "Primary reference/direction: Garden Eight — binary-palette museum-scale\ntypographic poster homepage, floating biomorphic cream sculpture.\nPreserve (3-5 traits): strictly binary palette (parchment `#dbd6d0` / carbon ink\n`#1e1f1f`), no third colour anywhere; 215px display type as the only heading size\nabove 15px, run either at Gunsan 600/0.77 leading or Lausanne 200/1.30 leading;\nradius limited to 1440px (interactive) or 30px (cards/images), nothing between;\nzero UI shadow — only the 3D sculptural forms carry elevation; 180px gutters with\nno max-width container.\nBorrow only (1-2): the AI/JA-style language toggle marked by underline only; the\nfloating circular scroll-indicator button.\nRole rules: no chromatic accent is ever introduced; body/caption text never\nexceeds 15px or drops below 12px; display headlines never scale down to fit —\nthe layout adjusts instead.\nMedia strategy: 3D render — abstract, cream-toned biomorphic sculptural forms\nonly; no photography, no human imagery, no lifestyle context, no flat illustration.\nReject: any third colour; box-shadow on UI components; corner radius outside\n{0, 30px, 1440px}; an intermediate heading size between 15px and 215px; a filled\ndefault state on bordered buttons.\nToken commitments: bg `#dbd6d0`, ink `#1e1f1f`, ink-hard `#000000`; display 215px\nat leading 0.77 (Gunsan 600) or 1.30 (Lausanne 200); body/caption 12-15px/leading\n1.5; radius 30px cards, 1440px pills; horizontal gutter 180px, section gap 60px."}, "has_extract": true}, {"slug": "geon", "title": "GEON", "url": "https://geon.au/", "captured": "2026-09-04", "family": "concrete-serif-civic", "dna": "Property monograph x civic development catalogue", "register": "warm photographic", "grammar": "gallery/catalog", "lane": "A warm mocha hero built from close-up architectural sculpture photography carries a mixed sans/serif-italic headline, drops into a tan info panel paired with an aerial photo, then opens into a full-bleed catalogue of developments", "mode": "persuade", "traits": ["warm mocha/tan grounds", "mixed bold-sans + serif-italic headline", "close-up architectural sculpture photography", "lowercase serif wordmark", "aerial dusk cityscape photo", "tan info panel beside photo pairing", "full-bleed development catalogue cards", "20-year tenure claim"], "palette": ["#8A7A6B", "#2E2B27", "#F3F0EA", "#FFFFFF", "#6C645C"], "type": ["Monument Grotesk", "GT Super Text"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "luxury-craft", "category2": "institutional", "origin": "raw-url", "extract": "ok", "source_url": "https://geon.au/", "has_image": true, "img": "../design-catalogue/entries/geon/fold.webp", "full": "../design-catalogue/entries/geon/shot.webp", "sections": {"Why it works": "The hero photograph isn't a building — it's a close, almost abstract crop of\ncurved concrete forms, cropped so tight it reads as sculpture before it reads as\narchitecture. That choice lets a property developer open on texture and warmth\nrather than a rendering, which is the more common (and more generic) move for\nthis category.\n\nThe headline mixes two registers in one line: \"SHAPING\" set bold and sans,\n\"EXTRAORDINARY\" set in a serif italic, both in caps. The pairing signals two\nclaims at once — the sans half says capability, the serif-italic half says\ncraft — without needing two separate taglines. \"FOR 20 YEARS\" underneath, small\nand tracked out, adds tenure as a quiet third claim.\n\nBelow the hero, the page shifts from atmosphere to substance in one move: a warm\ntan info panel sits directly beside an aerial dusk photograph of a real completed\ntower, so the reader gets mood first, then evidence, in adjacent blocks rather\nthan a long scroll between them. The developments section that follows treats\neach project as a catalogue entry — name, one-line pitch, \"explore\" link, full-\nbleed photo — which is the right grammar for a developer with a multi-project\npipeline.", "What to borrow (principle)": "", "What to leave": "- The lowercase serif wordmark is quiet to the point of being easy to miss against\n  a busy photographic hero — it needs more contrast or a fixed position to anchor\n  brand recognition on first load.\n- Warm mocha and near-black panels back to back risk muddiness if not given a\n  consistent light-source direction across images; the developments section reads\n  slightly darker/cooler than the hero without a clear reason.", "Signature move": "The mixed-register headline: one bold sans word, one serif-italic word, same\nsize, same line, both in caps — \"SHAPING\" then \"EXTRAORDINARY.\" It compresses two\nbrand claims (competence, craft) into a single visual unit instead of a tagline\nplus a sub-tagline.", "Motion": "(from designlang extract) Feel is tagged \"mechanical\" with scroll-linked\nmotion confirmed — an apt label: the two keyframes present are a plain\n`fadeIn`/`fadeOut` pair (opacity plus a 20px vertical shift, nothing more\nexpressive), and the dominant easing across the page is flat `linear` (38\nuses) rather than any eased curve, with a smaller `ease` group for colour\ntransitions. Duration climbs in a wide, evenly-spaced ladder from `200ms` up\nto `1.25s`, suggesting slower, deliberate reveals for the larger photographic\nblocks (hero, catalogue cards) and quicker ones for text/colour states —\nconsistent with a photography-led page that lets images settle in plainly\nrather than performing.\n\n| token | value | role |\n|---|---|---|\n| `sm`–`lg` | 200–500ms | UI/colour state changes |\n| `xl`/`xxl` | 850ms/1.25s | large photographic block reveals |\n| linear | `linear` | dominant (38 uses) — flat, mechanical settle |\n| ease-in-out | `ease` | secondary (3 uses) — colour transitions |", "Brief": "Build a warm, photography-led page for a multi-project property developer. Open\non a tightly cropped, almost abstract architectural or sculptural photograph in\nwarm mocha tones; set a two-word headline with one word bold sans and one word\nserif italic, both caps, plus a small tenure line beneath. Drop to a tan info\npanel paired directly beside a real project photo (aerial or exterior), with a\nshort paragraph and a \"learn more\" link. Continue into a full-bleed development\ncatalogue: each entry gets a name, one-line pitch, an \"explore\" action and a\nfull-width photo. Keep the wordmark small and lowercase-serif throughout.", "Image recipe": "A tight, almost-abstract crop of [SUBJECT] — curved or textured architectural\nconcrete, stone, or sculptural form — shot in warm late-afternoon or dusk light,\nshallow depth of field, no visible horizon or context, colour graded toward warm\nmocha and taupe.", "Photo search": "Unsplash first, Pexels second.\n- \"concrete sculpture close up warm light\"\n- \"architectural detail curved form shadow\"\n- \"aerial city dusk tower lights\"\n- \"modern glass building golden hour\"", "Reference lock": "Primary reference/direction: GEON — warm mocha property-developer page opening on abstract architectural photography, closing on a full-bleed development catalogue.\nPreserve (3-5 traits): tightly cropped, near-abstract architectural photography for the hero rather than a wide establishing shot; mixed bold-sans + serif-italic headline pairing for the primary claim; tan/mocha info panel placed directly beside a real project photo; each development treated as a catalogue entry (name, one line, action, full-bleed photo).\nBorrow only (1-2): the small tenure line (\"FOR 20 YEARS\") under the headline; the lowercase serif wordmark.\nRole rules: serif-italic reserved for exactly one word per headline, never full sentences; mocha/tan panels always paired with a photo, never standing alone; catalogue entries never carry more than one line of copy before the action link.\nMedia strategy: photo:unsplash — warm, tightly cropped architectural or sculptural detail for hero use; wider establishing/aerial shots reserved for the catalogue section only.\nReject: architectural render or CGI imagery in place of photography; a portfolio grid instead of a named catalogue; more than one accent typeface pairing per page.\nToken commitments: mocha `#8A7A6B`, charcoal `#2E2B27`, paper `#F3F0EA`, white `#FFFFFF`, sage `#5C6E63`; display sans for one headline word, serif italic for the other; wordmark lowercase serif, small and fixed."}, "has_extract": true}, {"slug": "gocanopy", "title": "GoCanopy", "url": "https://gocanopy.tech", "captured": "2026-09-04", "family": "teal-skyline-ai-saas", "dna": "Institutional real-estate skyline photography x teal AI-SaaS product system", "register": "modern clean", "grammar": "chaptered editorial", "lane": "A dusk city-skyline photograph carries a plain-serif headline and a play-to-preview product video, then the page steps through numbered process cards, a dark testimonial panel with monospace stat callouts, and a security-claims close", "mode": "persuade", "traits": ["dusk skyline photo hero with teal duotone overlay", "monospace tracked-out micro-labels", "click-to-play product video card", "numbered mint-green process cards", "dark testimonial panel with client photo", "monospace ticker-style stat callouts", "sticky announcement bar", "outline pill nav CTA"], "palette": ["#F6F5F3", "#00FFBB", "#14323A", "#5E7171", "#000000", "#979797", "#CECECE"], "type": ["Season Serif", "Season Sans", "Test Sohne Mono"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "product-focused", "category2": "institutional", "origin": "raw-url", "extract": "ok", "source_url": "https://gocanopy.tech", "has_image": true, "img": "../design-catalogue/entries/gocanopy/fold.webp", "full": "../design-catalogue/entries/gocanopy/shot.webp", "sections": {"Why it works": "The hero pairs a dusk skyline photograph — real estate's default authority\nimage — with a teal duotone treatment that immediately reads as \"AI product,\"\nnot \"real estate brochure,\" resolving the tension between an institutional\nsubject and a software pitch. A plain serif headline (\"From scattered data to\ninstitutional intelligence\") sits center-aligned over the skyline, restrained\nenough not to compete with the photo, while a small monospace pill above it\n(\"PURPOSE-BUILT FOR INSTITUTIONAL REAL ESTATE INVESTORS\") and another below\n(\"AI-NATIVE FROM DAY ONE\") bracket the claim in a completely different,\ntracked-out type register — monospace reads as \"system status,\" serif reads\nas \"the pitch,\" a split similar to Calyx's own serif/mono voice-versus-record\nconvention but applied to a B2B SaaS product instead of a craft brand.\n\nA click-to-play video card sits directly in the hero rather than an autoplay\nloop, giving the visitor control before committing to watch — a small\ncourtesy uncommon in this genre. Below the fold, a three-step process (Ingest\nand Structure / AI-Augmented Workflows / Compounded Intelligence) is laid out\nas large-numeral cards on a mint-green ground, breaking from the dark\nteal-on-photo hero into a much lighter, more didactic register for the\nexplanatory section — process needs clarity, not atmosphere.\n\nFurther down, the page returns to dark teal for a testimonial: a real client\nquote, attributed with name/title, paired with a monospace stat panel (a\ndollar-figure counter, a percentage) styled like a terminal readout rather\nthan a marketing infographic — reinforcing the \"AI-native,\" data-literal\npositioning established by the monospace hero labels. The page closes on a\nsecurity-claims list with small icons, addressing an institutional-investor\naudience's real objection (data sensitivity) directly rather than leaving it\nto a footer link.", "What to borrow (principle)": "- **Duotone a category-default photograph (skyline, office, etc.) in the\n  product's own accent colour** to pull a familiar authority image into a\n  software brand's palette without needing a bespoke hero image.\n- **Use a monospace face exclusively for system-status-style micro-labels**\n  (capability claims, live stats) against a serif or sans for the actual\n  argument — the contrast signals \"this is a data product,\" not a marketing\n  claim.\n- **Make hero video click-to-play, not autoplay**, when the video is\n  explanatory rather than purely atmospheric — respects the visitor's\n  choice to invest attention.\n- **Break from the hero's dark/photographic register into a light, plain\n  section for process explanation** — atmosphere and clarity are different\n  jobs and can use different visual registers.\n- **Address the audience's specific objection (security, compliance) as its\n  own named section**, not a footer afterthought, when selling to a\n  risk-sensitive institutional buyer.", "What to leave": "- A sticky announcement bar (\"GoCanopy announces our new fundraise\") sits\n  fixed at the very bottom of the viewport across every section in this\n  capture, permanently claiming a strip of vertical space.\n- The site uses a scroll-linked/smooth-scroll wrapper that made the page's\n  raw DOM height report far larger than its actual visible content during\n  capture — a reminder that heavily JS-animated scroll libraries can make a\n  page fragile to inspect or capture reliably, which is a real cost even if\n  invisible to a normal visitor.\n- Repeating the \"AI-native from day one\" tagline in multiple places (hero pill\n  and hero footer label) risks feeling repetitive on a careful read.", "Signature move": "Bracketing the hero headline with two small monospace, tracked-out labels —\none above stating the audience, one below stating the technology claim — so\nthe actual headline sentence is flanked by machine-voice metadata rather than\nsupported by subheading copy.", "Motion": "(from designlang extract) The extract rates overall feel \"responsive\" with\nconfirmed scroll-linked behaviour. Three duration steps (150/300/500ms) split\nbetween a standard material ease for colour changes and a more frequent\ndecelerate ease-out for transform/scale/rotate — no spring or bounce curve\nanywhere. No keyframe animations are defined in the stylesheet, so scroll\nreveals, if any, are transition-driven rather than keyframe-driven. The\nextract's component scan independently confirms the click-to-play hero video:\nan outline button variant carries the literal label \"Click to play,\" beside a\nprimary \"Download Executive Summary\" CTA — corroborating the non-autoplay\nchoice directly rather than leaving it as an image-only inference. (inferred\nfrom image) The page also uses a JS-driven smooth-scroll wrapper (inferred\nfrom capture artifacts where naive full-page screenshots initially produced a\nmismatched, oversized blank canvas), consistent with scroll-linked reveal or\nparallax effects beyond what the extract's static token scan captures.\n\n| kind | tokens |\n|---|---|\n| durations | xs 150ms · md 300ms · lg 500ms |\n| easings | custom `cubic-bezier(0.4, 0, 0.2, 1)` (8×) · ease-out `cubic-bezier(0, 0, 0.2, 1)` (16×) |", "Brief": "Build an institutional B2B SaaS product page on one category-default\nphotograph (skyline, office interior, etc.) treated in a duotone matching the\nproduct's accent colour, with a plain serif headline centred over it and\nclick-to-play (not autoplay) product video beneath. Bracket the headline with\nsmall monospace, tracked-out micro-labels — one naming the audience, one\nstating the core technology claim — to give the page a \"system status\" voice\ndistinct from the argument itself. Break from the dark photographic hero into\na light, plain section using large numeral cards for process explanation.\nReturn to a dark ground for a testimonial paired with monospace stat\ncallouts styled like a terminal readout. Close with a named security/trust\nsection addressing the audience's specific risk objection directly.", "Image recipe": "Photograph of [SUBJECT] — a city skyline at dusk or an institutional office\nenvironment — treated in a two-tone duotone matching the product's accent\ncolour (deep teal shadows, bright mint-green highlights), enough open sky or\nnegative space to place a centred headline without obscuring skyline detail.", "Photo search": "Unsplash first, Pexels second.\n- \"city skyline dusk aerial teal\"\n- \"financial district buildings evening light\"\n- \"downtown skyscrapers blue hour\"", "Reference lock": "Primary reference/direction: GoCanopy — duotone skyline hero with bracketing\nmonospace micro-labels, mint-green process cards, terminal-style testimonial\nstats.\nPreserve (3-5 traits): a category-default photograph duotoned in the\nproduct's accent colour for the hero; a plain serif headline bracketed above\nand below by small monospace tracked-out micro-labels; click-to-play (never\nautoplay) hero video; a light mint-green numbered-card section for process\nexplanation, breaking from the dark hero register; a named security/trust\nsection addressing the audience's specific risk objection.\nBorrow only (1-2): the outline pill \"Book a Demo\" CTA repeated in nav and\nhero; the terminal-style monospace stat callouts in the testimonial panel.\nRole rules: monospace type is reserved for micro-labels and stat callouts\nonly, never for headlines or body paragraphs; the dark teal duotone appears\nonly on photographic hero/testimonial sections, never as a flat background\nfor process/explanation content.\nMedia strategy: photo:unsplash — city skyline or institutional office\nphotography, always duotoned to the product's accent colour rather than used\nin natural colour.\nReject: autoplay hero video; a security/trust claim relegated to a footer\nlink; monospace type used for body paragraphs or headlines.\nToken commitments: deep-teal `#192C31`, mint-accent `#24E6B3`, teal-mid\n`#354A4B`, teal-soft `#5E7171`, stone `#A7A6A7`, stone-light `#C3C6C6`;\nheadline serif, UI/body sans, micro-label/stat monospace."}, "has_extract": true}, {"slug": "gorving", "title": "Go RVing Canada", "url": "https://gorving.ca", "captured": "2026-09-04", "family": "outdoor-slab-poster", "dna": "Documentary RV-lifestyle photography x oversized slab-caps poster type", "register": "warm photographic", "grammar": "rhythmic cutlist", "lane": "A dark full-bleed family-camping photo carries three huge word-fragments (FIND / YOUR / WILDHOOD) across it, then the page drops into sage-green beginner/expert panels and a stacked FIND-IT/DRIVE-IT/TOW-IT photo sequence", "mode": "persuade", "traits": ["full-bleed documentary lifestyle photo hero", "oversized slab-caps split across the image", "single orange accent CTA", "sage green content panels", "wavy connector line between thumbnail cards", "labelled photo tiles with arrow chevron", "diagonal photo-crop hero divider"], "palette": ["#FB6C41", "#B0B7AB", "#1E1E17", "#444539", "#8A918D", "#322A19"], "type": ["condensed slab sans (display)", "grotesque sans (UI/body)"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "consumer-brand", "category2": "hospitality", "origin": "raw-url", "extract": "failed: cloudflare interstitial (bot block), motion inferred from image", "source_url": "https://gorving.ca", "has_image": true, "img": "../design-catalogue/entries/gorving/fold.webp", "full": "../design-catalogue/entries/gorving/shot.webp", "sections": {"Why it works": "The hero sentence \"FIND YOUR WILDHOOD\" is split into three oversized\nslab-caps fragments and scattered across a single documentary photograph — a\nfather carrying a baby beside a parked RV, mountains behind — rather than set\nas one headline block. Each word sits in open sky or negative space in the\nphoto, so the huge type never competes with the family subject; it reads as\nenvironmental graphics painted onto the landscape, not text laid over a\npicture. A diagonal crop cuts across the top-right corner of the hero image,\nbreaking the rectangle just enough to feel art-directed rather than a plain\nphoto box.\n\nBelow the fold the page switches to a flat sage-green ground and a completely\ndifferent rhythm: labelled photo tiles (\"Find Your RV Match,\" \"Find a Dealer\")\nconnected by a thin wavy orange line threading beginner-path cards to\nexpert-path cards, turning a simple two-column list into a visual \"journey\"\nmetaphor without needing an literal roadmap illustration. Further down, the\npage returns to full-bleed dark photography for a \"Drive It / Tow It\" pairing,\neach with the same slab-caps treatment — so the poster-type hero device\nrecurs as a section marker throughout the page rather than a one-time hero\ntrick.\n\nColour discipline carries the persuasion: one warm orange accent (buttons, the\nconnector line, a small chevron pointer) against near-black photography and\nsage-neutral panels. Nothing else competes for the eye, so the orange reads\ninstantly as \"the next step.\"", "What to borrow (principle)": "- **Split a headline into environmental fragments placed in the empty parts of\n  a photograph** rather than stacking it as one block — the type becomes part\n  of the scene instead of sitting on top of it.\n- **Use a single accent colour as a wayfinding thread** — a thin coloured line\n  connecting related cards does the job of an illustrated map with far less\n  production.\n- **Repeat the poster-type-over-photo device as a section marker** throughout\n  the page, not just in the hero, so the identity stays legible on scroll.\n- **Break one hero rectangle with a diagonal crop** to signal \"designed,\" not\n  \"stock photo dropped in a box.\"", "What to leave": "- Splitting the headline across the photo depends entirely on there being\n  empty sky/ground in the right spots — this composition doesn't transfer to a\n  busier photograph without reshooting or heavy cropping.\n- The wavy connector line pattern, applied at real width, risks looking twee\n  if used more than once per page.\n- This entry's capture came from the raw screenshot only — the live site\n  blocked automated Playwright access (Cloudflare, HTTP 403) — so no below-fold\n  states beyond what the single raw image shows were verified live.", "Signature move": "The headline \"FIND YOUR WILDHOOD\" broken into three oversized slab-caps\nfragments and dropped into the empty sky/ground pockets of one documentary\nphotograph, rather than set as a single block over or beside the image.", "Motion": "(inferred from image) No usable extract — the designlang run against\ngorving.ca hit the same Cloudflare \"Attention Required\" interstitial that\nblocked the earlier Playwright capture, so `gorving-ca-design-language.md`\ndescribes that challenge page rather than the live site; its motion tokens\n(a lone 150ms duration on a \"mixed\" feel) belong to Cloudflare's block page,\nnot this brand, and are not used here. The layered hero (foreground family\nsubject, midground type, background mountains) and the wavy connector line\nbetween cards suggest parallax-style scroll movement and a drawn/animated SVG\npath is plausible, but this remains inferred from the static composition\nonly, not observed live.", "Brief": "Build an outdoor-lifestyle hero on one full-bleed documentary photograph with\nreal people and real gear, no studio staging. Break the headline into two or\nthree oversized slab-caps fragments and place each one in an empty pocket of\nthe photograph (sky, ground, negative space) rather than as a single text\nblock. Crop one corner of the hero diagonally to avoid a plain rectangle.\nChoose a single warm accent colour and use it exclusively — for CTA buttons, a\nthin connector line threading related content cards together, and any pointer\nchevrons. Ground supporting sections in a flat sage-neutral panel colour, and\nreturn to full-bleed dark photography with the same slab-caps treatment as a\nrecurring section marker further down the page.", "Image recipe": "Documentary lifestyle photograph of [SUBJECT] in an outdoor/camping setting,\nnatural daylight, real people captured mid-activity rather than posed, RV or\ncamping gear visible but not the focus, mountain or forest backdrop, warm but\nslightly desaturated colour grading, enough open sky or ground to place large\ndisplay type without obscuring the subject.", "Photo search": "Unsplash first, Pexels second.\n- \"family camping rv mountains candid\"\n- \"rv parked mountain landscape golden hour\"\n- \"van life outdoor lifestyle documentary\"\n- \"camping trip family outdoors candid\"", "Reference lock": "Primary reference/direction: Go RVing Canada — poster-type fragments placed\ninto a documentary photograph, single orange accent as wayfinding thread.\nPreserve (3-5 traits): headline broken into oversized slab-caps fragments\nplaced in the photo's own negative space, never stacked as one block; a single\naccent colour used only for CTAs, connector lines and pointers; a diagonal\ncrop breaking at least one hero-image rectangle; the poster-type-over-photo\ndevice repeated as a section marker further down the page; sage-neutral flat\npanels separating photographic sections.\nBorrow only (1-2): the wavy connector line between related cards; the\ndownward chevron scroll cue in the hero.\nRole rules: display slab-caps only ever appears over photography, never on a\nflat panel; the accent colour never fills a large area, only lines, buttons\nand small marks.\nMedia strategy: photo:unsplash — documentary, real-people outdoor/camping\nphotography only; no studio product renders of the vehicles themselves in\nhero-scale placements.\nReject: a single stacked headline block over the hero photo; more than one\naccent colour; a literal illustrated map in place of the connector-line\ndevice.\nToken commitments: accent-orange `#FB6C41`, sage `#B0B7AB`, ink `#1E1E17`,\nink-soft `#322A19`, stone `#444539`, stone-light `#8A918D`; display a\ncondensed slab/grotesque caps face, body a plain grotesque."}, "has_extract": true}, {"slug": "graft", "title": "Graft (furniture studio template)", "url": "https://graft.framer.website/", "captured": "2026-09-04", "family": "inline-thumbnail-catalog", "dna": "Warm interior photography x inline circular product thumbnails", "register": "warm photographic", "grammar": "gallery/catalog", "lane": "A warm interior photograph carries a giant lowercase wordmark and a small provenance address, then a cream category list where circular product thumbnails interrupt mid-sentence", "mode": "persuade", "traits": ["warm interior hero photo", "giant lowercase wordmark overlaid on photo", "small provenance address line", "floating product thumbnail card", "numbered footer nav", "cream category section", "inline circular thumbnails mid-word", "large stacked type list"], "palette": ["#B08554", "#F4EEE3", "#2B2620", "#FBF9F5", "#8C7A5E"], "type": ["Inter"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "luxury-craft", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://graft.framer.website/", "has_image": true, "img": "../design-catalogue/entries/graft/fold.webp", "full": "../design-catalogue/entries/graft/shot.webp", "sections": {"Why it works": "The hero is a single warm, styled interior photograph — rattan lamp, wood\npanelling, a low sofa — with the studio's giant lowercase wordmark (\"Graft\")\nset directly onto it at the bottom-left, large enough to read as part of the\nroom rather than a logo pasted over it. A small provenance line (\"Strada di\nMontegiano 42, 60030 Marche, Italia\") sits in the header, doing the \"this is a\nreal atelier, not a marketplace\" work in eight words.\n\nThe mission line — \"We don't make mass furniture. We make tables where kids will\ngrow up.\" — is placed top-right, small, plain-set, deliberately underplayed\nagainst the giant wordmark. It's the kind of claim that would usually anchor a\nwhole hero; here it's treated as a caption, which paradoxically makes it read\nas more sincere.\n\nBelow the fold, the category list is the real signature: \"Sofas / Sidetables /\nChairs / Tables / Dressing Room / Beds\" set in huge stacked type, with a small\ncircular product photo dropped inline mid-word for several of the entries. It\nturns a plain text navigation list into a browsable catalogue without a grid,\nletting typography and thumbnail share one line.", "What to borrow (principle)": "- **Set the wordmark directly into the hero photograph at scale**, large enough\n  to feel like part of the room rather than a logo overlay.\n- **Underplay your mission statement** — small, plain, captioned rather than\n  hero-sized — so it reads as sincerity rather than marketing copy.\n- **Drop a small circular product photo inline within a large type list**,\n  turning a plain category index into a browsable, photographic one without\n  building a grid.\n- **State a provenance address in the header** as a quiet craft/authenticity\n  signal for a maker brand.", "What to leave": "- Interrupting large display type with an inline circular thumbnail can hurt\n  legibility at smaller viewport widths — it needs a clear fallback (thumbnail\n  drops below the word) rather than breaking the line awkwardly.\n- The footer nav row (\"01 / Our works / Inspiration / Use for free\") mixes a\n  page-index numeral with a template-marketplace CTA (\"Use for free\") — a\n  giveaway that this is demo content, worth stripping before shipping.", "Signature move": "The inline circular thumbnail interrupting large stacked type: a category word\nlike \"Sidetables\" or \"Tables\" gets a small round product photo dropped directly\ninto the letterforms, so the huge type list doubles as a photographic index\nwithout ever becoming a conventional grid.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed,\nbut the captured CSS carries almost nothing concrete — no duration tokens, no\neasing families, and no content keyframes beyond a generic loading spinner;\nonly a bare `transition: all` and a `background, box-shadow` hover rule are\npresent. As with the giant-wordmark hero and inline thumbnails, the page's\nreal reveals are almost certainly driven by Framer's inline whileInView\nanimation rather than static CSS, so the hover-swap read on the inline\nthumbnails stays inferred, not confirmed by the extract.", "Brief": "Build a warm-photography furniture-atelier page. Open on one full-bleed styled\ninterior photograph with the studio wordmark set directly into it at giant\nlowercase scale, a small provenance address in the header, and a plainly-set\none-line mission statement placed as a caption rather than a headline. Below the\nfold, on a cream ground, list product categories in very large stacked type,\ndropping a small circular product photo inline within two or three of the\nwords. Keep the whole page to warm wood, cream and near-black ink, no additional\naccent colour.", "Image recipe": "A warm, styled interior of [SUBJECT] — natural wood tones, soft directional\nwindow light, one or two considered objects (a lamp, a vase, a woven basket),\nshot at a slight angle into the room rather than head-on, colour graded warm\nand slightly desaturated.", "Photo search": "Unsplash first, Pexels second.\n- \"warm wood interior living room natural light\"\n- \"rattan lamp wood cabinetry styled interior\"\n- \"handmade furniture workshop warm tones\"", "Reference lock": "Primary reference/direction: Graft — giant wordmark set into a warm interior photograph, category list interrupted by inline circular product thumbnails.\nPreserve (3-5 traits): wordmark set at giant scale directly into the hero photograph rather than overlaid as a logo; mission statement underplayed as a small caption, not a headline; provenance address stated plainly in the header; large stacked category type with inline circular product thumbnails replacing a conventional grid.\nBorrow only (1-2): the numbered footer nav row; the floating \"featured work\" thumbnail card.\nRole rules: wordmark appears at giant scale exactly once per page (the hero); inline thumbnails limited to 2-3 words per category list, never every line; no accent colour beyond warm wood and cream tones.\nMedia strategy: photo:unsplash — warm, styled, natural-light interior photography only; product thumbnails may be studio-lit but must match the hero's warm colour grade.\nReject: a conventional product grid replacing the inline-thumbnail type list; a bold hero mission statement competing with the wordmark; cool-toned or white-background product photography breaking the warm palette.\nToken commitments: wood `#B08554`, cream `#F4EEE3`, ink `#2B2620`, paper `#FBF9F5`, taupe `#8C7A5E`; rounded sans for wordmark and body, wordmark set lowercase at giant scale."}, "has_extract": true}, {"slug": "groupemontoni", "title": "Groupe Montoni", "url": "https://groupemontoni.com", "captured": "2026-09-04", "family": "aerial-drone-wordmark", "dna": "Live aerial drone footage x centred serif wordmark, live inventory counters", "register": "cinematic dark", "grammar": "filmic one-shot", "lane": "A full-bleed aerial drone video of the firm's own developments carries a huge centred serif wordmark and live space/careers counters, then the page runs a dark grid of project cards and a multicolour ESG-claim mosaic", "mode": "persuade", "traits": ["full-bleed aerial drone video hero", "centred serif wordmark over footage", "live inventory counters in nav (spaces/careers)", "dark project card grid with caption overlays", "multicolour ESG claim tile mosaic", "bilingual FR/EN toggle", "editorial serif for stat claims"], "palette": ["#EFEEE1", "#0D0D0D", "#B99C6A", "#123F4E", "#BFBDB9", "#717372", "#3D3533", "#A39F9D"], "type": ["fkroman", "studiopro"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "institutional", "category2": "portfolio", "origin": "raw-url", "extract": "ok", "source_url": "https://groupemontoni.com", "has_image": true, "img": "../design-catalogue/entries/groupemontoni/fold.webp", "full": "../design-catalogue/entries/groupemontoni/shot.webp", "sections": {"Why it works": "The hero is drone footage of the developer's own real estate, not stock\naerial photography — the two captures taken weeks apart show completely\ndifferent seasons (autumn foliage vs. snow cover) over the same buildings,\nconfirming this is either live/rotating footage of actual sites or a\nfrequently refreshed asset either way, it is the company's real portfolio\nshown at city scale. A single-weight serif wordmark, MONTONI, sits centred\nand large directly on the footage with no background treatment, legible\npurely because the display size and letter-spacing exceed the busiest parts\nof the image below it. The nav carries live counters — \"Available spaces 31,\"\n\"Careers 12\" — turning what could be static menu items into a real-time signal\nthat the business is active.\n\nBelow the fold, dark full-bleed project cards use a consistent caption\npattern: project name, one-line description, and a text link, layered over\nphotography with a soft dark gradient at the bottom edge only — enough for\nlegibility without an overlay across the whole image. Further down, the ESG\nsection breaks into a tiled mosaic of flat colour panels (cream, forest green,\ndeep teal, olive, stone), each carrying one concrete, numbered claim (\"Over\n35% reduction in energy costs...\", \"The first company to construct a LEED®\nGold-certified industrial building in Québec\") set in the same serif as the\nwordmark. Claims are specific and sourced (a footnote citation appears under\nthe energy-cost claim), which is the opposite of Areto's unattributed\npercentage stats — the same visual pattern, done with real substance behind\nit.\n\nThe extract shows the page's true ground colour is a warm cream (`#efeee1`,\nby far the most-used colour on the page) rather than pure white or near-black,\nwith a muted gold (`#b99c6a`) and deep teal (`#123f4e`) doing quiet accent\nwork in text and borders — the ink-on-photography read above holds, but the\nresting state of the page is warmer and more coloured than a black/white\nread would suggest.", "What to borrow (principle)": "- **Use real drone/aerial footage of the company's own assets for the hero**,\n  not stock — it's a stronger authority signal than any photography a stock\n  library could offer, and it's honest.\n- **Put a live operational number in the nav** (open positions, available\n  inventory) to signal an active business without a dedicated \"About\" claim.\n- **Cite the source next to every stat claim** (\"*for LEED®-certified\n  buildings\") — turns a persuasive number into a credible one.\n- **Tile ESG/values claims as flat colour panels of varying hue**, one claim\n  per panel, rather than a uniform icon-plus-text list — the colour variation\n  keeps a normally dry section visually alive.\n- **Layer only a soft bottom-edge gradient on photographic cards**, not a\n  full-image overlay, to keep captions legible while preserving photo clarity.", "What to leave": "- A wordmark set directly on drone footage depends on there being enough open\n  sky/rooftop in the frame at the point of capture — this composition is\n  fragile if the footage changes.\n- The multicolour ESG mosaic uses five distinct hues in one section; without\n  the shared serif and consistent card proportions holding it together, this\n  many colours in one view could read as scattered rather than intentional.", "Signature move": "Live inventory counters built directly into the primary navigation —\n\"Available spaces 31,\" \"Careers 12\" — turning menu items into real-time proof\nthat the business is operating at the scale its drone footage implies.", "Motion": "(from designlang extract) The extract rates overall feel \"mixed\" with\nconfirmed scroll-linked behaviour. Duration steps run from 150ms up to a full\n1000ms, split between a dominant standard-material custom ease\n(`cubic-bezier(0.4, 0, 0.2, 1)`, 18 uses) and a slower ease-out\n(`cubic-bezier(0.19, 1, 0.22, 1)`, 5 uses) for larger transforms. Three\nkeyframes are defined: horizontal and vertical marquee loops (each a\ncontinuous `translate`/`translateY` to `-100% - gap`) and a `spin` rotator.\nThe horizontal marquee is a plausible mechanism for a scrolling brand/logo\nstrip or the live counter display; the vertical variant suggests at least one\nsection scrolls content continuously rather than on a fixed reveal.\n(observed in capture) The hero is confirmed to be video or a rotating\nasset — raw and fresh captures of the same wordmark placement show entirely\ndifferent seasons over the same buildings. Live counter values also differ\nbetween captures (28→31 spaces, 15→12 careers), confirming the nav numbers\nare real-time/frequently updated data, not static copy.\n\n| kind | tokens |\n|---|---|\n| durations | xs 150ms · lg 500ms · xl 1000ms |\n| easings | custom `cubic-bezier(0.4, 0, 0.2, 1)` (18×) · ease-out `cubic-bezier(0.19, 1, 0.22, 1)` (5×) · linear (2×) |\n| keyframes | marquee (horizontal) · marqueeVertical · spin |", "Brief": "Build an institutional real-estate/developer site on full-bleed aerial or\ndrone footage of the company's actual portfolio, with a single large serif\nwordmark set centred directly on the footage — no scrim needed if the frame\nhas enough open ground/sky. Put one or two live operational numbers (open\npositions, available inventory) directly in the primary nav rather than\nburying them in a stats section. Below the fold, run a dark grid of project\ncards with a soft bottom-edge gradient only (not a full overlay) under\ncaption text. For a values/ESG section, tile concrete, sourced claims as flat\ncolour panels in varying hues, one claim per panel, in the same serif as the\nwordmark — always cite the basis for any percentage or superlative claim.", "Image recipe": "Aerial drone photograph or video of [SUBJECT] — a real estate development or\nindustrial/commercial property — shot from directly overhead or at a steep\noblique angle, natural daylight appropriate to the season, enough open\nrooftop/ground/sky area to place large centred type without obscuring\narchitectural detail, real (not rendered) footage of an actual asset.", "Photo search": "Unsplash first, Pexels second.\n- \"aerial drone industrial building rooftop\"\n- \"aerial view commercial real estate development\"\n- \"drone shot city development winter\"\n- \"office lobby corporate walking candid\"", "Reference lock": "Primary reference/direction: Groupe Montoni — aerial drone hero with centred\nwordmark, live nav counters, sourced ESG claim mosaic.\nPreserve (3-5 traits): full-bleed real aerial/drone footage of the company's\nown assets carrying a centred serif wordmark with no scrim; one or two live\noperational numbers built into the primary nav; project cards with a\nsoft bottom-edge-only gradient under captions, never a full-image overlay;\nESG/values claims tiled as flat colour panels, one claim per panel, always\nciting their basis; one serif for wordmark and all stat/claim copy.\nBorrow only (1-2): the bilingual FR/EN nav toggle; the hamburger \"Menu\" label\npaired with text rather than an icon alone.\nRole rules: any percentage or superlative claim must carry a source citation\nin the same section; the wordmark is set on photography/footage only, never\non a flat panel.\nMedia strategy: aerial/drone footage of real, owned assets for the hero and\nproject cards; documentary (not posed) photography for people/culture\nsections.\nReject: unsourced percentage stats; a full-image dark overlay across\nphotographic cards; stock aerial photography in place of real asset footage.\nToken commitments: ink `#0D0D0D`, stone `#BFBDB9`, stone-mid `#717372`,\nink-soft `#3D3533`, paper `#E2E2D6`, stone-light `#A39F9D`; display/stat serif\n\"fkroman\", body/UI \"studiopro\"."}, "has_extract": true}, {"slug": "halston", "title": "Halston (architecture template)", "url": "https://halston-architecture-template.webflow.io/", "captured": "2026-09-04", "family": "stone-ledger-atelier", "dna": "Architect portrait photography x achievement ledger rows", "register": "editorial print", "grammar": "chaptered editorial", "lane": "A stone-grey ground opens on a two-line all-caps claim, drops into a full-bleed portrait of the architect at work with the wordmark overlaid, then a ruled ledger of achievement statistics", "mode": "persuade", "traits": ["stone-grey ground", "two-line all-caps headline", "small vertical service list", "giant wordmark overlaid on portrait photo", "recognition/award tag", "ruled achievement stat rows with thumbnails", "warm interior/portrait photography", "red accent CTA"], "palette": ["#C9C4BA", "#6B4A33", "#EDE8DD", "#201C18", "#9B2E22"], "type": ["General Sans"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://halston-architecture-template.webflow.io/", "has_image": true, "img": "../design-catalogue/entries/halston/fold.webp", "full": "../design-catalogue/entries/halston/shot.webp", "sections": {"Why it works": "The page opens with restraint before it opens with a photo: a stone-grey band\ncarries a two-line all-caps claim (\"BESPOKE LIVING DEFINED BY CLARITY\"), a\nshort vertical service list (Architecture / Interior Design / Renovation), and\na small \"Recognition — DAM Preis 2026\" tag, all in plain type with no imagery.\nOnly after that quiet statement does the page drop into a full-bleed portrait\nof the architect at his desk, with the studio's wordmark set giant across the\nbottom of the photograph.\n\nPutting the founder's portrait in the hero, rather than a finished building,\nreframes the whole studio around a person rather than a product — the desk, the\nsketches, the plant, the warm light all read as \"here is who makes the\ndecisions,\" which is a different trust claim than a glossy exterior shot would\nmake.\n\nThe achievement section is the page's ledger: five stats (`96% Satisfaction`,\n`48+ Awards`, `2012 Since`, `180+ Projects`, `12 Countries`) each get their own\nruled row with a small project thumbnail, so the numbers aren't a bare stat\nstrip — every claim is anchored to a piece of visible work. It reads like a\nfirm's own internal scorecard made public.", "What to borrow (principle)": "- **State your headline claim in plain type before showing any photography** —\n  a text-only opening beat lets the claim land without competing with an image.\n- **Use a portrait of the person, not the product, as your hero photo** when the\n  studio's decision-maker is part of the sell.\n- **Overlay the wordmark at giant scale on the hero photograph** rather than in\n  a fixed header, so the name and the image read as one composition.\n- **Pair every achievement statistic with a small thumbnail of real work**,\n  never a bare number, so each claim has visible evidence beside it.", "What to leave": "- A \"Recognition\" tag naming a single, fairly generic-sounding award (\"DAM Preis\n  2026\") without context or a link reads as filler credibility rather than\n  earned credibility — it needs a real, checkable reference.\n- Five achievement stats in a row risks numeric fatigue; the strongest two or\n  three (Awards, Projects) would carry more weight isolated than diluted among\n  five.", "Signature move": "The portrait-as-hero with the wordmark overlaid: rather than a finished\nbuilding or an abstract texture, the founder at his desk — sketches, warm lamp\nlight, a stool, a laptop — becomes the full-bleed hero image, with the studio\nname set giant across the bottom third.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed.\nThe captured transitions are quick and plain — `200ms` colour, background and\nborder-colour changes on hover states, no eased curves beyond the default —\nplus one `1ms` allow-discrete overflow transition (a framework artifact, not\ncontent motion). Only one keyframe exists, a generic loading spinner. That\nthinness reads consistent with the entry's \"text-first, then one photograph\"\nstructure: little UI needs animating, so what the extract captures is state\ntransitions (link/button colour on hover) rather than the staggered ledger\nreveal the layout implies, which — if present — is likely driven by\nscroll-triggered JS the static extract can't see.\n\n| token | value | role |\n|---|---|---|\n| `instant` | 1ms | framework overflow transition |\n| `sm` | 200ms | hover/colour state changes |", "Brief": "Build a stone-grey architecture-studio page anchored by the founder's portrait.\nOpen on a text-only band: a two-line all-caps claim, a short vertical service\nlist, a small recognition tag and a CTA — no imagery yet. Drop into one\nfull-bleed portrait photograph of the founder at work, with the studio wordmark\nset giant across the bottom third and a small \"based in [city]\" tag in the\ncorner. Below, build a ruled achievement ledger: 3-5 stat rows, each paired\nwith a small thumbnail of real project work, dividers between rows. Keep the\npalette to stone, warm brown and near-black ink, one small red accent for the\nprimary CTA only.", "Image recipe": "A documentary portrait of a person at [SUBJECT] — a considered desk with warm\nlamp light, sketches, natural materials nearby (wood, paper, plants), shot at\na candid three-quarter angle, warm neutral colour grade, shallow depth of field\nkeeping the subject and immediate desk sharp.", "Photo search": "Unsplash first, Pexels second.\n- \"architect desk sketching warm light portrait\"\n- \"designer studio workspace candid documentary\"\n- \"creative professional at desk natural light\"", "Reference lock": "Primary reference/direction: Halston — text-first stone-grey opening beat, founder portrait as hero with wordmark overlaid, ruled achievement ledger with thumbnails.\nPreserve (3-5 traits): a text-only opening band (headline, service list, recognition tag) before any photography appears; the founder's portrait, not a building, as the full-bleed hero image; studio wordmark overlaid at giant scale on the hero photograph; every achievement statistic paired with a small thumbnail of real work.\nBorrow only (1-2): the \"based in [city]\" location tag; the small vertical service list.\nRole rules: red accent reserved for the primary CTA only, never body text or headings; achievement rows always paired with a thumbnail, never a bare number; wordmark overlay used once per page (the hero).\nMedia strategy: photo:unsplash — warm, candid, documentary portrait photography of a person at work; project thumbnails may be separate interior/exterior shots but must share the hero's warm colour grade.\nReject: a finished-building hero in place of the founder portrait; more than one accent colour; achievement stats presented as a bare number strip with no supporting thumbnail.\nToken commitments: stone `#C9C4BA`, warm-brown `#6B4A33`, paper `#EDE8DD`, ink `#201C18`, red-accent `#9B2E22`; `General Sans` for all type, headline in two-line all-caps."}, "has_extract": true}, {"slug": "happyrobot", "title": "HappyRobot", "url": "https://www.happyrobot.ai", "captured": "2026-09-04", "family": "cream-enterprise-serif", "dna": "Enterprise SaaS deck x quiet paper ledger", "register": "modern clean", "grammar": "chaptered editorial", "lane": "A cream, ledger-quiet enterprise pitch: serif display claims stacked over sans-serif proof — logo walls, paired stat cards, vertical photo grids — closing on a repeated dark-CTA banner", "mode": "persuade", "traits": ["cream paper ground", "old-style serif display", "small-caps sans kickers", "logo-wall social proof", "paired before/after stat cards", "muted industry photo grid", "tan announcement bar", "black pill CTAs"], "palette": ["#ECE8E3", "#B7B2AA", "#584736", "#1B1814", "#7F7D72"], "type": ["Tobias", "Suisse Intl"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "product-focused", "category2": "institutional", "origin": "raw-url", "extract": "ok", "source_url": "https://www.happyrobot.ai", "has_image": true, "img": "../design-catalogue/entries/happyrobot/fold.webp", "full": "../design-catalogue/entries/happyrobot/shot.webp", "sections": {"Why it works": "The page borrows the authority of print finance decks rather than SaaS marketing: an\nold-style serif (Tobias) carries every headline at a size and leading that would read\nnaturally in a shareholder letter, while a functional grotesque (Suisse Intl) carries\nevery other word — nav, body copy, labels, buttons. The split is total and load-bearing;\nbecause the serif never appears smaller than an H2, the reader always knows when the page\nis making a claim versus stating a fact.\n\nColour is almost entirely absent — a warm, slightly grey cream ground (`#ECE8E3`) and\nnear-black ink (`#1B1814`) do nearly all the work, so the one tan accent bar at the very\ntop and the black CTA pills read as genuinely rare, not decorative. Photography is kept\ndesaturated and cool (turbines, freight yards, ports) and boxed into a strict grid rather\nthan run full-bleed, which keeps the page reading as a document with illustrations, not a\nbrand film.\n\nProof is structured, not narrated: a dense logo wall, then a grid of industry photo tiles\nlabelled by vertical, then paired stat cards (\"70% reduction\" next to \"10% margin\nincrease\") set in the same small mono-weight caption style as everything else. Nothing is\noversized or centred for emphasis — the numbers earn attention by being the only bold,\nlarge glyphs against acres of quiet grey type, the same device the serif headlines use one\nlevel up.\n\nThe copy voice underneath the type system matches the same restraint: friendly in tone but\nwe-only in pronoun throughout, so the company stays the actor in every claim rather than\naddressing the reader directly (from designlang extract).", "What to borrow (principle)": "- **One serif for claims, one sans for everything else, no third voice.** The reader\n  learns the grammar in one screen and never has to re-parse a headline as a label.\n- **Spend colour on exactly one non-neutral element.** Here it's the top announcement bar\n  and the CTA pills; every other surface stays cream, grey, or near-black.\n- **Let proof be a grid, not a paragraph.** Logo walls and stat pairs, ruled and evenly\n  spaced, persuade an enterprise buyer faster than adjective-heavy copy.\n- **Desaturate photography toward the ink, not away from it.** Cool, muted industry\n  photos sit inside the same tonal range as the type, so images never fight the grid.\n- **Repeat the close, don't escalate it.** The final CTA restates the opening line in the\n  same serif/sans pair rather than introducing a new device.", "What to leave": "- The thin decorative line diagram behind the hero photo tiles — it reads as filler\n  geometry with no informational payload and competes with the headline for attention.\n- The cookie banner overlapping the primary CTA on first paint (observed in this capture,\n  locale-triggered) — worth designing around explicitly rather than leaving to the consent\n  library's default position.\n- Card backgrounds that shift from cream to a slightly darker taupe block with no other\n  signal for why (the \"we handle the work that matters most\" band) — the tonal jump reads\n  arbitrary rather than structural.", "Signature move": "The paired stat card: two numbers in the same weight and size, one framed as a cost/effort\nreduction and one as a gain, set side by side with no chart, just ruled whitespace and\nmono-caption labels underneath. It turns the page's restraint into the pitch itself — the\nnumbers don't need decoration because everything around them is already quiet.", "Motion": "Feel reads as mixed rather than a single house rhythm, and the page is scroll-linked:\nsections trigger their own enter animations as they cross the viewport instead of firing on\nload. Short micro-interactions (hover states, icon pops) run at 150-200ms while section and\ncard reveals stretch to 280-420ms. Three easing curves are in real use, all plain cubic\ndecelerate/accelerate curves with no spring or overshoot: a standard\n`cubic-bezier(0.4,0,0.2,1)` for generic property transitions, a snappier custom\n`cubic-bezier(0.33,0,0.15,1)` for transform-heavy moves, and a symmetric\n`cubic-bezier(0.65,0,0.35,1)` ease-in-out. The keyframe vocabulary is small and functional:\n`hero-enter` and `demoFadeIn` fade content up/down into place on entrance, `hr-blink` pulses\nopacity for a blinking-indicator effect, `hr-marquee`/`demoLogoMarquee` loop a horizontal\ntranslate to -50% for the scrolling logo wall, `hr-underline-sweep` wipes a link underline\nout then back in across a hover, and the generic Tailwind `enter`/`exit` pair plus two\nscale-pop keyframes (one with a fixed 45° rotate, one without) handle small icon/badge\npop-ins. No stagger or choreography pattern is documented beyond scroll-triggered section\nentry (from designlang extract).\n\n| token | value | used for |\n|---|---|---|\n| xs | 150ms | micro/hover transitions |\n| sm | 200ms | button, icon state changes |\n| md | 280ms | height/opacity reveals |\n| lg | 420ms | section/card entrances |\n| ease | `cubic-bezier(0.4,0,0.2,1)` | standard property transitions |\n| ease | `cubic-bezier(0.33,0,0.15,1)` | transform-heavy moves |\n| ease | `cubic-bezier(0.65,0,0.35,1)` | symmetric in-out |", "Brief": "Build a cream-paper enterprise pitch page for an AI/software product selling to large\nbuyers. Ground the whole page in a warm, slightly grey off-white (`#ECE8E3`) with near-\nblack ink (`#1B1814`); reserve colour for a single top announcement bar and black CTA\npills. Set every headline in an old-style serif at a size that reads like a pull-quote;\nset every label, nav item, button and body line in a functional grotesque, never mixing\nthe two roles. Open on a serif headline over a thin-line diagram or a single muted photo,\nwith a work-email capture field beside the CTA. Below the fold, alternate: a dense logo\nwall; a photo grid of use-case tiles labelled by vertical; paired stat cards with no\nchart, just numbers and mono captions; a single embedded product video in a dark frame.\nClose on a full-width dark or cream banner that restates the opening headline and repeats\nthe CTA.", "Image recipe": "Documentary industrial photograph of [SUBJECT] — logistics yards, freight, ports, energy\ninfrastructure — shot in overcast or blue-hour light, desaturated toward cool grey-blue,\nno people posed for camera, no gradient overlay, cropped tightly into a grid tile rather\nthan run full-bleed, contrast kept low so the photo reads as documentation, not a hero.", "Photo search": "Unsplash first, Pexels second.\n- \"freight yard overcast blue hour\"\n- \"wind turbines offshore muted\"\n- \"warehouse logistics workers documentary\"\n- \"shipping port cranes desaturated
