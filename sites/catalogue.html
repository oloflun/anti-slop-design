leading 0.9-1.3/-0.03 to -0.04em tracking; mono UI 10-20px/positive\ntracking; body Geist 17px/leading 1.4; radius 4-8px small, 18-40px cards/device,\n100000px pills; page max-width 1200px, section gap 80px."}, "has_extract": true}, {"slug": "nglm", "title": "NGLM", "url": "https://www.nglm.com", "captured": "2026-09-04", "family": "white-ground-holding-company", "dna": "Manifesto-scale grotesque headline x full-bleed portfolio-brand showcase panels", "register": "modern clean", "grammar": "gallery/catalog", "lane": "A near-empty white page states one manifesto headline and a founder portrait/quote, then the page becomes a sequence of full-bleed interior photographs each carrying one portfolio brand's wordmark, closing on a plain key-figures stat row", "mode": "read", "traits": ["oversized centred grotesque manifesto headline", "small centred founder portrait", "pull-quote with attribution", "full-bleed brand-showcase photo panels", "brand wordmark centred over each panel", "sidebar micro-labels (Companies/Information)", "plain numeral key-figures row", "cookie consent banner"], "palette": ["#FCFCFC", "#000000", "#51585C", "#C0C3C3", "#707575", "#131516", "#8D7C68", "#AB9F90"], "type": ["GD Trio Display", "GD Gaio VF"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "institutional", "category2": "portfolio", "origin": "raw-url", "extract": "ok", "source_url": "https://www.nglm.com", "has_image": true, "img": "../design-catalogue/entries/nglm/fold.webp", "full": "../design-catalogue/entries/nglm/shot.webp", "sections": {"Why it works": "The page opens with almost nothing on it: white ground, one manifesto-scale\nheadline in a high-contrast grotesque (\"BUILDING THE NEXT GENERATION OF DESIGN\nCOMPANIES\") centred alone, then a small founder portrait and a short\nattributed quote — no navigation clutter, no hero image competing with the\nstatement. For a design holding company whose product is other design\ncompanies, stating the thesis in plain oversized type before showing any of\nthe portfolio is the right order of operations: establish the idea, then the\nevidence.\n\nThe evidence arrives as a sequence of full-bleed interior photographs, one per\nportfolio brand, each with that brand's own wordmark set centred over the\nimage in a light display serif — \"DUSTY DECO\" over a warm dining-room\nphotograph, and so on. Small sidebar labels (\"Companies,\" \"Information\") sit\nat the panel's edges in tiny caps, functioning as museum wall-text rather than\nUI chrome. This turns the portfolio section into something closer to a\ngallery walk-through than a logo grid — each brand gets full-bleed\nphotographic space and one line of description before the reader moves to the\nnext.\n\nThe close is almost aggressively plain: \"Key Figures\" as three large numerals\n(7 brands, 1.8B SEK revenue, 51.2% growth) on white with small caption labels\nbeneath — no charts, no icons, just numbers set at headline scale. The\nrestraint at open and close brackets the one indulgence in the middle (the\nfull-bleed brand photography), giving the page a clear three-beat structure.", "What to borrow (principle)": "- **State the thesis in plain oversized type before any imagery**, especially\n  for a holding company or platform brand whose \"product\" isn't visually\n  obvious.\n- **Give each portfolio brand a full-bleed photographic moment with its own\n  wordmark**, rather than compressing a portfolio into a logo grid — it reads\n  as a gallery of real work, not a client-logo wall.\n- **Use tiny sidebar labels as wall-text**, not as active navigation — they\n  add context without adding visual weight.\n- **Close key metrics as bare numerals at headline scale**, with no\n  chart or icon — bold numbers read as more confident than any visualisation\n  of the same three data points.", "What to leave": "- The founder-portrait-plus-quote block, while restrained, is a common\n  \"trust\" device in this genre and doesn't differentiate the page — it works\n  here mainly because everything else is so quiet.\n- Full-bleed photography for every portfolio brand is a page-length-heavy\n  choice; it works for seven brands, would need reconsidering at twenty.\n- The cookie consent banner sits low-contrast (dark on dark) against the hero\n  in the captured state, briefly competing with the quote text above it.", "Signature move": "Each portfolio brand gets one full-bleed photographic panel with its own\nwordmark centred directly on the image — treating the portfolio section as a\nsequence of gallery rooms rather than a logo grid or card list.", "Motion": "(from designlang extract) The extract rates overall feel \"mixed\" with\nconfirmed scroll-linked behaviour. Two duration steps (300/450ms) carry a\nricher set of easing curves than the page's minimal visual vocabulary would\nsuggest — a dominant, pronounced ease-in-out family (95 uses, including\n`cubic-bezier(0.455, 0.03, 0.515, 0.955)`, close to an \"ease-in-out-quint\")\nalongside a lighter ease-out (40 uses). Only a generic `spin` loader keyframe\nis defined; the manifesto-to-gallery scroll structure appears to run on\ntransitions rather than bespoke keyframe choreography. The extract's\ncomponent scan also surfaces a Decline/Accept button pair — the cookie\nconsent banner noted in What to leave — confirming it as a real interactive\ncomponent. (inferred from image) No pinned, parallax or scroll-scrub\nbehaviour is otherwise evident from the fold/slice sequence; the page reads\nas simple stacked full-bleed sections.\n\n| kind | tokens |\n|---|---|\n| durations | md 300ms · lg 450ms |\n| easings | custom `cubic-bezier(0.455, 0.03, 0.515, 0.955)` / `cubic-bezier(0.515, 0.012, 0.25, 1)` / `cubic-bezier(0.645, 0.045, 0.355, 1)` (95×) · ease-out `cubic-bezier(0.165, 0.84, 0.44, 1)` / `cubic-bezier(0.215, 0.61, 0.355, 1)` (40×) |", "Brief": "Build a holding-company or platform-brand page that opens on almost nothing:\nwhite ground, one manifesto-scale headline in a high-contrast grotesque\nstating the company's thesis, centred alone with generous surrounding space.\nFollow with a small founder portrait and one short attributed quote. For the\nportfolio section, give each company or brand a full-bleed photographic panel\nwith its own wordmark set centred over the image in a light display serif,\nplus a one-line description and tiny sidebar wall-text labels at the panel\nedges — treat it as a gallery walk-through, not a logo grid. Close on key\nmetrics as bare numerals at headline scale with small caption labels beneath,\nno charts or icons.", "Image recipe": "Documentary interior or lifestyle photograph representing [SUBJECT] (a\nportfolio brand's own product or environment), warm natural light, real\nfurnished space rather than a staged studio set, colour grading consistent\nwith the brand being shown, generous negative space at top/centre for a\nwordmark to sit over without obscuring key detail.", "Photo search": "Unsplash first, Pexels second (for genre reference only — each real panel\nshould use the actual portfolio brand's own photography).\n- \"scandinavian interior dining room warm light\"\n- \"furniture design showroom natural light\"\n- \"founder portrait environmental candid\"", "Reference lock": "Primary reference/direction: NGLM — manifesto-scale opening headline, gallery-\nstyle full-bleed portfolio brand panels, bare-numeral key figures close.\nPreserve (3-5 traits): a single oversized centred grotesque headline stating\nthe company's thesis on an otherwise empty white opening; each portfolio\nbrand shown as one full-bleed photographic panel with its own wordmark\ncentred over the image; tiny sidebar wall-text labels rather than active\nin-panel navigation; key metrics closed as bare numerals at headline scale\nwith no chart or icon.\nBorrow only (1-2): the founder-portrait-plus-quote block; the \"+\" expandable\nnav items (Companies+, About+, Our Model+).\nRole rules: portfolio wordmarks are always centred on their own photograph,\nnever set on a flat panel; key-figures numerals never paired with a\nsupporting chart or icon.\nMedia strategy: photo:documentary — each portfolio panel should use that\nbrand's own real product/interior photography, not generic stock standing in\nfor it.\nReject: a logo-grid or card-list treatment for the portfolio section; charts\nor icon decoration on the key-figures numerals; a busy or image-heavy hero\ncompeting with the manifesto headline.\nToken commitments: paper `#FDFDFD`, ink `#000000`, warm-taupe `#8D7C68`,\nink-warm `#322219`, stone `#4D4339`, stone-light `#AB9F90`, grey `#CCCCCA`;\ndisplay \"GD Trio Display\", body/UI \"GD Gaio VF\"."}, "has_extract": true}, {"slug": "not-real", "title": "Not Real", "url": "https://notreal.tv/", "captured": "2026-09-04", "family": "vellum-gallery-zpattern", "dna": "Didone gallery-label serif x chromatic CGI on a three-colour vellum canvas", "register": "editorial print", "grammar": "gallery/catalog", "lane": "A warm off-white vellum canvas holds a staggered, asymmetric grid of full-bleed CGI renders at native resolution, each captioned below by an em-dash-split serif title and a slash-delimited sans metadata line, with a rotated running-text strip pinned to the right margin", "mode": "portfolio", "traits": ["\"three colours total", "chromatic content only in artwork\"", "\"0px radius everywhere", "zero elevation\"", "em-dash title / italic subtitle pairing", "\"staggered vertical offset grid", "no rigid rows\"", "vertical rotated metadata strip", "single weight (400) on both typefaces"], "palette": ["#292a2c", "#f2f2f2", "#000000"], "type": ["ogg", "telegraf"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://notreal.tv/", "has_image": true, "img": "../design-catalogue/entries/not-real/fold.webp", "full": "../design-catalogue/entries/not-real/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. The system runs on exactly three colours — ink charcoal, vellum canvas,\nfull black — and states its rule in the plainest possible terms: \"the more vivid\nthe artwork, the more monochrome and silent the surrounding UI must be.\" Because\nthe studio's own CGI renders already carry violets, pinks, greens and golds at\nfull saturation, a chromatic UI would compete with the work it exists to show;\nthree neutrals let every render register at full intensity.\n\nBoth typefaces run at a single weight (400) with no bold anywhere, so hierarchy\nis built entirely from size, letterform contrast, and tracking direction. ogg, a\nhigh-contrast didone-flavoured serif, announces each project at up to 55px with\naggressive negative tracking; telegraf, a geometric sans, documents it below with\ntracking that runs the opposite direction — widening as size decreases, which is\nwhat keeps 15px metadata tags legible as deliberate small caps rather than merely\ncramped. The two faces meet at 55px exactly once, a rare moment the source calls\nout specifically, where the serif announces the project name and the sans\ndescribes it at identical scale.\n\nZero elevation and zero radius across the entire system push all of the page's\nperceived depth into a single mechanism: the intentional vertical offset of\nimages within the asymmetric grid. A left-column tile starting 200px from the\ntop against a right-column neighbour starting at 80px creates the z-pattern\nstaggering that would otherwise need a shadow to achieve — flatness is a\ndeliberate \"anti-SaaS\" signal, the source states, meant to read as a printed\ngallery catalog rather than a software interface.", "What to borrow (principle)": "- **State the colour rule as an inverse relationship.** \"The more vivid the\n  artwork, the more silent the UI\" is a portable principle for any portfolio\n  built around saturated work.\n- **Run both typefaces at one weight only.** Removing bold as an option forces\n  every hierarchy decision onto size and letterform, which reads as more\n  editorial than weight-driven emphasis.\n- **Track two typefaces in opposite directions.** A serif that tightens at scale\n  paired with a sans that widens at small sizes gives each face a distinct,\n  legible signature.\n- **Use vertical offset instead of shadow to create depth in a grid.** Staggering\n  tile positions achieves a layered, z-pattern read without any elevation\n  effects.\n- **Give metadata a place to live that isn't a caption.** A rotated running-text\n  strip pinned to the viewport edge (project ID, timestamp) behaves like a\n  printed magazine running header rather than UI chrome.", "What to leave": "- Zero border-radius and zero shadow across an entire portfolio is a genuinely\n  narrow constraint — any borrowed component with a rounded corner or a card\n  shadow will immediately look foreign against this system.\n- The em-dash title/italic-subtitle pairing depends on every project having a\n  two-part name; a single-word project title loses the device's rhythm entirely.\n- A three-colour, artwork-only-colour rule assumes a deep, consistently\n  high-quality CGI/photography library; a thin portfolio would leave long\n  stretches of the page with nothing but grey type.", "Signature move": "The vertical rotated running-text strip: project reference codes and timestamps\n(e.g. \"BA 08:00AM — MAD 01:00PM\") set in telegraf, rotated 90° and pinned\nabsolutely along the right viewport edge — a printed-magazine running header\nthat persists independent of scroll content.", "Motion": "(from designlang extract) Feel reads as mechanical — a fitting label for a\nsystem this flat — and the page is scroll-linked. Interactions are dominated by\nplain `linear` easing (12 uses) at 200-300ms, with a small custom\n`cubic-bezier(0.4, 0, 0.22, 1)` set and a couple of `ease` uses; there is no\nspring or overshoot anywhere, matching the \"anti-elevation\" register. One\nkeyframe is confirmed firing: `moveSlideshow`, a slide-x transform driving a\nhorizontal slideshow/carousel — the one place the page does move content across\nthe screen rather than staggering it in a static grid. A generic `spin`\nkeyframe exists in the stylesheet but is not confirmed in use. (observed in\ncapture) given the explicit anti-elevation, anti-shadow stance, hover states on\ninline links most plausibly thicken the existing 1px underline border rather\nthan introducing colour or movement, consistent with the \"border is the visual\nweight\" component note.\n\n| Token | Value | Easing |\n|---|---|---|\n| sm | 200ms | `linear` |\n| md | 300ms | `linear` / `cubic-bezier(0.4, 0, 0.22, 1)` |\n| moveSlideshow | slide-x transform | 1 use |", "Brief": "Build a CGI/design-studio portfolio homepage. Canvas is vellum `#f2f2f2`\nthroughout, text is ink charcoal `#292a2c`, with full black `#000000` reserved\nfor underline borders and rare dark inversions — no fourth colour, and no\nchromatic UI colour at all. Set the wordmark and every project title in ogg at a\nsingle weight (400): 55px with -0.036em tracking for the largest headlines, 26px\nwith -0.02em for pull-quotes, always split as \"Title — Subtitle\" with the\nsubtitle in italic. Use telegraf for everything else — nav, body, metadata tags —\nwith tracking that widens as size decreases (0.002em at 55px up to 0.04em at\n15px). Lay out a two-column asymmetric grid with no max-width constraint: large\nproject tiles and compact secondary tiles at native aspect ratio, zero\nborder-radius, no shadow, positioned with deliberate vertical offset between\nneighbouring columns to create a staggered z-pattern. Below each image, a caption\nblock: em-dash title/subtitle in ogg, then category tags in telegraf separated by\n\" / \". Pin a rotated (90°) metadata strip along the right viewport edge. Keep\n120px section gaps and let the page flow to the viewport edges with no card\ncontainers anywhere.", "Image recipe": "High-production CGI render of [SUBJECT] — glossy or metallic abstract or product-\nadjacent form (crystal, liquid simulation, branded object), studio-lit with soft\ngradient or bokeh backdrop in saturated, unexpected colour (violet, pink, gold,\ngreen), photorealistic rendering quality, sharp focus on the subject with the\nbackground allowed to blur, presented uncropped at native resolution with no\noverlay or duotone treatment.", "Photo search": "Unsplash first, Pexels second.\n- \"abstract 3D render glossy metallic gradient background\"\n- \"crystal formation studio lighting colourful\"\n- \"liquid simulation render vivid colour\"\n- \"product CGI render pastel gradient background\"", "Reference lock": "Primary reference/direction: Not Real — three-colour vellum gallery grid,\nchromatic content confined entirely to CGI artwork.\nPreserve (3-5 traits): exactly three colours (`#292a2c` ink, `#f2f2f2` vellum,\n`#000000` black), no chromatic UI colour under any circumstance; both typefaces\nlocked to weight 400, no bold anywhere; 0px radius and zero elevation on every\nelement, depth achieved only through staggered image offset; em-dash title /\nitalic-subtitle pairing on every project heading; telegraf tracking widening as\nsize decreases, ogg tracking tightening as size increases.\nBorrow only (1-2): the rotated 90° running-text metadata strip on the right\nmargin; the \" / \"-delimited category tag format.\nRole rules: no fourth colour is ever introduced; ogg never sets body copy or\nmetadata; a filled CTA button is never created — links stay text with a 1px\nborder only.\nMedia strategy: CGI/3D render or high-production photography, always saturated,\nalways the page's sole source of colour; no illustration, no icon system beyond\nsimple glyphs.\nReject: any chromatic UI element (button fill, coloured link, badge); border-\nradius on any element including images; box-shadow of any kind; a centred or\nmax-width-constrained layout; bold or semibold type.\nToken commitments: bg `#f2f2f2`, ink `#292a2c`, hard `#000000`; display ogg 400\nat 24-55px/leading 1.06-1.5/-0.036 to -0.02em tracking; body telegraf 400 at\n15-25px/leading 0.75-2.0/0.002-0.04em tracking; radius 0px universal; page\nmax-width 1440px, section gap 120px, base spacing unit 6px."}, "has_extract": true}, {"slug": "nura", "title": "NURA (planner template)", "url": "https://nura-ai.framer.website/", "captured": "2026-09-04", "family": "meadow-planner", "dna": "Lifestyle photography x task-planner app pitch", "register": "warm photographic", "grammar": "none", "lane": "Full-bleed lifestyle photography of a woman in a flower field carries the entire pitch for a task planner that never shows its own interface, closing on a bare stat strip", "mode": "persuade", "traits": ["full-bleed lifestyle photography", "roman + italic serif headline pairing", "pill CTA on photo", "zero product screenshots", "light grey feature panel", "second flower-field photo mid-page", "bare inline stat strip", "generic planner copy"], "palette": ["#A9C9DE", "#E8A9C0", "#6B8F5A", "#FFFFFF", "#1A1A1A", "#F5F5F3"], "type": ["Inter Display", "Instrument Serif"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://nura-ai.framer.website/", "has_image": true, "img": "../design-catalogue/entries/nura/fold.webp", "full": "../design-catalogue/entries/nura/shot.webp", "sections": {"Why it works": "The page borrows wholesale from wellness/lifestyle-app photography: a full-bleed\nportrait of a woman in a flower field, warm sunlight, soft focus, with the\nheadline set directly onto it in white — roman weight for most of the sentence,\nitalic serif for the emotional word (\"a *better plan*\"). That's a legible,\nlow-effort way to signal \"calm, human, aspirational\" for a task-planning tool\nwithout building any product-specific imagery.\n\nBelow the fold, a light grey panel restates the pitch in plain prose (\"You don't\nneed more tasks — you need a clear direction\") next to a second, closer crop of\nthe same photographic subject. The repetition of the model across two hero-style\nimages, with no interface shown between them, is the page's most telling choice —\nthis is a productivity product whose entire visual argument is a lifestyle photo\nshoot, not a demonstration of the thing it does.\n\nA bare inline stat strip at the bottom (\"Tasks organized in 2.4s // 8 tasks\norganized / Priorities ranked automatically\") gestures at product proof without\never showing the product. It's the visual language of a SaaS landing page grafted\nonto a wellness photo shoot, and the seam between the two is visible.", "What to borrow (principle)": "- **Pair a roman headline with one italic-serif word** for warmth without\n  switching to a full serif system — it's a lightweight way to add an emotional\n  register to an otherwise plain sans headline.\n- **Use a bare, unboxed stat strip** as a lightweight proof device when you don't\n  want a full metrics dashboard.", "What to leave": "- Selling a software product entirely through lifestyle photography, with no\n  screenshot, mockup, or UI shown anywhere on the page — a planner app's core\n  claim (that it organizes your day) is never demonstrated, only asserted.\n- Repeating the same photographic subject across two hero-scale images reads as\n  a stock-photo budget of one shoot, not a considered art direction.\n- The bare stat strip has no visual container or hierarchy, so it reads as an\n  afterthought rather than proof.", "Signature move": "The photograph-only pitch: two full-bleed lifestyle shots of the same subject\ncarrying the entire emotional argument for a productivity tool, with the product\nitself never shown. It's a shortcut that works for tone and fails for\ncredibility — the reviewer's honest tell that this is a template, not a shipped\nproduct.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed,\nthough the captured CSS is thin — a single `400ms` duration token and one\ncustom ease (`cubic-bezier(0.44,0,0.56,1)`, a near-symmetric ease-in-out) drive\nlink/underline colour transitions; the only keyframe is a generic loading\nspinner, unrelated to content. That's consistent with a photography-only page:\nthere's little UI to animate, so what little motion exists is confined to\ntext-link state changes rather than any scroll-triggered reveal of the hero\nor stat strip.\n\n| token | value | role |\n|---|---|---|\n| `md` | 400ms | link/underline colour transitions |\n| custom | `cubic-bezier(0.44,0,0.56,1)` | only easing found (2 uses) |", "Brief": "If borrowing this direction, treat the photography as tone-setting only — pair it\nwith at least one real product screenshot before asking a visitor to trust a\nplanning tool. Open on a full-bleed lifestyle photograph with a roman + one-word\nitalic-serif headline in white, a single pill CTA. Follow with a light grey\nfeature panel pairing plain-prose copy against a second, tighter crop of the same\nphotographic world. Close with an inline, unboxed stat strip — but back it with\nan actual screenshot earlier in the scroll, which this reference omits.", "Image recipe": "A person in [SUBJECT] — a flower field, golden hour, soft warm light, shallow\ndepth of field, genuine unposed expression — shot documentary-style, no visible\nproduct or device, colour graded warm and slightly hazy.", "Photo search": "Unsplash first, Pexels second.\n- \"woman flower field golden hour candid\"\n- \"sun flare portrait outdoor warm\"\n- \"wildflower meadow lifestyle photography\"", "Reference lock": "Primary reference/direction: NURA — lifestyle-photography-only pitch for a task planner, no product screenshot shown.\nPreserve (3-5 traits): full-bleed warm lifestyle photography as the primary visual device; roman headline with one italic-serif emotional word; single pill CTA set directly on the photograph; bare, unboxed stat strip as a lightweight proof device.\nBorrow only (1-2): the light grey plain-prose feature panel; the repeated photographic subject across two hero-scale images.\nRole rules: never claim organizational/product proof without showing the product at least once; italic serif reserved for one word per headline only.\nMedia strategy: photo:unsplash — warm, candid lifestyle photography only; must be paired with at least one real UI screenshot elsewhere on the page to avoid an all-photography pitch.\nReject: shipping a software marketing page with zero product screenshots; an unboxed stat strip with no supporting visual proof nearby.\nToken commitments: sky `#A9C9DE`, blossom `#E8A9C0`, foliage `#6B8F5A`, white `#FFFFFF`, ink `#1A1A1A`, panel-grey `#F5F5F3`; sans for headline body, italic serif for one emphasis word only."}, "has_extract": true}, {"slug": "olipop", "title": "OLIPOP", "url": "https://drinkolipop.com", "captured": "2026-09-04", "family": "apothecary-soda-fountain", "dna": "Vintage apothecary display serif x flavor-locked pastel product cards", "register": "illustrated dark", "grammar": "gallery/catalog", "lane": "A warm cream canvas bracketed top and bottom by forest-teal bands carries a poster-scale retro-serif hero panel and a horizontal carousel of pastel flavor cards, each card colour reserved exclusively for its own product", "mode": "persuade", "traits": ["\"weight 800-900 retro display serif", "1.0 leading\"", "\"cream canvas", "forest-teal dark bookends\"", "\"15-colour palette", "flavor-locked to product cards\"", "pill radius on every interactive element", "circle motif for every product image", "\"one soft glow shadow", "on the primary CTA only\""], "palette": ["#14433d", "#fdf7e7", "#d3e8e3", "#3a3a3a", "#7e0022", "#2ad2c9"], "type": ["WindsorEF", "Ano"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "playful", "category2": "consumer-brand", "origin": "refero", "extract": "failed: \u001b[2m  - navigating to \"https://drinkolipop.com/\", waiting until \"domcontentloaded\"\u001b[22m", "source_url": "https://drinkolipop.com", "has_image": true, "img": "../design-catalogue/entries/olipop/fold.webp", "full": "../design-catalogue/entries/olipop/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens. Forest-teal `#14433d`\nis the system's one authoritative dark, appearing only as the announcement bar,\nfooter, and primary CTA fill — bracketing the cream page top and bottom like the\ncovers of a book. Product-card colour is treated as strictly separate namespace:\na 15-hue pastel palette is \"flavor-locked,\" meaning each colour belongs to\nexactly one product and must never be reused for UI chrome, buttons, or section\nbackgrounds. That separation is what lets the product carousel feel vivid and\ncandy-shop bright without any of that vibrancy leaking into — or competing with\n— navigation and buttons.\n\nWindsorEF, a high-contrast retro display serif, is reserved for headlines 32px\nand above at weight 800-900 with an extremely tight 1.0 line-height; Ano, a clean\nmodern sans, does every other job with generous 1.5-1.82 line-heights that keep\nbody copy breathable. The pairing recreates a specific historical reference —\napothecary and soda-fountain packaging — without needing any literal illustration\nto say so.\n\nElevation is almost entirely absent except for one exception stated explicitly:\na soft ambient glow shadow lives only on the primary CTA button, nowhere else.\nCombined with a strict two-radius system (16px for cards, 50px/pill for every\ninteractive element) and a recurring circle motif for every product photo, the\npage reads as a vintage general-store menu translated into modern e-commerce\nrather than a typical DTC storefront.", "What to borrow (principle)": "- **Flavor-lock a palette to specific products, not to UI.** Assigning each\n  named colour to exactly one item (never reused for chrome) makes a large\n  palette feel curated rather than arbitrary.\n- **Bracket the page with one dark colour, top and bottom only.** A single\n  forest-teal announcement bar and footer, with nothing dark between them, frames\n  a light page without needing alternating section bands.\n- **Reserve elevation for exactly one component.** A single soft glow shadow,\n  applied only to the primary CTA, makes that one button read as \"the\" action\n  without requiring shadows anywhere else.\n- **Recreate a specific historical reference through pairing, not literal\n  props.** A high-contrast display serif against a friendly workhorse sans can\n  evoke \"vintage apothecary\" without a single period illustration.\n- **Repeat one shape as a structural motif.** Circular crops on every product\n  image (and nowhere else) create a recognizable, medallion-like rhythm across\n  an otherwise rectangular grid.", "What to leave": "- A 15-colour flavor-locked palette requires real production discipline — every\n  new SKU needs a genuinely new hue, and a large enough product line will\n  eventually run out of distinguishable pastels.\n- WindsorEF's extremely tight 1.0 line-height at display sizes depends on a\n  typeface with generous internal leading in its metrics; a substitute serif\n  without that headroom will clip ascenders/descenders.\n- Reserving shadow for exactly one component is easy to erode as a product page\n  grows — a second \"important\" CTA will tempt a team to add the glow elsewhere,\n  diluting the signal.", "Signature move": "The circle-cropped product photo: every can, illustration, or feature image is\nmasked to a perfect circle — referencing vintage bottle caps and medallions — a\ndevice repeated consistently enough (flavor cards, rewards section, logo\ntreatment) that it becomes the brand's structural signature independent of any\nsingle instance.", "Motion": "No motion or interaction tokens are captured in the Refero export. Note: the\nlive site did not finish loading within this session's capture window (a\nnetworkidle timeout, likely from third-party trackers/pixels common on DTC\nstorefronts), so this entry's images are drawn from the Refero export rather\nthan a fresh capture. Inferred from the image and the \"flavor carousel\"\ncomponent description: the product-card row most plausibly scrolls\nhorizontally on drag or arrow-click, consistent with the \"Pure Nostalgia-ahh\"\ncarousel label, though no easing or duration is documented. (inferred)", "Brief": "Build a nostalgic prebiotic-soda DTC landing page. Bracket the page with forest-\nteal `#14433d` bands at the very top (announcement bar) and very bottom\n(footer); everything between sits on cream `#fdf7e7` canvas. Set headlines 32px\nand above in a high-contrast retro display serif at weight 800-900, 1.0 line-\nheight; use a friendly modern sans for everything else at 1.5+ line-height. The\nhero is a two-tone composition: a mint-sage `#d3e8e3` inset panel (24px radius)\nholding the display headline and a forest-teal pill CTA with a soft ambient\nglow shadow — the system's one elevated element. Below, run a horizontal\ncarousel of flavor cards, each a full-bleed pastel colour (16px radius) unique\nto its product, with a circular photo crop and the flavor name in the display\nserif. Repeat the circle-crop motif for any illustration or feature image. Use\n50px pill radius for every button and input; reserve a wine-red accent for rare\n\"specialness\" labels and a bright teal for one secondary CTA only. No shadows\nanywhere except the primary button's glow.", "Image recipe": "Studio product photograph of [SUBJECT] — a beverage can shot on a clean,\nsingle-colour pastel backdrop matching its flavor identity, straight-on or\nslight three-quarter angle, sharp focus, no lifestyle context, no hands, no\nenvironment — cropped or composed to sit within a circular mask, high-key\nlighting with minimal shadow beneath the can.", "Photo search": "Unsplash first, Pexels second.\n- \"soda can product shot pastel background\"\n- \"beverage can flat colour backdrop studio\"\n- \"fruit flat lay pastel colour palette\"\n- \"vintage soda fountain illustration retro\"", "Reference lock": "Primary reference/direction: OLIPOP — retro apothecary soda-fountain page,\nflavor-locked pastel product cards bracketed by forest-teal bands.\nPreserve (3-5 traits): cream `#fdf7e7` canvas bracketed top and bottom by\nforest-teal `#14433d` bands only; 15-colour pastel palette strictly flavor-\nlocked to individual product cards, never reused for UI chrome; WindsorEF\nweight 800-900 at 1.0 leading for all headlines 32px+, Ano for everything else;\n50px pill radius on every interactive element, 16px on cards; a single soft\nglow shadow reserved for the primary CTA only.\nBorrow only (1-2): the circular product-photo crop as a recurring structural\nmotif; the mint-sage inset hero panel (\"card on a card\") device.\nRole rules: flavor-card pastels never appear on buttons, nav, or borders; wine-\nred and bright-teal accents never combine in the same component; WindsorEF\nnever sets text below 20px.\nMedia strategy: photo:unsplash — clean, single-colour-backdrop product\nphotography and retro folk-art illustration only; no lifestyle staging, no\npeople.\nReject: shadows on anything but the primary CTA; sharp corners (0-8px) on any\nbutton or input; a second dark UI colour beyond forest-teal; reusing a flavor\ncolour as UI chrome; body text below 1.4 line-height.\nToken commitments: bg `#fdf7e7`, panel `#d3e8e3`, dark `#14433d`, ink `#3a3a3a`,\naccent-wine `#7e0022`, accent-teal `#2ad2c9`; display WindsorEF 800-900 at\n20-80px/leading 1.0; body Ano 400-700 at 12-24px/leading 1.2-2.33; radius 16px\ncards, 50px pills, 24px hero panel; page max-width 1200px, section gap 40-64px."}, "has_extract": true}, {"slug": "operator-ai-agency", "title": "Operator (AI Agent Agency template)", "url": "https://oma-operator.framer.website/", "captured": "2026-09-04", "family": "dark-agent-console", "dna": "SaaS dashboard demo x AI-agency pitch deck", "register": "cinematic dark", "grammar": "live surface", "lane": "A misty dark photograph carries the pitch, a glassy dashboard card floats mid-hero as proof, then a bento grid of stats and client quotes closes the case", "mode": "persuade", "traits": ["dark misty photo ground", "hexagon agent mark", "floating glassmorphic dashboard card", "garbled marquee logo strip", "bento stat/quote grid", "white pill CTAs on dark", "mint micro-accent tag", "placeholder testimonial names"], "palette": ["#0D0F12", "#181B20", "#6E7986", "#F5F4F0", "#9FEFC4"], "type": ["Uncut Sans"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://oma-operator.framer.website/", "has_image": true, "img": "../design-catalogue/entries/operator-ai-agency/fold.webp", "full": "../design-catalogue/entries/operator-ai-agency/shot.webp", "sections": {"Why it works": "The page sells an invisible product — software agents — by giving them a visible\nhome. A dark, fogged mountain photograph sits behind everything as atmosphere, and\na single glassy dashboard card (agent list, draft/paused/active counts, a \"deploy\nagent\" button) floats over it mid-hero. The card is doing the actual persuading:\nit is the only concrete thing on the page, so the eye lands there before it lands\non the headline.\n\nEverything below the fold is proof, stacked in two densities. A logo marquee runs\nfirst, deliberately distorted (letters skewed, mirrored, overlapping) so it reads\nas motion before it reads as names — trust-signal texture rather than trust-signal\ncontent. Underneath, a bento grid mixes hard numbers (`180+ agents deployed`,\n`94% average retention`) with quote tiles at the same visual weight, so a stat and\na testimonial are interchangeable units of the same argument.\n\nThe dark register does real work: on a near-black ground, the one warm/light\nsurface (the dashboard card, and later the white bento tiles) reads as the\n\"place where the product lives,\" separate from the marketing chrome around it.\nThat separation is the whole trick of demoing software you can't actually let\nsomeone click.", "What to borrow (principle)": "- **Float one real screen over the hero photograph.** A single UI card, partially\n  glass, does more convincing than three paragraphs of feature copy.\n- **Make the logo strip texture, not proof.** If the \"trusted by\" names aren't real\n  clients, distort or animate them so they read as rhythm, not as a claim.\n- **Mix stats and quotes in one grid.** Equal-weight tiles let a hard number and a\n  soft testimonial back each other up without a separate \"results\" section.\n- **Reserve one accent for state, not decoration.** A single mint tag or status dot\n  is enough to mark \"this is live\" against an otherwise monochrome dark UI.", "What to leave": "- Placeholder testimonial names and companies that read as generated rather than\n  sourced (a \"Sheldon Cooper, Founder, GrowthLane\" is a tell, not a proof point).\n- The garbled/broken logo marquee taken further than motion — at rest, several\n  logos are illegible, which undercuts the \"trusted by\" claim it's making.\n- Generic AI-agency copy (\"Scale your operations without scaling your team\") that\n  could sit on any agent-building business — the page has no product specifics to\n  differentiate it from a template.", "Signature move": "The floating dashboard card mid-photograph: a real (if fictional) product screen,\npartially transparent, overlapping the hero image and headline rather than sitting\nin its own section. It turns an abstract \"AI agents\" pitch into something with a\nUI, before a single feature is described.", "Motion": "(from designlang extract) The captured stylesheet is thin: Framer's static CSS\nshows only a near-instant `1ms` duration token, a discrete-property overflow\ntransition, and a generic `background, box-shadow` hover transition — no\nscroll-triggered keyframes or eased curves are present in the extracted CSS.\nThe extract still tags the page's feel as \"mixed\" with scroll-linked motion\npresent, consistent with Framer's habit of driving reveals (the card float,\nthe bento-tile entrances) through inline whileInView props rather than CSS\ntransitions, so the choreography the capture implies is real but invisible to\nstatic extraction. The one literal keyframe found is a generic 360° loading\nspinner, unrelated to content motion.\n\n| token | value | role |\n|---|---|---|\n| `instant` | 1ms | baseline transition duration (Framer default) |\n\nFeel: mixed · Scroll-linked: yes (per extract) · Easings/keyframes beyond the\nspinner: none captured.", "Brief": "Build a dark, photographic SaaS-agency page for a product that has no single\nscreen to show off. Ground everything in a near-black, fog-photograph hero; float\none glassy product card over it as the only concrete proof in the fold. Use a\nsingle geometric sans throughout, white text on dark, one small mint accent for\nstatus/tags. Below the fold, run a continuously scrolling logo strip (real or\nstylised) followed by a bento grid mixing 2-3 hard metrics with 2-3 short client\nquotes at equal visual weight. Close on a repeat of the primary CTA pair (a\ndemo/audit button plus a secondary \"see results\" link).", "Image recipe": "Atmospheric landscape or skyline of [SUBJECT], shot at dusk or in fog, desaturated\ntoward blue-grey, heavy vignette toward the edges so a UI card can float over the\ncentre without competing for contrast, no visible horizon line, wide negative\nspace top and bottom for headline and nav.", "Photo search": "Unsplash first, Pexels second.\n- \"misty mountains dark blue moody\"\n- \"foggy landscape aerial desaturated\"\n- \"night skyline haze dark\"\n- \"abstract dark gradient atmosphere\"", "Reference lock": "Primary reference/direction: Operator — dark AI-agency template, floating dashboard card over a fogged photograph, bento proof grid.\nPreserve (3-5 traits): near-black photographic ground with heavy fog/vignette; one glassy product-UI card floating mid-hero as the sole concrete proof; bento grid mixing stat tiles and quote tiles at equal weight; single mint micro-accent reserved for status/tags only.\nBorrow only (1-2): the continuously scrolling distorted logo marquee; the paired CTA (primary action + secondary \"see results\" link).\nRole rules: no more than one floating UI card per fold; stat and quote tiles never exceed two tones of emphasis; accent colour never used for body text, only tags/status.\nMedia strategy: photo:unsplash — atmospheric, low-detail, dark landscape or cityscape only; never a literal \"team in an office\" stock shot.\nReject: fabricated testimonial names presented as real; logo marquees distorted past legibility even at rest; stacking more than one floating UI card in the same viewport.\nToken commitments: bg `#0D0F12`, surface `#181B20`, muted `#6E7986`, paper `#F5F4F0`, accent-mint `#9FEFC4`; display/body a single geometric sans; card corner-radius large (~20px) with low-opacity fill for the glass effect."}, "has_extract": true}, {"slug": "orix-studio", "title": "Orix-Studio (creative agency template)", "url": "https://orixstudio.framer.website/", "captured": "2026-09-04", "family": "silhouette-runway-agency", "dna": "Fashion-runway silhouette photography x agency service list", "register": "cinematic dark", "grammar": "split stage", "lane": "A misty silhouette photograph of walking figures carries a left-aligned service list and a giant circular-registered wordmark, then drops hard to a plain white stats-and-work section", "mode": "persuade", "traits": ["misty silhouette photography", "left-aligned arrowed service list", "giant wordmark with registered-trademark mark", "dark-to-white hard section break", "plain stat trio", "small work thumbnail grid", "generic agency copy"], "palette": ["#2E3A3E", "#C9754A", "#FFFFFF", "#171A1B", "#E8C9C4"], "type": ["Inter Display", "Instrument Sans"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "portfolio", "category2": "", "origin": "raw-url", "extract": "ok", "source_url": "https://orixstudio.framer.website/", "has_image": true, "img": "../design-catalogue/entries/orix-studio/fold.webp", "full": "../design-catalogue/entries/orix-studio/shot.webp", "sections": {"Why it works": "The hero photograph is a row of silhouetted figures walking through fog or\nmist, lit by a warm rim light along the horizon — closer to a fashion-runway\nor editorial-film still than a typical agency stock photo. It sets a cinematic,\nfaintly mysterious tone before a single word of copy is read, which is a\nstronger opening move than the generic \"team high-fiving\" imagery most agency\ntemplates default to.\n\nService labels (`WEBSITE DESIGN`, `WEB DEVELOPMENT`, `BRANDING`, `MARKETING\nDESIGN`) run down the left edge with small arrows, functioning as both\nnavigation-flavoured decoration and an implicit capability list, while the\nstudio's wordmark sits giant at the bottom of the photograph with a circled ®\nmark for extra weight. It's a lot of visual authority claimed before any actual\nwork is shown.\n\nThe page then breaks hard from cinematic dark to plain white for the \"About\nUs\" and \"Work\" sections — three bare stats (`120+ Projects Delivered`, `98%\nClient Satisfaction Rate`, `15+ Industries Served`) and a small thumbnail grid\nof mockup-style work. The contrast is deliberate structurally (mood, then\nproof) but the two halves don't share any visual language — no colour, texture\nor type-weight carries over — so the page reads as two different sites stapled\ntogether.", "What to borrow (principle)": "", "What to leave": "- The hard, uncarried-over break from dark cinematic hero to plain white body\n  makes the page feel like two templates spliced together — at minimum, one\n  typographic or colour thread should survive the transition.\n- Three bare stat numbers with no visual anchor (no thumbnail, no chart) read as\n  unverifiable filler, especially directly after a hero this visually\n  confident.\n- The work-grid thumbnails (a poster mockup, a business-card mockup) are\n  generic placeholder-style renders rather than real client work, undercutting\n  the sophistication the hero promised.", "Signature move": "The mist-lit silhouette walk: a row of backlit figures mid-stride, photographed\nthrough fog with warm rim light along the horizon, used as the entire hero\nimage with no other visual element competing for attention except the\noverlaid wordmark.", "Motion": "(from designlang extract) Feel is \"mixed\" with scroll-linked motion confirmed,\nbut the captured CSS is minimal — no duration tokens, no easing families, and\nthe only keyframe present is a generic loading spinner; the visible rules are\njust a bare `transition: all` and a `background, box-shadow` hover state.\nThat thinness is consistent with the dark-to-white hard cut this entry\nalready flags: whatever drives the section break and the service-list\nhover/underline states is most likely inline whileInView motion the static\nextract can't see, not a captured CSS transition.", "Brief": "If borrowing this direction, close the gap between hero and body rather than\nletting them read as two separate pages. Open on cinematic, fog-lit silhouette\nor editorial photography with a left-edge service list and a giant wordmark\noverlaid. Carry at least one colour or type choice from the hero into the body\n(the warm rim-light tone, or the condensed display face) so the transition from\ndark to light reads as one system. Anchor every stat with a real project\nthumbnail rather than a bare number, and replace mockup-style work images with\nactual client output before shipping.", "Image recipe": "Silhouetted figures walking through [SUBJECT] — mist or fog, backlit by a warm\nlow sun or rim light along the horizon, wide shot with generous negative space\nabove for headline/nav, desaturated except for the warm rim-light glow.", "Photo search": "Unsplash first, Pexels second.\n- \"silhouette figures walking fog backlit\"\n- \"people walking mist warm light editorial\"\n- \"runway silhouette rim light dramatic\"", "Reference lock": "Primary reference/direction: Orix-Studio — cinematic fog-silhouette hero with a left-edge service list, breaking hard to a plain white proof section.\nPreserve (3-5 traits): cinematic, backlit silhouette photography for the hero rather than generic office stock; left-edge service list with arrow marks as implicit capability signage; giant wordmark with a registered-mark symbol overlaid on the hero photograph.\nBorrow only (1-2): the three-stat trio format; the small work-thumbnail grid layout.\nRole rules: at least one visual element (colour, type weight, or motif) must carry from the dark hero into the white body section; every stat must be paired with a real, specific piece of evidence, never left bare.\nMedia strategy: photo:unsplash — cinematic, backlit, editorial-style photography only for the hero; real client work (not mockup placeholders) for the portfolio grid.\nReject: an unbridged hard cut from dark hero to unrelated white body; bare stat numbers with no supporting evidence; generic mockup renders standing in for real client work.\nToken commitments: dark-teal `#2E3A3E`, rim-orange `#C9754A`, white `#FFFFFF`, near-black `#171A1B`, work-tile-peach `#E8C9C4`; bold condensed sans for the wordmark, plain sans for body and stats."}, "has_extract": true}, {"slug": "oryzo-ai", "title": "ORYZO AI", "url": "https://oryzo.ai", "captured": "2026-09-04", "family": "darkroom-cork-artifact", "dna": "Museum-artifact product reveal x deadpan AI-launch typographic voice", "register": "cinematic dark", "grammar": "continuous world", "lane": "A warm-dark canvas holds an ordinary cork coaster like a museum artifact: full-viewport void-mode sections stack a centred 3D render between flanking uppercase headline and body-copy columns, with a single orange used only for credit lines, never for a button", "mode": "experience", "traits": ["uppercase weight-500 everything except one body voice", "\"warm walnut void", "never pure black\"", "\"100vh per section", "one statement each\"", "\"orange accent for credits only", "never CTAs\"", "\"dashed hairline dividers", "no solid rules\"", "0.9 line-height stacking display type"], "palette": ["#ffedd7", "#100904", "#445231", "#382416", "#dc5000", "#000000"], "type": ["halyard-display-variable"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "luxury-craft", "category2": "product-focused", "origin": "refero", "extract": "ok", "source_url": "https://oryzo.ai", "has_image": true, "img": "../design-catalogue/entries/oryzo-ai/fold.webp", "full": "../design-catalogue/entries/oryzo-ai/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. Warm walnut `#100904` and warm cream `#ffedd7` stand in for black and\nwhite everywhere — the source is explicit that \"purity reads as wrong here.\"\nDepth comes from exactly one luminance step (canvas to Bark Brown), never from\nshadow, which keeps every void-mode section reading as a continuous dark stage\nrather than a stack of elevated cards.\n\nA single typeface carries the entire system in exactly two modes: uppercase\nweight 500 for everything functional — nav, headings, labels, buttons — and one\nnarrow exception, 29px weight-400 mixed-case body copy, reserved solely for\nproduct description. The shift from all-caps declarative label to lowercase\nsentence is itself the signal that tells a reader \"you are now reading\ndescription, not a UI label.\" Display sizes are stacked at an unusually tight\n0.9 line-height, which the source describes as making uppercase letterforms\noverlap their line bounds into a sculptural block rather than sitting in\nreadable lines.\n\nThe single accent colour, ember orange, is fenced to an unusually narrow role —\ncredit lines and one studio link — and explicitly banned from CTAs or any\ninteractive surface. Combined with sections that are each locked to a full\n100vh (never compressed into a band) and dashed hairline dividers as the only\nstructural break, the page reads as a sequence of gallery installations rather\nthan a scrolling marketing page — appropriate for a project whose entire premise\nis presenting an ordinary object with mock-serious \"AI product launch\" gravity.\nThe designlang extract also surfaces a moss-green `#445231` (417 uses, second\nonly to the cream ink colour) not present in the original capture — a second\nvoid-mode section tone alongside walnut, corrected into the palette above.", "What to borrow (principle)": "- **Warm both ends of the black/white scale.** Neither pure black nor pure\n  white appears anywhere; a warm near-black and warm near-white can carry an\n  entire dark system without feeling clinical.\n- **Use case and weight, not colour, to separate label from description.**\n  Switching from uppercase/500 to mixed-case/400 for exactly one text role is a\n  legible, colour-free way to mark \"this is prose.\"\n- **Fence an accent colour to editorial credit only.** Explicitly banning the\n  accent from buttons and CTAs keeps it reading as rare and earned rather than\n  decorative.\n- **Give every section a full viewport and one statement.** Locking sections to\n  100vh with no compression forces genuine editorial pacing rather than dense\n  stacking.\n- **Compress display leading until letterforms overlap.** A 0.9 line-height at\n  large uppercase sizes turns type into a stacked sculptural block rather than\n  conventional readable lines.", "What to leave": "- Locking every section to 100vh is a strong commitment that works for a\n  single-product showcase but would feel padded and slow on a page with more\n  than a handful of genuine content sections.\n- A single typeface with only two permitted voices (uppercase label, one\n  mixed-case body size) leaves no room for a third register — a testimonial or\n  a pull-quote would need to borrow one of the two existing voices rather than\n  getting its own treatment.\n- The premise-dependent tone (treating an ordinary object with mock-serious\n  product-launch gravity) is a specific creative conceit; applied to a genuinely\n  premium product without the self-aware wink, the same typographic solemnity\n  could read as simply humourless.", "Signature move": "The vertical sidebar serial-number label: rotated 90° text (\"ORYZO 1-MODEL\")\nrunning flush down the right viewport margin — a physical-product artifact\ndetail (like a stamped serial number) translated directly into a persistent UI\nelement.", "Motion": "(from designlang extract) Feel reads as springy, and the page is scroll-linked —\ncorrecting the earlier \"no durations specified\" read. Four duration steps run\n150-500ms, and a genuine spring/overshoot curve, `cubic-bezier(0.3, 0, 0.66,\n-0.3)`, is confirmed in use alongside a plain `ease`. The one keyframe firing is\n`grip-instruction-wheel-dash`, animating `stroke-dashoffset` on what reads as an\nSVG dial or wheel graphic — most plausibly a \"how to hold/rotate it\" instruction\nelement paired with the product render, tracing a dash pattern around a circular\npath rather than a static icon. (observed in capture) the live capture confirms\na real-time WebGL/Three.js render of the coaster with visible inertia and\nweight as it moves — the spring easing found in the extract is consistent with\nthat same weighted, springy feel carrying into the interactive object itself.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 150ms | `ease` |\n| sm | 180ms | `ease` |\n| md | 300ms | spring |\n| lg | 500ms | spring |\n| spring/overshoot | — | `cubic-bezier(0.3, 0, 0.66, -0.3)` |", "Brief": "Build a deadpan, museum-grade single-product showcase page. Canvas is warm\nwalnut `#100904` throughout — never pure black; text is warm cream `#ffedd7` —\nnever pure white. Depth comes from exactly one elevated surface, Bark Brown\n`#382416`, used only for the system's one filled CTA; everything else is flat.\nSet all UI text — nav, headings, labels, buttons — in a single geometric sans at\nweight 500, uppercase, with display sizes compressed to 0.9 line-height; reserve\none exception, 29px weight-400 mixed-case, for product description copy only.\nEmber orange `#dc5000` appears only on credit lines and a single studio link —\nnever on a button or CTA. Structure the page as a sequence of full 100vh\nsections: a top-down photographic hero with tools-of-the-craft context, followed\nby void-mode reveals where a centred 3D product render sits flanked by a\nleft-aligned uppercase heading and a right-aligned mixed-case body column. Use\ndashed 1px hairlines as the only divider, 12px radius for cards, 36px for the\none pill CTA, 22.5px for ghost buttons, 0px for inputs. Add a rotated\nserial-number label fixed to the right margin as a persistent artifact detail.", "Image recipe": "Top-down documentary photograph of [SUBJECT] and its tools-of-the-craft — laid\non a green cutting mat or workbench surface, natural or warm practical light,\nsharp focus throughout, genuine workshop clutter (pencil, blade, paperclip)\nvisible in frame but not staged, warm high-contrast colour grading, full-bleed\nwith no vignette.", "Photo search": "Unsplash first, Pexels second.\n- \"craft tools top down workbench flat lay\"\n- \"cutting mat pencil knife top down\"\n- \"product design workshop overhead warm light\"\n- \"cork material texture close up\"", "Reference lock": "Primary reference/direction: ORYZO AI — deadpan museum-artifact single-product\npage, warm dark void with an uppercase-only type voice.\nPreserve (3-5 traits): warm walnut `#100904` canvas and warm cream `#ffedd7`\ntext, never pure black or white; single typeface locked to uppercase weight 500\nfor everything except one 29px mixed-case body voice; ember `#dc5000` fenced to\ncredit lines only, never a CTA or interactive surface; every section locked to\n100vh, one statement per screen; dashed 1px hairlines as the only divider, zero\nshadow-based elevation.\nBorrow only (1-2): the rotated 90° serial-number sidebar label; the semi-\ntransparent attribution info-card overlay on the hero photograph.\nRole rules: ember never touches a button or interactive surface; body copy\n(29px mixed-case) is the only non-uppercase text in the system; body text\nnever centres, even when flanking a centred object.\nMedia strategy: top-down documentary/workshop photography for hero context;\nreal-time 3D/WebGL render for the isolated product reveal; no lifestyle\nphotography, no stock people.\nReject: pure black or pure white anywhere; ember on any button; solid (non-\ndashed) dividers; border-radius below 12px on containers; compressing a\nsection below 100vh.\nToken commitments: bg `#100904`, elevated `#382416`, hairline `#40372e`,\nmid-tone `#6c5f51`, ink `#ffedd7`, accent `#dc5000`; display 41-51px/leading\n0.9; body 29px weight 400/leading 1.26; label 8-24px weight 500 uppercase;\nradius 12px cards, 22.5px ghost buttons, 36px filled pill, 0px inputs."}, "has_extract": true}, {"slug": "palais", "title": "Pa'lais", "url": "https://www.palais.bio/", "captured": "2026-09-04", "family": "honeyed-sketchbook-cookbook", "dna": "Hand-bound botanical sketchbook x condensed-serif editorial food-magazine confidence", "register": "illustrated dark", "grammar": "chaptered editorial", "lane": "A cream paper canvas carries condensed all-caps indigo headlines and a handwritten script tagline, divided from full-bleed lifestyle photography by an organic honey-and-sage blob rather than a straight line, with toile-style botanical line-art bleeding off every section edge", "mode": "persuade", "traits": ["\"single cool indigo", "all warmth in organic blobs\"", "condensed all-caps display + handwritten script duet", "0.13-0.27em tracking on every label", "wavy SVG blobs replace straight dividers", "botanical line-art bleeding off page edges", "\"pill buttons", "soft-corner cards", "hairline borders\""], "palette": ["#234386", "#fbf9f6", "#ffc400", "#ed7328", "#a2d3a6", "#000000"], "type": ["hwt-artz", "Delivery Note DEMO", "Axiforma", "Sonder Sans Black Rough"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "playful", "category2": "consumer-brand", "origin": "refero", "extract": "ok", "source_url": "https://www.palais.bio/", "has_image": true, "img": "../design-catalogue/entries/palais/fold.webp", "full": "../design-catalogue/entries/palais/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. The system draws a hard \"colour lane\" boundary the source states as an\nexplicit rule: deep indigo `#234386` is the only cool saturated hue and it alone\nowns type, links and filled buttons; every warm colour (honey gold, burnt\norange, mint sage) is confined to organic blob shapes and outlined secondary\nactions, never body text or buttons. Cream paper `#fbf9f6` underneath both is\nwhat makes the rule legible — warm enough that indigo reads as a deliberate cool\ncounterpoint, saturated enough that white cards lift without needing gray\nseparators.\n\nTwo display voices work in tandem rather than opposition: a bold condensed\nall-caps face carries structural headlines at tight 0.043em tracking — the\ndesignlang extract identifies this as \"Sonder Sans Black Rough,\" correcting the\noriginal \"Caveat\" read, which the live font list does not confirm — while a\nhandwritten script carries emotional taglines beneath them (\"The future\nof cooking – today\") — a label-plus-signature pairing rather than the\nheavy-vs-light contrast used elsewhere in this catalogue. Labels and navigation,\nmeanwhile, run the widest tracking in the system, up to 0.267em, which the\nsource calls the \"aggressive tracking... the system's signature typographic\ndevice.\"\n\nThe organic blob is the structural device that replaces every straight line in\nthe layout: section dividers, hero splits, and decorative washes are all\nfree-form SVG paths in a single accent colour, evoking liquid or botanical\nforms rather than a hard edge. Paired with hand-drawn botanical line-art that is\nexplicitly instructed to \"bleed off page edges, overlap section boundaries, and\nbe partially hidden\" rather than sit in a contained box, the page reads as a\nliving illustrated notebook rather than a templated grid.", "What to borrow (principle)": "- **Draw a hard colour-lane boundary and never cross it.** One cool hue owns\n  structure (type, links, buttons); all warm hues stay confined to decoration —\n  stating the rule explicitly keeps a multi-colour palette disciplined.\n- **Pair a structural display voice with an emotional script voice.** A bold\n  condensed headline plus a handwritten tagline beneath it gives copy two\n  distinct registers without needing a third typeface for body text.\n- **Replace every straight divider with an organic shape.** A wavy SVG blob\n  between two colour fields creates a hand-painted transition a hard line\n  cannot.\n- **Let illustration bleed off the page.** Explicitly forbidding illustrations\n  from sitting in a contained box is what keeps hand-drawn elements feeling\n  \"living\" rather than stock-decorated.\n- **Push label tracking to an extreme and hold it there.** 0.267em tracking on\n  the widest labels is aggressive enough to become a recognizable signature\n  rather than a default choice.", "What to leave": "- A strict colour-lane rule (cool = structure, warm = decoration only) is easy\n  to violate under marketing pressure — a \"limited edition\" callout in a warm\n  accent as a text colour would immediately break the system's internal logic.\n- Free-form organic blob dividers require custom SVG path work for every new\n  section transition; a team without illustration resources will default back\n  to straight lines and lose the device entirely.\n- The handwritten script accent depends on genuine restraint — the source notes\n  it is \"not a structural font,\" and any temptation to use it for UI labels or\n  buttons would undermine its rarity as an emotional flourish.", "Signature move": "The organic wavy section divider: a large flowing SVG path (honey-gold over\nmint-sage, or matching the section below) replacing every hard boundary between\ncolour fields — cream to orange, white to indigo — with a hand-painted,\nwatercolor-edge curve instead of a straight line.", "Motion": "(from designlang extract) Feel reads as mixed, and the page is scroll-linked.\nInteractions run across five durations (150ms-1s) on three easing families: a\nplain `ease` for simple state changes, a fast-settling ease-out\n(`cubic-bezier(0.3, 0.95, 0.33, 0.98)`, the most-used curve at 21 uses) for\nreveals, and `linear` for continuous motion. Three related keyframes —\n`WaveCards`, `WaveCards2`, `WaveCards3` — each a slide-x transform, confirm the\nrecipe-card carousel does move on its own: three cards staggered into a\ntravelling wave rather than a single block sliding uniformly. (observed in\ncapture) the minimal circular downward-chevron scroll cue is consistent with a\nsimple, non-parallax scroll experience elsewhere on the page — the wave motion\nis confined to the card carousel, not the whole viewport.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 150ms | `ease` |\n| sm | 200ms | `ease` |\n| md | 300ms | `cubic-bezier(0.3, 0.95, 0.33, 0.98)` |\n| lg | 500ms | `cubic-bezier(0.3, 0.95, 0.33, 0.98)` |\n| xl | 1s | `linear` |\n| WaveCards 1-3 | slide-x transform | staggered card-wave carousel |", "Brief": "Build a warm, illustrated plant-based food-brand landing page. Canvas is cream\npaper `#fbf9f6` with white `#ffffff` cards layered on top; deep indigo\n`#234386` is the only cool saturated colour, owning every headline, link and\nfilled button. Reserve honey gold `#ffc400`, burnt orange `#ed7328`, sky blue,\nwarm sand and mint sage `#a2d3a6` exclusively for organic blob shapes and\noutlined secondary buttons — never as text or fill on a primary action. Open\nwith a split hero: a bold condensed all-caps indigo headline plus a handwritten\nscript tagline on one side, product photography on the other, divided by a\nflowing gold-over-sage SVG blob rather than a straight line. Scatter hand-drawn\nbotanical line illustrations (indigo or sky-blue stroke, no fill) bleeding off\nsection edges throughout. Use 32px pill radius for buttons, 8px for cards, and\nlabel/nav text at 0.13-0.27em tracking in a geometric sans. Alternate cream,\nwhite, and full-bleed orange section bands, separated by organic wavy dividers,\nwith a dark indigo footer band closing the page.", "Image recipe": "Warm natural-light food photograph of [SUBJECT] — a plant-based spread or dish\nstyled on wood, linen or ceramic surfaces, garnished with fresh herbs and nuts,\nshallow depth of field, close-up or slightly overhead angle, natural warm\nlighting with no harsh flash, an artisan/handmade rather than studio-sterile\nmood.", "Photo search": "Unsplash first, Pexels second.\n- \"plant-based spread toast natural light\"\n- \"vegan cheese wooden board overhead\"\n- \"cashew cream sauce close up\"\n- \"botanical herbs kitchen natural light\"", "Reference lock": "Primary reference/direction: Pa'lais — illustrated plant-kitchen recipe-journal\npage, one indigo structural colour against warm decorative blobs.\nPreserve (3-5 traits): cream paper `#fbf9f6` canvas with white cards; deep\nindigo `#234386` as the sole cool hue, owning all type/links/buttons; warm\naccents (gold, orange, sage) confined strictly to organic blob shapes and\noutlined buttons, never text or primary fills; condensed all-caps display\npaired with a handwritten script tagline; hand-drawn botanical line-art\nbleeding off section edges, never boxed.\nBorrow only (1-2): the organic wavy SVG section divider; the circular\nscroll-indicator icon below the hero.\nRole rules: warm accent colours never set body text or fill a primary button;\nindigo never appears inside a decorative blob; the script font never appears in\nUI chrome, labels or buttons.\nMedia strategy: photo:unsplash — warm, natural-light artisan food and product\nphotography, paired with hand-drawn botanical line illustration; no studio-\nsterile white-cyc shots.\nReject: a second cool saturated colour; warm accents on buttons or body text;\nflat gray surfaces for separation; hard straight-line section dividers; bold\ninline emphasis within body copy.\nToken commitments: bg `#fbf9f6`, card `#ffffff`, ink-structural `#234386`,\nink-body `#000000`, accent-gold `#ffc400`, accent-orange `#ed7328`, accent-sage\n`#a2d3a6`; display 32-88px/leading 0.82-1.2/0.031-0.043em tracking; label\ntracking 0.133-0.267em; radius 8px cards, 32px buttons, organic blobs for\ndividers; page max-width 1200px, section gap 64px."}, "has_extract": true}, {"slug": "paper", "title": "Paper", "url": "https://paper.design/", "captured": "2026-09-04", "family": "warm-notebook-studio-blue", "dna": "Two-tone editorial headline x cream notebook canvas with one restrained blue mark", "register": "modern clean", "grammar": "split stage", "lane": "A warm cream canvas holds a left-aligned two-tone headline — dark first line, mid-gray continuation — above a single elevated product-screenshot card, with a faint isometric grid the only decorative flourish and a lone blue accent confined to the logo mark and code syntax", "mode": "persuade", "traits": ["\"two-tone headline", "one weight", "two fill colours\"", "\"cream canvas", "white reserved for elevated cards\"", "\"single filled dark button", "no chromatic CTA\"", "\"4px buttons", "8px cards", "12-24px product frames\"", "three-layer shadow reserved for product chrome only", "blue confined to logo mark and code accents"], "palette": ["#efefe4", "#fcfcf9", "#181818", "#83837e", "#5d8cd7", "#d7d7d6"], "type": ["Matter", "Inter", "Paper Mono"], "kind": "reference-style", "source": "anton", "status": "ready", "category": "product-focused", "category2": "editorial", "origin": "refero", "extract": "ok", "source_url": "https://paper.design/", "has_image": true, "img": "../design-catalogue/entries/paper/fold.webp", "full": "../design-catalogue/entries/paper/shot.webp", "sections": {"Why it works": "Palette and type are read from Refero's extracted tokens, confirmed by the live\ncapture. Bone canvas `#efefe4` replaces white as the page background, with\npaper white and bright card white reserved strictly for elevated surfaces — the\nsource's Do's list states this distinction outright: \"reserve #ffffff for\nelevated cards and product chrome only.\" That three-step neutral stack (canvas\n→ paper white → bright white) gives the page a printed, notebook-page feel\nbefore a single UI element loads.\n\nThe two-tone headline is the system's most legible device: identical Matter\nmetrics (same size, same weight 400, same tracking) split across two fill\ncolours — ink `#181818` for the declarative first line, slate `#83837e` for the\ncontinuation — so the effect comes entirely from colour, never from a size or\nweight change. The source is explicit that mixing sizes or fonts for the two\nlines would break the device; the whole trick depends on identical typography\nwith only colour differing.\n\nColour discipline elsewhere is equally strict: the one chromatic accent, studio\nblue `#5d8cd7`, is confined to the brand mark and code syntax highlighting —\nnever a button, never a link, never large text. Combined with a filled CTA\nthat is always neutral ink, never chromatic, and a shadow system reserved\nexclusively for the product screenshot and floating tool panels (marketing\ncards stay flat with hairline borders instead), the page keeps all its visual\nrichness inside the product itself, exactly as a design tool's marketing site\nshould. Note: the designlang extract's raw colour counts are dominated by\nnear-black IDE tones and syntax-style blue/green accents (`#3d7cff`, `#0fa821`)\nrather than the cream/ink marketing palette above — consistent with an embedded\ndark code-editor product demo (matching the Paper Mono font's heavy element\ncount) outweighing the surrounding marketing chrome in raw element count, not\nwith the page itself running dark. The cream canvas and slate-headline reading\nstand as originally documented.", "What to borrow (principle)": "- **Split one headline across two fill colours, not two sizes.** Identical\n  type metrics with only colour differing is a subtler, more controllable\n  device than a bold/light size contrast.\n- **Distinguish canvas from elevated surface with two near-white values.**\n  \"Cream for the page, pure white only for cards\" gives elevation meaning\n  without needing a shadow on every surface.\n- **Confine the single accent colour to identity and code, never UI action.**\n  Keeping the brand blue out of buttons and links makes \"neutral dark\" read as\n  a deliberate action language, not an oversight.\n- **Reserve complex shadow for the product itself.** A three-layer shadow used\n  only on the screenshot card (never on headings, logos or marketing cards)\n  keeps that one element reading as the page's real focal point.\n- **Let a faint geometric pattern add depth without colour.** A low-opacity\n  isometric line grid, clipped to a corner wedge, provides spatial interest\n  that a gradient or illustration would otherwise need to supply.", "What to leave": "- The two-tone headline device only reads correctly with genuinely calm,\n  short copy; a headline needing emphasis mid-sentence has nowhere to put it\n  since bold and italic are both explicitly forbidden.\n- Confining shadow entirely to product chrome is a strict rule that a growing\n  marketing team will be tempted to break for a \"featured\" testimonial or\n  pricing card — the system offers no secondary elevation pattern to fall\n  back on.\n- A single studio-blue accent restricted to logo and code means any new\n  semantic need (a warning state, a highlighted diff) has to invent its own\n  convention within an otherwise near-achromatic palette.", "Signature move": "The two-tone headline: two lines of identical Matter type, one in ink, one in\nslate, at the same size and weight — treating the hero statement as a\ncomposition of colour rather than a single block of emphasis.", "Motion": "(from designlang extract) Feel reads as springy, and the page is scroll-linked —\ncorrecting the earlier \"no motion tokens\" read substantially. A fast-settling\nease-out curve (`cubic-bezier(0.16, 1, 0.3, 1)`, 32 uses) carries most\ntransitions across four durations (100-800ms), and a genuine spring/overshoot\ncurve, `cubic-bezier(0.34, 1.3, 0.64, 1)`, is confirmed in use (5 times). The\nkeyframe behind it, `terminal-chunk-in` (slide-y, combining opacity, filter and\ntransform, 3 uses), is the overlapping terminal/MCP panel: output chunks slide\nup and sharpen into focus as they appear, rather than sitting in a static\ncomposition. (observed in capture) given the flat, hairline-bordered marketing\nsurface and the shadow reserved only for product chrome, a plain card hover\nmost plausibly still shifts from a bordered ghost treatment to the elevated\nthree-layer shadow rather than introducing colour, even though the terminal\npanel itself is genuinely animated.\n\n| Token | Value | Easing |\n|---|---|---|\n| xs | 100ms | `cubic-bezier(0.16, 1, 0.3, 1)` |\n| md | 300ms | `cubic-bezier(0.16, 1, 0.3, 1)` |\n| lg | 500ms | spring |\n| xl | 800ms | spring |\n| spring/overshoot | — | `cubic-bezier(0.34, 1.3, 0.64, 1)` |\n| terminal-chunk-in | slide-y, opacity, filter | 3 uses |", "Brief": "Build a design-tool marketing homepage. Canvas is bone cream `#efefe4`\nthroughout; reserve paper white `#fcfcf9` and pure white `#ffffff` strictly for\nelevated cards and product chrome. Set the hero as a left-aligned two-tone\nheadline in Matter at 64px: first line in ink `#181818`, continuation line(s)\nin slate `#83837e`, identical weight and tracking (-1.28px at 64px), lines\nnearly touching at 1.0-1.14 leading. Below, a Matter 18px lead paragraph in\niron gray, max-width ~56ch. Pair one filled dark button (`#181818` fill, 4px\nradius) with a ghost arrow-link — never a chromatic CTA. Centre a product-\nscreenshot card below the hero, 8px radius, elevated with a genuine three-layer\nshadow; this is the only card in the system permitted that shadow. Use studio\nblue `#5d8cd7` only for the brand mark and code-syntax accents. Add a faint,\nlow-opacity isometric line grid clipped to the hero's upper-right corner. Keep\nmarketing cards flat with 1px hairline borders instead of shadow, 96px section\ngaps, and a consistent eyebrow → two-tone heading → lead → visual rhythm\nthroughout.", "Image recipe": "Not primarily photographic — the sole hero visual is a product screenshot\n(the design tool's own UI, rendered flat with traffic-light window dots, a\nfile-tree sidebar, and a properties panel) rather than photography. Where a\nsupplementary image is needed: a plain, evenly lit [SUBJECT] product-UI\nmockup on a neutral background, no lifestyle staging, styled to match the\nexisting product chrome rather than introducing new imagery language.", "Photo search": "Unsplash first, Pexels second.\n- \"software interface mockup minimal desk\"\n- \"laptop screen design tool workspace\"\n- \"minimal desk setup natural light\"\n- \"abstract isometric line grid pattern\"", "Reference lock": "Primary reference/direction: Paper — warm cream design-tool marketing page,\ntwo-tone headline, colour confined to logo and code.\nPreserve (3-5 traits): bone cream `#efefe4` canvas with paper/bright white\nreserved for elevated cards only; two-tone headline (identical Matter size and\nweight, ink first line, slate continuation), never varied by size or font;\nsingle filled ink `#181818` CTA, no chromatic button ever; three-layer shadow\nreserved exclusively for the product screenshot and floating panels, hairline\nborders elsewhere; studio blue `#5d8cd7` confined to the brand mark and code\nsyntax only.\nBorrow only (1-2): the low-opacity isometric line-grid corner overlay; the\noverlapping terminal/MCP panel composed against the product screenshot card.\nRole rules: blue never appears on a button, link, or large text area; the\ntwo-tone headline never mixes fonts or sizes between its lines; card shadow\nnever applies to headings, logos, or plain marketing cards.\nMedia strategy: none beyond the product's own UI screenshots — no lifestyle\nphotography, no illustration, no stock imagery.\nReject: a chromatic CTA fill; shadow on non-product cards; bold or italic\ninline emphasis in body copy; pure white as the page background; a gradient\nanywhere.\nToken commitments: bg `#efefe4`, card `#fcfcf9`/`#ffffff`, hairline `#d7d7d6`,\nink `#181818`, secondary `#83837e`, accent `#5d8cd7`; display Matter 400 at\n48-64px/leading 1.0-1.14/-0.96 to -1.28px tracking; body Inter 400-600 at\n12-18px; radius 4px buttons, 8px cards, 12-24px product frames; page max-width\n1200px, section gap 96px."}, "has_extract": true}, {"slug": "paya", "title": "PAYÁ Film Haus", "url": "https://paya.ar", "captured": "2026-09-04", "family": "olive-playbill-studio", "dna": "Sports production reel x playbill corner-mark editorial", "register": "modern clean", "grammar": "gallery/catalog", "lane": "A flat olive-green field opens on a centred, hand-drawn wordmark and icon set, then a project page runs full-bleed documentary sports photography as stacked plates with single-letter corner tags spelling out the studio name", "mode": "experience", "traits": ["flat olive-green ground", "chartreuse-yellow ink", "custom rounded display wordmark", "three hand-drawn service icons", "single-letter corner tags", "full-bleed documentary photo plates", "small-caps tracked nav labels", "no card chrome"], "palette": ["#387648", "#74A653", "#98BF64", "#ECFD64", "#223830", "#000000"], "type": ["Annuario", "Tuppence"], "kind": "reference-style", "source": "claude", "status": "ready", "category": "portfolio", "category2": "editorial", "origin": "raw-url", "extract": "ok", "source_url": "https://paya.ar", "has_image": true, "img": "../design-catalogue/entries/paya/fold.webp", "full": "../design-catalogue/entries/paya/shot.webp", "sections": {"Why it works": "The studio identity is built almost entirely from two colours — a flat olive-green field\nand a single chartreuse-yellow ink — applied with total consistency across the homepage\nand the project pages. Because there is no white, no black and no photography in the\nidentity screen itself, the custom rounded wordmark and its three hand-drawn icons (a\nplay triangle, a sun-burst, a star) read as a logotype system rather than a decorated\nheadline; each icon reappears as a bullet before its matching service label in the row\nbeneath, so the mark and the navigation share one vocabulary.\n\nProject pages invert the balance: the same olive-and-chartreuse frame recedes to a border,\nand full-bleed documentary sports photography (shot on location, natural light, real\nmotion) fills nearly the entire viewport. A single letter of the studio name sits in each\ncorner of the frame — \"P\" top-left, \"A\" top-right, continuing down the page — so the\nbrand mark is present on every plate without ever occupying space a photograph could use.\n\nThe typography stays uniform throughout: one tracked small-caps sans (Annuario) sets every\nlabel, from top-level nav to photo captions to the project title's supporting line,\nleaving the custom wordmark as the only display-scale exception anywhere in the system.\nThat restraint is what lets the photography, not typography, carry the case-study pages.\nThe copy matches: headings run in tight sentence
